<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="612" role="img"><title>What we learned: transformers</title><desc> Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs></defs><rect x="28" y="20" width="446.6666666666667" height="185" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="71.3">Text becomes numbers</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="140.98000000000002">IDs select vectors; positions tell</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="171.14">the model where tokens occur.</tspan></text><rect x="496.6666666666667" y="20" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="71.3">Attention mixes values</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="140.98000000000002">Queries match keys; row weights</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="171.14">mix the value vectors.</tspan></text><rect x="965.3333333333334" y="20" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="71.3">Build a block</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="140.98000000000002">Join heads, add residuals, and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="171.14">transform each position.</tspan></text><rect x="28" y="227" width="446.6666666666667" height="185" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="278.3">Learn from targets</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="347.98">Shift the text, measure prediction</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="378.14">loss, then update weights.</tspan></text><rect x="496.6666666666667" y="227" width="446.6666666666667" height="185" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="278.3">Generate with a prefix</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="332.9">Block future inputs; sample and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="363.05999999999995">append; learned weights stay</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="393.21999999999997">fixed.</tspan></text><rect x="965.3333333333334" y="227" width="446.6666666666667" height="185" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="278.3">Check evidence and cost</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="332.9">Inspect loss and samples; caching</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="363.05999999999995">saves work; routing is not</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="393.21999999999997">explanation.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="28" y="455.56">Example to explain aloud</tspan></text><text font-family="Arial,sans-serif" font-size="27" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="511.87">cat → ats targets; attention weights [0.401, 0.198, 0.401] mix V to give [0.602, 0.398].</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="583.06">Next: in Week 6 we see how large language models learn, decode and differ.</tspan></text></svg>