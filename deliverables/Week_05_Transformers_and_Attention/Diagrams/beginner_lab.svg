" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="255.68">Inputs and</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="283.52000000000004">shifted answers</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="319.36">get_batch</tspan></text><rect x="736" y="142" width="205.33333333333334" height="236" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="838.6666666666666" y="217.3">Train model</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="255.68">Loss then</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="283.52000000000004">gradient update</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="319.36">gpt / opt</tspan></text><rect x="973.3333333333334" y="142" width="205.33333333333334" height="236" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1076" y="217.3">Check output</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1076" y="255.68">Held-out loss;</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1076" y="283.52000000000004">generated text</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="