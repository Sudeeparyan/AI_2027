<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>Train next-character predictions with known targets</title><desc>B is batch size; T is sequence length; d is vector size; V is vocabulary size. Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker><marker id="arrow0072B2" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0072B2"/></marker><marker id="arrowD55E00" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D55E00"/></marker></defs><polyline points="229.33333333333334,260 261.33333333333337,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="245.33333333333337" y="127.52">input IDs [B,T]</tspan></text><polyline points="466.66666666666674,260 498.6666666666667,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="482.66666666666674" y="127.52">X [B,T,d]</tspan></text><polyline points="704,260 736,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="720" y="127.52">H [B,T,d]</tspan></text><polyline points="941.3333333333334,260 973.3333333333334,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="957.3333333333334" y="127.52">logits [B,T,V]</tspan></text><polyline points="1178.6666666666667,260 1210.6666666666667,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1194.6666666666667" y="127.52">scalar loss</tspan></text><polyline points="126.66666666666667,378 126.66666666666667,404 1076,404 1076,378" fill="none" stroke="#0072B2" stroke-width="3"  marker-end="url(#arrow0072B2)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="430.44">known targets [B,T]: ats</tspan></text><polyline points="1313.3333333333335,142 1313.3333333333335,44 364.00000000000006,44 364.00000000000006,142" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#A64200" font-weight="400" text-anchor="middle"><tspan x="838.6666666666667" y="30.44">Repeat: the optimiser updates all trainable model parameters.</tspan></text><rect x="24" y="142" width="205.33333333333334" height="236" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="126.66666666666667" y="217.3">Shift text</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="126.66666666666667" y="255.68">cat inputs; ats</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="126.66666666666667" y="283.52000000000004">targets</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="126.66666666666667" y="319.36">get_batch</tspan></text><rect x="261.33333333333337" y="142" width="205.33333333333334" height="236" rx="0" fill="#E5F