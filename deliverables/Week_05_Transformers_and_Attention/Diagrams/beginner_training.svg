66" y="255.68">One vocabulary</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="283.52000000000004">row per input</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="319.36">head</tspan></text><rect x="973.3333333333334" y="142" width="205.33333333333334" height="236" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1076" y="217.3">Compare</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1076" y="255.68">Cross-entropy</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1076" y="283.52000000000004">with targets</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1076" y="319.36">forward</tspan></text><rect x="1210.6666666666667" y="142" width="205.33333333333334" height="236" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1313.3333333333335" y="217.3">Update</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="255.68">Use gradients;</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="283.52000000000004">change weights</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="319.36">opt.step</tspan>