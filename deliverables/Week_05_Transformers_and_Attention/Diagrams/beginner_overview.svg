<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4F46E5"/></marker></defs><line x1="418" y1="137" x2="528" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="912" y1="137" x2="1022" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1214" y1="337" x2="1214" y2="362" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1022" y1="465" x2="912" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="528" y1="465" x2="418" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="75">1. Text</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="151">Characters from the Tiny</tspan><tspan x="226" y="179.25">Shakespeare training text</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="233">text</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="283">Pass: raw characters</tspan></text><rect x="536" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="75">2. Character IDs</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="151">Each character receives one</tspan><tspan x="720" y="179.25">vocabulary number</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="233">stoi</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="283">Pass: integer IDs</tspan></text><rect x="1030" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="75">3. Token + position</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="151">Look up character vectors and</tspan><tspan x="1214" y="179.25">add position vectors</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="233">CharGPT.tok / CharGPT.pos</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="283">Pass: position-aware vectors</tspan></text><rect x="1030" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="403">4. Causal blocks</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="479">Mix allowed earlier</tspan><tspan x="1214" y="507.25">information, then transform</tspan><tspan x="1214" y="535.5">each position</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="561">Block.forward</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="611">Pass: contextual vectors</tspan></text><rect x="536" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="403">5. Vocabulary scores</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="479">One score for every possible</tspan><tspan x="720" y="507.25">next character</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="561">CharGPT.head</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="611">Pass: logits</tspan></text><rect x="42" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="403">6. New character</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="479">Choose an ID and decode it</tspan><tspan x="226" y="507.25">back to text</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="561">CharGPT.generate / itos</tspan></text><path d="M226,656 V677 H18 V14 H1214 V37" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="708">Repeat: Append the chosen ID; predict again from the current context</tspan></text></svg>