<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>Learn probabilities from names</title><desc>Training turns observed character pairs into a reusable probability table. Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker></defs><polyline points="276.8,260 308.8,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="292.8" y="127.52">marked names</tspan></text><polyline points="561.6,260 593.6,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="127.52">pair counts</tspan></text><polyline points="846.4000000000001,260 878.4000000000001,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="862.4000000000001" y="127.52">smoothed counts</tspan></text><polyline points="1131.2,260 1163.2,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1147.2" y="99.68">conditional</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1147.2" y="127.52">probabilities</tspan></text><rect x="24" y="142" width="252.8" height="236" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="150.4" y="217.3">Prepare examples</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="150.4" y="255.68">Mark each name’s</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="150.4" y="283.52000000000004">boundaries.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="150.4" y="319.36">words</tspan></text><rect x="308.8" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="435.20000000000005" y="217.3">Count pairs</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="255.68">Increase one cell per</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="283.52000000000004">pair.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="319.36">N</tspan></text><rect x="593.6" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="217.3">Smooth counts</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="255.68">Add one to every</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="283.52000000000004">cell.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="319.36">N</tspan></text><rect x="878.4000000000001" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1004.8000000000001" y="202.22000000000003">Normalise each</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1004.8000000000001" y="232.38">row</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="270.76">Divide by its row</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="298.6">total.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="334.44">P</tspan></text><rect x="1163.2" y="142" width="252.8" height="236" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1289.6000000000001" y="217.3">Check row sums</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1289.6000000000001" y="255.68">Every probability row</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1289.6000000000001" y="283.52000000000004">sums to 1.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1289.6000000000001" y="319.36">P</tspan></text><rect x="24" y="495" width="26" height="26" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="58" y="515.4399999999999">Input data</tspan></text><rect x="198.48832" y="495" width="26" height="26" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="232.48832" y="515.4399999999999">Model</tspan></text><rect x="330.12764" y="495" width="26" height="26" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="364.12764" y="515.4399999999999">Output</tspan></text><polyline points="468.69732,508 512.69732,508" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="520.69732" y="515.4399999999999">data flow</tspan></text></svg>