<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="612" role="img"><title>Week 1: what we learned</title><desc> Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs></defs><rect x="28" y="20" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="71.3">Model and application</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="125.9">Weights predict; an app adds</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="156.06">instructions, tools and an</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="186.21999999999997">interface.</tspan></text><rect x="496.6666666666667" y="20" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="71.3">Training and inference</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="125.9">Training changes learned</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="156.06">numbers. Ordinary generation</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="186.21999999999997">uses fixed numbers.</tspan></text><rect x="965.3333333333334" y="20" width="446.6666666666667" height="185" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="71.3">Tokens and probability</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="140.98000000000002">Text becomes IDs. Choose a next</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="171.14">token, append it and repeat.</tspan></text><rect x="28" y="227" width="446.6666666666667" height="185" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="278.3">Likelihood and sampling</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="332.9">NLL scores known examples.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="363.05999999999995">Temperature changes choices</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="393.21999999999997">during sampling.</tspan></text><rect x="496.6666666666667" y="227" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="278.3">Generative families</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="332.9">Autoregressive, VAE, GAN and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="363.05999999999995">diffusion models generate in</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="393.21999999999997">different ways.</tspan></text><rect x="965.3333333333334" y="227" width="446.6666666666667" height="185" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="278.3">Responsible use</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="347.98">Protect data, verify evidence and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="378.14">disclose how AI helped.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="28" y="455.56">Example to explain aloud</tspan></text><text font-family="Arial,sans-serif" font-size="27" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="511.87">Illustrative sequence: 0.5 × 0.2 × 0.1 = 0.01. A probable sequence can still contain a false claim.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="583.06">Next: in Week 2 we draw a hidden code and use a decoder to make an image.</tspan></text></svg>