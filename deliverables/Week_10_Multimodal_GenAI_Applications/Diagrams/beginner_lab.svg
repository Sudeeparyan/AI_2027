<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4F46E5"/></marker></defs><line x1="418" y1="137" x2="528" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="912" y1="137" x2="1022" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1214" y1="337" x2="1214" y2="362" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1022" y1="465" x2="912" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="528" y1="465" x2="418" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="75">1. Create test inputs</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="151">Load photos; draw charts and</tspan><tspan x="226" y="179.25">a fictional invoice</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="233">photos, fig_to_image, QA</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="283">Pass: inputs + known answers</tspan></text><rect x="536" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="75">2. Ask + verify</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="151">Caption images, answer known</tspan><tspan x="720" y="179.25">questions and probe absent</tspan><tspan x="720" y="207.5">objects</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="233">ask, score, pope</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="283">Pass: completed understanding</tspan><tspan x="720" y="310.12">checks</tspan></text><rect x="1030" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="75">3. Generate + edit</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="151">Create prompt-conditioned</tspan><tspan x="1214" y="179.25">images and vary editing</tspan><tspan x="1214" y="207.5">strength</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="233">t2i, gen, edits</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="283">Pass: generated images</tspan></text><rect x="1030" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="403">4. Measure alignment</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="479">Compare each image with its</tspan><tspan x="1214" y="507.25">own and other prompts</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="561">clip_score, t2i_df</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="611">Pass: alignment results</tspan></text><rect x="536" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="403">5. Speech round trip</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="479">Synthesise words, transcribe</tspan><tspan x="720" y="507.25">audio and measure word</tspan><tspan x="720" y="535.5">disagreement</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="561">tts, asr, wer</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="611">Pass: generated media</tspan></text><rect x="42" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="403">6. Reshare image</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="479">Save PNG metadata, then</tspan><tspan x="226" y="507.25">inspect the JPEG copy</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="561">meta</tspan></text></svg>