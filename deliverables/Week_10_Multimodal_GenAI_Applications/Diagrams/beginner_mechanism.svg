mily="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1313.3333333333335" y="232.38">answer</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="270.76">Read only the</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="298.6">continuation</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="334.44">vlm_proc.decode</tspan></text><rect x="24" y="495" width="26" height="26" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="58" y="515.4399999999999">Input data</tspan></text><rect x="198.48832" y="495" width="26" height="26" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="232.48832" y="515.4399999999999">Model</tspan></text><rect x="330.12764" y="495" width="26" height="26" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="364.12764" y="515.4399999999999">Output</tspan></text><polyline points="468.69732,508 512.69732,508" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="520.69732" y="515.4399999999999">data flow</tspan></text><polyline points="650.107,508 694.107,508" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill