<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="612" role="img"><title>Week 2: what we learned</title><desc> Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs></defs><rect x="28" y="20" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="71.3">Encode an image</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="125.9">The encoder predicts a mean and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="156.06">log variance for each latent</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="186.21999999999997">coordinate.</tspan></text><rect x="496.6666666666667" y="20" width="446.6666666666667" height="185" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="71.3">Sample during training</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="125.9">z = centre + spread × fresh</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="156.06">Gaussian noise; gradients train</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="186.21999999999997">the encoder.</tspan></text><rect x="965.3333333333334" y="20" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="71.3">Decode a code</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="140.98000000000002">The decoder turns a short code</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="171.14">into pixel predictions.</tspan></text><rect x="28" y="227" width="446.6666666666667" height="185" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="278.3">Balance two costs</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="332.9">Pixel cost preserves detail. KL</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="363.05999999999995">compares code distributions to the</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="393.21999999999997">prior.</tspan></text><rect x="496.6666666666667" y="227" width="446.6666666666667" height="185" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="278.3">Generate a new image</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="347.98">Draw a prior code and decode. No</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="378.14">input image or encoder is needed.</tspan></text><rect x="965.3333333333334" y="227" width="446.6666666666667" height="185" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="278.3">Evaluate the result</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="332.9">Inspect samples and failures;</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="363.05999999999995">validate anomaly scores on</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="393.21999999999997">realistic data.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="28" y="455.56">Example to explain aloud</tspan></text><text font-family="Arial,sans-serif" font-size="27" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="511.87">Illustrative costs: reconstruction 120 + β × KL 3 gives 123 at β 1 and 132 at β 4.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="583.06">Next: in Week 3 we train a realism checker instead of comparing only pixels.</tspan></text></svg>