<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>Train a VAE to rebuild digits</title><desc>Learn a distribution of short codes and a decoder that turns codes into pixels. Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker><marker id="arrow0072B2" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0072B2"/></marker><marker id="arrowD55E00" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D55E00"/></marker></defs><polyline points="229.33333333333334,260 261.33333333333337,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="245.33333333333337" y="127.52">image batch x</tspan></text><polyline points="466.66666666666674,260 498.6666666666667,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="482.66666666666674" y="127.52">mu and logvar</tspan></text><polyline points="704,260 736,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="720" y="127.52">latent code z</tspan></text><polyline points="941.3333333333334,260 973.3333333333334,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="957.3333333333334" y="127.52">784 pixel logits</tspan></text><polyline points="1178.6666666666667,260 1210.6666666666667,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1194.6666666666667" y="127.52">batch loss</tspan></text><polyline points="126.66666666666667,378 126.66666666666667,444 1110.2222222222222,444 1110.2222222222222,378" fill="none" stroke="#0072B2" stroke-width="3"  marker-end="url(#arrow0072B2)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="618.4444444444445" y="470.44">image x: the pixel targets</tspan></text><polyline points="364.00000000000006,378 364.00000000000006,404 1041.7777777777778,404 1041.7777777777778,378" fill="none" stroke="#0072B2" stroke-width="3"  marker-end="url(#arrow0072B2)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="702.8888888888889" y="430.44">mu, logvar for the KL cost</tspan></text><polyline points="1313.3333333333335,142 1313.3333333333335,44 364.00000000000006,44 364.00000000000006,142" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#A64200" font-weight="400" text-anchor="middle"><tspan x="838.6666666666667" y="30.44">Use updated encoder and decoder on the next batch.</tspan></text><rect x="24" y="142" width="205.33333333333334" height="236" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="126.66666666666667" y="217.3">Read digits</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="126.66666666666667" y="255.68">28 × 28 pixels,</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="126.66666666666667" y="283.52000000000004">values 0–1.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="126.66666666666667" y="319.36">train_dl</tspan></text><rect x="261.33333333333337" y="142" width="205.33333333333334" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="364.00000000000006" y="202.22000000000003">Encode</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="364.00000000000006" y="232.38">distribution</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="364.00000000000006" y="270.76">Predict mean</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="364.00000000000006" y="298.6">and log variance.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="364.00000000000006" y="334.44">VAE.encode</tspan></text><rect x="498.6666666666667" y="142" width="205.33333333333334" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="601.3333333333334" y="217.3">Sample a code</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="255.68">Centre + spread</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="283.52000000000004">× noise.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="601.3333333333334" y="319.36">reparameterise</tspan></text><rect x="736" y="142" width="205.33333333333334" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="838.6666666666666" y="217.3">Decode pixels</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="255.68">Predict 784 pixel</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="283.52000000000004">logits.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="838.6666666666666" y="319.36">VAE.dec</tspan></text><rect x="973.3333333333334" y="142" width="205.33333333333334" height="236" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1076" y="202.22000000000003">Measure two</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1076" y="232.38">costs</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1076" y="270.76">Reconstruction +</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1076" y="298.6">β × KL.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1076" y="334.44">vae_loss</tspan></text><rect x="1210.6666666666667" y="142" width="205.33333333333334" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1313.3333333333335" y="202.22000000000003">Update</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1313.3333333333335" y="232.38">weights</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="270.76">Adam changes</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="298.6">both networks.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1313.3333333333335" y="334.44">train</tspan></text><rect x="24" y="495" width="26" height="26" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="58" y="515.4399999999999">Input data</tspan></text><rect x="198.48832" y="495" width="26" height="26" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="232.48832" y="515.4399999999999">Model</tspan></text><rect x="330.12764" y="495" width="26" height="26" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="364.12764" y="515.4399999999999">Loss / update</tspan></text><polyline points="543.2669999999999,508 587.2669999999999,508" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="595.2669999999999" y="5