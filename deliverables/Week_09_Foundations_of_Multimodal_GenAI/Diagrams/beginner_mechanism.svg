<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>How matching pairs teach CLIP</title><desc>Learn which caption belongs to each image, and vice versa Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker><marker id="arrowD55E00" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D55E00"/></marker></defs><polyline points="229.33333333333334,260 261.33333333333337,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="245.33333333333337" y="127.52">ordered pairs</tspan></text><polyline points="466.66666666666674,260 498.6666666666667,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="482.66666666666674" y="127.52">model inputs</tspan></text><polyline points="704,260 736,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="720" y="127.52">normalised vectors</tspan></text><polyline points="941.3333333333334,260 973.3333333333334,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="957.3333333333334" y="127.52">score matrix</tspan></text><polyline points="1178.6666666666667,260 1210.6666666666667,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" fo