<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="612" role="img"><title>What we learned: fine-tuning</title><desc> Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs></defs><rect x="28" y="20" width="446.6666666666667" height="185" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="71.3">Choose adaptation</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="125.9">Prompt for instructions; retrieve</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="156.06">facts; train for measured</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="186.21999999999997">behaviour gaps.</tspan></text><rect x="496.6666666666667" y="20" width="446.6666666666667" height="185" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="71.3">Learn known answers</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="125.9">SFT reads the prompt and learns</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="156.06">desired answer tokens with loss</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="186.21999999999997">masking.</tspan></text><rect x="965.3333333333334" y="20" width="446.6666666666667" height="185" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="71.3">Learn preferences</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="125.9">RLHF, DPO and verified rewards</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="156.06">use different feedback and update</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="186.21999999999997">paths.</tspan></text><rect x="28" y="227" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="278.3">Add a small correction</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="332.9">LoRA freezes W and trains A/B;</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="363.05999999999995">QLoRA also compresses base</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="393.21999999999997">weights.</tspan></text><rect x="496.6666666666667" y="227" width="446.6666666666667" height="185" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="278.3">Keep honest datasets</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="332.9">Separate training, validation and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="363.05999999999995">final tests; match the chat</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="393.21999999999997">template.</tspan></text><rect x="965.3333333333334" y="227" width="446.6666666666667" height="185" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="278.3">Earn the training cost</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="332.9">Beat the best prompt; inspect</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="363.05999999999995">errors, older abilities, safety and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="393.21999999999997">cost.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="28" y="455.56">Example to explain aloud</tspan></text><text font-family="Arial,sans-serif" font-size="27" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="511.87">A 4096×4096 layer has 16,777,216 fixed W values; rank 16 A+B adds 131,072 trainable values (0.78%).</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="583.06">Next: in Week 9 we connect text with images, audio and other input types.</tspan></text></svg>