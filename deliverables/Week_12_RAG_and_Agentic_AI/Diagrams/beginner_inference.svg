<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>Who controls a tool call?</title><desc>Trace one tool request and the next observation Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker><marker id="arrowD55E00" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D55E00"/></marker></defs><polyline points="276.8,260 308.8,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="292.8" y="127.52">formatted task</tspan></text><polyline points="561.6,260 593.6,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="127.52">proposed call</tspan></text><polyline points="846.4000000000001,260 878.4000000000001,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="862.4000000000001" y="127.52">permitted call</tspan></text><polyline points="1131.2,260 1163.2,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1147.2" y="127.52">result or error</tspan></text><polyline points="1289.6000000000001,142 1289.6000000000001,44 150.4,44 150.4,142" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#A64200" font-weight="400" text-anchor="middle"><tspan x="720.0000000000001" y="30.44">Continue with the observation until an answer or the step limit.</tspan></text><rect x="24" y="142" width="252.8" height="236" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="150.4" y="217.3">Task + tool list</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="150.4" y="255.68">Names, purposes</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="150.4" y="283.52000000000004">and fields</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="150.4" y="319.36">messages</tspan></text><rect x="308.8" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="435.20000000000005" y="217.3">Propose a call</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="255.68">Model gives name</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="283.52000000000004">and arguments</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="319.36">llm</tspan></text><rect x="593.6" y="142" width="252.8" height="236" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="217.3">Parse + permit</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="255.68">Basic checks and</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="283.52000000000004">simulated gate</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="319.36">execute</tspan></text><rect x="878.4000000000001" y="142" width="252.8" height="236" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1004.8000000000001" y="202.22000000000003">Run approved</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1004.8000000000001" y="232.38">tool</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="270.76">Search, calculator or</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="298.6">stub</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="334.44">TOOLS</tspan></text><rect x="1163.2" y="142" width="252.8" height="236" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1289.6000000000001" y="202.22000000000003">Return</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1289.6000000000001" y="232.38">observation</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1289.6000000000001" y="270.76">Result informs next</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1289.6000000000001" y="298.6">decision</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1289.6000000000001" y="334.44">run_agent</tspan></text><rect x="24" y="495" width="26" height="26" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="58" y="515.4399999999999">Input data</tspan></text><rect x="198.48832" y="495" width="26" height="26" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="232.48832" y="515.4399999999999">Model</tspan></text><rect x="330.12764" y="495" width="26" height="26" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="364.12764" y="515.4399999999999">Output</tspan></text><rect x="468.69732" y="495" width="26" height="26" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="502.69732" y="515.4399999999999">Human / tool</tspan></text><polyline points="673.51528,508 717.51528,508" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="725.51528" y="515.4399999999999">data flow</tspan></text><polyline points="854.9249599999999,508 898.9249599999999,508" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="906.9249599999999" y="515.4399999999999">feedback / repeat</tspan></text></svg>