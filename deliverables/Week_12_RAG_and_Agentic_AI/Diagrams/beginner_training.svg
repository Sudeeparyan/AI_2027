<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>Prepare the document indexes</title><desc>Indexing makes sources searchable without training the language model Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker></defs><polyline points="276.8,260 308.8,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="292.8" y="99.68">documents +</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="292.8" y="127.52">metadata</tspan></text><polyline points="561.6,260 593.6,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="99.68">chunks + source</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="127.52">IDs</tspan></text><polyline points="846.4000000000001,260 878.4000000000001,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="862.4000000000001" y="127.52">compatible vectors</tspan></text><polyline points="1131.2,260 1163.2,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1147.2" y="99.68">searchable</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-wei