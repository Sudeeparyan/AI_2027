<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="612" role="img"><title>Week 11: operate an application</title><desc> Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs></defs><rect x="28" y="20" width="446.6666666666667" height="185" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="71.3">Choose the layers</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="140.98000000000002">Separate model libraries, serving,</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="171.14">application code and interfaces.</tspan></text><rect x="496.6666666666667" y="20" width="446.6666666666667" height="185" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="71.3">Call an API</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="140.98000000000002">Send structured requests; protect</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="171.14">keys and bound retries.</tspan></text><rect x="965.3333333333334" y="20" width="446.6666666666667" height="185" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="71.3">Measure speed</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="140.98000000000002">First text, full wait and throughput</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="171.14">answer different questions.</tspan></text><rect x="28" y="227" width="446.6666666666667" height="185" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="46" y="278.3">Compare efficiency</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="347.98">Measure quality after rounding,</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="46" y="378.14">batching and cache changes.</tspan></text><rect x="496.6666666666667" y="227" width="446.6666666666667" height="185" rx="0" fill="#F2F4F5" stroke="#626B73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="514.6666666666667" y="278.3">Package and release</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="347.98">Record tested versions; trial</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="514.6666666666667" y="378.14">gradually and retain a rollback.</tspan></text><rect x="965.3333333333334" y="227" width="446.6666666666667" height="185" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="30" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="983.3333333333334" y="278.3">Monitor every route</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="347.98">Track quality, cost, failures and</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="983.3333333333334" y="378.14">checks on each entry point.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="28" y="455.56">Example to explain aloud</tspan></text><text font-family="Arial,sans-serif" font-size="27" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="511.87">500 students → expected requests → token/GPU cost → load test → checked interface → monitoring.</tspan></text><text font-family="Arial,sans-serif" font-size="26" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="28" y="583.06">Next: in Week 12 we add retrieved evidence and controlled tool use.</tspan></text></svg>