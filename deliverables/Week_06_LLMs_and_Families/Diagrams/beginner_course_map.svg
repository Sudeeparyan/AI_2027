<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="658" role="img"><title>The twelve-week course map</title><desc> Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow0072B2" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0072B2"/></marker></defs><text font-family="Arial,sans-serif" font-size="27" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="36" y="58.370000000000005">Foundations and image generators</tspan></text><rect x="36" y="78" width="313.5" height="104" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="25" fill="#0072B2" font-weight="700" text-anchor="start"><tspan x="50" y="103.75">Week 1</tspan></text><text font-family="Arial,sans-serif" font-size="25" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="50" y="141.25">Introduction and</tspan></text><text font-family="Arial,sans-serif" font-size="25" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="50" y="170.25">responsible AI</tspan></text><polyline points="349.5,130 387.5,130" fill="none" stroke="#0072B2" stroke-width="3"  marker-end="url(#arrow0072B2)"/><rect x="387.5" y="78" width="313.5" height="104" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="25" fill="#0072B2" font-weight="700" text-anchor="start"><tspan x="401.5" y="103.75">Week 2</tspan></text><text font-family="Arial,sans-serif" font-size="25" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="401.5" y="141.25">Variational</tspan></text><text font-family="Arial,sans-serif" font-size="25" fill="#1E1B4B" font-weight="700" text-anchor="start"><tspan x="401.5" y="170.25">autoencoders (VAEs)</tspan></text><polyline points="701,130 739,130" fill="none" stroke="#0072B2" stroke-width="3"  marker-end="url(#arrow0072B2)"/><rect x="739" y="78" width="