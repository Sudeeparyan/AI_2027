<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4F46E5"/></marker></defs><line x1="418" y1="137" x2="528" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="912" y1="137" x2="1022" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1214" y1="337" x2="1214" y2="362" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1022" y1="465" x2="912" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="528" y1="465" x2="418" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="75">1. Prepare and build</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="151">Scale digits and connect</tspan><tspan x="226" y="179.25">noise-to-image and</tspan><tspan x="226" y="207.5">image-to-score networks.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="233">Generator / Discriminator</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="283">Pass: G, D, and real batches</tspan></text><rect x="536" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="75">2. Alternate training</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="151">Record losses, discriminator</tspan><tspan x="720" y="179.25">probabilities, and fixed-code</tspan><tspan x="720" y="207.5">snapshots.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="233">d_loss_fn / g_loss_fn / log</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="283">Pass: trained G + snapshots</tspan></text><rect x="1030" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="75">3. Explore codes</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="151">Compare straight and</tspan><tspan x="1214" y="179.25">spherical paths between noise</tspan><tspan x="1214" y="207.5">codes.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="233">lerp / slerp</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="283">Pass: generated images</tspan></text><rect x="1030" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="403">4. Check class coverage</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="479">Train a digit classifier and</tspan><tspan x="1214" y="507.25">count predicted generated</tspan><tspan x="1214" y="535.5">classes.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="561">DigitCNN / counts</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="611">Pass: classifier feature</tspan><tspan x="1214" y="638.12">extractor</tspan></text><rect x="536" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="403">5. Compare features</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="479">Compare real and fake feature</tspan><tspan x="720" y="507.25">means and covariances.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="561">feats / frechet_distance</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="611">Pass: quality and coverage</tspan><tspan x="720" y="638.12">questions</tspan></text><rect x="42" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="403">6. Test collapse</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="479">Compare standard GAN and</tspan><tspan x="226" y="507.25">WGAN-GP on eight toy</tspan><tspan x="226" y="535.5">clusters.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="561">train_toy / modes_covered</tspan></text></svg>