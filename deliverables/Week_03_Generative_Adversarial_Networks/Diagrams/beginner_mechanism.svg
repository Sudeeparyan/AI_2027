<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>One alternating GAN update</title><desc>Detach fakes for the D update; keep G connected for its own update. Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker><marker id="arrow0072B2" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0072B2"/></marker><marker id="arrowD55E00" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D55E00"/></marker></defs><polyline points="276.8,260 308.8,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="292.8" y="127.52">fake images</tspan></text><polyline points="561.6,260 593.6,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="99.68">D loss: real 1,</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="127.52">fake 0</tspan></text><polyline points="846.4000000000001,260 878.4000000000001,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="862.4000000000001" y="127.52">updated D</tspan></text><polyline points="1131.2,260 1163.2,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1147.2" y="99.68">G loss and</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1147.2" y="127.52">gradients</tspan></text><polyline points="150.4,378 150.4,404 1004.8000000000001,404 1004.8000000000001,378" fill="none" stroke="#0072B2" stroke-width="3"  marker-end="url(#arrow0072B2)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="577.6" y="430.44">same fakes, still linked to G</tspan></text><polyline points="1289.6000000000001,142 1289.6000000000001,44 150.4,44 150.4,142" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#A64200" font-weight="400" text-anchor="middle"><tspan x="720.0000000000001" y="30.44">Updated G makes the next batch’s fake images.</tspan></text><rect x="24" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="150.4" y="217.3">Make linked fakes</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="150.4" y="255.68">Images retain the G</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="150.4" y="283.52000000000004">graph.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="150.4" y="319.36">G / fake</tspan></text><rect x="308.8" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="435.20000000000005" y="217.3">Detach for D</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="255.68">Real batch plus</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="283.52000000000004">detached fakes.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="435.20000000000005" y="319.36">d_loss_fn</tspan></text><rect x="593.6" y="142" width="252.8" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="217.3">Update D</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="255.68">Real target 1; fake</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="283.52000000000004">target 0.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="319.36">opt_D</tspan></text><rect x="878.4000000000001" y="142" width="252.8" height="236" rx="10" fill="#FFF0E6" stroke="#D55E00" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1004.8000000000001" y="217.3">Score linked fakes</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="255.68">Updated D; original</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1004.8000000000001" y="283.52000000000004">G graph.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="