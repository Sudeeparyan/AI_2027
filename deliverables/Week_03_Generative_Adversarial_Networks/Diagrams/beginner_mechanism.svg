<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4F46E5"/></marker></defs><line x1="418" y1="137" x2="528" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="912" y1="137" x2="1022" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1214" y1="337" x2="1214" y2="362" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1022" y1="465" x2="912" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="75">1. Make connected fakes</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="151">G creates images with a</tspan><tspan x="226" y="179.25">gradient path to its weights.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="233">G / fake</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="283">Pass: fake images with graph</tspan></text><rect x="536" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="75">2. Detach for D</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="151">Give D real images and a</tspan><tspan x="720" y="179.25">disconnected view of fakes.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="233">d_loss_fn</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="283">Pass: real/fake D loss</tspan></text><rect x="1030" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="75">3. Update D</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="151">Train D with real targets 1</tspan><tspan x="1214" y="179.25">and fake targets 0.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="233">opt_D</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="283">Pass: updated D; original fake</tspan><tspan x="1214" y="310.12">tensor</tspan></text><rect x="1030" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="403">4. Score original fakes</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="479">Use updated D; original fakes</tspan><tspan x="1214" y="507.25">still connect to G.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="561">g_loss_fn</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="611">Pass: generator loss and</tspan><tspan x="1214" y="638.12">gradient path</tspan></text><rect x="536" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="403">5. Update G</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="479">Backpropagate the real-target</tspan><tspan x="720" y="507.25">loss; step only G's</tspan><tspan x="720" y="535.5">optimiser.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="561">opt_G</tspan></text><path d="M720,656 V677 H18 V14 H226 V37" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="708">Repeat: Updated G produces the fakes for the next batch's discriminator and generator updates.</tspan></text></svg>