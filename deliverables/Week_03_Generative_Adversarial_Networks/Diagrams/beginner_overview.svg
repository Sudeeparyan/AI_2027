<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4F46E5"/></marker></defs><line x1="418" y1="137" x2="528" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="912" y1="137" x2="1022" y2="137" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1214" y1="337" x2="1214" y2="362" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="1022" y1="465" x2="912" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><line x1="528" y1="465" x2="418" y2="465" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="75">1. Draw inputs</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="151">Sample noise; load real</tspan><tspan x="226" y="179.25">digits on a parallel data</tspan><tspan x="226" y="207.5">path.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="233">train_dl / Z_DIM</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="283">Pass: noise codes; real images</tspan><tspan x="226" y="310.12">bypass G</tspan></text><rect x="536" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="75">2. Generate images</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="151">Map each 64-number noise code</tspan><tspan x="720" y="179.25">into one digit image.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="233">Generator / G</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="283">Pass: fake images; real images</tspan><tspan x="720" y="310.12">join D</tspan></text><rect x="1030" y="42" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="75">3. Score real and fake</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="151">The discriminator reads both</tspan><tspan x="1214" y="179.25">real and generated images.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="233">Discriminator / D</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="283">Pass: real/fake logits</tspan></text><rect x="1030" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1214" y="403">4. Form two losses</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1214" y="479">D separates sources; G wants</tspan><tspan x="1214" y="507.25">its fakes accepted as real.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="561">d_loss_fn / g_loss_fn</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1214" y="611">Pass: losses and gradients</tspan></text><rect x="536" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="720" y="403">5. Alternate updates</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="720" y="479">Update D first, then update G</tspan><tspan x="720" y="507.25">through the new D.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="561">opt_D / opt_G</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="611">Pass: trained G and recorded</tspan><tspan x="720" y="638.12">samples</tspan></text><rect x="42" y="370" width="368" height="210" rx="5" fill="#F5F3FF" stroke="#4F46E5" stroke-width="2"/><text font-family="Calibri,Arial,sans-serif" font-size="29" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="226" y="403">6. Inspect progress</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="25" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="226" y="479">Compare fixed-noise images,</tspan><tspan x="226" y="507.25">class coverage, and feature</tspan><tspan x="226" y="535.5">distance.</tspan></text><text font-family="Calibri,Arial,sans-serif" font-size="21" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="226" y="561">snapshots / frechet_distance</tspan></text><path d="M226,656 V677 H18 V14 H720 V37" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text font-family="Calibri,Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="720" y="708">Repeat: Repeat generation and alternating updates on new batches using the updated G and D.</tspan></text></svg>