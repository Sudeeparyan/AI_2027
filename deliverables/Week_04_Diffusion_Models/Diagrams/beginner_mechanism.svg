<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" role="img"><title>Generate by repeating reverse steps</title><desc>One denoiser is reused at every timestep; the sampler decides each update. Solid arrows carry data. Dashed arrows show repetition.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow009E73" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#009E73"/></marker><marker id="arrowD55E00" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D55E00"/></marker></defs><polyline points="348,260 380,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="364" y="127.52">current x and t</tspan></text><polyline points="704,260 736,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="720" y="99.68">predicted noise +</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="720" y="127.52">current x</tspan></text><polyline points="1060,260 1092,260" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#0072B2" font-weight="400" text-anchor="middle"><tspan x="1076" y="127.52">updated x</tspan></text><polyline points="1254,142 1254,44 542,44 542,142" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#A64200" font-weight="400" text-anchor="middle"><tspan x="898" y="30.44">The updated x goes back in with the next lower t.</tspan></text><rect x="24" y="142" width="324" height="236" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="186" y="217.3">Start from noise</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="186" y="255.68">Random image-shaped x at</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="186" y="283.52000000000004">the last step T.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="186" y="319.36">torch.randn</tspan></text><rect x="380" y="142" width="324" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="542" y="217.3">Predict noise</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="542" y="255.68">Network reads current x</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="542" y="283.52000000000004">and timestep t.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="542" y="319.36">TinyUNet.forward</tspan></text><rect x="736" y="142" width="324" height="236" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="898" y="217.3">Take reverse step</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="898" y="255.68">Remove predicted noise;</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="898" y="283.52000000000004">add fresh noise if t &gt; 0.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="898" y="319.36">reverse_step</tspan></text><rect x="1092" y="142" width="324" height="236" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="26" fill="#1E1B4B" font-weight="700" text-anchor="middle"><tspan x="1254" y="217.3">Repeat or finish</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1254" y="255.68">Next lower t; stop after t =</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="1254" y="283.52000000000004">0.</tspan></text><text font-family="Arial,sans-serif" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle"><tspan x="1254" y="319.36">sample_ddpm</tspan></text><rect x="24" y="495" width="26" height="26" rx="10" fill="#E4F2FB" stroke="#0072B2" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="58" y="515.4399999999999">Input data</tspan></text><rect x="198.48832" y="495" width="26" height="26" rx="0" fill="#E5F7EF" stroke="#009E73" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="232.48832" y="515.4399999999999">Model</tspan></text><rect x="330.12764" y="495" width="26" height="26" rx="10" fill="#F9EAF4" stroke="#CC79A7" stroke-width="2"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="364.12764" y="515.4399999999999">Output</tspan></text><polyline points="468.69732,508 512.69732,508" fill="none" stroke="#009E73" stroke-width="3"  marker-end="url(#arrow009E73)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="520.69732" y="515.4399999999999">data flow</tspan></text><polyline points="650.107,508 694.107,508" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowD55E00)"/><text font-family="Arial,sans-serif" font-size="24" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="702.107" y="515.4399999999999">feedback / repeat</tspan></text></svg>