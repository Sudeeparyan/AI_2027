slides:
- type: title
  figure: cover
  notes: 'In short: Generative AI creates possible outputs from learned patterns, and this module teaches us to build and check
    them.

    Explain: A model is a numerical system learned from examples. Generative means it can create new content, such as text or
    images. A sample is one output drawn using the model. Our twelve weeks combine explanation with real implementation. Each
    week has a two-hour lecture and a two-hour lab.

    Example: Begin with a name-maker: it counts which letter follows another, then draws letters to create a name. This is a
    real model, although it understands neither people nor the meaning of a name.

    Ask: If a generated name looks familiar, has the model proved that somebody has that name?

    Answer: No. Familiar spelling is an output pattern; establishing existence would require independent evidence.

    Watch out: Do not equate creating a plausible example with discovering a true fact about the world.'
- type: outcomes
  notes: 'In short: Today we connect basic probability, model vocabulary and careful verification to the same small examples.

    Explain: A model learns patterns from examples; an application adds controls and tools. Training learns parameters, the
    model''s stored numbers. Inference uses those fixed numbers to produce outputs. Likelihood measures agreement between a
    model and observed examples. A classifier assigns labels; a generator creates possible examples. Families group similar
    generators; evaluation checks outputs against a task and evidence.



    Example: A complete explanation of the name model covers three operations: count pairs, make probabilities, and sample letters.
    A complete evaluation also asks whether its outputs satisfy the task. Knowing definitions alone does not perform either
    job.

    Ask: Which outcome would help you spot an invented reference in a fluent answer?

    Answer: Checking evidence: open the reference and compare the claimed content with the actual source.

    Watch out: Keep concepts and evaluation together; a working code cell alone does not show that its answer is reliable.'
  items:
  - Distinguish models and apps.
  - Explain training and inference.
  - Calculate sequence likelihood.
  - Compare classifiers/generators.
  - Identify model families.
  - Verify evidence; disclose.
- type: agenda
  icon: fa:FaRoute
  items:
  - title: Warm-up
    minutes: 8
  - title: Generative AI landscape
    minutes: 22
  - title: Data, parameters, tokens
    minutes: 18
  - title: Probability foundations
    minutes: 35
  - title: Families and course map
    minutes: 10
  - title: Responsible AI
    minutes: 17
  - title: Lab and recap
    minutes: 10
  notes: 'In short: The lecture moves from familiar AI tasks to probability, then returns to practical checking and the lab.

    Explain: The twelve-week map starts with probability and mechanisms that generate new data. A VAE, or variational autoencoder,
    compresses an example into a hidden code and rebuilds it. A GAN, or generative adversarial network, trains a generator using
    feedback from a critic. An LLM, or large language model, predicts tokens to produce text. RAG means retrieval-augmented
    generation: retrieve evidence before generating an answer. Later weeks adapt models, combine modalities, deploy applications
    and add tool-using agents.

    Example: Today’s planned segments total 120 minutes. Probability receives the largest block because the next VAE lecture
    builds on it. These times describe a teaching plan, not measured lab waiting times.

    Ask: Why do we study a small count table before opening a large language model?

    Answer: Its learning and sampling operations are visible, so we can understand them before adding neural-network complexity.

    Watch out: Allow a short break after core concepts, and revisit a worked row when new probability terms cause confusion.'
- type: discussion
  title: Warm-up
  icon: fa:FaComments
  prompt: Which AI task helped you this week, and where did it fail?
  points:
  - Describe one success and one failure.
  - Was the problem a fact, request or source?
  - Explain how you checked.
  notes: 'In short: An AI tool can help with a task while still making errors that require your expertise to detect.

    Explain: An output is the content a system returns. A factual error contradicts reliable evidence. A misunderstood request
    answers a different task. An invented source gives a plausible reference that cannot be verified. Comparing successes and
    failures tells us what to test.

    Example: Ask pairs to describe one helpful output and one failure. Write tasks and checking methods in separate board columns.
    For example, a draft email may save effort while an invented journal article fails a source check; neither observation establishes
    general reliability.

    Ask: Would a person unfamiliar with the subject notice the same failure you noticed?

    Answer: Perhaps not. Verification requires suitable evidence, tools or knowledge, so fluency can hide a problem from beginners.

    Watch out: Avoid collecting personal prompts or confidential examples; students can explain the task using a harmless invented
    scenario.'
- type: section
  number: 1
  title: The generative AI landscape
  question: What exactly is 'generative', and what is the difference between a model and a product?
  icon: fa:FaGlobeEurope
  notes: 'In short: Understanding the landscape begins with separating the learned model, the application and the tools it can
    use.

    Explain: A model learns numerical patterns from data. An application combines a model with an interface and instructions.
    A tool performs an additional operation, such as searching documents. Proprietary means the provider controls access to
    the model weights. Open-weight means those learned numbers are available under a licence.

    Example: A library assistant can use a fixed model plus a catalogue search tool. Updating the catalogue changes available
    evidence without retraining the model. The library analogy describes the application workflow; the model does not literally
    browse shelves by itself.

    Ask: If an assistant quotes a newly published book, which component might supply that information?

    Answer: A retrieval or search tool can supply it as context to the application.

    Watch out: Do not infer a model update from an application update; check which component actually changed.'
- type: bullets
  title: What is generative AI?
  bullets:
  - Learn a distribution.
  - Draw a possible output.
  - Check the task and evidence.
  callout: Generating does not prove truth.
  notes: 'In short: A generative model describes possible data and can use that description to create a new example.

    Explain: A probability distribution describes the chances of possible outcomes. Sampling means drawing an outcome using
    those chances. A discriminative classifier predicts a label for an input. A generator creates an output, sometimes given
    an input or prompt. A foundation model learns broad patterns that support many tasks.

    Example: A spam filter labels an existing email; an email generator writes a new sequence. Translation also generates a
    sequence, conditioned on the source text. The distinction concerns what the system models and produces, not whether its
    output is surprising or original.

    Ask: Does translating a sentence count as generation, even when the task is tightly specified?

    Answer: Yes. The system produces output text given the input sentence.

    Watch out: A generated example can resemble training material; generation does not guarantee novelty, ownership rights or
    correctness.'
  visual:
    type: example_strip
    title: One input, different jobs
    items:
    - label: Classifier
      text: Email → spam label
    - label: Generator
      text: Prompt → new email
- type: figure
  title: 'A short history: from VAEs to agents'
  figure: timeline
  caption: Historical milestones; details in notes.
  notes: 'In short: The timeline explains where the module mechanisms came from; historical model names are examples rather
    than current records.

    Explain: A variational autoencoder learns a probabilistic hidden representation. A GAN learns through feedback from a second
    network. A transformer compares token representations using attention. Pre-training learns reusable patterns before later
    adaptation. Multimodal systems combine more than one kind of input or output.

    Example: Follow the top row before the bottom row. The 2013 VAE and 2014 GAN lead into weeks 2 and 3; the 2017 transformer
    leads into week 5. The dates identify milestones, not the first possible appearance of every related idea.

    Ask: Why can an older mechanism remain useful after a new product is released?

    Answer: Products can combine and adapt earlier mechanisms; the underlying operation still helps explain their behaviour.

    Watch out: Keep names and dates attached to their historical context; do not describe an older release as the latest available
    model.'
- type: cards
  title: Foundation models come in several kinds
  cards:
  - head: Language
    text: Text or code → text
  - head: Image/video
    text: Prompt → visual content
  - head: Speech/audio
    text: Sound ↔ words
  - head: Multimodal
    text: Image + question → answer
  notes: 'In short: Foundation models support different inputs and outputs, so choose the route that matches the task.

    Explain: A language model produces text or code. An image generator creates pictures from supplied conditions. Speech recognition
    maps audio to words, while speech synthesis maps words to audio. Multimodal means involving more than one kind of data.
    An assistant may also use separate tools around its model.

    Example: A chart question uses an image and text as inputs, then returns text. A poster task takes a text description and
    returns an image. Both cross modalities, but an image-reading model need not have an image-generation capability.

    Ask: A tool turns a sketch into a photograph. What input and output route does it need?

    Answer: Image input to image output: an image generator conditioned on the sketch.

    Watch out: A family or product name alone does not establish supported modalities; inspect the documented input and output
    capabilities.'
- type: table
  title: 'Model, application, tool: three layers people confuse'
  header:
  - Layer
  - What it is
  - Example
  rows:
  - - Model
    - Learned weights
    - LLM
  - - Application
    - Model + interface + tools
    - Chat assistant
  - - Tool / workflow
    - Help with one task
    - Library search
  callout: An application can change while its model stays fixed.
  notes: 'In short: A model supplies learned predictions; an application adds the surrounding behaviour; a tool performs another
    operation.

    Explain: Weights are the learned numerical values used by a model. System instructions tell an application how to frame
    the task. Retrieval supplies relevant external information. Conversation memory provides earlier messages or stored context.
    A tool can search, calculate or execute a permitted operation.

    Example: Two assistants can use the same weights while only one searches a library catalogue. They may answer the same question
    differently because their evidence and instructions differ. Think of the same engine installed in different vehicles; the
    engine does not explain every feature.

    Ask: Can an assistant change its answer after a document update without changing model weights?

    Answer: Yes. New retrieved context can change the answer during inference.

    Watch out: When recording an experiment, identify both the model and the application components that influenced the response.'
- type: compare
  title: Proprietary vs. open-weight models
  columns:
  - head: Proprietary (closed-weight)
    icon: fa:FaLock
    points:
    - Provider runs the model.
    - Use an app or API.
    - Check data handling and cost.
  - head: Open-weight
    icon: fa:FaLockOpen
    points:
    - Download and run weights.
    - Manage compute and safety.
    - Read the licence.
  callout: Open weights do not automatically mean open source.
  notes: 'In short: Open weights allow local inspection and operation, while licences and deployment choices still constrain
    their use.

    Explain: Proprietary models are normally accessed through a provider-controlled application or API. An API is a software
    interface for requests and responses. Open-weight releases provide trained numerical parameters for permitted use. Open
    source is a broader claim about available resources and licensing. Local operation requires suitable hardware and maintenance.

    Example: An organisation handling private records may evaluate a local open-weight model to keep prompts on its own infrastructure.
    This trades provider operation for local responsibilities. A downloadable file alone does not establish privacy: the surrounding
    application may still send data elsewhere.

    Ask: Do downloadable weights guarantee that training data and training code are also published?

    Answer: No. Check what is released and read the applicable licence.

    Watch out: Compare task quality, data handling, cost and licence together; neither closed nor open access guarantees suitability.'
- type: cards
  title: Everyday AI tools you will meet
  cards:
  - head: Chat
    text: Draft; explain.
  - head: Code
    text: Write; debug.
  - head: Research
    text: Find; verify.
  - head: Images
    text: Create; edit.
  - head: Audio/video
    text: Generate; revise.
  - head: Local models
    text: Choose; run.
  callout: Check model, data, tools and evidence.
  notes: 'In short: Evaluate everyday AI tools by their task, data handling, capabilities and checking process.

    Explain: A chat assistant drafts or explains text. A coding assistant proposes code that must be run and inspected. Research
    tools may retrieve sources before generating an answer. Design tools may generate or edit media. A locally run model still
    needs an application and an evaluation method.

    Example: For a study summary, compare the answer with the supplied chapter and check each claimed quotation. For coding
    help, run a small example and inspect the result. These checks test the selected task; one success does not prove reliability
    on every possible input.

    Ask: Which evidence would convince you that a research tool quoted the uploaded source correctly?

    Answer: The actual source passage matching the quotation and the claim made about it.

    Watch out: Follow the institution’s assessment policy before using a tool; convenient access is not permission for every
    assignment.'
- type: quiz
  question: ChatGPT, the Gemini app and Claude.ai are best described as…
  options:
  - Bare learned weights
  - Applications with models and tools
  - Indexes of stored answers
  - Downloadable open weights
  answer: 1
  notes: 'In short: The named chat products are applications surrounding model families, rather than bare learned weights.

    Explain: A model maps input representations to output scores. An application adds instructions, tools and an interface.
    A search engine retrieves indexed information. A language model generates a sequence from its learned distribution and supplied
    context. Product capabilities can differ by configuration and available tools.

    Example: Ask students to vote before discussing the options. An application can use a search tool, but that does not make
    the whole application a search engine. Likewise, a product label may resemble its model-family name while referring to a
    much larger system.

    Ask: Which description best fits ChatGPT, the Gemini app and Claude.ai on this slide?

    Answer: B. They are applications that combine models with surrounding components.

    Watch out: Option A omits those components; C confuses generation with stored-answer retrieval; D confuses hosted products
    with downloadable weights.'
- type: section
  number: 2
  title: 'Core concepts: data, parameters, tokens'
  question: How is a model built, and what happens when you press Enter?
  icon: fa:FaCogs
  notes: 'In short: Data, learned numbers and tokenised inputs explain what a model learns and what ordinary generation uses.

    Explain: Training data supplies examples used to learn a model. Parameters are adjustable numerical values in a neural network.
    A tokenizer converts text pieces into vocabulary identifiers. Training changes learned numbers using examples and an objective.
    Inference uses an already learned model on an input.

    Example: In the count model, the learned object is a table of next-letter probabilities. In the neural model, learned weights
    produce next-token scores. These mechanisms differ, but both separate learning from using a learned model to make a new
    choice.

    Ask: When you add another sentence to a prompt, which part normally changes?

    Answer: The input context changes; the model’s weights remain fixed during that generation.

    Watch out: Introduce each term through a visible operation before using abbreviations; a vocabulary list alone cannot explain
    the process.'
- type: figure
  title: 'Tokens: how models see text'
  figure: tokens
  notes: 'In short: A tokenizer converts text into pieces and integer IDs; these IDs are labels, not meanings or probabilities.

    Explain: A token is a piece from the tokenizer’s vocabulary. The vocabulary lists all pieces that tokenizer can represent.
    An integer ID identifies one entry in that list. Different tokenizers can split the same text differently. Context length
    and generation length are counted using the model’s tokens.

    Example: The figure shows GPT-2 tokenizer pieces for one sentence, with a dot marking leading spaces. Point from each piece
    to its ID. A longer printed word need not have a larger ID; the numbering is a lookup scheme, not a measure of meaning.

    Ask: Will two tokenizers necessarily give the same number of tokens for your name?

    Answer: No. Compare the actual pieces and IDs produced by each tokenizer.

    Watch out: Do not assume a token is a whole word or apply an English words-per-token estimate to every language.'
- type: compare
  title: Training vs. inference
  columns:
  - head: Training
    points:
    - Examples change learned numbers.
    - Names change counts N.
  - head: Inference
    points:
    - Inputs use fixed learned numbers.
    - Sampling reads table P.
  callout: More context does not retrain the model.
  notes: 'In short: Training changes a model’s learned numbers; inference uses those numbers while the input and output can
    change.

    Explain: A loss measures how the model’s prediction differs from a training target. An optimiser adjusts parameters to reduce
    a training objective. Parameters are the model’s learned numbers. Inference runs the learned model on an input. Fine-tuning
    is further training on selected examples.

    Example: Reading another name increases entries in the count table during learning. Sampling a name later reads the probability
    table without changing it. For a neural model, adding chat messages changes available context in the same sense; it does
    not perform an optimiser update.

    Ask: Is adapting weights to your own examples in week 8 training or inference?

    Answer: Training. The adaptation procedure changes parameters, even if it starts from a pretrained model.

    Watch out: Future provider training on stored conversations is a separate data-use process, not learning during this ordinary
    response.'
- type: flow
  title: 'From raw data to an assistant: pre-training, post-training, application'
  steps:
  - label: Prepare
    sub: Examples
    role: data
  - label: Pre-train
    sub: Predict tokens
    role: model
  - label: Adapt
    sub: Instructions/feedback
    role: model
  - label: Load
    sub: Fixed weights
    role: model
  - label: Build app
    sub: Tools/interface
    role: tool
  bullets:
  - Pre-training learns patterns; adaptation shapes behaviour.
  notes: 'In short: Pre-training learns broad patterns, post-training adapts behaviour, and an application supplies tools and
    an interface.

    Explain: Pre-training learns from a broad collection of examples. A base language model learns to continue text. Instruction
    tuning uses examples of requested tasks and suitable answers. Preference tuning uses comparisons or feedback to shape behaviour.
    The application then combines adapted weights with instructions, context and permitted tools.

    Example: A base model may continue a question with more questions; an adapted assistant may answer it. Adding library search
    can supply a current passage without either training stage. This is a mechanism comparison, not a promise that every adapted
    model answers correctly.

    Ask: Which stage adds a calculator that performs exact arithmetic for the application?

    Answer: The application stage adds that tool; its result can then become context for generation.

    Watch out: The division between knowledge and behaviour is approximate; both training stages can influence capabilities
    and factual responses.'
  arrows:
  - examples
  - base weights
  - adapted weights
  - loaded model
- type: stat
  title: The scale of modern models
  stats:
  - value: 175 B
    label: GPT-3 parameters (2020)
  - value: 15 T+
    label: Llama 3 training tokens (2024)
  - value: 2 M
    label: Gemini 1.5 Pro context tokens (2024)
  - value: 800 M
    label: Weekly ChatGPT users (Oct 2025)
  caption: Historical developer reports; different units, not current records.
  notes: 'In short: Parameters, training tokens, context tokens and users count different things and should never be treated
    as interchangeable.

    Explain: Parameters count the model’s learned numbers. Training tokens count text pieces used during learning. Context tokens
    describe how much input a model can consider at once. Weekly users count people using an application. The slide reports
    historical developer statements, with years attached.

    Example: GPT-3’s 175 billion parameters and Llama 3’s more than 15 trillion training tokens use different units. Compare
    them as you would seats and kilometres: both describe a vehicle, but their numbers answer different questions. The analogy
    does not predict model quality.

    Ask: Does a larger context window mean the model was trained on fewer or more tokens?

    Answer: Neither follows. Context capacity and the volume of training data are separate properties.

    Watch out: These historical figures are not current records; choose models using task evidence rather than the largest advertised
    number.'
- type: section
  number: 3
  title: Probabilistic foundations
  question: How does a probability distribution become a sentence, an image or a song?
  icon: fa:FaDiceFive
  notes: 'In short: Probability turns learned patterns into concrete choices that we can calculate, sample and inspect.

    Explain: An outcome is one possible event, such as the next character. A probability states its chance on a scale from zero
    to one. A distribution describes all possible outcomes and their chances. A conditional probability uses information already
    given. Sampling selects an outcome according to those chances.

    Example: Suppose a next-character row gives dot, a and b probabilities one-half, one-third and one-sixth. They sum to one.
    Repeated draws favour dot but can still select b; the most probable choice is not the only possible choice.

    Ask: If b has the smallest probability, does that make generating it impossible?

    Answer: No. A nonzero probability allows it to be sampled, just less often over many comparable draws.

    Watch out: Work with one row before a whole sequence; likelihood and temperature refer to different operations on these
    probabilities.'
- type: figure
  title: An LLM outputs a probability distribution over the next token
  figure: next_token
  caption: Illustrative next-token probabilities.
  notes: 'In short: A language model supplies a next-token distribution, then generation chooses a token and repeats with updated
    context.

    Explain: A score, or logit, is a numerical preference before normalisation. Softmax turns scores into probabilities that
    sum to one. The vocabulary contains all candidate next tokens. Sampling chooses one candidate using its probability. Appending
    the choice changes the context for the next prediction.

    Example: The figure’s illustrative distribution gives mat 0.42, floor 0.17 and sofa 0.12. The remaining candidates receive
    0.29 altogether. These numbers illustrate one prediction; they are not measured outputs from the lab model and cannot establish
    factual accuracy.

    Ask: If the model samples floor, can it use exactly the same context for the following prediction?

    Answer: No. It appends floor, then predicts from the extended context.

    Watch out: A high probability measures the model’s text preference, not the truth of a claim or the reliability of a source.'
- type: equation
  title: 'The chain rule: generating one token at a time'
  eq: p(x_1, x_2, \ldots, x_T) = \prod_{t=1}^{T} p(x_t \mid x_1, \ldots, x_{t-1})
  read_as:
  - Multiply conditional probabilities.
  - 'Example: 0.5×0.2×0.1=0.01.'
  - Repeat next-token prediction.
  terms:
  - - p
    - probability
  - - xₜ
    - token t
  - - T
    - sequence length
  - - ∏
    - multiply positions
  - - '|'
    - given
  notes: 'In short: The chain rule scores a sequence by multiplying each token’s probability given the earlier tokens.

    Explain: A joint probability is the chance of the complete sequence. A conditional probability is the chance of a token
    given earlier tokens. The index t identifies a position. The symbol T here counts positions in the sequence. The product
    sign means multiply the probability at every position.

    Example: For three supplied next-token probabilities, 0.5 × 0.2 × 0.1 gives 0.01. This illustrative calculation scores that
    particular sequence. Generation instead draws a token at each step; the resulting sequence may differ while using the same
    conditional model.

    Ask: Does the factorisation require neighbouring tokens to be independent?

    Answer: No. Each conditional can depend on all earlier tokens; the chain rule itself is exact.

    Watch out: Here T is sequence length; the temperature equation reuses the same letter for a different quantity.'
- type: equation
  title: Likelihood and maximum likelihood training
  eq:
  - \mathcal{L}(\theta)=\sum_{i=1}^{N}\log p_\theta(x^{(i)})
  - \theta^*=\arg\max_\theta\mathcal{L}(\theta)=\arg\min_\theta[-\mathcal{L}(\theta)/N]
  read_as:
  - Score observed examples.
  - Maximise log-likelihood.
  - Equivalently, minimise average NLL.
  terms:
  - - θ
    - learned parameters
  - - pθ
    - model probability
  - - x⁽ⁱ⁾
    - example i
  - - N
    - example count
  - - ℒ
    - total log-likelihood
  - - θ*
    - best parameters
  - - log
    - natural logarithm
  - - argmax
    - choose maximiser
  - - argmin
    - choose minimiser
  notes: 'In short: Maximum likelihood chooses parameters that assign more probability to the observed training examples.

    Explain: Likelihood views the probability of observed data as a function of candidate parameters. Theta names learned numbers;
    theta-star names their best choice. N counts training examples, and the superscript i identifies one example. A logarithm
    turns products into sums without changing which positive value is largest. Negative log-likelihood reverses the sign so
    training can minimise a loss. Argmax chooses maximising parameters; argmin chooses minimising parameters.

    Example: If a is followed by n in 300 of 1,000 observed transitions, the unsmoothed estimate is 0.3. Adding one to every
    count is smoothing, which changes that estimate. Explain this distinction before calling the lab’s smoothed table maximum
    likelihood.

    Ask: Why use logarithms rather than multiplying thousands of tiny probabilities directly?

    Answer: Sums of logs avoid numerical underflow and retain the same maximum.

    Watch out: Likelihood measures agreement with observed data; it does not prove truth, and GAN training uses a different
    adversarial objective.'
- type: table
  title: 'Worked example: the likelihood of a short sentence'
  header:
  - Prediction
  - p
  - log p
  rows:
  - - the
    - '0.06'
    - −2.81
  - - cat | the
    - '0.01'
    - −4.61
  - - sat | the cat
    - '0.20'
    - −1.61
  - - on | the cat sat
    - '0.55'
    - −0.60
  - - Sequence
    - 6.6×10⁻⁵
    - −9.63
  callout: Illustrative. Average NLL ≈ 2.41 nats/token; perplexity ≈ 11.1.
  notes: 'In short: A sequence’s loss combines all its token surprises, rather than looking only at its least likely word.

    Explain: The natural logarithm turns the sequence product into a sum. Negative log-probability measures how surprising a
    target is under the model. Average negative log-likelihood divides the total surprise by the number of tokens. A nat is
    the unit from natural logarithms. Perplexity is the exponential of that average.

    Example: Multiply the four supplied probabilities to obtain 0.000066. Use unrounded logarithms: the total is about −9.63
    and average NLL about 2.41. The table is illustrative arithmetic, not a lab measurement; rounding each displayed log can
    slightly change the recomputed sum.

    Ask: Which prediction contributes the largest positive amount to the negative log-likelihood?

    Answer: Cat given the, because its probability 0.01 is the smallest.

    Watch out: Compare perplexity only with compatible tokenisation and evaluation data; lower loss alone does not establish
    a truthful answer.'
- type: equation
  title: Temperature reshapes the distribution before sampling
  eq: p_i = \frac{\exp(z_i / T)}{\sum_j \exp(z_j / T)}
  read_as:
  - Softmax normalises logits.
  - Lower T concentrates; higher T spreads.
  - Weights stay fixed.
  terms:
  - - zᵢ
    - score for token i
  - - T
    - positive temperature
  - - pᵢ
    - sampling probability
  - - exp
    - exponential
  - - Σⱼ
    - sum vocabulary candidates
  notes: 'In short: Positive temperature rescales fixed logits before softmax, changing sampling probabilities without changing
    learned weights.

    Explain: A logit is a raw next-token score. Softmax exponentiates scores and divides each value by their total. The index
    i identifies one candidate, while j runs over all candidates. T is a positive temperature setting. Lower T emphasises score
    differences; higher T reduces their effect.

    Example: For illustrative logits [2, 1, 0] at T equal to one, exponentials are about [7.39, 2.72, 1.00]. Their probabilities
    are about [0.67, 0.24, 0.09]. These rounded values demonstrate the calculation; they are separate from the cat-sentence
    chart.

    Ask: Does turning the temperature up train the model to know more facts?

    Answer: No. It changes the probability distribution used for selecting tokens from existing scores.

    Watch out: Never divide logits by zero; in this Transformers lab, use do_sample=False for greedy generation.'
- type: figure
  title: Temperature in pictures
  figure: temperature
  caption: Fixed scores.
  callout: 'Predict: which panel samples rare tokens more often?'
  notes: 'In short: The three charts keep the starting scores fixed and show how temperature redistributes probability.

    Explain: Entropy, labelled H, measures uncertainty in a probability distribution. Bits are the unit when entropy uses logarithms
    to base two. A concentrated distribution has lower entropy than a more evenly spread one. The strongest candidate has the
    largest probability. The others bar combines several separate rare tokens.

    Example: At temperature one, the chart matches the earlier illustrative next-token distribution. Compare the mat bar and
    the grouped tail across all three panels. Temperature acts on individual tokens before grouping, so treating the others
    total as one token would produce a different calculation.

    Ask: Predict which panel will choose rare tokens more frequently over many repeated samples.

    Answer: The higher-temperature panel, because it assigns those individual tokens more probability.

    Watch out: A few sampled outputs can obscure the trend; compare distributions first and describe observed variation without
    promising particular words.'
- type: bullets
  title: 'Decoding strategies: how we pick the next token'
  bullets:
  - Choose a decoding rule.
  - Limit the candidate set.
  - Record settings and seed.
  callout: Temperature changes probabilities; decoding selects a token.
  notes: 'In short: Decoding specifies how an application turns a next-token distribution into an actual selected token.

    Explain: Greedy decoding chooses the strongest candidate. Sampling draws a candidate according to its probability. Top-k
    limits sampling to k strongest candidates. Top-p retains the smallest leading group whose probabilities reach the chosen
    threshold. A seed initialises the random sequence for a fixed setup.

    Example: For probabilities [0.6, 0.3, 0.1], top-k equal to two keeps the first two candidates. Top-p equal to 0.8 also keeps
    them because 0.6 is insufficient and 0.9 reaches the threshold. This agreement need not hold for another distribution.

    Ask: What does top-p equal to 0.5 retain in that illustrative example?

    Answer: Only the first candidate: its probability 0.6 already reaches the threshold.

    Watch out: Record model revision, settings, seed and environment; a seed alone does not ensure identical outputs across
    software and hardware changes.'
  visual:
    type: mini_table
    header:
    - Rule
    - Candidates kept
    rows:
    - - Greedy
      - Top one
    - - Top-k
      - k strongest
    - - Top-p
      - Enough to reach p
- type: figure
  title: Generative vs. discriminative models
  figure: gen_vs_disc
  caption: Classify existing points; generate new points.
  notes: 'In short: A discriminative classifier models labels given inputs; a generative classifier also models possible inputs
    within each class.

    Explain: The input x is an observed example. The label y is its class. A decision boundary separates regions assigned different
    labels. A class-conditional distribution describes how inputs vary within one class. Sampling that distribution produces
    new possible inputs.

    Example: The left panel shows a boundary between two clouds of points. The right panel adds Gaussian shapes and sampled
    stars. The cloud represents two numerical features, not literal cat pictures; the analogy helps separate class prediction
    from describing an input distribution.

    Ask: Which fitted model in the lab can draw new points from its class-zero Gaussian?

    Answer: The generative Gaussian classifier, because it stores the class mean and covariance.

    Watch out: Both approaches can classify; the distinction concerns what they model, and their measured accuracy may be similar
    on this dataset.'
- type: equation
  title: Connecting the two views with Bayes' rule
  eq: p(y\mid x)=\dfrac{p(x\mid y)p(y)}{\sum_{y'}p(x\mid y')p(y')}
  read_as:
  - 'Generative: model inputs and priors.'
  - Normalise class scores.
  - 'Discriminative: predict labels directly.'
  terms:
  - - p
    - probability
  - - x
    - input
  - - y
    - class
  - - p(x|y)
    - class likelihood
  - - p(y)
    - class prior
  - - Σᵧ′
    - sum all classes
  callout: 'Example: 0.12/(0.12+0.08)=0.60.'
  notes: 'In short: Bayes’ rule turns class-generating probabilities and class frequencies into a probability for the class
    given an input.

    Explain: The input x is the observed example, and y is a candidate label. The likelihood p(x given y) describes that example
    under one class. The prior p(y) describes the class frequency before observing x. The denominator adds the same product
    across all possible classes. Dividing normalises the resulting class probabilities.

    Example: Suppose two illustrative class products are 0.12 and 0.08. Their total is 0.20, so the first class receives 0.6
    and the second 0.4. These products combine likelihood and prior; they are not unnormalised class probabilities to report
    directly.

    Ask: If both class products double, do the normalised class probabilities change?

    Answer: No. The numerator and denominator scale together, leaving the ratios unchanged.

    Watch out: For continuous inputs these likelihoods can be densities; do not interpret a density value as the probability
    of one exact point.'
- type: figure
  title: 'Latent variables: simple hidden causes, complex data'
  figure: latent
  notes: 'In short: A latent variable is a hidden numerical code that a decoder can map into a more structured output.

    Explain: Latent means not directly observed in the supplied example. The code z is drawn from a specified distribution.
    A decoder g maps a code to an output x. The integral combines contributions from all possible codes when describing x. Learned
    coordinates need not correspond to named human properties.

    Example: The figure maps two-dimensional Gaussian points into a spiral using a specified mathematical transformation. Matching
    colours help trace corresponding regions. It illustrates how a simple distribution can become structured data; it is not
    evidence that a trained network learned that spiral.

    Ask: Does the first latent coordinate necessarily mean a property such as style or age?

    Answer: No. Such interpretations require evidence; numerical coordinates can mix several effects.

    Watch out: Gradual movement through latent space can still produce poor intermediate outputs; inspect samples instead of
    assuming a perfect semantic map.'
- type: quiz
  question: You raise the sampling temperature from 0.7 to 1.5. What happens?
  options:
  - New facts are learned
  - Choices become more concentrated
  - Choices become more spread out
  - Weights favour rare tokens
  answer: 2
  notes: 'In short: Raising positive temperature spreads sampling probability more widely while leaving the learned model unchanged.

    Explain: Temperature rescales logits before they become sampling probabilities. Logits are raw numerical preferences over
    candidates. Increasing temperature reduces the relative influence of score differences. Less likely candidates therefore
    receive more chance than before. The setting acts during inference, which ordinarily uses fixed weights.

    Example: Invite a vote before discussing the options. Revisit the earlier temperature chart to predict which bars will rise.
    The idea concerns the distribution over repeated choices; one high-temperature answer can still be ordinary, and one low-temperature
    answer can still be wrong.

    Ask: What happens when sampling temperature rises from 0.7 to 1.5?

    Answer: C. Choices become more spread out, so repeated samples can be more varied.

    Watch out: A and D imply learning or weight updates; B describes lower temperature. Variation itself is not evidence of
    improved knowledge.'
- type: figure
  title: 'Four ways to generate: the model families of this module'
  figure: families
  caption: Compare generation operations.
  notes: 'In short: The four model families generate through different real operations, even when applications combine them.

    Explain: Autoregressive models predict one next item from previous items. A VAE uses a probabilistic encoder and a decoder.
    A GAN trains a generator using a discriminator’s feedback. Diffusion models learn to reverse a noise process. Flow models
    learn transformations that carry noise towards data.

    Example: Read the rows as generation mechanisms: extend tokens, decode a code, generate from noise, or repeatedly update
    a state. L means context length, V vocabulary size, d code dimensions, and C,H,W image channels, height and width. Shapes
    are symbolic, and these diagrams are not measured image-quality results.

    Ask: After GAN training, which network produces a fresh sample from noise?

    Answer: The generator. The discriminator provides training feedback and is not normally needed to produce that sample.

    Watch out: A transformer is an architecture, while these rows describe modelling and generation approaches; a transformer
    can appear inside several families.'
- type: table
  title: Comparing the four families
  header:
  - Family
  - Generation operation
  rows:
  - - Autoregressive
    - Append one token
  - - VAE
    - Decode a code
  - - GAN
    - Run the generator
  - - Diffusion / flow
    - Update a noisy state
  notes: 'In short: Choose a model family by the mechanism and measured task tradeoffs, rather than assuming its name guarantees
    quality.

    Explain: Quality means how well outputs satisfy a stated task. Diversity means the range of outputs or data regions represented.
    Generation time is the measured waiting for a sample. Conditioning means supplying information that influences generation.
    Coverage describes which parts of the target distribution are represented.

    Example: Compare a GAN and a diffusion model on the same kind of image, using fixed evaluation data and relevant quality
    checks. A fast generator that repeats one type of image may have poor diversity. A vehicle comparison needs the same journey
    and load; the analogy cannot decide image quality.

    Ask: Does a lower training loss automatically justify selecting one family for your project?

    Answer: No. Test sample quality, diversity, waiting time and task constraints.

    Watch out: The fuller strengths and weaknesses are in the Word notes; they describe common tendencies, not guarantees for
    every implementation.'
- type: figure
  title: 'Where we are going: the 12-week map'
  figure: course_map
  caption: Evaluation and responsibility throughout.
  notes: 'In short: The course moves from generator mechanisms to language models, adaptation, multimodal tasks and complete
    applications.

    Explain: A VAE compresses and rebuilds examples through hidden numerical codes. A GAN trains a generator against a discriminator
    or critic. An LLM predicts token sequences, underpinning the language weeks. Fine-tuning updates selected pretrained weights
    using new examples. RAG retrieves evidence before answering, and an agent can choose permitted tool calls. Evaluation and
    responsible use apply across all twelve topics.

    Example: The assessment combines a group project worth 60 percent and an exam worth 40 percent. A project may reuse components
    from labs, but students must evaluate their own application. Following the map provides building blocks rather than proof
    that any proposed project will succeed.

    Ask: Where would you look for a method that adds newly updated documents without changing model weights?

    Answer: Week twelve covers retrieval-augmented generation, building on the application distinction from today.

    Watch out: Keep responsible use and evaluation present throughout the route, rather than saving all checking until the project
    submission.'
- type: section
  number: 4
  title: Responsible AI from day one
  question: What can go wrong, and what habits keep you, your users and your data safe?
  icon: fa:FaBalanceScale
  notes: 'In short: Responsible use begins by identifying concrete failure modes and choosing checks appropriate to the task.

    Explain: A hallucination is a generated claim that is false or unsupported. Bias can produce systematically different outcomes
    across groups. Privacy concerns how information is shared, stored and reused. Transparency helps people understand how AI
    contributed. Verification checks an output against evidence rather than its style.

    Example: A model can write a polished reference to a paper that does not exist. Opening the supposed publication is a targeted
    check. A grammar check would miss this problem: the output’s wording and the evidence supporting it are different properties.

    Ask: Which checking action would directly test whether a cited paper exists?

    Answer: Open an authoritative publication record and confirm the title, authors and publication details.

    Watch out: Use the institution’s policy and current official guidance for legal duties; a general risk checklist does not
    determine every legal obligation.'
- type: bullets
  title: 'Hallucination: fluent but false'
  bullets:
  - Fluency is not evidence.
  - Check each claim.
  - Open its source.
  callout: A real source may still be misquoted.
  callout_label: Remember
  notes: 'In short: Fluent generated wording can contain a false or unsupported claim, so verify the evidence behind it.

    Explain: Hallucination describes generated content that is incorrect or unsupported. A language model learns patterns useful
    for predicting text. Plausibility under that model is not a check against external reality. Grounding supplies relevant
    evidence as context. The model can still misread or misattribute that evidence.

    Example: A fictional-paper prompt tests whether the model invents a plausible summary, expresses uncertainty, or asks for
    evidence. Record the actual answer before checking the supposed paper. An invented example is a controlled probe; it does
    not establish a general hallucination rate for the model.

    Ask: If the answer sounds cautious and includes a citation, can we skip verification?

    Answer: No. Open the source and check that it exists and supports the specific claim.

    Watch out: Lower temperature and requests for honesty may affect responses but do not supply a factual verification mechanism.'
  visual:
    type: example_strip
    title: Verify a reference
    items:
    - label: Generated
      text: Plausible paper title
    - label: Checked
      text: Publication and supporting passage
- type: cards
  title: Six risks to check with any generative AI system
  cards:
  - head: Bias/fairness
    text: Compare groups.
  - head: Privacy
    text: Protect data.
  - head: Intellectual property
    text: Check rights.
  - head: Transparency/law
    text: Explain AI use.
  - head: Academic integrity
    text: Follow assessment rules.
  - head: Security/misuse
    text: Test hidden instructions.
  notes: 'In short: Each risk area needs a concrete example, an appropriate check and an explanation of the remaining limits.

    Explain: Fairness asks whether outcomes differ unjustifiably across relevant groups. Privacy concerns permitted handling
    of personal or confidential information. Intellectual property concerns rights and applicable licences. Academic integrity
    requires following assessment rules and explaining your contribution. Prompt injection uses supplied content to try to redirect
    a system.

    Example: A profession-image task can reveal stereotypes; an uploaded student record can create a privacy problem. A hidden
    instruction inside a retrieved document can challenge tool boundaries. These examples need different tests, so one safety
    filter cannot demonstrate that all six risks are controlled.

    Ask: Who remains accountable for the sources and claims in a submitted assignment?

    Answer: The student submitting it must check them and follow the module’s disclosure rules.

    Watch out: EU transparency duties differ for providers and deployers; use the official Article 50 text and guidance for
    scope and exceptions.'
- type: flow
  title: A five-step checklist for using AI tools
  steps:
  - label: Check purpose
    sub: Allowed use?
    role: tool
  - label: Protect data
    sub: Safe input
    role: tool
  - label: Prompt model
    sub: Task/context
    role: tool
  - label: Verify
    sub: Check evidence
    role: metric
  - label: Record
    sub: Model/settings/date
    role: output
  callout: Use these checks in each lab.
  notes: 'In short: The five-step checklist links a permitted purpose to protected data, a clear task, verified output and recorded
    use.

    Explain: Purpose checks whether AI is suitable and allowed for the task. Data protection checks what information may enter
    the selected service. A clear prompt states the task, context and constraints. Verification checks claims, calculations,
    citations and code using appropriate evidence. Disclosure explains how AI assisted the work.

    Example: For a literature summary, use permitted source text, ask a specific question, and open each referenced passage.
    Record the model, date, prompt and checking method. Think of this as a laboratory record: its value comes from reproducible
    evidence, not simply ticking five boxes.

    Ask: Which step catches a plausible citation that points to the wrong paper?

    Answer: Verification: inspect the actual source and compare it with the claimed reference and content.

    Watch out: Disclosing AI use does not repair unchecked facts or override the assessment policy; perform the checks before
    submitting.'
  arrows:
  - permission
  - safe input
  - answer
  - checked answer
- type: discussion
  title: Case discussion
  icon: fa:FaUserGraduate
  prompt: A student submits five AI-suggested references. Two do not exist.
  points:
  - Why did this happen?
  - Who checks submitted claims?
  - Which verification step was missing?
  - Can source grounding still fail?
  notes: 'In short: The fictional-reference case shows why the person submitting AI-assisted work must verify each supporting
    source.

    Explain: A generated reference can follow familiar author, title and journal patterns. That pattern does not establish a
    real publication. Accountability concerns the work the student submits. Source grounding supplies documents that may support
    an answer. Verification checks both source existence and whether it supports the stated claim.

    Example: Five suggested references contain two nonexistent papers. Opening all five would catch the existence problem, but
    reading only their titles would miss a misleading interpretation. A source can be real while the assistant’s explanation
    of it is wrong.

    Ask: Would restricting an assistant to uploaded papers remove every possible citation error?

    Answer: No. It may still misquote a passage, confuse sources or attribute a claim incorrectly.

    Watch out: Discuss the actual verification process rather than blaming only the sampling setting; even a repeatable answer
    can be unsupported.'
- type: lab
  title: 'Lab 1: probability, sampling and a first look at an LLM'
  steps:
  - Build probabilities.
  - Score and sample.
  - Compare classifiers.
  - Inspect tokens.
  - Verify answers.
  - Record evidence.
  runtime: CPU by default; Colab or VS Code. Optional API; local fallback.
  deliverable: Completed notebook, checks, reflections and evidence table
  notes: 'In short: The lab makes learning, sampling and verification visible on a CPU path before any optional hosted comparison.

    Explain: The first part counts neighbouring characters and makes a probability table. Scoring measures how surprising a
    supplied name is under that table. Sampling draws a new name without changing learned counts. The classifier comparison
    separates label prediction from modelling inputs. A small language model then exposes tokens, scores and generated text.

    Example: Stored language results use SmolLM2-360M-Instruct on CPU, seed 42, in the 9 October 2026 full run. Definition sampling
    used T=0.2/1.2, top-p=0.9 and 60-token limits; fictional references used T=0.7 and 90-token limits. The current 135M CPU
    core can differ.

    Ask: Is an API key required to complete the local experiments?

    Answer: No. Both API switches are false by default, and the local route remains complete.

    Watch out: Use invented prompts and one API switch. OpenAI API usage may incur charges separately from ChatGPT subscriptions.'
- type: summary
  points:
  - Models learn; applications add tools.
  - Training updates; inference uses fixed weights.
  - Tokens give repeated next-item choices.
  - Likelihood scores; temperature changes sampling.
  - Generators create; classifiers label.
  - Verify, protect data and disclose.
  notes: 'In short: The six recap ideas connect the model’s generation mechanism with the habits needed to evaluate its outputs.

    Explain: A model supplies learned numerical patterns. An application adds instructions, tools and an interface. Training
    changes learned values, while ordinary inference keeps them fixed. Tokens provide the repeated choices used to generate
    text. Likelihood scores examples, and temperature changes the sampling distribution.

    Example: Ask students to explain the name-maker without reading: count pairs, normalise each row, sample and repeat. Then
    ask which operation checks a factual claim. A good mechanism explanation still needs an evidence-checking action; knowing
    how a lottery works does not verify the resulting sentence.

    Ask: What changes if we raise temperature: the stored weights or the sampling probabilities?

    Answer: The sampling probabilities change; the stored weights remain fixed during this generation.

    Watch out: Use uncertain answers to revisit the matching example before introducing the VAE’s hidden codes next week.'
