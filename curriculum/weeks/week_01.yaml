subtitle: How AI learns from examples, creates new content and needs careful checking
mimlos:
- 1
- 4
objectives:
- Separate a model from its application.
- Explain data, weights, tokens, training and inference.
- Use likelihood, sampling and temperature.
- Compare generative and discriminative models.
- Recognise autoregressive, VAE, GAN and diffusion families.
- Check evidence, protect data and disclose use.
