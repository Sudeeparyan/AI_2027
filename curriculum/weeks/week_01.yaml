    prediction and broad applications. A longer coding lesson connects counts, tensors and sampling. Official learning pages
    provide further exercises and terminology. Primary risk sources explain responsibilities and checking practices.

    Example: A student unsure about normalisation can watch the opening count-table section of the makemore lesson, then calculate
    [3, 2, 1] divided by six. Watching the full lesson is optional; explaining the row calculation is the immediate learning
    goal.

    Ask: What should you write after watching an explanation of temperature?

    Answer: Predict how a fixed distribution changes, calculate or inspect it, and explain why no weights were updated.

    Watch out: Separate introductory resources from deeper optional reading, and consult current official documentation before
    relying on a product capability or legal detail.'
