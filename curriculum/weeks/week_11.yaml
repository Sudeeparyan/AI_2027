subtitle: "From notebook to product: frameworks, API platforms, deployment options, efficient serving, applications, monitoring and guardrails"
mimlos: [3, 4, 5]
objectives:
  - "Map the generative AI **tool stack** and compare frameworks: Hugging Face, OpenAI / Azure OpenAI, Gemini API, **vLLM**, **Ollama**, **LangChain / LangGraph**, LlamaIndex."
  - "Use **API platforms** safely and efficiently: authentication and key management, tokens and **pricing**, **rate limits**, **streaming**."
  - "Compare **cloud APIs, self-hosted and local** deployment, and explain **quantisation**, **batching** and **caching** for serving efficiency."
  - "Build a small application with **Gradio** and **FastAPI**, packaged with **Docker**."
  - "**Deploy and monitor** a generative AI system: logging, tracing, latency and cost monitoring, **guardrails**, versioning."
  - "Justify a deployment choice with measured latency, cost and quality evidence."
coverage:
  - Hugging Face
  - OpenAI
  - Azure OpenAI
  - Gemini API
  - vLLM
  - Ollama
  - LangChain
  - LangGraph
  - LlamaIndex
  - authentication
