slides:
  - type: title
    figure: cover
    notes: |
      Welcome to week 11, deployment and frameworks. So far we have used models inside notebooks. This week we turn a model into something other people can use: an application with an interface and an API, running somewhere sensible, at an acceptable cost and speed, with guardrails and monitoring. Every number on the "real" slides was measured by running this week's lab in advance, on a small open model, so students can reproduce them on Colab.

  - type: outcomes
    notes: |
      Six outcomes matching the descriptor's week 11: frameworks; API platforms; deployment options; building applications and interfaces; deploying and monitoring with standard tools; and comparison. The final outcome is the one examiners and employers care about: justifying a deployment decision with evidence about latency, cost and quality rather than habit. This week practises MIMLO 5, deploying generative AI with contemporary frameworks, together with MIMLO 3 and 4.

  - type: agenda
    icon: "fa:FaRoute"
    items:
      - {title: "Warm-up: from notebook to 500 users", minutes: 5}
      - {title: "1 · Frameworks and the tool stack", minutes: 20}
      - {title: "2 · API platforms: keys, tokens, pricing, limits, streaming", minutes: 22}
      - {title: "3 · Deployment options and efficient serving", minutes: 25}
      - {title: "4 · Building applications: Gradio, FastAPI, Docker", minutes: 14}
      - {title: "5 · Monitoring, guardrails and comparison", minutes: 21}
      - {title: "Lab preview and wrap-up", minutes: 6}
    notes: |
      The plan follows the revised descriptor. Sections two and three contain real measurements from the lab: streaming latency, quantisation and batching. Take the break after section three. Sections four and five show the code students will write in the lab and how to monitor and protect the application.

  - type: discussion
    title: "Warm-up"
    icon: "fa:FaUsers"
    prompt: "Your notebook chatbot works well for you. Tomorrow 500 students will use it. What could go wrong?"
    points:
      - "Speed: many requests at once, long answers, slow first token."
      - "Cost: who pays for the tokens or the GPU? Is there a budget cap?"
      - "Safety and privacy: prompt injection, personal data, harmful answers, leaked API keys."
      - "Operations: crashes, model updates, knowing when something breaks."
    notes: |
      Two minutes in pairs. Collect answers under the four headings on the slide; together they are the agenda for today. Students often mention speed first. Push them on cost: a public link to a paid API with no limits can produce a large bill overnight. Push them on keys: API keys pasted into notebooks or GitHub are routinely stolen by automated scanners. And on operations: without logs you do not know that the app is failing until users complain.

  # ------------------------------------------------ section 1
  - type: section
    number: 1
    title: "Frameworks and the tool stack"
    question: "Which tools exist, and which do you need?"
    icon: "fa:FaLayerGroup"
    notes: |
      Section one maps the tool landscape into layers, compares the main frameworks named in the descriptor, introduces the OpenAI-compatible API pattern that connects them, and discusses when an orchestration framework helps and when plain code is better. Ask students which of these tools they have already used: most know a chat assistant, few have called an API directly. About twenty minutes.

  - type: figure
    title: "The generative AI stack"
    figure: stack
    notes: |
      Think in layers. At the bottom is hardware: cloud GPUs and TPUs, servers, laptops and phones with neural processing units. Models are proprietary, reached only through APIs, or open-weight, downloaded from the Hugging Face Hub. The access and serving layer is how you run a model: cloud APIs, self-hosted serving engines such as vLLM, or local runners such as Ollama. Orchestration frameworks compose prompts, tools, retrieval and agents. At the top are applications and interfaces. Running alongside every layer is LLMOps: logging, tracing, evaluation, guardrails and versioning.

  - type: table
    title: "Frameworks and platforms at a glance"
    header: ["Tool", "Layer", "Use it for"]
    rows:
      - ["Hugging Face (Hub, Transformers, Inference Providers)", "Models, serving", "Open models, datasets; run locally or via hosted providers"]
      - ["OpenAI / Azure OpenAI", "Cloud API", "GPT models; Azure adds enterprise security, regions, compliance"]
      - ["Google Gemini API / Vertex AI", "Cloud API", "Gemini models; free tier in AI Studio; long context, multimodal"]
      - ["vLLM (also SGLang, TGI)", "Self-hosted serving", "High-throughput GPU serving with an OpenAI-compatible API"]
      - ["Ollama (also llama.cpp, LM Studio)", "Local", "Quantised open models on a laptop; offline and private"]
      - ["LangChain / LangGraph", "Orchestration", "Chains, tool use and stateful agent graphs (week 12)"]
      - ["LlamaIndex", "Orchestration", "Data connectors, indexing and retrieval for RAG (week 12)"]
    notes: |
      Walk through the table by layer. Hugging Face is the hub for open models and also offers hosted inference through partner providers. OpenAI's API and Microsoft's Azure OpenAI serve GPT models; Azure adds enterprise features such as private networking, regional data residency and compliance certifications, which matter to universities and companies. Google's Gemini API has a free tier through AI Studio, and Vertex AI is its enterprise route. vLLM is the most widely used open-source serving engine for GPUs. Ollama makes local models easy. LangChain, LangGraph and LlamaIndex are orchestration frameworks, used heavily next week.

  - type: figure
    title: "One client, many back ends: the OpenAI-compatible API"
    figure: openai_compat
    notes: |
      A practical fact that simplifies everything: most providers and serving tools accept the OpenAI chat-completions format. Gemini offers an OpenAI-compatible endpoint, Hugging Face's router does, vLLM and Ollama do, and in the lab students build their own with FastAPI. The same client code therefore works everywhere; only the base URL, the key and the model name change. This reduces lock-in and makes comparisons easy: you can evaluate a cloud model and a local model with identical code. Provider-specific features, such as Gemini's native SDK features, still need their own SDKs.

  - type: compare
    title: "Plain SDK or orchestration framework?"
    columns:
      - head: "Plain SDK + your own code"
        icon: "fa:FaCode"
        points:
          - "Few moving parts; easy to debug and test"
          - "Full control over prompts and retries"
          - "Best for simple apps, classification, extraction"
          - "Anthropic and OpenAI guides recommend starting simple"
      - head: "Framework (LangChain, LangGraph, LlamaIndex)"
        icon: "fa:FaProjectDiagram"
        points:
          - "Ready-made connectors, retrievers, memory, tools"
          - "Stateful graphs, retries, human-in-the-loop for agents"
          - "Tracing integrations (e.g. LangSmith)"
          - "Extra abstraction; APIs change quickly"
    callout: "Start with the SDK; adopt a framework when you need its connectors, state management or tracing."
    notes: |
      Students often assume they must use LangChain. Frameworks are useful when you need their connectors to data sources, retrievers, state management for multi-step agents, or tracing integrations, and LangGraph in particular is designed for controllable agent workflows. But they add abstraction layers, and their APIs change quickly, which makes debugging harder. Guides from Anthropic and OpenAI on building agents recommend starting with direct API calls and simple code, and adding frameworks only when they solve a real problem. In the lab, students write the plain version first, then see LangChain drive the same model.

  - type: quiz
    question: "Your team built a prototype with a cloud API. Legal now requires that student data never leaves the university's servers. What is the least disruptive change?"
    options:
      - "Rewrite the application with a different framework"
      - "Serve an open-weight model on university GPUs with vLLM's OpenAI-compatible server and change the base URL"
      - "Ask the cloud provider to delete the data afterwards"
      - "Switch to a larger cloud model"
    answer: 1
    notes: |
      Answer: B. Because vLLM exposes an OpenAI-compatible API, the application code stays the same; only the base URL, key and model name change. You must then re-evaluate quality, because the open model will behave differently, and plan capacity for the GPUs. A is unnecessary work. C does not satisfy a requirement that data never leaves. D changes nothing about where data goes. Note that enterprise cloud offerings with regional data residency, such as Azure OpenAI in an EU region, may satisfy some policies, but that is a legal decision.

  # ------------------------------------------------ section 2
  - type: section
    number: 2
    title: "API platforms"
    question: "Keys, tokens, pricing, rate limits and streaming"
    icon: "fa:FaPlug"
    notes: |
      Section two covers what every developer must know about API platforms: authentication and key management, how tokens determine cost, rate limits and error handling, and streaming. We look at real latency measurements and a cost calculation. The same skills apply to OpenAI, Azure, Google and Hugging Face. About twenty-two minutes.

  - type: cards
    title: "What an API platform gives you, and what it expects"
    cards:
      - {icon: "fa:FaKey", head: "Authentication", text: "API keys or cloud identities (e.g. Microsoft Entra ID for Azure); one key per app and environment."}
      - {icon: "fa:FaCoins", head: "Tokens and pricing", text: "Billed per million input and output tokens; output usually costs more; images and audio are tokens too."}
      - {icon: "fa:FaTachometerAlt", head: "Rate limits", text: "Requests and tokens per minute; HTTP 429 when exceeded; tiers rise with usage and spend."}
      - {icon: "fa:FaStream", head: "Streaming", text: "Tokens sent as they are generated (server-sent events): lower perceived latency."}
      - {icon: "fa:FaBoxes", head: "Batch and caching", text: "Batch APIs for offline jobs at a discount; prompt caching discounts repeated prefixes."}
      - {icon: "fa:FaTools", head: "Structured output and tools", text: "JSON schemas and function calling (weeks 7 and 12)."}
    notes: |
      Six concepts cover most API platforms. Authentication uses API keys, or for enterprise clouds, identities such as Microsoft Entra ID, which avoid long-lived secrets. Pricing is per million tokens, with output tokens usually several times more expensive than input, so long answers cost more than long prompts. Rate limits cap requests and tokens per minute. Streaming sends tokens as they are generated. Batch APIs process large offline jobs asynchronously at a discount, and prompt caching discounts repeated prefixes such as long system prompts. Structured outputs and tool calling were covered in week 7 and return in week 12.

  - type: bullets
    title: "Keeping API keys safe"
    icon: "fa:FaUserShield"
    bullets:
      - "**Never** put keys in notebooks, code or Git: automated scanners find leaked keys within minutes."
      - "Use **Colab Secrets**, environment variables or a secrets manager (Azure Key Vault, Google Secret Manager)."
      - "Keys stay on the **server**: a browser or mobile app must call your back end, never the provider directly."
      - "Least privilege: separate keys per project, spending limits and alerts, rotate regularly."
      - "If a key leaks: **revoke it immediately**, then check usage and billing."
    notes: |
      Key security is a practical skill every student needs. Keys committed to public repositories are found by automated scanners very quickly and used to run up bills. Store keys in Colab Secrets, environment variables or a cloud secrets manager. Never embed a key in front-end code, because anyone can read it in the browser; the front end must call your own back end, which holds the key. Use separate keys per project with spending limits and alerts. If a key leaks, revoke it first and investigate afterwards. The lab reads keys only from Colab Secrets.

  - type: figure
    title: "Anatomy of a request: where the time goes"
    figure: request_anatomy
    bullets:
      - "**TTFT** (time to first token) is what users feel; streaming makes the wait visible and shorter-seeming."
      - "Decoding is sequential: long answers cost time as well as money."
    stack: true
    notes: |
      Break latency into parts. Network and authentication add tens of milliseconds. Under load, requests wait in a queue. Prefill processes the whole prompt in parallel, so it grows with prompt length, which matters for RAG with long contexts. Then decoding generates one token at a time, which is why output length dominates total time. Time to first token is network plus queue plus prefill; total latency is roughly time to first token plus the number of output tokens divided by the decoding speed. Streaming shows the first words early, which greatly improves perceived speed.

  - type: figure
    title: "Measured: streaming latency of a small open model"
    figure: lab_latency
    bullets:
      - "{{LAT_NOTES}}"
      - "Users see text after the first token; without streaming they wait for the whole bar."
    stack: true
    notes: |
      This is the lab's measurement for Qwen2.5-0.5B-Instruct. The dark part of each bar is time to first token, the light part the rest of the answer. The numbers are quoted in the bullet. Time to first token is a small fraction of the total, which is why streaming is standard in chat interfaces. On a CPU the same model is several times slower. Hosted frontier models run on far larger hardware, but they are also much larger, so the same pattern holds.

  - type: table
    title: "Estimating cost: 500 students, 20 requests a day, one month"
    header: ["Option (illustrative prices)", "Price per 1M tokens (in / out)", "USD per month"]
    rows:
      - ["Small hosted model", "$0.10 / $0.40", "$60"]
      - ["Mid-size hosted model", "$0.50 / $2.00", "$300"]
      - ["Frontier hosted model", "$2.00 / $10.00", "$1,380"]
      - ["Self-hosted small GPU, always on", "$0.60 per hour", "$432 + staff time"]
    callout: "300,000 requests × (800 input + 300 output tokens). Prices are illustrative: always check the providers' current pricing pages."
    callout_label: "Method"
    notes: |
      Walk through the arithmetic. Five hundred students times twenty requests a day times thirty days is three hundred thousand requests. Each has eight hundred input and three hundred output tokens. For the small model, that is three hundred thousand times eight hundred tokens at ten cents per million, plus three hundred thousand times three hundred tokens at forty cents per million: twenty-four plus thirty-six, sixty dollars. The same formula gives three hundred and thirteen hundred and eighty dollars for the larger models. A GPU running all month costs about four hundred and thirty dollars before staff time. The prices are illustrative; the method is what students must learn.

  - type: code
    title: "Streaming and retries in code"
    code: |
      from openai import OpenAI
      client = OpenAI(base_url=BASE_URL, api_key=get_secret("API_KEY"))

      stream = client.chat.completions.create(
          model=MODEL, messages=messages, stream=True, max_tokens=300)
      for chunk in stream:
          print(chunk.choices[0].delta.content or "", end="")

      def call_with_retry(fn, max_retries=5, base=0.5):
          for attempt in range(max_retries + 1):
              try:
                  return fn()
              except RateLimitError:                  # HTTP 429
                  if attempt == max_retries:
                      raise
                  time.sleep(base * 2**attempt * (1 + random.random() / 2))
    bullets:
      - "Set `max_tokens` and a timeout on every call."
      - "Exponential back-off with jitter avoids retry storms."
    notes: |
      Two patterns every application needs. Streaming: set stream to true and print each chunk's delta as it arrives. Retries: when the provider returns HTTP 429, too many requests, wait and retry, doubling the wait each time and adding random jitter so that many clients do not retry at the same moment. Always set a maximum number of output tokens, which caps both cost and latency, and a timeout. The official SDKs have built-in retries for some errors, but you should understand and configure them.

  # ------------------------------------------------ section 3
  - type: section
    number: 3
    title: "Deployment options and efficient serving"
    question: "Cloud, self-hosted or local, and how to make it cheaper and faster"
    icon: "fa:FaServer"
    notes: |
      Section three compares the three deployment options, then covers the three main efficiency techniques named in the descriptor: quantisation, batching and caching, with real measurements. The key message: cost and speed are design choices that can be measured, and every efficiency gain must be checked against quality. About twenty-five minutes; take the break afterwards.

  - type: table
    title: "Cloud API vs. self-hosted vs. local"
    header: ["", "Cloud API", "Self-hosted (e.g. vLLM on GPUs)", "Local (e.g. Ollama)"]
    rows:
      - ["Models", "Frontier proprietary and hosted open models", "Open-weight, including your fine-tunes", "Small, quantised open models"]
      - ["Cost profile", "Pay per token; no fixed cost", "Fixed GPU cost; cheap per token at high, steady load", "Free after hardware"]
      - ["Data", "Leaves your network (check terms, region)", "Stays in your infrastructure", "Stays on the device"]
      - ["Operations", "Provider scales and updates", "You run, scale, patch and monitor", "Per-device setup"]
      - ["Risks", "Price and model changes, rate limits, lock-in", "Capacity planning, staff skills", "Limited quality and speed"]
    notes: |
      There is no universally best option. Cloud APIs give the strongest models with no infrastructure and pay-per-use pricing, but data leaves your network, and providers change prices and retire models. Self-hosting on GPUs keeps data in-house and becomes cheaper per token at high, steady volume, and lets you serve your own fine-tuned models, but you must operate it. Local models are private and free to run but limited to small quantised models. Many real systems are hybrids: a small local or self-hosted model for routine requests, a cloud model for hard ones.

  - type: equation
    title: "Quantisation: fewer bits per weight"
    eq:
      - "\\text{memory} \\approx N_{\\text{params}} \\times \\frac{\\text{bits}}{8}\\ \\text{bytes}"
      - "s = \\frac{\\max |w|}{2^{b-1} - 1}, \\qquad q = \\mathrm{round}\\left(\\frac{w}{s}\\right), \\qquad \\hat{w} = q \\cdot s"
    read_as:
      - "A 7 B model needs ≈ 14 GB in 16-bit, ≈ 7 GB in 8-bit and ≈ 3.5–4 GB in 4-bit (plus the KV cache)."
      - "Absmax: scale each group so its largest weight maps to the largest integer, round, store integers and one scale."
      - "Smaller groups (e.g. 64 weights per scale) keep more precision: the basis of GPTQ, AWQ and GGUF formats."
    terms:
      - ["b", "bits per weight (8 or 4)"]
      - ["s", "scale for a group of weights"]
      - ["q", "stored integer"]
      - ["ŵ", "de-quantised weight used in computation"]
    notes: |
      Quantisation stores weights with fewer bits. Memory is roughly the number of parameters times bits divided by eight: a seven-billion-parameter model needs fourteen gigabytes in sixteen-bit, seven in eight-bit and under four in four-bit, which is the difference between needing a data-centre GPU and running on a laptop. The absmax method scales each group of weights so the largest maps to the largest integer, rounds, and stores the integers plus one scale per group. Smaller groups keep more precision. Formats such as GPTQ, AWQ and GGUF, used by vLLM and Ollama, refine this idea.

  - type: figure
    title: "Measured: size and quality after quantisation"
    figure: lab_quant
    bullets:
      - "{{QUANT_NOTES}}"
      - "Always re-evaluate on your own task after quantising."
    stack: true
    notes: |
      The lab quantises every linear layer of the model and measures perplexity on a paragraph of text. The measured values are in the bullet. The typical pattern: eight-bit is almost lossless; naive four-bit with one scale per row damages quality badly; four-bit with small groups recovers most of it at almost the same size. This is exactly why practical four-bit formats use groups. The perplexity check on one paragraph is only a quick sanity test; before deployment, rerun your task evaluation from weeks 7 and 8.

  - type: figure
    title: "Measured: batching raises throughput"
    figure: lab_batch
    bullets:
      - "{{BATCH_NOTES}}"
      - "Serving engines batch **continuously**: new requests join as others finish."
    stack: true
    notes: |
      Generating for one request at a time leaves most of a GPU idle, because decoding is limited by memory bandwidth, not arithmetic. Processing several requests together reuses each weight read for many sequences. The lab measures throughput for batch sizes one to eight; the numbers are in the bullet. Production engines go further with continuous batching, adding and removing requests at every step rather than waiting for a whole batch to finish. The trade-off: larger batches increase throughput but can increase each user's latency.

  - type: bullets
    title: "Serving engines and caching"
    icon: "fa:FaBolt"
    bullets:
      - "**vLLM**: continuous batching and **PagedAttention**, which stores the KV cache in pages like virtual memory (Kwon et al., 2023)."
      - "**KV cache** (week 5) and **prefix caching**: reuse computation for shared prompt prefixes; providers discount cached tokens."
      - "**Response caching**: identical questions answered from a cache (the lab: milliseconds instead of seconds)."
      - "**Speculative decoding**: a small draft model proposes tokens, the large model verifies several at once."
      - "**Right-size the model**: a distilled or fine-tuned small model is often the biggest saving (week 8)."
    notes: |
      vLLM's key idea, PagedAttention, manages the key-value cache in fixed-size pages, like an operating system's virtual memory, which reduces wasted memory and allows larger batches. Prefix caching reuses the KV cache for shared prompt beginnings, such as a long system prompt, and API providers pass on the saving as discounted cached input tokens. Response caching answers repeated questions instantly. Speculative decoding speeds up generation by letting a small model draft tokens that the large model verifies in parallel. Often the largest saving is simply using a smaller, fine-tuned model.

  - type: stat
    title: "What fits where? (weights only)"
    stats:
      - {value: "≈ 1 GB", label: "0.5 B model in 16-bit: runs on any laptop (the lab model)"}
      - {value: "≈ 4 GB", label: "7–8 B model in 4-bit: a laptop with Ollama, or a free Colab T4"}
      - {value: "16 GB", label: "memory of a Colab T4 GPU: up to ≈ 7 B in 16-bit, ≈ 20–30 B in 4-bit"}
      - {value: "≈ 140 GB", label: "70 B model in 16-bit: several data-centre GPUs"}
    caption: "Add memory for the KV cache, which grows with context length and batch size."
    notes: |
      These rules of thumb help students choose. Half a billion parameters in sixteen-bit is about one gigabyte and runs anywhere. A seven-to-eight-billion-parameter model in four-bit is about four gigabytes and runs on a laptop with Ollama or on a free Colab GPU. A T4 has sixteen gigabytes, enough for about seven billion parameters in sixteen-bit or twenty to thirty billion in four-bit. A seventy-billion-parameter model in sixteen-bit needs about one hundred and forty gigabytes, several data-centre GPUs. Always leave room for the KV cache, which grows with context length and the number of concurrent requests.

  - type: quiz
    question: "Your self-hosted model is accurate but too slow when 50 users are online at once. Which change is most likely to help first?"
    options:
      - "Increase the temperature"
      - "Serve with an engine that uses continuous batching (e.g. vLLM) and quantise the model, then re-check quality"
      - "Add a longer system prompt"
      - "Switch off streaming"
    answer: 1
    notes: |
      Answer: B. With many concurrent users, a naive server processes requests one at a time, so queues grow. A serving engine with continuous batching raises throughput dramatically, and quantisation reduces memory so more requests fit in a batch. Quality must be rechecked after quantising. A changes randomness, not speed. C makes prefill slower. D does not change total time and makes perceived latency worse.

  # ------------------------------------------------ section 4
  - type: section
    number: 4
    title: "Building applications and interfaces"
    question: "Gradio, FastAPI and Docker"
    icon: "fa:FaWindowRestore"
    notes: |
      Welcome back. Section four shows how the pieces fit together into an application: an interface for people, an API for other programs, guardrails and logging around the model, and a container for deployment. The code on these slides is what students write in the lab. About fourteen minutes.

  - type: figure
    title: "Proposed integrated application architecture"
    figure: app_architecture
    notes: |
      This is a proposed integrated design. A user interface or other client calls a back-end API, with input checks, model generation, output checks and logs inside that request path. In the lab the routes are separate: Gradio calls respond and generate directly, while the SDK and LangChain call the FastAPI endpoint. That endpoint does not inherit respond's guardrails or logs. The exported app.py is a smaller packaging scaffold without all notebook checks and logging. Students should identify the features that must be connected before deploying the integrated design.

  - type: code
    title: "An OpenAI-compatible endpoint with FastAPI"
    code: |
      from fastapi import FastAPI
      from pydantic import BaseModel

      class ChatRequest(BaseModel):
          messages: list[dict]
          max_tokens: int = 128

      api = FastAPI()

      @api.post("/v1/chat/completions")
      def chat(req: ChatRequest):
          text, n_in, n_out = generate(req.messages, req.max_tokens)
          return {"object": "chat.completion",
                  "choices": [{"index": 0, "finish_reason": "stop",
                               "message": {"role": "assistant", "content": text}}],
                  "usage": {"prompt_tokens": n_in, "completion_tokens": n_out,
                            "total_tokens": n_in + n_out}}
    bullets:
      - "Pydantic validates requests; FastAPI generates interactive docs at `/docs`."
      - "OpenAI-compatible, so the `openai` SDK and LangChain can call it."
    notes: |
      FastAPI turns a Python function into a web API. Pydantic models validate the request body automatically, rejecting malformed requests, and FastAPI generates interactive documentation. By returning the OpenAI response format, including the usage block with token counts, our server works with the OpenAI SDK and LangChain unchanged, as students verify in the lab. In production you would add authentication, request size limits, timeouts and streaming, and run the server behind a process manager.

  - type: code
    title: "A chat interface with Gradio"
    code: |
      import gradio as gr

      def respond(message, history):
          allowed, cleaned, reason = check_input(message)   # guardrail
          if not allowed:
              return f"Sorry, I can't help with that ({reason})."
          answer, n_in, n_out = generate(build_messages(cleaned, history))
          log_request(n_in, n_out, reason)                   # metadata only
          return check_output(answer)

      demo = gr.ChatInterface(respond, title="Course assistant")
      demo.launch(share=True)     # temporary public link from Colab
    bullets:
      - "Hugging Face **Spaces** hosts Gradio apps for free (CPU) with secrets support."
      - "A public link means anyone can use your quota: add limits or authentication."
    notes: |
      Gradio builds a web interface from a Python function; ChatInterface provides a complete chat UI in one line. The respond function wraps the model with an input check, logging and an output check. In Colab, share equals true prints a temporary public link, useful for demonstrations but anyone with the link can use it. For longer-lived demos, Hugging Face Spaces hosts Gradio apps, with secrets for API keys. Streamlit is a popular alternative for data-oriented apps.

  - type: bullets
    title: "Packaging and releasing: Docker, versions, CI"
    icon: "fa:FaDocker"
    bullets:
      - "**Docker** image: code + pinned dependencies + start command; runs the same on a laptop, Hugging Face Spaces, Google Cloud Run or Azure Container Apps."
      - "Secrets are passed as **environment variables at run time**, never baked into the image."
      - "**Version everything**: model name and version, prompt templates, decoding settings, data and index versions."
      - "**Evaluate before release**: run your fixed evaluation set in CI; compare with the current version (weeks 7–8)."
      - "Roll out gradually (canary or A/B) and keep the previous version ready for rollback."
    notes: |
      A Docker image packages code, pinned dependencies and the start command, so the application runs identically everywhere, including serverless container platforms such as Google Cloud Run and Azure Container Apps, or Hugging Face Spaces. Pass secrets at run time. Version not only the code but also the model, prompts, decoding settings and retrieval index, because any of them changes behaviour. Treat prompt changes like code changes: run the evaluation set automatically and compare with the current version before release. Roll out gradually and keep a rollback path.

  # ------------------------------------------------ section 5
  - type: section
    number: 5
    title: "Monitoring, guardrails and comparison"
    question: "How do you know it is working, and safe?"
    icon: "fa:FaChartLine"
    notes: |
      The final section covers what to monitor, a real monitoring summary from the lab, layered guardrails, the LLMOps tooling for tracing and evaluation, a comparison of deployment choices, and a responsible deployment checklist. It answers the question every client asks after launch: how do we know it is still working? About twenty-one minutes.

  - type: cards
    title: "What to monitor"
    cards:
      - {icon: "fa:FaStopwatch", head: "Performance", text: "TTFT, p50 / p95 / p99 latency, throughput, timeouts."}
      - {icon: "fa:FaDollarSign", head: "Cost", text: "Tokens per request, per user and per day; budget alerts."}
      - {icon: "fa:FaExclamationTriangle", head: "Reliability", text: "Error rates, HTTP 429s, provider outages, fallbacks used."}
      - {icon: "fa:FaCheckDouble", head: "Quality", text: "User feedback, sampled human or LLM-judge review, regression tests, drift."}
      - {icon: "fa:FaShieldAlt", head: "Safety", text: "Guardrail blocks, redactions, flagged outputs, injection attempts."}
      - {icon: "fa:FaCodeBranch", head: "Versions", text: "Which model, prompt and index produced each answer."}
    notes: |
      Monitoring for generative AI extends normal web monitoring. Performance uses percentiles because averages hide slow requests: p95 means ninety-five percent of requests are faster. Cost must be tracked per user and per day, with alerts. Reliability includes rate-limit errors and provider outages. Quality needs signals such as user feedback, sampled reviews and regression tests, because model and data drift can silently degrade answers. Safety metrics track guardrail activity. Versions link every answer to the model and prompt that produced it, which is essential for debugging and accountability.

  - type: figure
    title: "Measured: a monitoring summary from the lab app's logs"
    figure: lab_monitor
    bullets:
      - "{{MONITOR_NOTES}}"
      - "Logs record metadata (latency, tokens, blocks, version), not raw personal data."
    stack: true
    notes: |
      The lab sends simulated traffic through the app, including a prompt-injection attempt and messages containing an e-mail address and a phone number. Each bar is one request: blue answered, orange answered after redacting personal data, red blocked. The dashed line marks the ninety-fifth percentile latency. The summary in the bullet is computed from the log file. Point out the design choice: logs store metadata, not message text, following GDPR data minimisation; if you need text for quality review, redact it and limit retention and access.

  - type: flow
    title: "Guardrails in layers"
    steps:
      - {label: "Input checks", sub: "Length, rate limits, PII redaction, injection and topic filters"}
      - {label: "Model setup", sub: "System prompt, least-privilege tools, safe decoding settings"}
      - {label: "Output checks", sub: "Moderation classifier, schema validation, leak and policy checks", highlight: true}
      - {label: "Human oversight", sub: "Escalation for sensitive or uncertain cases"}
      - {label: "Monitor & red-team", sub: "Track blocks, test attacks, update rules"}
    callout: "Regex rules are a start; production systems add trained classifiers (e.g. Llama Guard-style models) and least privilege."
    notes: |
      Guardrails work in layers because each layer can be bypassed. Input checks enforce length and rate limits, redact personal data and filter known injection patterns. The model setup limits damage: least-privilege tools mean an injected instruction cannot do much. Output checks run moderation classifiers, validate structured outputs and check for leaked secrets or policy violations. Humans handle sensitive or uncertain cases. Monitoring and red-teaming find new attacks. The lab's regex guardrails are deliberately simple; students discuss how to bypass them in question two.

  - type: bullets
    title: "LLMOps tooling: tracing and evaluation"
    icon: "fa:FaSearch"
    bullets:
      - "**Tracing** records each step of a request (retrieval, prompts, tool calls, model calls) with timings and tokens."
      - "Tools: **OpenTelemetry** (open standard), **Langfuse** (open source), **LangSmith**, **MLflow**, cloud consoles (Azure AI Foundry, Vertex AI)."
      - "**Evaluation in production**: sampled LLM-as-judge and human review, user feedback, regression suites (week 7)."
      - "**Guardrail libraries**: moderation APIs, Llama Guard-style classifiers, NeMo Guardrails, Guardrails AI."
    notes: |
      Tracing is essential once an application has several steps, as RAG and agent systems do next week: a trace shows which retrieval, prompt, tool call or model call caused a bad answer or a slow response. OpenTelemetry is the open standard; Langfuse is an open-source LLM observability platform; LangSmith integrates with LangChain; MLflow tracks experiments and traces; and cloud platforms such as Azure AI Foundry and Vertex AI include monitoring and evaluation dashboards. Guardrail libraries and safety classifiers provide more robust checks than hand-written rules. Mention these as options, not requirements, for projects.

  - type: table
    title: "Comparison: choosing a deployment for a student project"
    header: ["Need", "Good choice", "Why"]
    rows:
      - ["Best quality, quick prototype", "Cloud API (free tier) + Gradio", "No infrastructure; strongest models"]
      - ["Private data, no budget", "Ollama or Transformers locally", "Data stays on the machine"]
      - ["Fine-tuned model for a demo", "Hugging Face Spaces or Colab + Gradio", "Free hosting of your own model"]
      - ["Many users, steady load", "vLLM on a cloud GPU", "Batching gives low cost per token"]
      - ["Reproducible hand-in", "Docker image + pinned versions", "Examiners can run it"]
    notes: |
      The descriptor asks for a comparison, so end with a practical decision table for projects. For the best quality in a quick prototype, use a cloud API on its free tier with a Gradio interface. For private data without a budget, run a local model. To demo your own fine-tuned model, use Hugging Face Spaces or Colab. For many users with steady load, a serving engine on a GPU. For a reproducible hand-in, a Docker image with pinned versions. Remind students to justify their choice in the project report with measured latency, cost and quality.

  - type: bullets
    title: "Responsible deployment checklist"
    icon: "fa:FaClipboardList"
    bullets:
      - "**Transparency**: tell users they are talking to an AI and label generated content (EU AI Act Art. 50)."
      - "**Data protection**: know where data goes; minimise, redact and set retention; check provider terms (GDPR)."
      - "**Security**: keys in secrets managers; authentication and rate limits; OWASP Top 10 for LLM applications."
      - "**Oversight and evaluation**: test before release, monitor after, clear escalation path to a human."
      - "**Cost and environment**: budgets and alerts; right-size models to reduce energy use."
    notes: |
      This checklist connects the week to responsible AI. Transparency is now a legal duty in the EU: users must be told they are interacting with an AI system. Data protection requires knowing where prompts go and how long they are kept. Security follows the OWASP Top 10 for LLM applications, which lists prompt injection, sensitive information disclosure and unbounded consumption among the main risks. Oversight and evaluation continue after launch. Finally, cost and energy: smaller, well-chosen models reduce both.

  - type: lab
    title: "Lab 11: deploy, measure and monitor a generative AI app"
    steps:
      - "Stream from a local model and measure **TTFT** and **tokens/s**."
      - "Serve it as an **OpenAI-compatible API** with **FastAPI**; call it with the `openai` SDK and **LangChain**; optionally a cloud API."
      - "Estimate **monthly cost**; implement **retry with back-off**."
      - "Quantise (int8, int4, groups) and measure **perplexity**; measure **batching** and **caching**."
      - "Build a **Gradio** app with **guardrails** and **logging**; summarise the logs as a **monitoring** report; write a **Dockerfile**."
    runtime: "Google Colab T4 GPU (≈ 20 min); CPU works, more slowly"
    deliverable: "Notebook with latency, cost, quantisation, batching and monitoring tables, the app link or screenshot, and three answers"
    notes: |
      The lab covers both descriptor tutorials: exploring tools with local and cloud models, and building and deploying a small application with a web interface, measuring latency and cost and adding logging and guardrails. Cloud API keys are optional; everything else runs without accounts. Remind students to stop the public Gradio link at the end of the session and never to paste keys into the notebook.

  - type: summary
    points:
      - "Think in layers: models, serving, orchestration, applications, plus LLMOps."
      - "The **OpenAI-compatible API** lets one client use cloud, self-hosted and local models."
      - "Protect **API keys**; plan for **tokens, pricing and rate limits**; **stream** answers."
      - "Latency ≈ **TTFT** + output tokens ÷ tokens per second."
      - "Cloud vs self-hosted vs local: trade quality, cost, data control and operations."
      - "**Quantisation**, **batching** and **caching** cut cost; re-check quality."
      - "Apps: **Gradio** + **FastAPI** + **Docker**; version models and prompts."
      - "Monitor performance, cost, quality and safety; layer **guardrails**."
    notes: |
      Recap the eight points. Students should be able to draw the architecture of a small application, estimate its cost, explain where latency comes from, choose and justify a deployment option, and list what to monitor. Next week, the final technical week, we connect models to knowledge and tools: retrieval-augmented generation and agents, which use everything from today.

