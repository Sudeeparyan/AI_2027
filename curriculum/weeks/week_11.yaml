slides:
- type: title
  figure: cover
  notes: 'In short: Deployment turns a model into an application people can use and maintain.


    Explain: A model predicts tokens, while an application receives requests and returns useful answers. Deployment means making
    that complete system available. An interface serves people; an API connects programs through declared messages. Monitoring
    records failures, time, token use and versions after requests arrive. Weights stay fixed during the serving experiments
    in this lecture.


    Example: Imagine a course assistant answering one invented question in a notebook. Now imagine 500 students requesting answers.
    The model is unchanged, but queues, access controls and operating responsibilities become essential. The classroom example
    does not establish real concurrent capacity.


    Ask: What separates a working notebook from a maintained service?


    Answer: Request handling, an interface, deployment choices, tests, controls and monitoring around the model.


    Watch out: A successful single answer does not demonstrate reliable service for hundreds of simultaneous users.'
- type: outcomes
  notes: 'In short: Choose and operate a deployment using evidence about quality, time, cost and data.


    Explain: Serving means running an existing model for requests. Frameworks provide reusable components for model access or
    application coordination. Quantisation represents weights with fewer values; batching processes requests together. Caching
    reuses computation or completed answers. The full outcomes include building interfaces, packaging dependencies and monitoring
    every reachable request route.


    Example: For a fictional course assistant, identify who owns the interface, model runtime and logs. Compare a local model
    with a hosted API using the same questions. A comparison needs task quality as well as token counts; a cheap incorrect answer
    is not sufficient.


    Ask: Which evidence would justify choosing one deployment?


    Answer: Task quality, request timing, total operating cost, data handling and maintenance constraints.


    Watch out: Tool familiarity is useful, but it cannot replace measurements or the requirements of the actual task.'
  items:
  - Choose layers.
  - Build interfaces.
  - Measure operation.
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: from notebook to 500 users'
    minutes: 5
  - title: 1 · Frameworks and the tool stack
    minutes: 20
  - title: '2 · API platforms: keys, tokens, pricing, limits, streaming'
    minutes: 22
  - title: 3 · Deployment options and efficient serving
    minutes: 25
  - title: '4 · Building applications: Gradio, FastAPI, Docker'
    minutes: 14
  - title: 5 · Monitoring, guardrails and comparison
    minutes: 21
  - title: Lab preview and wrap-up
    minutes: 6
  notes: 'In short: The course now connects trained models to usable systems and measured operation.


    Explain: Earlier weeks explained model families, prompting, evaluation and adaptation. This week adds serving, interfaces
    and operating measurements. Serving uses fixed weights rather than changing them through training. Week twelve extends applications
    with retrieval and controlled tools. Read the highlighted course position before naming the dependencies needed for the
    lab.


    Example: A student fine-tunes a classifier in an earlier week, then exposes its predictions through an API here. The training
    notebook supplies weights; the application supplies request validation and responses. The course map shows conceptual dependencies
    rather than an executable data pipeline.


    Ask: Does moving a model behind an API train its weights?


    Answer: No. Deployment changes how requests reach the model; training requires a separate objective and update.


    Watch out: Do not interpret every connection on the course map as a model-training step or a compulsory software dependency.'
- type: discussion
  title: Warm-up
  icon: fa:FaUsers
  prompt: Your notebook works. Tomorrow 500 students use it. What could fail?
  points:
  - Waiting time and capacity.
  - Cost and privacy.
  - Failures and operating responsibility.
  notes: 'In short: More users create questions about capacity, privacy, cost and responsibility.


    Explain: Capacity is the workload a service can handle under stated conditions. Concurrent requests overlap in time and
    can create queues. Latency measures how long a request waits. Throughput measures total completed work per unit time. Responsibility
    includes deciding who diagnoses failures, controls access and keeps the application working.


    Example: Imagine 500 students each sending one question before a deadline. A notebook that answered one question tells us
    little about that burst. Like a service counter, the application can develop a queue; unlike a simple counter, model requests
    also vary in length.


    Ask: Which concern would you measure first for the deadline burst?


    Answer: Measure arrival patterns, individual waits and errors, then compare capacity with the quality and budget requirements.


    Watch out: A public demo link is an interface feature, not evidence of capacity, access control or reliable operation.'
- type: section
  number: 1
  title: Frameworks and the tool stack
  question: Which tools exist, and which do you need?
  icon: fa:FaLayerGroup
  notes: 'In short: Separate the model, serving layer, application coordination and interface before choosing tools.


    Explain: The model computes token predictions from stored weights. A serving layer runs that computation for requests. Application
    coordination connects prompts, retrieval, tools and checks. An interface presents controls to people or endpoints to programs.
    These responsibilities can share one process, but they remain different design decisions.


    Example: A restaurant separates the menu, waiter and kitchen. Similarly, Gradio displays controls while model code generates
    answers. The analogy breaks when software components run together or call remote services; their physical location does
    not define their responsibility.


    Ask: Does an orchestration framework automatically host the model?


    Answer: No. Workflow coordination and model execution are separate choices, even when one package can connect them.


    Watch out: An OpenAI-compatible endpoint can implement only part of the client format; always test the fields you need.'
- type: figure
  title: The generative AI stack
  figure: stack
  notes: 'In short: The stack assigns distinct responsibilities to hardware, models, serving, coordination and applications.


    Explain: Hardware supplies computation and memory. Model weights determine learned predictions, while generation settings
    control inference. Serving accepts requests and invokes a model runtime. Orchestration connects multiple application operations.
    Monitoring crosses these layers because a slow or incorrect answer can originate in several different places.


    Example: Trace a browser message through application code to a model on a laptop. The browser is an interface; the laptop
    is hardware. A serving engine runs weights, whereas a retrieval framework finds evidence. The layer table classifies responsibilities
    rather than passing data between its rows.


    Ask: Where do vLLM and Ollama belong in this stack?


    Answer: They provide ways to run and access models; they are serving or local-runtime tools.


    Watch out: Do not label a model library, orchestration framework and hosting service as interchangeable products.'
- type: table
  title: Frameworks and platforms at a glance
  header:
  - Tool
  - Role
  rows:
  - - Hugging Face
    - Distribute models
  - - OpenAI / Azure OpenAI
    - Hosted API
  - - Gemini API
    - Hosted API
  - - vLLM / Ollama
    - Run models
  - - LangChain / LangGraph
    - Coordinate steps
  - - LlamaIndex
    - Retrieve evidence
  notes: 'In short: Choose each named tool for its role rather than collecting frameworks without a need.


    Explain: Hugging Face offers model distribution and tools for running or accessing models. OpenAI, Azure OpenAI and Gemini
    API provide hosted model access. vLLM and Ollama illustrate serving and local model execution. LangChain and LangGraph coordinate
    application operations; LlamaIndex supports indexing and retrieval. Model availability, features and hosting conditions
    require current official documentation.


    Example: For one laptop request, a local runtime may be sufficient. For a retrieval assistant, application code also needs
    evidence selection. The table groups examples by role; it does not rank model quality or promise any account a free hosted
    machine.


    Ask: Which kind of tool runs a small model locally?


    Answer: A local model runtime, such as Ollama or direct Transformers code, subject to the device and model requirements.


    Watch out: An example name is not a guarantee of current pricing, capacity, eligibility or identical behaviour across releases.'
- type: figure
  title: 'One client, many back ends: the OpenAI-compatible API'
  figure: openai_compat
  notes: 'In short: A compatible API reuses a basic request format while backend capabilities can differ.


    Explain: A client is the program sending a request. An endpoint is the address and handler receiving it. Compatibility means
    supporting specified request and response fields. It does not guarantee identical answers, tools, streaming or error behaviour.
    Changing endpoints therefore requires feature checks and a repeated task evaluation.


    Example: Keep a messages list containing one user question, then change the endpoint, credential and model identity. The
    local lab returns choices and usage fields in a compatible shape. It deliberately lacks the complete provider API, production
    authentication and streaming response protocol.


    Ask: Which settings usually identify another compatible backend?


    Answer: The endpoint address, its credential and the model identifier, followed by checks of required features.


    Watch out: Compatibility concerns a contract between programs; it does not make their models equally capable or their data
    terms identical.'
- type: compare
  title: Plain SDK or orchestration framework?
  columns:
  - head: SDK + code
    points:
    - Direct calls
    - Explicit checks
    - Simple debugging
  - head: Framework
    points:
    - Reusable connectors
    - Managed state
    - More dependencies
  callout: Add coordination for a stated need.
  notes: 'In short: An SDK is enough for a simple call; frameworks help when coordination becomes a real requirement.


    Explain: An SDK is a software library for communicating with a service. Plain code can format prompts, make calls and validate
    results directly. Frameworks add connectors, state management and reusable workflow components. State means information
    retained between operations. Each extra abstraction also adds dependencies and another place to inspect failures.


    Example: Compare one call followed by JSON validation with a workflow that retrieves evidence and resumes interrupted steps.
    The latter may benefit from managed state. A framework can organise that work, but the same underlying model still needs
    task evaluation and operating controls.


    Ask: When does an orchestration framework justify its dependencies?


    Answer: When its connectors, workflow state or tracing solve a specific application requirement that plain code handles
    poorly.


    Watch out: A framework does not automatically provide suitable privacy controls, model hosting or correct answers.'
- type: quiz
  question: University data stays on campus. Which route fits?
  options:
  - Self-host compatible model; re-test
  - Replace all client components
  - Send externally; request deletion
  - Choose larger external model
  answer: 0
  notes: 'In short: A data-location requirement must be satisfied before comparing model quality or convenience.


    Explain: Self-hosting means your organisation operates the model runtime. A compatible endpoint can preserve the basic client
    contract. The organisation still needs capacity, access controls and maintenance. Re-evaluation checks the replacement model
    on the real task. Deleting data after sending it cannot satisfy a requirement that it never leaves university servers.


    Example: An invented student record must remain on university infrastructure. Changing to a suitable university-hosted compatible
    endpoint can preserve the request pattern. Verify that logging, backups and auxiliary tools also respect the same location
    requirement; changing one URL alone does not establish that.


    Ask: Which option fits the stated data-location requirement?


    Answer: A. Self-host a suitable compatible model, change the endpoint and repeat feature, quality and capacity tests.


    Watch out: A larger external model remains external, and requesting later deletion does not undo the earlier transfer.'
- type: section
  number: 2
  title: API platforms
  question: Keys, tokens, pricing, rate limits and streaming
  icon: fa:FaPlug
  notes: 'In short: API operation requires credentials, bounded requests, cost arithmetic and explicit error handling.


    Explain: Authentication establishes who is requesting access. Token counts measure input and generated text under the selected
    tokenizer. Rate limits restrict requests or tokens within a time window. Streaming exposes pieces of an answer before completion.
    Prices and supported fields are provider-specific, so classroom cost inputs are explicitly illustrative.


    Example: At 500 students, 20 requests daily and 30 days, the scenario contains 300,000 requests. Multiplying by 800 input
    tokens gives 240 million input tokens. Output tokens need a separate count and price. These are planning assumptions, not
    observed traffic or current vendor rates.


    Ask: Why count input and output tokens separately?


    Answer: They represent different work and can have different prices, quotas and effects on waiting time.


    Watch out: Streaming changes when output becomes visible; it does not automatically reduce total generation work.'
- type: cards
  title: What an API platform gives you, and what it expects
  cards:
  - head: Identity
    text: Credential + permissions
  - head: Usage
    text: Input / output tokens
  - head: Limits
    text: Bound requests; handle 429
  - head: Streaming
    text: Expose pieces before completion
  - head: Reuse
    text: Batch / cache policies
  - head: Schema
    text: Validate declared fields
  notes: 'In short: Read an API platform as a contract for identity, requests, responses, quotas and billing.


    Explain: Credentials establish the calling account or identity. Request fields specify messages, output limits and supported
    settings. Responses return useful data or an error that the application must handle. Quotas bound requests or token use.
    Schema validation checks declared fields, while billing and data-use terms need separate provider documentation.


    Example: An invented request contains messages and max_tokens=24. The platform checks access and field validity before serving
    it. A successful reply may include separate input and output counts. The same JSON shape does not imply a shared tokenizer,
    free access or identical request limits.


    Ask: Does a valid schema guarantee a correct model answer?


    Answer: No. A schema checks structure; correctness still requires evidence and task evaluation.


    Watch out: Do not assume every provider supports the same tools, output formats, cache rules or streaming fields.'
- type: bullets
  title: Keeping API keys safe
  notes: 'In short: Keep provider credentials on the server and apply deliberate access and request controls.


    Explain: An API key is a secret credential identifying an account. Browser code and shared notebooks can reveal embedded
    credentials. Server-side secrets keep that key outside the user interface. Restricted permissions and usage controls limit
    what a stolen credential can do. Revocation disables a leaked key; reviewing usage helps identify what happened.


    Example: A browser sends an invented question to your application server. The server reads a secret only after the optional
    provider route is enabled. The browser receives answer text, never the key. This separation still needs authentication and
    limits on the browser-facing endpoint.


    Ask: Should a browser receive the provider key to call the model?


    Answer: No. It should call a controlled application server that holds the provider credential.


    Watch out: A private notebook can later be shared or committed; its privacy setting is not a secrets-management strategy.'
  visual:
    type: example_strip
    items:
    - label: Browser
      text: Question only
    - label: Server
      text: Restricted secret + request limits
    - label: Provider
      text: Answer + usage
    caption: Revoke leaked keys; review usage.
  bullets:
  - Keep credentials in trusted server code.
- type: figure
  title: 'Anatomy of a request: where the time goes'
  figure: request_anatomy
  bullets:
  - 'First output: network + queue + prefill.'
  - 'Remaining output: decoding.'
  - Streaming exposes pieces sooner.
  stack: true
  notes: 'In short: First-token wait and full-answer wait measure different stages of one request.


    Explain: Network travel and authentication occur before model work. A queue adds waiting when capacity is occupied. Prefill
    processes the input prompt. Decoding generates continuation tokens sequentially. Time to first token ends when the first
    model token becomes available; completion time covers the whole request.


    Example: In a hypothetical calculation, first output arrives after one second and 100 further tokens take five seconds.
    Total wait is roughly six seconds. The notebook observes first non-empty decoded text instead of internal token timestamps;
    one text chunk can contain several tokens.


    Ask: Does showing streamed text necessarily shorten completion time?


    Answer: No. It can let users read earlier while the same generation work continues.


    Watch out: TestClient excludes real network transport; neither its timing nor a decoded chunk is a complete production TTFT
    measurement.'
- type: figure
  title: 'Stored GPU run: streaming latency'
  figure: lab_latency
  bullets:
  - '{{LAT_NOTES}}'
  - First decoded text approximates TTFT.
  stack: true
  notes: 'In short: Read the latency chart together with the recorded model, hardware and measurement boundary.


    Explain: The stored chart comes from the archived instructor run. First non-empty decoded text approximates time to first
    token. Full-answer duration includes the complete observed generation. Retokenising decoded text estimates output length
    and can differ from generated token IDs. The revised CPU lab creates its own table using a smaller bounded workload.


    Example: The shorter bar marks when readable text began; the longer bar marks completion for the same question. Use the
    stored result placeholder for the recorded values. Then compare your new table only after noting model identity, output
    cap, device and warm-up conditions.


    Ask: Can the stored chart predict your exact CPU waiting time?


    Answer: No. It records a specified earlier run; your hardware, model, workload and timing boundary may differ.


    Watch out: Never copy archived values into a fresh table or describe an unmeasured revised path as already timed.'
  caption: Qwen2.5-0.5B-Instruct · GTX 1650 · 9 Oct 2026
- type: table
  title: 'Estimating cost: 500 students, 20 requests a day, one month'
  header:
  - Classroom option
  - Input / output $/1M
  - Monthly USD
  rows:
  - - Small
    - 0.10 / 0.40
    - '60'
  - - Medium
    - 0.50 / 2.00
    - '300'
  - - Frontier
    - 2.00 / 10.00
    - 1,380
  - - Always-on GPU
    - 0.60/hour
    - 432 + staff
  callout: 300,000 requests; 800 input, 300 output tokens. Illustrative rates.
  callout_label: Method
  notes: 'In short: Estimate monthly cost by multiplying requests and separate token charges using consistent units.


    Explain: Input and output prices here are hypothetical classroom values. A million-token unit requires dividing token totals
    by one million. Requests per month come from users, requests per day and days. An always-on machine instead accumulates
    hourly charges. Staff work, peak capacity and answer quality remain separate comparison requirements.


    Example: The scenario gives 300,000 requests with 800 input and 300 output tokens each. At illustrative rates 0.10 and 0.40
    dollars per million, each request costs 0.0002 dollars, giving 60 dollars monthly. This arithmetic is not a current provider
    quotation.


    Ask: Which costs are absent from the always-on GPU row?


    Answer: Staff time and other operating costs; the row also does not establish enough capacity for peak demand.


    Watch out: Keep rates dated and labelled, and do not compare model prices without checking the quality required by the task.'
- type: code
  title: Streaming and retries in code
  code: "stream = client.chat.completions.create(\n    model=MODEL, messages=messages,\n    stream=True, max_tokens=24)\nfor\
    \ chunk in stream:\n    print(chunk.choices[0].delta.content or \"\", end=\"\")"
  bullets:
  - Set timeouts.
  - '429: bounded backoff + jitter.'
  - 'Full retry logic: notebook.'
  notes: 'In short: Streaming and retries need explicit limits and clear failure handling.


    Explain: A stream yields pieces while generation continues. The displayed pseudocode consumes chunks instead of waiting
    for one complete answer. HTTP 429 signals rate limiting. Backoff increases retry delays; jitter varies them so callers do
    not retry simultaneously. Capped attempts and timeouts prevent endless waiting, while permanent errors need a different
    response.


    Example: A fictional provider returns two 429 errors before succeeding. Base delays of 0.2 then 0.4 seconds can receive
    a small random variation. The local simulation demonstrates scheduling; it makes no hosted requests and does not establish
    a provider quota.


    Ask: Why add jitter as well as exponential backoff?


    Answer: It reduces synchronised retries by many clients after a shared limit or outage.


    Watch out: Every attempted hosted call can affect quotas or cost; cap combined attempts and do not retry invalid credentials
    indefinitely.'
- type: section
  number: 3
  title: Deployment options and efficient serving
  question: Cloud, self-hosted or local, and how to make it cheaper and faster
  icon: fa:FaServer
  notes: 'In short: Choose the hosting location and then test efficiency changes against task quality.


    Explain: Hosted APIs run the model through a provider. Self-hosting makes your organisation responsible for the runtime.
    Local execution runs on the student or user device. Quantisation, batching and caching improve different parts of operation.
    Their effects depend on the actual model, workload, hardware and implementation rather than a universal speed ranking.


    Example: For a fictional course assistant, compare where prompts travel, who maintains the runtime and how cost accumulates.
    Then hold questions and output length constant while testing an efficiency change. A lower weight estimate does not prove
    lower total memory or satisfactory answers.


    Ask: What should be checked after changing numerical precision?


    Answer: The actual task answers, timing and complete memory requirements under the chosen serving configuration.


    Watch out: An optimisation can change quality, capacity or individual waiting time; measure each relevant outcome separately.'
- type: table
  title: Cloud API vs. self-hosted vs. local
  header:
  - ''
  - Hosted API
  - Self-hosted
  - Local
  rows:
  - - Model
    - Provider list
    - Runnable weights
    - Device fit
  - - Cost
    - Token charges
    - Infrastructure + staff
    - Device + energy
  - - Data
    - Provider terms
    - Your infrastructure
    - Your device
  - - Owner
    - Provider
    - Your team
    - Device owner
  notes: 'In short: Hosting choices trade data location, operating work, model access and cost structure.


    Explain: A cloud API charges for provider-managed access. Self-hosting runs suitable weights on infrastructure your team
    maintains. Local execution uses the device owner''s available resources. Data location depends on all routes, logs and connected
    services. No option removes the need to evaluate quality and request handling.


    Example: Suppose invented data must stay on a university server. A university-hosted runtime may satisfy that condition,
    while a provider API requires a different agreement. For public fictional prompts, a hosted route may be convenient. These
    scenarios illustrate requirements rather than a universal recommendation.


    Ask: Which cost can make self-hosting expensive at low usage?


    Answer: An idle rented machine still incurs charges, and maintenance staff time continues.


    Watch out: Local execution is not costless: hardware, energy, setup, reliability and model suitability still matter.'
- type: equation
  title: 'Quantisation: fewer bits per weight'
  eq:
  - \text{memory} \approx N_{\text{params}} \times \frac{\text{bits}}{8}\ \text{bytes}
  - s = \frac{\max |w|}{2^{b-1} - 1}, \qquad q = \mathrm{round}\left(\frac{w}{s}\right), \qquad \hat{w} = q \cdot
    s
  read_as:
  - 'Weights: parameters × bits/8, before overhead.'
  - Scale → round → reconstruct.
  terms:
  - - N
    - Parameter count
  - - w
    - Original weights
  - - b
    - Bits
  - - s
    - Scale
  - - q
    - Rounded integer
  - - $\hat{w}$
    - Reconstruction
  notes: 'In short: Quantisation rounds weights to a limited set of values using an explicit scale.


    Explain: The parameter count determines ideal weight storage before overhead. Bits per weight divided by eight converts
    that count to bytes. The symbol b denotes bits and s denotes the scale. Integer q is the rounded value; reconstructed weight
    w-hat equals q times s. Separate group scales trade added metadata for potentially lower rounding error. N with subscript
    params means parameter count, while w means original weights.


    Example: For one billion weights, 16-bit ideal storage is two billion bytes; four-bit storage is half a billion bytes. In
    a four-bit symmetric group with largest magnitude one, the scale is one divided by seven. Rounding 0.2 then reconstructing
    gives approximately 0.143.


    Ask: Does the fake_quantize helper allocate packed four-bit tensors?


    Answer: No. It reconstructs floating-point tensors to measure numerical approximation error.


    Watch out: Weight-only arithmetic excludes scales, attention caches, intermediate tensors and runtime memory; it cannot
    guarantee that a model fits.'
- type: figure
  title: 'Stored GPU run: rounding and perplexity'
  figure: lab_quant
  bullets:
  - '{{QUANT_NOTES}}'
  - Reconstructed floats; theoretical size.
  stack: true
  notes: 'In short: The quantisation chart separates hypothetical packed storage from a measured quality proxy.


    Explain: Fake quantisation rounds then reconstructs floating-point weights. The size estimate describes hypothetical packed
    storage, not observed tensor allocations. Perplexity is exponential average token loss under this model and tokenizer. It
    probes one paragraph rather than every application task. Original weights are restored so later experiments start from the
    unchanged reference.


    Example: Compare per-row four-bit rounding with groups of 64 weights. Each group has its own scale, so differently sized
    values can receive different resolutions. Read the archived result placeholder for the actual recorded error and perplexity;
    the mechanism alone cannot predict their order.


    Ask: What evidence would establish acceptable quality after rounding?


    Answer: Task-specific evaluation on held-out examples, alongside the numerical error and perplexity probe.


    Watch out: Do not call theoretical size a measured memory saving or treat one paragraph as a complete deployment benchmark.'
  caption: Qwen2.5-0.5B-Instruct · GTX 1650 · 9 Oct 2026
- type: figure
  title: 'Stored GPU run: batch throughput'
  figure: lab_batch
  bullets:
  - '{{BATCH_NOTES}}'
  - Throughput differs from individual wait.
  stack: true
  notes: 'In short: Batch throughput measures aggregate work and does not directly state each user''s waiting time.


    Explain: Batching processes several input sequences in one model operation. Padding aligns their lengths, and an attention
    mask identifies real tokens. Aggregate throughput counts generated tokens divided by elapsed time. The lab fixes generation
    length for a fair workload comparison. Continuous batching can admit new work as existing requests finish.


    Example: Four prompts with eight generated tokens each create 32 output tokens. If the measured workload takes t seconds,
    aggregate throughput is 32 divided by t. This worked formula does not assign a value to t or claim the batch is faster on
    every CPU.


    Ask: Must a throughput improvement shorten each request''s latency?


    Answer: No. Waiting for a batch or sharing capacity can increase an individual request''s wait.


    Watch out: Compare equal prompts and token counts; do not infer concurrent production capacity from this small sequential
    timing experiment.'
  caption: Qwen2.5-0.5B-Instruct · GTX 1650 · 9 Oct 2026
- type: bullets
  title: Serving engines and caching
  notes: 'In short: Distinguish reused attention computation, reused prefixes and reused complete answers.


    Explain: A key-value cache stores earlier attention state during generation. Prefix caching reuses computation for a repeated
    input beginning. Response caching instead returns an already completed answer. PagedAttention organises attention-cache
    memory, while speculative decoding proposes then verifies candidate tokens. These mechanisms solve different kinds of repeated
    work.


    Example: The lab response-cache key includes model identity, complete messages and output cap. Changing any field should
    require a new answer. A cached library-hours reply remains unsupported when no timetable evidence was supplied; speed does
    not turn an invented answer into a fact.


    Ask: Can a response-cache hit still return a wrong answer?


    Answer: Yes. It reuses the stored text and inherits its errors unless separate evidence and freshness checks are applied.


    Watch out: A provider prefix cache is not the same operation as storing full application responses in a dictionary.'
  visual:
    type: mini_table
    header:
    - Mechanism
    - Reuses / changes
    rows:
    - - KV / prefix cache
      - Earlier attention / input work
    - - Response cache
      - Complete answer
    - - PagedAttention
      - Cache layout
    - - Speculation
      - Propose, then verify
    caption: Re-check quality and freshness.
  bullets:
  - Cache keys must capture response-changing inputs.
- type: stat
  title: What fits where? (weights only)
  stats:
  - value: ≈ 1 GB
    label: 0.5 B, 16-bit
  - value: ≈ 4 GB
    label: 7–8 B, 4-bit
  - value: 16 GB
    label: T4 capacity
  - value: ≈ 140 GB
    label: 70 B, 16-bit
  caption: Weights only; add scales, caches and runtime.
  notes: 'In short: Weight storage is only the first part of a model''s complete memory budget.


    Explain: A billion parameters contain a billion learned weight values. Sixteen bits require two bytes per value before overhead.
    Four-bit storage needs additional scales or metadata in a real implementation. Serving also allocates attention caches,
    intermediate tensors and runtime state. Longer prompts and larger batches can increase these additional allocations.


    Example: The arithmetic gives about one gigabyte for 0.5 billion weights at 16 bits. Seven billion four-bit weights need
    about 3.5 gigabytes before metadata. Compare those estimates with device capacity only after allowing room for caches and
    the actual runtime configuration.


    Ask: Why can fitting the weight estimate still cause an out-of-memory error?


    Answer: Generation needs additional caches, temporary tensors and runtime memory beyond the weights.


    Watch out: A device-capacity example is not a guarantee that a particular model, context length or batch will run successfully.'
- type: quiz
  question: Accurate model, 50 concurrent users, slow replies. Test?
  options:
  - Raise temperature; expect capacity
  - Batch / quantise; re-check quality
  - Extend prompts; expect capacity
  - Disable streaming; expect capacity
  answer: 1
  notes: 'In short: Concurrent-user pressure calls for capacity experiments while preserving acceptable model quality.


    Explain: Concurrency means requests overlap in time. Continuous batching shares model operations across requests as capacity
    becomes available. Quantisation can reduce weight storage in a suitable serving implementation. Both changes need evaluation
    under the intended workload. Changing temperature or disabling streaming does not by itself establish enough capacity.


    Example: An already accurate model struggles with 50 overlapping users. Test a serving configuration with the same task
    examples and realistic arrival patterns. Record waiting-time percentiles, errors and answer checks alongside throughput.
    The notebook''s small batch experiment is preparation for this larger load test.


    Ask: Which option deserves testing in the stated situation?


    Answer: B. Continuous batching and quantisation, followed by quality, latency and capacity checks.


    Watch out: Efficiency techniques are hypotheses to test, not promises; fake rounding alone does not create a production
    low-bit serving engine.'
- type: section
  number: 4
  title: Building applications and interfaces
  question: Gradio, FastAPI and Docker
  icon: fa:FaWindowRestore
  notes: 'In short: An interface, an endpoint and a package expose the same model through different responsibilities.


    Explain: FastAPI maps declared HTTP requests to Python handlers. Gradio connects browser controls to a Python function.
    Docker packages code and dependencies with a start command. Request validation checks structure before generation. Authentication,
    content controls and monitoring still need explicit implementation on every route.


    Example: TestClient sends a JSON request to the FastAPI application inside the notebook process. Calling respond directly
    exercises a separate checked route. An optional Gradio interface can call respond too, but it does not automatically send
    requests through FastAPI or inherit its schema.


    Ask: Does creating a Gradio interface also create a FastAPI deployment?


    Answer: No. They are separate application components; connecting them requires an explicit design and implementation.


    Watch out: A Docker scaffold does not reproduce notebook controls unless those handlers, checks and logs are actually included.'
- type: figure
  title: Proposed integrated application architecture
  figure: app_architecture
  notes: 'In short: The architecture diagram shows a proposed integrated route, distinct from the lab''s separate exercises.


    Explain: A browser submits a request to an application entry point. Input controls can check fields, access and supported
    data patterns. Fixed model weights generate an answer. Output controls inspect the reply before it reaches a user. Metadata
    logs support monitoring without storing complete conversations by default.


    Example: Follow an invented question through UI, checks, model and checked answer. The proposed architecture places controls
    on the common route. In the lab, TestClient reaches FastAPI while respond is called separately; joining those routes is
    an optional architecture exercise, not existing behaviour.


    Ask: Can controls on one route protect another independent endpoint?


    Answer: No. Each reachable entry point must invoke and test the relevant controls.


    Watch out: A dashed arrow means feedback or repetition; logging actual metadata is a solid data transfer, not a model-training
    update.'
- type: code
  title: An OpenAI-compatible endpoint with FastAPI
  code: "@api.post(\"/v1/chat/completions\")\ndef chat(req: ChatRequest):\n    text, n_in, n_out = generate(req.messages, 24)\n\
    \    return compatible_reply(text, n_in, n_out)"
  bullets:
  - 'Pseudocode: full schema in notebook.'
  - 'TestClient: in-process requests.'
  - Usage = input + output.
  notes: 'In short: The FastAPI handler converts a validated request into a generated answer and usage fields.


    Explain: A decorator associates a Python function with an HTTP route. Pydantic validates declared message roles, content
    and token limits. The handler invokes fixed-weight generation using supported settings. Prompt tokens and completion tokens
    are separate counts. TestClient exercises the same application handler without opening a network port.


    Example: A valid request contains one user message and max_tokens=24. The response places answer text inside choices and
    reports prompt_tokens, completion_tokens and their sum. A negative output limit instead returns HTTP 422 before generation.
    The full implementation and schema appear in the reference notes and lab.


    Ask: What should total_tokens equal in this response?


    Answer: The prompt token count plus the completion token count for the actual model call.


    Watch out: This minimal compatible endpoint has no production authentication or inherited respond guardrails; schema validity
    does not guarantee safe content.'
- type: code
  title: A chat interface with Gradio
  code: "if RUN_GRADIO_STRETCH:\n    demo = gr.ChatInterface(respond)\n    demo.launch(share=False)"
  bullets:
  - Optional local interface.
  - Handler supplies checks and logs.
  - 'Remote hosting: separate controls.'
  notes: 'In short: Gradio connects browser inputs to a handler; the handler supplies checks and model work.


    Explain: An interface displays controls and results. ChatInterface calls a function with the current message and recent
    history. The lab''s respond function performs limited current-input checks and metadata logging. The interface is optional;
    direct Python calls demonstrate the same handler. A public link requires separate access, retention and request-budget decisions.


    Example: Create ChatInterface only after enabling the local Gradio stretch. With share=False, the classroom demo stays on
    its local route. Its previous messages still need inspection because checking the newest message alone does not clean earlier
    history. An interface wrapper cannot solve that limitation.


    Ask: Which component supplies the input checks in this example?


    Answer: The respond handler, not the Gradio button or chat display itself.


    Watch out: Do not promise free hosting or launch a public link by default; hosting eligibility and operating controls need
    separate checks.'
- type: bullets
  title: 'Packaging and releasing: Docker, versions, CI'
  notes: 'In short: Packaging records the environment, while release testing checks the actual application behaviour.


    Explain: A Docker image packages code, dependencies and a start command. Exact dependency pins identify tested versions
    rather than broad allowed ranges. Continuous integration, abbreviated CI, runs automated checks before release. Versioning
    records model, prompt, settings and relevant data identities. Rollback means returning to a previously tested release after
    a problem.


    Example: Inspect the exported requirements and Dockerfile as a scaffold. A range such as transformers==5.* does not identify
    one exact installed version. Compare the smaller app handler with notebook redaction, output checks and logging before calling
    the package equivalent to the monitored application.


    Ask: Do broad dependency ranges guarantee an identical future environment?


    Answer: No. Record tested exact versions and rebuild the package before relying on reproducibility.


    Watch out: Secrets belong in controlled runtime configuration, not source code, notebook output, Docker image layers or
    browser fields.'
  visual:
    type: example_strip
    items:
    - label: Package
      text: Code + tested pins
    - label: Release
      text: Evaluate + version
    - label: Recover
      text: Monitor + rollback
    caption: Secrets supplied at runtime.
  bullets:
  - Release a tested version; keep rollback available.
- type: section
  number: 5
  title: Monitoring, guardrails and comparison
  question: How do you know it is working, and safe?
  icon: fa:FaChartLine
  notes: 'In short: Monitoring checks how a released application behaves and connects failures to recorded versions.


    Explain: Monitoring records operational measurements after requests arrive. Evaluation checks answers against task criteria
    and remains necessary after release. Guardrails block or modify specified input and output patterns. False positives block
    harmless requests; false negatives miss unwanted behaviour. Traces link individual request steps so problems can be investigated.


    Example: A fictional service sees slower answers after a prompt change. Latency logs show the timing change, while version
    fields identify the prompt release. A repeated held-out test checks answer quality. Neither measurement alone explains every
    failure, so inspection combines operational and task evidence.


    Ask: Does a good latency dashboard establish correct answers?


    Answer: No. Speed and reliability measurements must be combined with repeated task-quality checks.


    Watch out: A rise in blocked requests may indicate attacks, changed rules or harmless inputs being blocked; inspect examples
    with appropriate data controls.'
- type: cards
  title: What to monitor
  cards:
  - head: Performance
    text: First text; full wait; throughput
  - head: Cost
    text: Tokens + budget
  - head: Reliability
    text: Errors; 429; timeouts
  - head: Quality
    text: Task tests + review
  - head: Checks
    text: Blocks; misses; redactions
  - head: Versions
    text: Model + prompt + data
  notes: 'In short: Monitor speed, cost, failures, quality, checks and versions as separate signals.


    Explain: Performance includes first output, completion wait and throughput. Reliability records failures, timeouts and rate-limit
    responses. Cost needs token usage and the relevant dated charging rules. Quality needs task tests and suitable human review.
    Version fields help link changed behaviour to model, prompt, settings or retrieved-data changes.


    Example: Suppose most fictional requests finish quickly but several wait much longer. The mean can hide those slow cases;
    percentiles expose the distribution. Pair that chart with error counts and answer checks. A small lab traffic sample demonstrates
    aggregation rather than guaranteeing production service levels.


    Ask: What does p95 latency describe?


    Answer: A duration at or below which approximately 95 percent of the measured request waits fall.


    Watch out: The population matters: state whether percentiles include blocked requests, failed requests, cache hits or only
    successful generation.'
- type: figure
  title: 'Stored GPU run: ten-request monitoring'
  figure: lab_monitor
  bullets:
  - '{{MONITOR_NOTES}}'
  - Metadata only; allowed-request percentiles.
  stack: true
  notes: 'In short: The monitoring chart represents a recorded traffic sample with explicitly separated request outcomes.


    Explain: Allowed requests reach generation and can consume prompt and completion tokens. Blocked current inputs skip generation
    in respond. Supported personal-data patterns are replaced before allowed generation. The log stores metadata rather than
    raw prompts. The summary computes latency percentiles from allowed requests and block counts from all requests.


    Example: Follow one recorded blocked bar and one redacted bar. The blocked request records zero model token counts, while
    the redacted request can still generate an answer. Read the stored summary placeholder for actual results. The revised CPU
    lab uses four invented requests and needs its own measured record.


    Ask: Do blocked requests enter the allowed-request p95 calculation?


    Answer: No. They remain visible in the total request and block counts but are excluded from that percentile.


    Watch out: The historical per-request chart has its own sample size; do not label it as the new four-request CPU run.'
  caption: Qwen2.5-0.5B-Instruct · GTX 1650 · 9 Oct 2026
- type: flow
  title: Guardrails in layers
  steps:
  - label: Validate
    sub: Input
    role: tool
  - label: Generate
    sub: Fixed weights
    role: model
  - label: Check
    sub: Output
    role: tool
  - label: Escalate
    sub: Uncertainty
    role: tool
  - label: Monitor
    sub: Outcomes
    role: metric
  callout: Apply controls on every route.
  notes: 'In short: Controls belong on every request route and should be evaluated for misses and false alarms.


    Explain: Input checks inspect request size, identity and permitted content. Restricting model tools limits the actions a
    compromised workflow can perform. Output checks validate fields and relevant policies. Human oversight handles uncertain
    or consequential cases under defined rules. Monitoring provides evidence for repeated improvement of those controls.


    Example: A literal injection pattern is blocked, but a paraphrase can avoid the same regular expression. The code still
    needs least-privilege design and task-specific checks. Follow the labelled route from input to checked answer; monitoring
    feedback returns test cases rather than training gradients.


    Ask: What should happen after discovering a missed attack?


    Answer: Add a representative regression case, inspect the relevant control and retest both unwanted and harmless examples.


    Watch out: Pattern detection is a demonstration with known gaps; it does not guarantee safe behaviour for arbitrary inputs
    or model outputs.'
  arrows:
  - request
  - answer
  - checked answer
  - case record
- type: bullets
  title: 'LLMOps tooling: tracing and evaluation'
  notes: 'In short: Tracing links request operations, while LLMOps combines versions, testing, releases and monitoring.


    Explain: A trace records the operations involved in one request. Timing and token fields help identify costly or slow steps.
    LLMOps means operating language-model applications through a repeatable lifecycle. Telemetry tools can collect traces and
    operational measurements. Their usefulness depends on what the application records and who can access it.


    Example: A retrieved answer takes too long. A trace can separate retrieval wait, prompt preparation and model completion.
    OpenTelemetry, Langfuse, LangSmith and MLflow are examples to investigate for appropriate recording. Choosing one tool does
    not supply missing evaluation cases or justify storing personal conversations.


    Ask: How does a trace differ from one total-duration field?


    Answer: It links the request''s individual operations, making the location of time or failure easier to inspect.


    Watch out: Instrument only needed fields, restrict access and retention, and avoid recording keys or raw personal data in
    debug output.'
  visual:
    type: example_strip
    items:
    - label: Request trace
      text: Retrieval → prompt → generation
    - label: Inspect
      text: Timing + tokens + errors
    - label: Operate
      text: Versions + tests + releases
    caption: 'Examples: OpenTelemetry, Langfuse, LangSmith, MLflow.'
  bullets:
  - Inspect every reachable request route.
- type: table
  title: 'Comparison: choosing a deployment for a student project'
  header:
  - Need
  - Route
  - Verify
  rows:
  - - Prototype
    - Hosted API
    - Quality / terms
  - - Private data
    - Local model
    - Fit / quality
  - - Demo
    - Gradio
    - Hosting eligibility
  - - Many users
    - Serving engine
    - Load / waits
  - - Repeatable
    - Docker
    - Tested pins
  notes: 'In short: A deployment recommendation should follow requirements and evidence rather than a favourite tool.


    Explain: A prototype values quick iteration but still needs data and spending controls. Private-data tasks constrain where
    requests and logs can travel. Many users require realistic load testing and capacity planning. Reproducible hand-ins need
    tested environments and documented settings. Hosting availability and account conditions change, so published examples are
    not entitlement promises.


    Example: For a fictional student project, first list the required quality, data location, peak workload and budget. Then
    compare a local model, a hosted API and a self-hosted runtime using identical task examples. Record the assumptions that
    could change the recommendation before making a deployment choice.


    Ask: Does a demo hosting option guarantee free CPU or GPU access?


    Answer: No. Check current official account conditions, hardware availability, quotas and charges.


    Watch out: A cheap isolated request cannot establish total project cost, suitable concurrency or acceptable answer quality.'
- type: bullets
  title: Responsible deployment checklist
  notes: 'In short: A responsible release needs a concrete test and an accountable owner for each requirement.


    Explain: Disclosure tells users they are interacting with an AI system. Data minimisation limits collection to what the
    task needs. Access controls and request limits constrain who can call the application. Evaluation and escalation address
    uncertain or consequential answers. A release record connects these decisions to tested versions and evidence.


    Example: Before exposing an invented classroom assistant, inspect its request routes, secret handling, logs and quality
    tests. Assign someone to respond to errors and withdraw a faulty version. A checklist becomes useful when each item names
    a check, its result and the person responsible.


    Ask: Does checking boxes once remove the need for monitoring?


    Answer: No. Workloads, model releases, prompts and user behaviour can change after deployment.


    Watch out: Use the relevant institutional and legal guidance for a real deployment; classroom pattern checks are only a
    small technical demonstration.'
  visual:
    type: mini_table
    header:
    - Requirement
    - Evidence
    rows:
    - - Transparency
      - Clear AI notice
    - - Data / access
      - Minimise; restrict; expire
    - - Quality / safety
      - Test; monitor; escalate
    - - Operation
      - Owner; budget; rollback
  bullets:
  - Assign owners and test controls before release.
- type: lab
  title: 'Lab 11: deploy, measure and monitor a generative AI app'
  steps:
  - Time CPU generation.
  - Validate endpoint requests.
  - Estimate cost; simulate retries.
  - Probe rounding, batches and cache.
  - Inspect monitoring and packaging.
  runtime: 'CPU core: {{W11_CORE_TIME}}.'
  deliverable: Tables, checks and explained decisions.
  notes: 'In short: The lab core deploys and measures a small local model without requiring hosted spending.


    Explain: Shared setup chooses CPU by default and provides optional provider access. The core uses real bounded generation,
    FastAPI TestClient and synthetic monitoring traffic. Quantisation here means rounding then reconstructing floating-point
    weights. Server launch, framework clients, Gradio and remote hosting are optional stretches. Cached local CPU waiting time
    is measured; downloading and optional stretches need separate records.


    Example: Complete five TODOs, predict each result and use its semantic check. Compare a 24-token cap with 12 tokens using
    an invented question. A slider inspects the setting without sending automatic model requests. Preserve your actual tables
    rather than copying stored GPU results.


    Ask: Are an API key or GPU required for the core?


    Answer: No. Local CPU generation and the in-process endpoint supply the complete required path.


    Watch out: Apply the recorded runtime only to the cached local CPU core; downloading and optional stretches need separate
    evidence.'
- type: summary
  points:
  - Choose model, server and application layers.
  - Protect keys; estimate tokens and cost.
  - Measure first text and full wait.
  - Compare deployment and efficiency tradeoffs.
  - Package tested versions.
  - Check every route; monitor quality, cost and failures.
  notes: 'In short: Operate the whole request path and justify decisions using quality, timing, cost and data evidence.


    Explain: The model, runtime, coordination and interface have different responsibilities. API contracts describe fields rather
    than identical model behaviour. Efficiency changes require quality checks as well as speed measurements. Packaging records
    tested versions, while monitoring records operational behaviour. Every reachable route needs its own validated controls
    and failure handling.


    Example: Return to the fictional 500-student assistant. State its expected traffic, data location and quality target before
    choosing deployment. Then inspect first text, full wait, throughput, token costs and failures. A modest working demo is
    useful evidence, but it is not a capacity or safety guarantee.


    Ask: If batching doubles throughput, must every student wait less?


    Answer: No. Aggregate work can rise while individual requests wait longer for batching or shared capacity.


    Watch out: Keep archived measurements labelled and replace them only through a measured export, results comparison and the
    fill pipeline.'
