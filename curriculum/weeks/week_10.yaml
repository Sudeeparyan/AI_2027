  notes: 'In short: Use primary explanations and exact model documentation for further study.


    Explain: The readings connect architecture, training and task evaluation. The small-model card explains the lab''s proposed
    VLM route. Original CLIP research explains shared image-text representations. C2PA specifications define provenance assertions
    and verification. The lecture video offers another worked explanation of generative modelling foundations.


    Example: Read the SmolVLM card before changing checkpoints, then compare your actual inputs, output task and hardware with
    its supported use.


    Ask: Which source should resolve a model-specific preparation question?


    Answer: The exact model card and official processor documentation, checked against the installed version and the observed
    tensors.


    Watch out: A family overview or old tutorial may describe a different checkpoint, endpoint or library interface.'
