subtitle: Read and generate media, inspect each stage, and verify what the model claims
mimlos:
- 2
- 3
- 4
objectives:
- Trace how a **vision-language model (VLM)** uses image features with a language model; compare modular and
  native designs.
- Explain the data and training stages used to align images with text and teach visual tasks.
- Use models for captions, chart and invoice questions, image generation and editing, and speech generation.
- Check factual answers with known values; use image-text scores, speech word errors and human scoring appropriately.
- 'Identify **hallucination**: invented objects, text or numbers; separate reading errors from calculation
  errors.'
- Design responsible applications with consent, privacy, verification and clear media labels; explain limits
  of provenance methods.
coverage:
- multimodal LLM
- natively multimodal
- omni
- visual instruction tuning
- alignment pre-training
- parameter-efficient
- text-to-image
- image editing
- text-to-speech
- speech-to-speech
- music
- text-to-video
- CLIP score
- FID
- human preference
- multimodal hallucination
- deepfake
- consent
- watermark
- provenance
- C2PA
- chart
- document
- captioning
- visual question answering
slides:
- type: title
  figure: cover
  notes: 'In short: Media applications need both generation and verification.


    Explain: A modality is a kind of data, such as an image or audio. Multimodal models connect supported kinds of data. A vision-language
    model reads an image with a text question. Other models create pictures, waveforms or video. Their outputs need different
    checks.


    Example: An invoice photograph supplies pixels; the requested answer supplies a text task. Reading EUR 20 and EUR 15 precedes
    computing EUR 35. For the invoice example, identify which values came from pixels and which were computed, then state how
    each is checked.


    Ask: Does reading an image imply the model generates images?


    Answer: No. The exact model and endpoint determine accepted inputs and generated outputs.


    Watch out: A fluent media description can contain unsupported details.'
- type: outcomes
  notes: 'In short: Explain, use and evaluate multimodal systems responsibly.


    Explain: The full six objectives remain in the teaching notes. We distinguish model architecture from training and inference.
    Inference uses learned weights to produce an output. Evaluation checks a stated task using known evidence. Responsible design
    includes permission, privacy, disclosure and human review.


    Example: For a council invoice service, explain the VLM, check extracted amounts, compute sums, and route discrepancies
    to a person. For the council workflow, ask learners to assign one concrete verification action to each relevant objective
    before revealing the answer.


    Ask: Which objective requires more than attractive outputs?


    Answer: Verification and responsible application design require factual checks, consent and provenance decisions.


    Watch out: One quality score cannot cover every objective or modality.'
  items:
  - Read media.
  - Trace training.
  - Generate responsibly.
  - Evaluate tasks.
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: a photo of a receipt'
    minutes: 5
  - title: 1 · Multimodal LLMs
    minutes: 25
  - title: 2 · Training and fine-tuning multimodal models
    minutes: 13
  - title: 3 · Generation across modalities
    minutes: 25
  - title: 4 · Evaluating multimodal generative AI
    minutes: 17
  - title: 5 · Responsible use, applications and trends
    minutes: 22
  - title: Lab preview and wrap-up
    minutes: 6
  notes: 'In short: Follow the route from media inputs to checked applications.


    Explain: Week 9 supplied shared representations and alignment. Today we inspect models that use those foundations. We separate
    reading media from generating media. Training explains where capabilities come from; evaluation establishes their limits.
    The final application pattern combines model inference with code and human review.


    Example: A chart-reading route returns text; a lighthouse prompt follows a diffusion route to pixels. They require different
    known answers and quality checks.


    Ask: Where should evaluation happen in this sequence?


    Answer: After each relevant operation, with evidence appropriate to that task, before trusting or publishing the result.


    Watch out: Archived examples demonstrate one configuration, rather than universal capability.'
- type: discussion
  title: Warm-up
  icon: fa:FaReceipt
  prompt: A receipt photo must be split between four people. Which stage could fail?
  points:
  - Read amounts accurately.
  - Calculate and cross-check totals.
  - Protect personal details.
  notes: 'In short: A receipt workflow separates reading, arithmetic and privacy.


    Explain: Reading turns visible symbols into candidate values. Arithmetic combines those values using explicit operations.
    Verification checks both the reading and the calculation. Receipts may reveal names, locations or payment details. A synthetic
    receipt lets us examine errors without exposing a real person.


    Example: Four people share EUR 35 equally: code computes EUR 8.75 each. A misread EUR 350 creates a different answer despite
    correct division.


    Ask: Can a correctly calculated split still be wrong?


    Answer: Yes. The calculation can use misread amounts, an omitted item or an unsuitable splitting rule.


    Watch out: Valid numeric output does not show that the value matches the receipt.'
- type: section
  number: 1
  title: Multimodal LLMs
  question: How do chat models see, read and listen?
  icon: fa:FaEye
  notes: 'In short: A VLM generates text conditioned on visual evidence.


    Explain: VLM means vision-language model. An encoder converts pixels into learned features. A bridge makes those features
    usable by a language component. The language component predicts answer tokens using the image and question. Audio and video
    support depend on the exact architecture and endpoint.


    Example: Ask which bar is tallest in a known chart. Image features provide evidence while question tokens specify the requested
    property.


    Ask: What is the bridge connecting?


    Answer: Visual feature vectors and the representation accepted by the language component; it is a learned mapping.


    Watch out: A family name alone does not specify every supported input or output.'
- type: figure
  title: 'Two designs: modular bridge vs. natively multimodal'
  figure: mllm_types
  bullets:
  - Check supported inputs and outputs.
  stack: true
  notes: 'In short: Modular bridges and joint multimodal training organise learning differently.


    Explain: Modular systems connect separately pretrained components. A projector maps visual features into the language representation.
    Joint multimodal training uses mixed supported data in the training recipe. Native is a broad design description, rather
    than a guarantee of every modality. Check the particular checkpoint and endpoint.


    Example: The left route encodes image pixels, projects features and predicts words. The right route represents supported
    media within jointly trained components.


    Ask: Which approach can reuse an existing image encoder and LLM?


    Answer: The modular approach, provided its connecting projector is trained to make the components work together.


    Watch out: Do not interpret native multimodal as universal media generation.'
- type: cards
  title: What multimodal LLMs can do
  cards:
  - head: Caption
    text: Name visible objects.
  - head: Documents
    text: Extract checked fields.
  - head: Charts
    text: Read axes; compute sums.
  - head: Video
    text: Inspect sampled frames.
  - head: Speech
    text: Check names and numbers.
  - head: Screens
    text: Approve consequential actions.
  notes: 'In short: Capabilities are tasks with specific inputs and outputs.


    Explain: Captioning describes an image in text. OCR reads visible characters; document understanding links those fields
    to a task. Chart reading also needs correct axes and units. Video systems may inspect sampled frames, missing brief events.
    Speech and screen tasks need their own accuracy and permission checks.


    Example: Alt text names visible objects; an invoice task extracts an identifier. Neither task authorises a screen agent
    to submit a form.


    Ask: Which chart mistake can survive a fluent answer?


    Answer: Reading the wrong axis or units, or inventing a value; compare the answer with the chart evidence.


    Watch out: A useful description may still require review before accessibility use.'
- type: table
  title: Multimodal model families (examples, 2026)
  header:
  - Family
  - Access
  - Route
  rows:
  - - GPT
    - Hosted
    - Endpoint-specific
  - - Gemini
    - Hosted
    - Endpoint-specific
  - - Claude
    - Hosted
    - Image→text
  - - Qwen-VL/Omni
    - Weights
    - Variant-specific
  - - LLaVA
    - Research
    - Image→text
  - - SmolVLM
    - Weights
    - Image→text
  notes: 'In short: Compare exact model capabilities rather than treating families as interchangeable.


    Explain: Hosted models run through a provider service. Open weights can be downloaded subject to their licence. A family
    may include several sizes and endpoints. Their media inputs, generated outputs and context limits can differ. The CPU lab
    selects a small image-to-text checkpoint, not an image generator.


    Example: SmolVLM-256M is the proposed local core; the archived results used Qwen3-VL-2B. Different checkpoints can produce
    different factual answers.


    Ask: Why is a family comparison insufficient for deployment?


    Answer: The exact checkpoint, endpoint, licence, task evaluation and hardware requirements must also be checked.


    Watch out: Capabilities and provider terms change; the table is an illustrative comparison.'
  callout: Check exact checkpoint and licence.
- type: figure
  title: Real captions from an open VLM
  figure: lab_caption
  bullets:
  - Archived Qwen3-VL-2B captions.
  - Check every claimed detail.
  stack: true
  notes: 'In short: Inspect archived captions claim by claim against the photographs.


    Explain: A caption is generated answer text about an image. Fluent wording can include locations or objects unsupported
    by the pixels. The archived captions came from a specific Qwen3-VL-2B run. The new CPU core uses a smaller checkpoint. Its
    captions must be evaluated independently.


    Example: The archived temple caption describes a lake and a hill. Point to the visible evidence before accepting those phrases.
    {{CAPTIONS}}


    Ask: What should happen to an unsupported caption detail?


    Answer: Remove it, mark uncertainty or review the source; attractive prose is insufficient evidence for a factual claim.


    Watch out: Stored captions are measured examples, not answers promised by the current core.'
- type: bullets
  title: How images become tokens, and why resolution matters
  bullets:
  - Illustrative patch grid; processors differ.
  - Resolution trades detail for computation.
  notes: 'In short: Resolution changes visual detail and computation.


    Explain: A patch is a small image region represented by a feature vector. A simple patch model divides an image into a grid.
    Tiles may preserve local detail while increasing visual work. Video sampling adds a time dimension and can miss brief events.
    Processor rules vary across models.


    Example: A 336-by-336 image divided into 14-by-14 patches has 24 patches per side, giving 24 times 24 equals 576.


    Ask: Does doubling resolution guarantee correct OCR?


    Answer: No. It may preserve characters, but model training, compression, layout and the task still affect accuracy.


    Watch out: This grid calculation illustrates one design; it is not every model''s visual-token count.'
  visual:
    type: example_strip
    items:
    - label: Per side
      text: 336 ÷ 14 = 24
    - label: Grid
      text: 24 × 24 = 576 patches
    - label: Small text
      text: Check readable detail.
- type: figure
  title: Cross-modal reasoning over a chart and a document (real)
  figure: lab_chart
  bullets:
  - Archived Qwen3-VL-2B answers.
  - Compare field reading with aggregation.
  stack: true
  notes: 'In short: Known chart and invoice data reveal reading and calculation errors.


    Explain: Ground truth is a known reference answer. We create the chart and fictional invoice from explicit data. This makes
    factual checking possible without another model judging the answer. The archived run read several fields correctly but missed
    the chart sum. The CPU core reports its own results separately.


    Example: The chart total is 12 + 30 + 18 + 25 + 9 = 94; compare the complete archived reply with this known value. {{QA_NOTES}}


    Ask: Which check separates arithmetic from reading?


    Answer: Extract and verify individual values, then sum them in code and compare the result with the requested total.


    Watch out: A correct field format or high self-reported confidence does not establish a correct value.'
- type: quiz
  question: How should invoice items be totalled?
  options:
  - Request one grand total
  - Increase sampling temperature
  - Check fields; sum in code
  - Trust stated confidence
  answer: 2
  notes: 'In short: Extract checked values and compute totals in code.


    Explain: A VLM supplies candidate fields from an image. Validation checks field types and required structure. Source checking
    establishes whether those fields match the document. Code then performs arithmetic reproducibly. The printed total remains
    another value to cross-check, rather than an unquestionable authority.


    Example: For two invoice lines, 40 times EUR 0.50 equals EUR 20 and 2 times EUR 7.50 equals EUR 15.


    Ask: How should 200 invoice line items be totalled?


    Answer: C. Extract checked fields, sum them in code and compare the result with the printed total; review mismatches.


    Watch out: Increasing sampling temperature does not make visual reading more reliable.'
- type: section
  number: 2
  title: Training and fine-tuning multimodal models
  question: How are these models built, and how can you adapt one?
  icon: fa:FaCogs
  notes: 'In short: Training connects visual representations with useful responses.


    Explain: Pretraining learns general representations from many examples. Alignment training connects representations from
    different components. Visual instruction tuning uses image questions and desired answers. Adaptation targets a narrower
    domain using representative data. The lab performs inference with existing weights rather than training a VLM.


    Example: An image-caption pair says a blue cup; an instruction pair asks its colour and answers blue. A new photograph tests
    generalisation.


    Ask: What must stay separate from adaptation examples?


    Answer: A held-out test set representing the intended users, layouts and tasks, so evaluation can expose generalisation
    errors.


    Watch out: Training on a test image makes later success a weak measure of generalisation.'
- type: figure
  title: A typical training pipeline for a vision-language model
  figure: vlm_training
  bullets:
  - Conceptual recipe; lab uses pretrained weights.
  stack: true
  notes: 'In short: A typical recipe trains the bridge before visual instruction responses.


    Explain: A pretrained image encoder supplies feature vectors. A pretrained language model supplies text generation. Alignment
    pre-training updates their connecting projector using paired examples. Visual instruction tuning uses questions and target
    responses. Preference or domain adaptation may follow, depending on the chosen recipe.


    Example: Train a bridge with a cup caption, then teach the question What colour is the cup? Test a different cup image.


    Ask: Does every training stage update every component?


    Answer: No. Recipes can freeze the image encoder, train the projector, or selectively adapt language weights such as LoRA
    matrices.


    Watch out: The diagram is a conceptual training recipe; the lab loads pretrained models.'
- type: bullets
  title: Data for multimodal training
  bullets:
  - Review labels, licences and consent.
  - Mixed documents preserve context.
  notes: 'In short: Training data must represent both the media and the task.


    Explain: Paired data connects an image with a caption or audio with a transcript. Interleaved documents contain several
    kinds of data in context. Task labels can specify chart values, document fields or object positions. Synthetic examples
    still require correctness checks. Permission and licence review precede training.


    Example: A rendered chart supplies pixels, a question and an exact target of 25. A wrong label teaches the wrong association
    despite clean pixels.


    Ask: Why remove duplicates across train and test sets?


    Answer: Repeated images or near-identical layouts can inflate reported performance without demonstrating useful generalisation.


    Watch out: More examples cannot compensate for systematically wrong labels or inappropriate data use.'
  visual:
    type: mini_table
    header:
    - Input
    - Target
    rows:
    - - Image
      - Caption
    - - Chart
      - Known answer
    - - Speech
      - Transcript
    - - Document
      - Field
- type: bullets
  title: Adapting a multimodal model to your domain
  bullets:
  - Define the domain task.
  - Keep a separate test set.
  notes: 'In short: Adapt a model only after defining and measuring the domain task.


    Explain: A domain is the intended setting, such as a particular invoice layout. Begin with prompting and checked extraction.
    A labelled evaluation set identifies persistent reading or formatting failures. LoRA trains small added matrices for parameter-efficient
    adaptation. Some recipes also update the visual bridge.


    Example: If a model repeatedly misreads a company''s item codes, compare improved image preparation and prompting before
    training on permissioned examples.


    Ask: What evidence justifies fine-tuning?


    Answer: A repeatable task error on representative held-out images, plus enough correct training examples and a meaningful
    evaluation plan.


    Watch out: A successful demonstration on one familiar document is insufficient justification for adaptation.'
  visual:
    type: example_strip
    items:
    - label: First
      text: Prompt; check extraction.
    - label: Evidence
      text: Repeated held-out errors.
    - label: Adapt
      text: LoRA; evaluate again.
- type: section
  number: 3
  title: Generation across modalities
  question: From text to images, speech, music and video
  icon: fa:FaMagic
  notes: 'In short: Generation routes create different media and need different checks.


    Explain: A text-to-image route produces pixels conditioned on words. Image editing also conditions on an existing picture.
    Text-to-speech produces sound samples or intermediate audio tokens. Music and video add timing and continuity requirements.
    A VLM that reads images usually produces answer text instead.


    Example: The prompt a lighthouse at sunset creates an image; asking what is visible in that image requests a text answer
    from another route.


    Ask: Why should the output modality be named first?


    Answer: It determines the model, preprocessing, output representation, appropriate evaluation and likely resource requirements.


    Watch out: A single multimodal interface can hide several distinct models behind different routes.'
- type: figure
  title: 'Generation across modalities: a map'
  figure: generation_map
  notes: 'In short: Map each requested output to its generating operation.


    Explain: Diffusion progressively transforms a noisy representation into an image. Editing begins from a partly noised existing
    representation. A vocoder converts acoustic features into a waveform. Audio-codec models generate discrete sound segments
    represented as token IDs. Video models represent both space and time.


    Example: Trace words to image pixels, then trace words to sound samples. Both routes are conditional generation, but their
    data and failures differ.


    Ask: Which route tests whether a chart answer is true?


    Answer: The VLM reading route with known-value checking; image or audio generation metrics answer different questions.


    Watch out: A model-family example in the notes is not a promise that every variant supports every task.'
- type: figure
  title: Text → image with a distilled model (real)
  figure: lab_t2i
  bullets:
  - 'Archived SD-Turbo: 2 steps; guidance 0.'
  - Inspect prompt details beside CLIP scores.
  stack: true
  notes: 'In short: Distilled diffusion generates quickly but still needs visual inspection.


    Explain: Distillation trains a smaller-step sampling procedure from a more expensive process. The archived SD-Turbo experiment
    used two denoising steps. Its guidance scale was zero under that model''s recipe. CLIP compared the generated images with
    prompt embeddings. The full generator remains an optional extension in the CPU lab.


    Example: The lighthouse, robot and ramen prompts produced stored images. Compare own-prompt scores with other-prompt scores.
    {{T2I_NOTES}}


    Ask: Can a good similarity score prove every requested object is present?


    Answer: No. Inspect object count, text, composition and artefacts directly; a global similarity score can miss individual
    errors.


    Watch out: Do not apply another diffusion model''s preferred guidance settings without checking its recipe.'
- type: figure
  title: 'Image → image: editing with partial noise (real)'
  figure: lab_i2i
  bullets:
  - Editing strength sets the starting noise level.
  - Low strength tends to retain more input structure.
  - High strength permits more change; inspect the actual result.
  stack: true
  notes: 'In short: Editing strength controls starting noise rather than overall quality.


    Explain: Image-to-image generation encodes an existing picture. The pipeline adds partial noise before denoising with the
    new prompt. Higher strength generally permits larger departures from the input. The schedule also depends on step count
    and rounding. Hold the prompt and seed fixed when comparing settings.


    Example: With four requested steps, strengths 0.3, 0.6 and 0.9 start at approximately one, two and three effective denoising
    steps.


    Ask: What should be compared beside each edit?


    Answer: The original image, prompt, seed, strength, effective schedule and visible preservation of the original scene.


    Watch out: A higher setting can change more without improving the result or achieving the requested style.'
- type: bullets
  title: Editing, control and personalisation
  bullets:
  - Instruction editing describes a change.
  - Check likeness and style permissions.
  notes: 'In short: Editing tools constrain different parts of an image-generation task.


    Explain: Inpainting changes a masked region. Outpainting extends the canvas beyond its original boundaries. A control guide
    constrains structure using edges, depth or pose. Instruction editing describes the desired change in words. Personalisation
    adapts a model toward a subject or style using example images.


    Example: Replacing a damaged sign inside a mask differs from making the entire scene look like winter. Evaluate what changed
    outside the intended region.


    Ask: Why does personalisation require permission and licence checks?


    Answer: Training examples may depict identifiable people or copyrighted work, and generated outputs can imitate likeness
    or protected material.


    Watch out: A technical ability to imitate a subject does not supply authority to do so.'
  visual:
    type: mini_table
    header:
    - Route
    - Constraint
    rows:
    - - Inpaint
      - Masked region
    - - Outpaint
      - Canvas boundary
    - - Control
      - Edges/depth/pose
    - - Personalise
      - Permissioned examples
- type: bullets
  title: 'Speech: text-to-speech, cloning and speech-to-speech'
  bullets:
  - Keep the true sampling rate.
  - Voice imitation requires permission.
  notes: 'In short: Speech generation creates sound; recognition checks recovered words.


    Explain: TTS means text-to-speech. A waveform is a sequence of sound samples. The sampling rate states how many samples
    represent one second. ASR means automatic speech recognition and converts sound into text. Voice imitation adds consent
    and impersonation risks beyond ordinary speech synthesis.


    Example: A 16,000-sample waveform at 16,000 samples per second lasts one second. Preserve this rate when passing the waveform
    to a recogniser.


    Ask: Does a zero-error transcript prove natural speech?


    Answer: No. It establishes recovered words through one recogniser, while naturalness, pronunciation, timing and listener
    experience need further checks.


    Watch out: Changing a sampling-rate label without resampling changes the sound''s interpreted speed.'
  visual:
    type: example_strip
    items:
    - label: TTS
      text: Words → waveform
    - label: ASR
      text: Waveform + rate → words
    - label: Round trip
      text: Recovered words ≠ naturalness
- type: bullets
  title: Music, sound and video
  bullets:
  - Inspect identity, motion and synchronisation.
  - Check rights and deceptive uses.
  notes: 'In short: Music and video need temporal quality and rights checks.


    Explain: Music models may generate audio-codec tokens or denoise sound representations. Video models represent both spatial
    content and temporal changes. Temporal consistency means details remain coherent across frames. Sound and motion may need
    synchronisation. These tasks can require substantial compute and careful licence review.


    Example: A cup may look correct in each isolated frame yet change colour or disappear across the clip. Watch the sequence
    rather than one thumbnail.


    Ask: Which video error is invisible in a single frame?


    Answer: Identity drift, broken motion, flicker or mismatched sound timing; evaluation must inspect transitions and the complete
    sequence.


    Watch out: Plausible frames and attractive music do not establish rights, physics or faithful prompt execution.'
  visual:
    type: mini_table
    header:
    - Output
    - Representation
    rows:
    - - Music/sound
      - Codec tokens or diffusion
    - - Video
      - Spatial + temporal patches
- type: quiz
  question: Editing strength 0.3 → 0.9 changes what?
  options:
  - Sharper output, same scene
  - Memory only
  - Higher guidance scale
  - More noise; larger changes
  answer: 3
  notes: 'In short: Increasing editing strength allows a larger departure from the input.


    Explain: Strength controls how much starting noise is used in image-to-image editing. It changes the starting point for
    denoising. Guidance scale controls the influence of a conditioning signal in applicable recipes. These are different settings.
    Comparisons should hold the input, prompt and random seed fixed.


    Example: At four requested steps, changing strength from 0.3 to 0.9 changes the effective denoising schedule as well as
    retained input information.


    Ask: What does increasing strength from 0.3 to 0.9 do?


    Answer: D. It adds more starting noise and can produce larger changes; it does not guarantee sharper output or raise guidance
    scale.


    Watch out: A strength slider is a controlled comparison, rather than a universal quality ranking.'
- type: section
  number: 4
  title: Evaluating multimodal generative AI
  question: How do you measure quality, alignment and truthfulness across modalities?
  icon: fa:FaClipboardCheck
  notes: 'In short: Evaluation begins with the actual question the system must answer.


    Explain: A metric is a measurement tied to a task. Known answers check factual reading. Image-text similarity checks part
    of prompt alignment. Speech word error rate checks disagreement with a reference transcript. Human evaluation can examine
    naturalness, usefulness and unsupported claims omitted by automatic measures.


    Example: For a generated image of two red cups, count cups directly as well as comparing its CLIP score. The two checks
    can disagree.


    Ask: Why is one score insufficient for all media?


    Answer: Different outputs have different errors and user requirements; each metric observes a limited aspect of quality.


    Watch out: An impressive number is weak evidence if its task, reference set and limitations are unspecified.'
- type: table
  title: Metrics by task
  header:
  - Task
  - Automatic
  - Human
  rows:
  - - Images
    - FID/CLIP/GenEval
    - Defects
  - - Captions
    - CIDEr/CLIPScore
    - Facts
  - - VQA
    - Accuracy
    - Errors
  - - Speech
    - WER
    - Naturalness
  - - Video
    - FVD
    - Continuity
  - - Hallucination
    - POPE/CHAIR
    - Evidence
  notes: 'In short: Choose task-specific metrics and a matching human rubric.


    Explain: FID compares distributions of image features, rather than checking one image''s truth. CLIP measures image-text
    embedding similarity. VQA accuracy compares answers with known references. WER counts word edits relative to a transcript.
    POPE-style probes check object claims, while human review examines missed defects.


    Example: For speech, compare reference words with recognised words and listen separately. For invoices, compare each extracted
    field with a checked source.


    Ask: What additional evaluation does low WER need?


    Answer: Human listening for naturalness and pronunciation, plus tests covering names, numbers, accents, timing and the intended
    users.


    Watch out: Benchmark names in a table do not make a small classroom sample a full benchmark.'
- type: bullets
  title: Multimodal hallucination
  bullets:
  - Unsupported claims are hallucinations.
  - Inspect absent-item errors and yes bias.
  notes: 'In short: A hallucination is a claim unsupported by the available evidence.


    Explain: A model may name an absent object or invent document text. Leading questions can encourage a yes response. Present
    and absent probes help reveal this bias. Inspect the full answer alongside the image and reference. A small classroom probe
    has narrower scope than a published benchmark.


    Example: Ask whether the flower photograph contains a flower, then whether it contains a dog. {{POPE_NOTES}}


    Ask: Does six correct probes establish freedom from hallucination?


    Answer: No. They describe that sample and configuration; varied images, questions and failure analysis are needed for wider
    claims.


    Watch out: Report absent-object performance separately instead of hiding yes bias inside one overall accuracy.'
  visual:
    type: example_strip
    items:
    - label: Present
      text: 'Flower photograph: flower.'
    - label: Absent
      text: 'Flower photograph: dog.'
    - label: Invented field
      text: Invoice contains no VAT.
- type: bullets
  title: Designing human evaluation for images and audio
  bullets:
  - Combine human and automatic checks.
  notes: 'In short: Human evaluation needs a controlled comparison and explicit criteria.


    Explain: A rubric states what raters should judge. Randomising display order reduces position bias. Blind comparisons can
    hide system identities from raters. Include representative content, languages and user groups. Rater agreement measures
    consistency, rather than proving that their judgements are correct.


    Example: Two raters compare generated invoice summaries for field correctness, omitted details and unsupported claims, using
    the same scoring instructions.


    Ask: Why record disagreement instead of averaging it away?


    Answer: Disagreement may reveal unclear criteria, ambiguous evidence or different user needs; it informs the evaluation
    and review process.


    Watch out: An attractive image can win preference while failing a critical factual or safety requirement.'
  visual:
    type: mini_table
    header:
    - Step
    - Purpose
    rows:
    - - Randomise
      - Reduce order bias
    - - Rubric
      - Score the task
    - - Vary
      - Content/accents/languages
    - - Agreement
      - Inspect disputed cases
- type: section
  number: 5
  title: Responsible use, applications and trends
  question: What can go wrong, how do we label synthetic media, and where is this useful?
  icon: fa:FaBalanceScale
  notes: 'In short: Responsible applications combine useful tasks with safeguards.


    Explain: Synthetic media can help accessibility, education and design. The same methods can enable impersonation or misleading
    evidence. Consent concerns permission to depict or imitate a person. Provenance records origin and edits, rather than the
    truth of a depicted event. Review must match the stakes of the application.


    Example: A fictional training invoice permits experimentation; a real customer invoice introduces private details and a
    consequential workflow requiring stricter handling.


    Ask: Which safeguards are needed before publishing generated media?


    Answer: Appropriate permissions, rights checks, visible disclosure, provenance where available, factual review and a clear
    route for correction.


    Watch out: Technical success does not establish that the intended use is appropriate or lawful.'
- type: cards
  title: Harms of realistic synthetic media
  cards:
  - head: Impersonation
    icon: fa:FaPhoneAlt
    text: Fake faces or voices can enable fraud.
  - head: Non-consensual imagery
    icon: fa:FaUserSlash
    text: Fabrications can severely harm people.
  - head: Disinformation
    icon: fa:FaNewspaper
    text: Fakes mislead; real evidence may be dismissed.
  - head: Harassment
    icon: fa:FaUserSecret
    text: Synthetic identities can enable targeted abuse.
  notes: 'In short: Realistic synthetic media can harm people even when technically impressive.


    Explain: Impersonation can deceive someone about who is speaking. Non-consensual imagery can damage dignity and safety.
    Disinformation can misrepresent events or public figures. The liar''s dividend means genuine evidence may be dismissed because
    convincing fakes exist. Synthetic identities can enable targeted harassment.


    Example: A convincing fake voice asking for an urgent bank transfer creates a verification problem: independently contact
    the person through a known channel.


    Ask: What separates a creative demo from an impersonation risk?


    Answer: Permission, audience expectations, clear labelling, context and the potential for others to mistake it for a real
    person or event.


    Watch out: A disclaimer hidden in metadata may never reach the person who hears or sees the media.'
- type: figure
  title: 'Provenance and labelling: no single layer is enough'
  figure: provenance
  bullets:
  - Origin history does not prove scene truth.
  stack: true
  notes: 'In short: Provenance tools describe origin with different limitations.


    Explain: Visible labels inform viewers directly. C2PA credentials cryptographically sign provenance assertions about an
    asset. Invisible watermarks embed a detectable signal when supported by the generator. Detection classifiers estimate origin
    and can make mistakes. These layers complement factual review rather than replacing it.


    Example: Re-saving a labelled PNG as JPEG can remove ordinary text fields. This experiment tests unsigned metadata, not
    the robustness of signed C2PA credentials.


    Ask: Does a valid content credential prove the scene occurred?


    Answer: No. It can support an origin or editing history claim; the depicted event still needs independent factual evidence.


    Watch out: Article 50 has different provider and deployer duties, scope and exceptions; consult the official text.'
- type: discussion
  title: 'Discuss: where should the label go?'
  icon: fa:FaTag
  prompt: An app removes a stranger and brightens a photo. Where should an AI-edit label appear?
  points:
  - Family album, news report, insurance claim.
  - Consider visible disclosure and edit history.
  notes: 'In short: Disclosure decisions depend on how an edited image will be used.


    Explain: An edit can change brightness or remove meaningful evidence. Viewers may interpret an image differently in family,
    news and insurance contexts. A visible label reaches viewers without metadata inspection. An edit history can support review
    when tools and platforms preserve it. Neither guarantees scene truth.


    Example: Removing a stranger from a family portrait has different consequences from removing a witness from a news photograph
    or damage from an insurance image.


    Ask: Where should an AI-edit label appear?


    Answer: Where the relevant viewer encounters the media, with a description sufficient to understand the consequential edit
    and supporting history where available.


    Watch out: A generic label can hide an important alteration if its wording does not explain the change.'
- type: bullets
  title: Consent, likeness and rights
  bullets:
  - Use an appropriate lawful basis.
  - Collect only necessary personal data.
  notes: 'In short: Permission and rights checks belong before data collection or imitation.


    Explain: Faces, voices and document details may identify a person. Data minimisation means collecting only what the task
    needs. A lawful basis supports applicable personal-data processing. Model and dataset licences can restrict permitted use.
    Likeness and output rights also depend on context and jurisdiction.


    Example: Use the fictional invoice in this lab. A customer''s real scan may contain addresses, identifiers and bank details
    unnecessary for teaching totals.


    Ask: What should be checked before cloning a classmate''s voice?


    Answer: Explicit permission, the intended audience and use, data handling, licence conditions, disclosure and safeguards
    against impersonation.


    Watch out: Access to a photograph or recording does not itself grant permission for every processing or generation task.'
  visual:
    type: example_strip
    items:
    - label: Collect
      text: Purpose; minimal fields.
    - label: Imitate
      text: Permission; licences.
    - label: Publish
      text: Disclosure; review.
- type: cards
  title: Valuable applications
  cards:
  - head: Accessibility
    text: Review alt text.
  - head: Documents
    text: Validate extracted fields.
  - head: Voice
    text: Check words; enable handover.
  - head: Education
    text: Teacher reviews feedback.
  - head: Design
    text: Label concept images.
  - head: Inspection
    text: Confirm defect alerts.
  notes: 'In short: Useful applications need verification designed around their users.


    Explain: Accessibility tools provide descriptions or captions people rely on. Document workflows extract fields before code
    validates and routes them. Voice services need clear pronunciation and a human handover path. Education tools need teacher
    review. Inspection systems require confirmation of alerts and missed defects.


    Example: An invoice system routes a candidate amount to code, while an accessibility description must remove unsupported
    objects before reaching the user.


    Ask: Which application needs a different error tolerance from concept art?


    Answer: Invoices, accessibility and inspection can create concrete harms from factual errors, so their evaluation and review
    thresholds must reflect that use.


    Watch out: A generic multimodal accuracy score does not capture every application''s consequences.'
- type: bullets
  title: Emerging trends (2026–27)
  bullets:
  - Forecasts; exact systems need evaluation.
  - Any-to-any support is model-specific.
  notes: 'In short: Emerging trends are hypotheses to evaluate on exact systems.


    Explain: Any-to-any describes systems connecting several supported media routes. Live interaction adds delay and interruption
    requirements. Video generation aims for longer coherent motion and sound. World-model research represents changes in an
    environment. Smaller checkpoints may enable local deployment, with capability and resource trade-offs.


    Example: A small local VLM can read a simple chart while failing a dense invoice. Test the actual task before extrapolating
    from a demonstration.


    Ask: How should a 2027 capability forecast be presented?


    Answer: As a direction or hypothesis with a date and scope, distinct from measured performance on a named model and evaluation
    set.


    Watch out: Family marketing, impressive demonstrations and research trends are not guarantees for a deployed endpoint.'
  visual:
    type: mini_table
    header:
    - Direction
    - Test
    rows:
    - - Live interaction
      - Measure latency
    - - World models
      - Check transitions
    - - On-device
      - Check resources
    - - Longer video
      - Inspect continuity
- type: flow
  title: A design pattern for multimodal applications
  steps:
  - label: Review input
    sub: Quality; permission
    role: data
  - label: Extract fields
    sub: Candidate values
    role: model
  - label: Verify values
    sub: Source; sums
    role: metric
  - label: Use result
    sub: Task response
    role: output
  - label: Review; label
    sub: Human oversight
    role: tool
  callout: Correct sums need correct inputs.
  notes: 'In short: Perceive with a model, verify with code, then review consequential outputs.


    Explain: Input review checks quality and permission before inference. The VLM extracts candidate fields rather than authenticated
    facts. Code checks values, formats and arithmetic. The application then uses the checked result within its task. Human review
    and disclosure address consequential uncertainties before an output is shared.


    Example: Read an invoice, compare extracted EUR 20 and EUR 15 with the image, sum EUR 35 in code, and review any discrepancy.


    Ask: Why keep source checking before calculation?


    Answer: A correct calculation can use incorrectly extracted inputs; preserving evidence lets reviewers find the cause and
    correct the workflow.


    Watch out: The arrows carry fields and results, rather than proving that every earlier stage succeeded.'
  arrows:
  - pixels
  - fields
  - checked values
  - response
- type: bullets
  title: Responsible-use checklist for multimodal projects
  bullets:
  - State purpose and people affected.
  - Keep human review for consequential errors.
  notes: 'In short: Record evidence and decisions so a multimodal workflow can be reviewed.


    Explain: State the purpose and people affected before selecting a model. Record permission, applicable licences and personal-data
    handling. Test unsupported claims as well as reading errors. Apply appropriate disclosure and provenance measures. Record
    exact versions, settings and measured results so later changes can be compared.


    Example: A report lists the VLM checkpoint, processor resolution, questions, references, full replies and mismatches. It
    also explains who reviewed failures.


    Ask: What should accompany a reported accuracy?


    Answer: The evaluation sample, reference answers, configuration, error types and limitations, so another person can assess
    what the number establishes.


    Watch out: A checklist entry needs supporting evidence rather than an unsupported tick or a model''s self-assurance.'
  visual:
    type: mini_table
    header:
    - Evidence
    - Record
    rows:
    - - Permission
      - Licences; basis
    - - Experiment
      - Versions; settings
    - - Verification
      - References; errors
    - - Disclosure
      - Visible labels; history
- type: lab
  title: 'Lab 10: multimodal generative tasks, measured'
  steps:
  - 'Core: read images.'
  - 'Core: verify facts.'
  - Inspect stored experiments.
  - 'Stretch: images and speech.'
  runtime: 'CPU core: {{W10_CORE_TIME}}.'
  deliverable: Evidence, errors, five self-checks.
  notes: 'In short: The CPU core runs local reading and verification; heavy generation is optional.


    Explain: The shared setup defaults to CPU in Colab and local VS Code. A small VLM performs bounded image-to-text inference.
    Known chart and invoice values supply references. Stored diffusion and speech outputs support inspection without loading
    those models. Optional extensions retain real generation, editing, CLIP and speech experiments.


    Example: Core inference uses capped image resolution and short deterministic answers. Change one setting, inspect the result,
    and compare its errors with known data.


    Ask: Is an external API or GPU needed for the core?


    Answer: No. Optional API switches start disabled and preserve a local answer; a GPU and heavy model execution are optional
    extensions.


    Watch out: Keep current CPU core timings separate from archived full experiments, first downloads and optional stretches.'
- type: summary
  points:
  - Choose a route for each media task.
  - Resolution limits readable detail.
  - Bridges and instruction examples connect modalities.
  - Generate pixels, edits and sound.
  - Measure specific tasks and inspect errors.
  - Protect consent, rights and provenance.
  notes: 'In short: Connect each media route with its task-specific evidence.


    Explain: A VLM reads images and generates answer text. Alignment and instruction examples explain how its components learn
    to cooperate. Diffusion and TTS generate different output representations. Evaluation checks facts, alignment, recovered
    words and human quality separately. Permission and provenance accompany those technical checks.


    Example: An invoice can have correct arithmetic with a misread line; a generated voice can have zero WER but sound unnatural.


    Ask: What common principle connects these failures?


    Answer: A partial check can succeed while another essential property fails; name the property and collect its own evidence.


    Watch out: Do not infer complete correctness from fluent text, one metric or a signed origin record.'
