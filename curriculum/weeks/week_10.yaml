subtitle: "Models that see, listen, speak and create: multimodal LLMs, generation across modalities, evaluation and responsible use"
mimlos: [2, 3, 4]
objectives:
  - "Explain how **multimodal LLMs** work (modular bridge models vs **natively multimodal** models) and what they can do with images, documents, charts, audio and video."
  - "Describe how multimodal models are **trained and fine-tuned**: alignment pre-training, **visual instruction tuning**, preference tuning and parameter-efficient adaptation."
  - "Use models for **text-to-image, image editing, text-to-speech, speech-to-text** and cross-modal reasoning, and explain music and **text-to-video** generation."
  - "Evaluate multimodal generation with **CLIP score, FID, task accuracy, human preference** and **multimodal hallucination** probes."
  - "Assess risks (**deepfakes**, consent, likeness and voice rights) and mitigations: **watermarking and content provenance (C2PA)**, disclosure duties."
  - "Design a multimodal application with verification, human review and labelling."
coverage:
  - multimodal LLM
  - natively multimodal
  - omni
  - visual instruction tuning
