      - {kind: video, label: "Andrej Karpathy: Deep Dive into LLMs like ChatGPT", note: "3.5 h deep dive incl. reasoning models", url: "https://www.youtube.com/watch?v=7xTGNNLPyMI"}
      - {kind: video, label: "Google Cloud Tech: Introduction to large language models", note: "Short overview", url: "https://www.youtube.com/watch?v=zizonToFXDs"}
      - {kind: course, label: "Hugging Face LLM Course, chapters 1–2", note: "Pipelines, models and tokenizers", url: "https://huggingface.co/learn/llm-course/chapter1/1"}
      - {kind: course, label: "Google ML Crash Course: Introduction to LLMs", note: "Concise official module", url: "https://developers.google.com/machine-learning/crash-course/llm"}
      - {kind: book, label: "Tunstall et al. (2022) NLP with Transformers, ch. 1 and 5", note: "Descriptor 7.9 reading", url: "https://www.oreilly.com/library/view/natural-language-processing/9781098136789/"}
      - {kind: book, label: "Ozdemir (2023) Quick Start Guide to LLMs, part I", note: "Descriptor 7.9 supplementary", url: "https://www.informit.com/store/quick-start-guide-to-large-language-models-strategies-9780138199197"}
      - {kind: paper, label: "Hoffmann et al. (2022) Training Compute-Optimal LLMs (Chinchilla)", note: "Scaling laws", url: "https://arxiv.org/abs/2203.15556"}
