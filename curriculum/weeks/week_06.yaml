subtitle: "From n-grams to frontier models: how LLMs are built and scaled, how they decode, and how to choose among model families"
mimlos: [1, 3, 5]
objectives:
  - "Trace the **evolution of NLP** from n-grams and word embeddings through RNNs to transformer LLMs."
  - "Explain how transformers become LLMs: **pre-training** data, **scaling laws**, compute, and **context windows**."
  - "Compare **decoding strategies** (greedy, beam, temperature, top-k, top-p) and choose settings for a task."
  - "Distinguish **LLM families**: encoder (BERT), encoder–decoder (T5), decoder-only (GPT, LLaMA, Gemini, Claude, Mistral, Qwen, DeepSeek); proprietary vs **open-weight**; small, mixture-of-experts and **reasoning** models."
  - "Read **model cards**, licences and **benchmarks** critically, and choose a model for an application."
  - "Use pretrained models with **Hugging Face** pipelines and query an LLM through an API or local runtime."
