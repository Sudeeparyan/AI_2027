subtitle: How language models learn, choose tokens and differ, and how to compare them for a task
mimlos:
- 1
- 3
- 5
objectives:
- Explain how language modelling progressed.
- Trace pre-training and post-training.
- Choose and explain token-selection settings.
- Compare model architectures and access.
- Read model cards, licences and test results.
- Run a local model or hosted request.
coverage:
- n-gram
- word embeddings
- RNN
- pre-training
- scaling law
- context window
- greedy
- beam search
- temperature
- top-k
- top-p
- BERT
- T5
- GPT
- LLaMA
- Gemini
