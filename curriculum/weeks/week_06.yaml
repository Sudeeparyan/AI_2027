  items:
  - kind: video
    label: 'Karpathy: Intro to LLMs'
    note: Accessible overview
    url: https://www.youtube.com/watch?v=zjkBMFhNj_g
  - kind: course
    label: HF LLM course
    note: Model interfaces
    url: https://huggingface.co/learn/llm-course/en/chapter1/6
  - kind: docs
    label: Chat templates
    note: Exact formatting
    url: https://huggingface.co/docs/transformers/en/chat_templating
  - kind: docs
    label: Perplexity guidance
    note: Measurement limits
    url: https://huggingface.co/docs/transformers/en/perplexity
  - kind: model
    label: Qwen3 model card
    note: Thinking settings
    url: https://huggingface.co/Qwen/Qwen3-0.6B
  notes: 'In short: Use accessible explanations for intuition and primary papers or current model cards for technical claims.


    Explain: A teaching video can connect mechanisms to applications. A course chapter provides executable examples. A primary
    paper explains a study''s methods. A model card documents a release and recommended use. Documentation describes the supported
    runtime interface.


    Example: Start with the introductory LLM video, then read the official chat-template and perplexity guidance. For optional
    Qwen3 thinking, inspect the current card''s sampling recommendation before changing settings. The sources serve different
    purposes; a broad overview cannot establish an exact checkpoint''s licence, availability, output cap or measured performance
    on your task.


    Ask: Which source would you consult before changing an optional thinking model''s decoding settings?


    Answer: Use that release''s official card and runtime documentation, then evaluate the changed configuration on representative
    tasks.


    Watch out: Source-check dates document this revision; current model and account details can require renewed verification
    later.'
