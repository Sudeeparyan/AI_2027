      Karpathy's one-hour introduction is the best single overview; his longer deep dive covers reasoning models well. Google's short video is a gentle alternative. Chapters 1 and 2 of the Hugging Face LLM Course cover pipelines, models and tokenizers with runnable code. Tunstall and colleagues' chapters 1 and 5, and part one of Ozdemir's book, are the descriptor's readings. The Chinchilla paper is readable and important for the scaling discussion. All links were checked in September 2026.
