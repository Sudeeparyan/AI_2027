slides:
- type: title
  figure: cover
  notes: 'In short: Language-model choice connects learned prediction, token selection, architecture and measured task requirements.


    Explain: A language model assigns probabilities to token sequences. Tokens are pieces of text represented by integer IDs.
    Training changes learned numbers called parameters. Inference uses those parameters to produce or score text. A deployed
    assistant also includes instructions, tools and an interface.


    Example: Two assistants can receive the same question and return different answers. One may retrieve a current document
    while another relies on earlier training. Think of comparing two tools with different settings and attachments. The analogy
    does not establish either answer''s correctness; verify the actual claim against evidence.


    Ask: What would you record before deciding which assistant is better for a task?


    Answer: Record the task, model version, prompt, available tools, decoding settings, quality checks and measured time or
    usage.


    Watch out: A product name alone does not reveal the model configuration or evaluation evidence.'
- type: outcomes
  notes: 'In short: The weekly outcomes combine explaining mechanisms, running controlled inference and choosing models using
    evidence.


    Explain: Pre-training learns patterns from many examples. Post-training adapts behaviour using instructions or feedback.
    Decoding selects output tokens from model scores. Architecture describes how input and output are processed. Access terms
    determine how a release can be used.


    Example: Use a fictional study-guide task: generate a short definition, verify its meaning, then record the configuration.
    Explaining why a token was selected is different from proving the definition correct. The small CPU checkpoint makes mechanisms
    inspectable; it cannot stand in for every model family or deployment requirement.


    Ask: Which outcome requires more than obtaining a fluent reply?


    Answer: Critical model comparison needs a task rubric, matched examples and measured constraints, followed by verification
    of the outputs.


    Watch out: The lab runs already trained weights; this week does not claim to pre-train a large model.'
  items:
  - Explain LLM training
  - Compare decoding rules
  - Choose a model for a task
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: two assistants, two answers'
    minutes: 5
  - title: 1 · The evolution of NLP
    minutes: 12
  - title: '2 · From transformer to LLM: data, scale, context'
    minutes: 25
  - title: 3 · Decoding strategies
    minutes: 13
  - title: 4 · LLM families
    minutes: 27
  - title: 5 · Choosing and using models
    minutes: 30
  - title: Lab preview and wrap-up
    minutes: 8
  notes: 'In short: Place language-model comparison after transformer mechanisms and before prompting, fine-tuning and retrieval.


    Explain: Last week explained attention and transformer representations. This week studies training scale and inference behaviour.
    Next week changes prompts and measures task performance. Fine-tuning later changes selected weights. Retrieval supplies
    relevant source material during an application request.


    Example: Trace an invented question about a course policy. A decoder can generate wording, prompting can specify format,
    and retrieval can supply the actual policy passage. These contributions work together but have different inputs and evaluation
    needs. A course map shows dependencies; it does not make their mechanisms interchangeable.


    Ask: Does adding a retrieved paragraph necessarily update the model weights?


    Answer: It normally changes the request context. Weight updates require a separate training process with an objective and
    optimiser.


    Watch out: Do not treat prompting, retrieval and fine-tuning as three names for the same operation.'
- type: discussion
  title: Warm-up
  icon: fa:FaComments
  prompt: Two assistants answer differently. Which settings or evidence would you compare?
  points:
  - Model and training?
  - Context, tools and decoding?
  - Correctness under one rubric?
  notes: 'In short: Different answers can arise from model training, the surrounding application or the token-selection policy.


    Explain: A prompt is the supplied request text. System instructions can add behaviour requirements. Tools can provide retrieved
    facts or calculations. Decoding settings affect which continuation is selected. Versions and conversation history can also
    differ between requests.


    Example: Ask two fictional assistants for a three-item reading list. One retrieves course materials; the other invents plausible
    titles. Their surface formats may match while source accuracy differs. Comparing the wording alone resembles checking two
    calculators'' displays without checking their inputs; that analogy leaves model uncertainty and generated citations unexplained.


    Ask: What should remain fixed when testing one decoding-setting change?


    Answer: Keep the checkpoint, prompt, supplied context, tool access and evaluation rubric fixed, then record the changed
    setting.


    Watch out: A repeated answer is not automatically correct, and a different answer is not automatically worse.'
- type: section
  number: 1
  title: The evolution of NLP
  question: How did we get from counting word pairs to chat assistants?
  icon: fa:FaHistory
  notes: 'In short: The history of language modelling explains why counts, vectors, recurrence and attention remain useful ideas.


    Explain: Natural language processing, or NLP, handles human language computationally. Counts estimate familiar local patterns.
    Embeddings are learned numerical representations. Recurrent networks carry a state through a sequence. Attention relates
    positions using the supplied context.


    Example: A word-pair model can count continuations after ''the cat''. A representation-based model can share clues with
    other animal contexts. Neither example guarantees factual understanding. Think of replacing an exact phrase catalogue with
    reusable features: reuse helps unseen combinations, but it also permits mistaken generalisations and does not supply external
    verification.


    Ask: Why does a larger catalogue of phrases still struggle with unseen combinations?


    Answer: Long contexts create many possible combinations, while exact counts share limited information across phrases without
    additional smoothing or representations.


    Watch out: Historical methods are not obsolete for every job; compare their task fit and limitations.'
- type: figure
  title: Forty years of NLP in one line
  figure: nlp_timeline
  notes: 'In short: The timeline shows changing representations and interfaces rather than a universal ranking of language-model
    intelligence.


    Explain: An n-gram is a local sequence of n words. Word vectors attach learned features to words. Recurrent state carries
    information between positions. Transformers use contextual attention. Broad pre-training and later assistant tuning changed
    how these models are used.


    Example: Follow ''bank'' through the timeline. A fixed word vector gives it one representation, while contextual processing
    can distinguish a river bank from a bank loan. This is a representation example, not a guarantee of correct financial or
    geographical knowledge. Earlier techniques can still be efficient for restricted, well-defined tasks.


    Ask: Does every arrow on a historical timeline carry a tensor between the displayed models?


    Answer: No. Chronological comparisons show developments; operation diagrams separately show actual data flow and tensor
    shapes.


    Watch out: A historical product release and a scientific architecture innovation need different kinds of source evidence.'
- type: equation
  title: 'Where it started: n-gram language models'
  eq: p(w_t \mid w_{t-n+1}, \ldots, w_{t-1}) \approx \frac{\mathrm{count}(w_{t-n+1}, \ldots, w_{t-1}, w_t)}{\mathrm{count}(w_{t-n+1},
    \ldots, w_{t-1})}
  read_as:
  - 'Trigram: two preceding words.'
  - 'Illustration: 6 continuations / 10 contexts = 0.6.'
  - Unseen contexts need smoothing.
  terms:
  - - p
    - probability
  - - $w_t$ / t
    - word / position
  - - n
    - word count including prediction
  - - count
    - observed occurrences
  notes: 'In short: An n-gram estimates the next word''s probability using observed continuation counts for a short context.


    Explain: The symbol p denotes probability, and the vertical bar means given. The symbol w_t is the word at position t. The
    index t counts positions, and n includes the predicted word. Count means observed occurrences in the training text. The
    denominator counts the preceding context. Smoothing handles unseen or rare events.


    Example: If ''the cat'' occurs ten times and ''the cat sat'' occurs six times, the estimate for ''sat'' is 6/10, or 0.6.
    Other observed continuations share the remaining probability. This arithmetic is a classroom example. An unseen context
    can have a zero denominator and needs a fallback.


    Ask: Does a count ratio of 0.6 prove that the continuation is true?


    Answer: No. It estimates continuation frequency under the model assumptions; factual correctness needs a separate check.


    Watch out: Here n counts words including the predicted word, so a trigram uses two preceding words.'
- type: table
  title: Each generation fixed a limitation of the last
  header:
  - Method
  - Representation
  - Limit
  rows:
  - - n-gram
    - Counts
    - Unseen phrases
  - - Word vectors
    - Fixed features
    - Word senses
  - - RNN/LSTM
    - Recurrent state
    - Sequential work
  - - Transformer
    - Contextual attention
    - Cost; errors
  notes: 'In short: Each representation solves some earlier limitations while introducing costs and remaining failure modes.


    Explain: Count models need observed contexts. Fixed embeddings share features but do not resolve every word sense. Recurrent
    networks process a sequence through repeated state updates. Transformers construct context-dependent representations using
    attention. None of these designs makes generated statements inherently true.


    Example: Compare ''river bank'' and ''bank loan''. A single stored vector for ''bank'' cannot depend on the surrounding
    phrase at use time. A contextual vector can change with that phrase. This explanation describes representational capacity;
    actual sense separation and downstream task success still need a measured evaluation with matched examples.


    Ask: What is the difference between adding context and establishing reliable knowledge?


    Answer: Context changes the information used for prediction. Reliable knowledge needs suitable sources, training or retrieval,
    and checked outputs.


    Watch out: Do not infer a universal winner from one architecture''s advantage on one illustrative weakness.'
- type: section
  number: 2
  title: 'From transformer to LLM: data, scale, context'
  question: What turns a transformer into a large language model?
  icon: fa:FaDatabase
  notes: 'In short: A transformer becomes a useful language model through data, training objectives, scale and later adaptation.


    Explain: A parameter is a learned numerical weight. A training token is one processed piece from the corpus. Compute counts
    numerical operations. Pre-training learns broad prediction patterns. Post-training shapes instruction-following or other
    intended behaviour.


    Example: Separate one billion parameters from twenty billion training tokens on the board. The first counts adjustable numbers;
    the second counts processed examples. A recipe with more adjustable controls is not automatically better than one trained
    on appropriate data. That analogy omits architecture, optimisation and serving costs, which must be assessed separately.


    Ask: What changes if the same model is trained on more tokens?


    Answer: The architecture can remain unchanged while more prediction examples update its weights, using additional training
    computation.


    Watch out: Parameter count, corpus size and context length are distinct quantities with different units.'
- type: flow
  title: The LLM pipeline, in more detail
  steps:
  - label: Collect
    sub: Authorised text
    role: data
  - label: Clean
    sub: Deduplicate
    role: tool
  - label: Tokenise
    sub: Vocabulary IDs
    role: tool
  - label: Pre-train
    sub: Predict tokens
    role: model
  - label: Post-train
    sub: Instructions
    role: model
  bullets:
  - Data mix affects learning.
  notes: 'In short: The development pipeline turns authorised source material into learned weights and then adapted behaviour.


    Explain: Cleaning removes unsuitable material and duplicates. Decontamination checks for evaluation examples in training
    data. Tokenisation maps text pieces to IDs. Pre-training predicts known next tokens. Post-training uses task demonstrations
    or feedback to adapt the model.


    Example: A document first yields clean text, then IDs shaped [B,L] for B sequences of length L. A decoder produces scores
    [B,L,V] over V vocabulary entries. Known next-token IDs supply the targets. This conceptual development pipeline is broader
    than one batch update; the separate training diagram exposes the prediction, loss and optimiser operations.


    Ask: Why remove benchmark test overlap before reporting evaluation scores?


    Answer: Overlap can make the evaluation reflect prior exposure rather than the generalisation needed for the intended task.


    Watch out: Cleaning decisions require documentation and checks; filtering does not automatically establish data rights or
    eliminate bias.'
  arrows:
  - text
  - clean text
  - IDs
  - base weights
- type: equation
  title: How much compute does pre-training need?
  eq: C \approx 6\, N\, D
  read_as:
  - Rough dense training estimate.
  - 'Illustration: 6 × 7 B × 2 T = 8.4 × 10²² operations.'
  terms:
  - - C
    - operations
  - - N
    - parameters
  - - D
    - training tokens
  notes: 'In short: The dense-model compute estimate multiplies parameters and training tokens, while actual elapsed time depends
    on the system.


    Explain: C denotes training compute in floating-point operations. N counts model parameters. D counts processed training
    tokens. The factor six approximates forward and backward work for dense transformers. It omits some architecture and implementation
    costs.


    Example: For the displayed planning inputs, N is seven billion and D is two trillion. Six times those quantities gives 8.4
    × 10²² operations. This is illustrative arithmetic, not the timing of a lab run. Converting operations to seconds additionally
    requires an explicitly assumed or measured throughput and realistic utilisation.


    Ask: Can the equation determine wall-clock training time from parameter count alone?


    Answer: No. It also needs token count, and elapsed time depends on hardware throughput, coordination, memory and utilisation.


    Watch out: Do not present a hypothetical compute-to-time conversion as an observed runtime or hardware benchmark.'
- type: figure
  title: 'Scaling laws: loss is predictable from size and data'
  figure: scaling
  bullets:
  - Published fit; not a new run.
  - Training/serving constraints change the balance.
  stack: true
  notes: 'In short: Scaling fits describe measured relationships in a study and support planning within their assumptions.


    Explain: A scaling law is an empirical relationship involving loss, size or compute. Loss measures prediction error under
    a defined objective. A fitted curve summarises observations. Chinchilla studied a particular training-compute balance. Later
    serving costs can favour a different balance.


    Example: In the study''s fit, twenty training tokens per parameter is a useful planning reference. A hypothetical one-billion-parameter
    model would therefore correspond to twenty billion tokens at that ratio. The curves are calculations from a published fit,
    rather than new lab measurements. Their smoothness does not guarantee a particular downstream capability or universal optimal
    ratio.


    Ask: Why might an application train a smaller model longer than this reference ratio suggests?


    Answer: A large number of later requests can make reduced per-request inference cost valuable, changing the full lifecycle
    trade-off.


    Watch out: Fit constants and reference ratios must be attributed to their study, not treated as laws for every model.'
- type: stat
  title: The scale of pre-training data
  stats:
  - value: 300 B
    label: GPT-3 training (2020)
  - value: 1.4 T
    label: Chinchilla training (2022)
  - value: 15 T
    label: FineWeb dataset (2024)
  - value: 15 T+
    label: Llama 3 training (2024)
  caption: Historical developer reports; token units vary.
  notes: 'In short: Historical training-token counts illustrate scale, while token units and corpus disclosures require careful
    interpretation.


    Explain: A billion represents 10⁹ units. A trillion represents 10¹² units. Training-token totals count processed tokenizer
    pieces. Dataset size and processed training-token count can differ. A model''s disclosed corpus does not establish its knowledge
    of every included topic.


    Example: The slide separates reported GPT-3 and Chinchilla training totals from FineWeb''s dataset scale and Llama''s disclosed
    pre-training scale. These are historical developer or paper reports, not outcomes from this course''s lab. Comparing tokens
    to words is only approximate because language, code and tokenizer boundaries change how much text each token represents.


    Ask: Why is a token-to-word conversion unsuitable as an exact multilingual cost estimate?


    Answer: Different languages and tokenizers divide text differently; count the actual formatted input and generated tokens
    for the chosen model.


    Watch out: Do not confuse downloaded dataset size, unique source text and the number of tokens processed across training.'
- type: bullets
  title: In-context learning and 'emergent' abilities
  bullets:
  - Prompt examples change context.
  - Weights stay fixed.
  - Test the actual capability.
  notes: 'In short: Prompt demonstrations can guide inference while leaving weights fixed, and scoring can make gradual gains
    look abrupt.


    Explain: In-context learning uses examples inside the current prompt. Those examples change the input context. Ordinary
    inference does not perform an optimiser update. An exact-match score gives credit only to a fully matching answer. That
    scoring rule can hide partial progress.


    Example: Provide ''good → positive'' and ''awful → negative'', then ask for ''great''. The intended pattern answer is positive,
    but the small model''s actual reply needs checking. This is an illustrative task demonstration, not a training run. A changed
    response could arise from supplied context without any learned parameter being modified.


    Ask: What would distinguish prompt demonstrations from fine-tuning?


    Answer: Fine-tuning computes a training objective and updates selected weights; prompt demonstrations are supplied as context
    during a request.


    Watch out: A sudden thresholded benchmark score does not by itself prove a sudden underlying capability change.'
  visual:
    type: example_strip
    items:
    - label: Examples
      text: good → positive; awful → negative
    - label: Predict
      text: great → ?
- type: bullets
  title: 'Context windows: how much the model can see at once'
  bullets:
  - Count formatted tokens.
  - Capacity does not guarantee recall.
  - Check model-specific caps.
  notes: 'In short: A context window bounds usable request tokens without guaranteeing that every supplied detail is used reliably.


    Explain: The context window is the model''s allowed sequence budget. Instructions and conversation history consume tokens.
    Sources and tool results can consume more. Output may share the budget or have another cap. Limits and accounting depend
    on the actual model and interface.


    Example: With an illustrative 100-token combined budget, 20 instruction tokens, 50 source tokens and 10 history tokens leave
    20 for output. Actual templates can add markers, so count the formatted request. Think of a notebook page with finite space:
    fitting a fact on the page does not guarantee the model will correctly retrieve or apply it.


    Ask: What should be checked after a long source passage fits within the limit?


    Answer: Test whether the reply uses the relevant details accurately, including facts in different positions and necessary
    supporting context.


    Watch out: A large advertised limit does not establish faithful recall or remove the need for relevant-source selection.'
  visual:
    type: example_strip
    items:
    - label: Input
      text: Instructions + sources + history
    - label: Output
      text: Generated tokens
- type: figure
  title: Tokenisers differ between model families
  figure: tokenizers
  bullets:
  - Stored counts for fixed texts.
  - Inspect actual pieces and markers.
  - Language and code affect budgets.
  stack: true
  notes: 'In short: The same source text can produce different token pieces and counts across tokenizer/model pairs.


    Explain: A tokenizer defines a vocabulary and segmentation rules. Vocabulary entries can include subword pieces or format
    markers. Token IDs belong to that vocabulary. Whitespace word counting is a separate convenience. Counts affect context
    accounting and per-token measurements.


    Example: A fictional two-word phrase represented by five pieces has 2.5 tokens per whitespace word. The chart instead shows
    stored measured counts for named tokenizers and fixed source texts. Keep that distinction visible. Accented names and indentation
    are useful inspection cases because punctuation, spaces and language coverage can change the segmentation.


    Ask: Must two tokenizers use the same integer ID for the word Dublin?


    Answer: No. Each has its own vocabulary and rules. Compare the source text and decoded pieces before interpreting the counts.


    Watch out: Different token counts do not rank answer quality, and format markers must be handled consistently.'
- type: section
  number: 3
  title: Decoding strategies
  question: The model gives probabilities. How do we turn them into text?
  icon: fa:FaSlidersH
  notes: 'In short: Decoding is the policy that turns model scores into successive output tokens while learned weights remain
    fixed.


    Explain: A logit is an unnormalised score for a candidate token. Softmax converts scores to probabilities. Greedy decoding
    chooses the largest score. Sampling draws according to a distribution. Beam search retains several possible partial sequences.


    Example: For five candidate tokens, the model produces a score vector [V] with V equal to five in the teaching example.
    A decoding filter changes which candidates remain eligible. Selecting one ID extends the prefix from [1,L] to [1,L+1]. The
    next model call then receives a changed prefix, while using the same learned parameters.


    Ask: Which part changes when you apply top-p to already computed scores?


    Answer: The candidate-selection policy changes. The fixed model produced the scores before filtering; a new token subsequently
    changes its next input.


    Watch out: A sampling policy affects diversity and selection, but does not provide a truthfulness guarantee.'
- type: table
  title: Decoding strategies compared
  header:
  - Rule
  - Choice
  - Risk
  rows:
  - - Greedy
    - Argmax
    - Repetition
  - - Beam
    - Several prefixes
    - Generic output
  - - Temperature
    - Rescale scores
    - Variety
  - - Top-k
    - Score threshold
    - Ties
  - - Top-p
    - Cumulative mass
    - Variable count
  - - Penalty
    - Reduce repeats
    - Needed repeats
  notes: 'In short: Token-selection rules make different trade-offs, so choose and report settings according to the task.


    Explain: Temperature is a positive score divisor before softmax. Top-k uses a kth-score threshold. Top-p keeps leading candidates
    reaching cumulative probability p. A repetition penalty modifies previously used token scores. Beam search maintains multiple
    partial sequences.


    Example: The five-score example [2,1,0.5,0.1,−1] gives about [0.56,0.21,0.12,0.08,0.03]. Top-p 0.8 retains the first three
    candidates and renormalises their probabilities. These are illustrative calculations. A threshold-based top-k can retain
    extra tied candidates, and applying temperature first can change the subsequent top-p set.


    Ask: How do you implement greedy generation without dividing scores by zero?


    Answer: Use the runtime''s greedy option, such as do_sample=False. Temperature must remain positive in the manual softmax
    sampler.


    Watch out: Do not equate deterministic selection with correct extraction; verify output format and the underlying facts.'
- type: figure
  title: Real next-token distributions from a small open LLM
  figure: next_token
  bullets:
  - Archived base-model predictions.
  - Probable continuations can be wrong.
  - New checkpoint needs new evidence.
  stack: true
  notes: 'In short: Stored next-token probabilities reveal continuation patterns for specific prompts and checkpoints, rather
    than verified factual answers.


    Explain: A base model continues text using learned patterns. Instruction tuning adapts responses toward requested tasks.
    A probability ranks candidate continuations for a particular prefix. Token labels can include leading spaces or blank markers.
    The chart exposes those measured candidates.


    Example: The archived chart uses the base Qwen2.5-0.5B checkpoint. Its leading-space marker helps explain why displayed
    token strings look unusual. The current CPU lab uses a different small instruction checkpoint and caps output. Changing
    checkpoints is a new experiment; the archived bars and probabilities must not be relabelled as its new results.


    Ask: Does the most probable continuation establish that a factual question has been answered correctly?


    Answer: It describes model continuation likelihood for that prefix. Check whether the continuation actually answers the
    question and matches reliable evidence.


    Watch out: A completion pattern does not identify the particular training examples that caused it.'
- type: quiz
  question: Which policy suits structured invoice extraction?
  options:
  - High temperature for variety
  - Large candidate set
  - Heavy repetition penalties
  - Greedy plus validation
  answer: 3
  notes: 'In short: Structured extraction needs consistent selection plus validation of both format and source content.


    Explain: An extraction task selects requested fields from supplied input. JSON is a structured text format. Greedy decoding
    chooses the highest-scoring token. A validator checks the requested schema. Source comparison checks whether the values
    were copied or inferred correctly.


    Example: Use a fictional invoice with total 12.50 and an invoice ID. The goal is to preserve those values, rather than generate
    varied alternatives. Greedy selection can still produce malformed JSON or a wrong total. This worked task example defines
    the desired behaviour; it is not a claim that the course''s small checkpoint passes it.


    Ask: Which option best matches this structured extraction task?


    Answer: D. Greedy decoding plus output validation gives a consistent starting policy, while format and source-value checks
    remain necessary.


    Watch out: Temperature zero can be an API-specific convention; the manual sampler must not divide by zero.'
- type: section
  number: 4
  title: LLM families
  question: 'GPT, BERT, LLaMA, T5, Claude, Gemini, Qwen…: how do they relate?'
  icon: fa:FaSitemap
  notes: 'In short: Model families are compared along architecture, access, size and behaviour rather than by names alone.


    Explain: An encoder represents supplied input using its available context. A decoder predicts successive output tokens.
    An encoder–decoder conditions generation on an encoded source. Open-weight means weights are downloadable under terms. A
    hosted product can conceal architectural details.


    Example: For one fictional course question, BERT can fill a supplied mask, T5 can transform a task-prefixed source, and
    a decoder can continue a formatted chat. Their output interfaces differ before any quality comparison starts. The family
    names identify useful examples; they do not specify identical training data, context limits, licences or application features.


    Ask: Can you infer that every named assistant has a fully disclosed decoder-only internal architecture?


    Answer: No. Distinguish publicly documented architecture from an observed text-generation interface, especially for proprietary
    products.


    Watch out: A familiar family label must not replace reading the exact release''s card and terms.'
- type: figure
  title: A family tree of transformer language models
  figure: family_tree
  notes: 'In short: Architecture describes input and output processing, while access terms describe how a model release is available.


    Explain: Encoder-only models build input representations. Encoder–decoders encode a source and generate separate output.
    Decoder-only models continue a prefix. A masked objective predicts hidden input pieces. A causal objective predicts using
    preceding pieces only.


    Example: An illustrative input [1,4] can contain a mask for BERT. A text-to-text task can use a source [1,4] and a separately
    generated target [1,3]. A decoder instead returns prefix plus continuation. These shapes show interfaces, not equal task
    difficulty or measured superiority. A downloadable checkpoint can belong to any architectural family.


    Ask: Does open-weight access determine whether a model is an encoder or decoder?


    Answer: No. Access and architecture are separate dimensions; inspect both when matching the model to an application.


    Watch out: A category diagram is a comparison of designs, not a data pipeline connecting different released models.'
- type: compare
  title: 'BERT vs. T5 vs. GPT-style: same input, different jobs'
  columns:
  - head: 'BERT: encoder'
    points:
    - 'Input: supplied mask'
    - 'Output: ranked token'
    - 'Use: labels/representations'
  - head: 'T5: encoder–decoder'
    points:
    - 'Input: source tokens'
    - 'Output: new sequence'
    - 'Use: text transformation'
  - head: Decoder
    points:
    - 'Input: prefix IDs'
    - 'Output: appended IDs'
    - 'Chat: template required'
  notes: 'In short: BERT, T5 and a decoder support different interfaces even when demonstrations use related input topics.


    Explain: BERT''s mask-filling interface ranks missing-token candidates. T5 represents the source before generating another
    sequence. A decoder appends tokens to its existing prefix. Chat markers distinguish message roles. Task quality must be
    assessed for the requested output.


    Example: Supply ''The capital of Ireland is [MASK]'' to BERT, a question to Flan-T5, and a formatted message to the decoder.
    The recorded companion table labels its exact checkpoints. The new CPU core''s SmolLM2 reply belongs to another model and
    cap. Similar wording does not make mask ranking, translation and chat the same measured task.


    Ask: When could an encoder be preferable to a chat decoder?


    Answer: For classification, tagging or retrieval representations, an encoder''s output interface may fit the task directly
    and efficiently.


    Watch out: Do not rank all families by how fluent one short demonstration sounds; match their outputs to actual requirements.'
- type: table
  title: Proprietary and open-weight families (examples, 2026)
  header:
  - Examples
  - Developer
  - Access
  rows:
  - - GPT/Claude/Gemini
    - OpenAI/Anthropic/Google
    - API/app
  - - Llama/Qwen
    - Meta/Alibaba
    - Release-specific weights
  - - DeepSeek/Mistral
    - DeepSeek/Mistral AI
    - Weights/API
  - - Phi/OLMo
    - Microsoft/Ai2
    - Weights
  callout: Read each release's terms.
  notes: 'In short: Access varies by release, and downloadable weights still require licence, provenance and operational checks.


    Explain: A proprietary API exposes a hosted interface. Open-weight access makes learned weights downloadable. Open-source
    claims involve additional materials and licence definitions. A model card documents uses and limits. Terms can differ between
    releases within one family.


    Example: Use the table to create a shortlist for a fictional public study-guide service. Then inspect the actual release,
    including notices, access approval, disclosed training sources and supported inputs. This table groups examples; it cannot
    establish that every family member has identical licence permissions or that any provider is available in every account
    or region.


    Ask: Does downloading model weights automatically provide training data, training code and unrestricted use?


    Answer: No. Check exactly which materials are released and what the licence allows, alongside the application''s own requirements.


    Watch out: Product names and availability change; preserve a dated release record instead of relying on a family-level claim.'
- type: cards
  title: Newer categories that matter when choosing
  cards:
  - head: Small models
    text: Fewer weights; verify task fit.
  - head: Expert routing
    text: Selected experts; total storage remains.
  - head: Reasoning
    text: Extra tokens; check completed answers.
  - head: Multimodal
    text: Additional inputs; verify supported modalities.
  notes: 'In short: Size, expert routing, extra inference computation and input modalities are separate model-selection properties.


    Explain: A small model uses fewer learned parameters. Mixture-of-experts routes tokens to selected expert networks. Total
    weight storage can exceed active-per-token computation. A reasoning configuration spends extra generated computation. Multimodal
    models accept supported non-text input types.


    Example: Compare a hypothetical model storing ten experts while activating two for each token. Activating two does not remove
    storage for the other experts. The numbers illustrate the distinction, not a measured release. Likewise, generating a longer
    thinking trace uses more token work, but final-answer accuracy and completion still need an actual evaluation.


    Ask: Can a model be small, open-weight and reasoning-capable at the same time?


    Answer: These labels describe different properties. Verify the exact architecture, terms, supported mode and task performance
    instead of treating categories as exclusive.


    Watch out: A lower active-parameter count does not by itself establish the memory needed to load a model.'
- type: figure
  title: Reasoning models and test-time compute
  figure: reasoning
  stack: true
  notes: 'In short: Extra inference computation is a budget to evaluate using completed final answers, tokens and measured time.


    Explain: Test-time compute is work performed during inference. A thinking mode can generate intermediate text before an
    answer. Completion checks whether the response reached its intended final section. Accuracy compares the final answer with
    a verified reference. Visible reasoning is generated output.


    Example: The stored scheduling puzzle has three GPUs, but each run needs two for four hours. Only one fits at once, so five
    runs require twenty hours. The archived Qwen3-0.6B comparison on the slide used different sampling and caps for each mode;
    the Word notes give its full table. The new core tests answer-scoring logic only.


    Ask: What is missing if a long response uses its whole budget without a final answer?


    Answer: It has not established a completed correct response. Report the cap, completion flag, accuracy, generated-token
    count and elapsed time together.


    Watch out: Do not score persuasive intermediate text as ground truth or assume more thinking always improves accuracy.'
- type: quiz
  question: Which architecture statement is correct?
  options:
  - BERT is decoder-only chat
  - All weights include training data
  - T5 encodes source and generates text
  - Thinking always reduces time
  answer: 2
  notes: 'In short: The correct architecture statement describes T5''s source encoding and separate text generation without
    making access guarantees.


    Explain: A masked language model predicts hidden input tokens. A causal decoder predicts successive output tokens. T5 combines
    an encoder with a decoder. Open-weight releases do not automatically include all training materials. Reasoning configurations
    can spend additional inference time.


    Example: For a translation task, T5 reads an English source and generates a German sequence. Input and output lengths can
    differ; neither sequence needs to be a single missing word. This worked interface example distinguishes architectures without
    proving that a particular T5 checkpoint translates well. Inspect actual outputs under matched evaluation settings.


    Ask: Which architecture statement is correct?


    Answer: C. T5 frames tasks as text-to-text using an encoder–decoder, while the other options conflate architectures, release
    materials or reasoning cost.


    Watch out: An observed text-generation interface does not disclose every internal design detail of a proprietary assistant.'
- type: section
  number: 5
  title: Choosing and using models
  question: How do you pick the right model and use it responsibly?
  icon: fa:FaTasks
  notes: 'In short: Choose a model by explicit task requirements and measured evidence under practical constraints.


    Explain: A task defines expected input and output. A constraint limits acceptable data handling, cost or hardware. A shortlist
    contains plausible candidates. Evaluation measures the required behaviour on representative examples. Monitoring checks
    whether that behaviour changes after deployment.


    Example: For a fictional course FAQ, require correct answers supported by supplied course passages, a specified format and
    an explicit refusal when evidence is absent. Compare candidates using the same questions and sources. Think of selecting
    laboratory equipment for a defined measurement: specifications narrow the options, but the final choice needs calibration
    on the intended workload.


    Ask: Why is a broadly popular model insufficient evidence for this FAQ task?


    Answer: Its reported tests may not measure source faithfulness, refusal behaviour, the relevant language or the application''s
    actual constraints.


    Watch out: Choose settings on development examples and keep a separate final test for an honest comparison.'
- type: table
  title: What a model card should tell you
  header:
  - Card section
  - Check
  rows:
  - - Use
    - Task/users
  - - Data
    - Disclosure
  - - Evaluation
    - Settings
  - - Limits
    - Known failures
  - - Licence
    - Permissions
  - - Technical
    - Size/template/context
  notes: 'In short: A model card records intended uses and evidence, and missing disclosures must remain visible in the decision.


    Explain: A model card documents a released model. Intended use defines the planned tasks and audience. Evaluation sections
    should state tests and settings. Limitations identify known weaknesses. Technical details include tokenizer, template, size
    and context information.


    Example: Inspect the core SmolLM2 card and the optional Qwen3 card. Record their exact IDs, disclosed evaluations, licence
    and recommended usage. A blank training-data detail should be recorded as undisclosed rather than filled with an assumption.
    Like an instrument datasheet, a model card helps interpretation; it is not an independent certificate that every reported
    capability transfers to your task.


    Ask: What should you do if a requirement depends on information absent from the card?


    Answer: Record the gap, seek reliable evidence or choose another candidate; do not silently assume the missing property.


    Watch out: A model card''s benchmark number must be read with its evaluation procedure and supported limitations.'
- type: table
  title: Licences at a glance (always read the actual text)
  header:
  - Terms
  - Check
  rows:
  - - MIT/Apache
    - Notices
  - - Custom
    - Use conditions
  - - OpenRAIL
    - Restrictions
  - - Research-only
    - Commercial permission
  - - Hosted API
    - Data/cost/access
  notes: 'In short: Model use requires the exact release terms and application requirements, rather than a licence-family shortcut.


    Explain: A licence grants specified permissions under conditions. Notices can be required when redistributing materials.
    Custom terms can impose additional limits. Research-only access may exclude commercial use. Hosted API terms concern service
    access and data handling.


    Example: For a fictional student prototype, check whether the selected checkpoint permits the intended use and what notices
    accompany redistribution. A prototype''s later public deployment can change the applicable operational questions. The table
    offers categories, not legal conclusions about every release. Keep the actual licence text and revision with the model-selection
    record.


    Ask: Does a no-cost download establish unrestricted commercial rights?


    Answer: No. Price and permission are different facts; read the release''s actual terms and address the intended use.


    Watch out: Do not transfer one checkpoint''s permissions to an entire family or present this overview as individual legal
    advice.'
- type: quiz
  title: 'Benchmarks: useful, but read them critically'
  notes: 'In short: Benchmarks help create a shortlist, while representative task tests support the actual model-selection decision.


    Explain: A benchmark is a defined evaluation set and procedure. Contamination means evaluation material appeared during
    training. A harness supplies the scoring and execution rules. Preference votes can reflect style or length. Task mismatch
    limits a score''s relevance.


    Example: A model can lead a code benchmark yet fail a fictional course-policy extraction task. The benchmark and application
    request different outputs under different checks. Keep the detailed MMLU, maths, code, science and preference examples in
    the Word notes. Their names identify evaluation families; they do not establish a current leaderboard ordering or equal
    scoring conditions.


    Ask: How should benchmark evidence guide your final choice?


    Answer: A. Use it to shortlist candidates, then compare them on representative held-out task examples with matched settings
    and constraints.


    Watch out: Freeze development choices before the final test; selecting a winner on that same test overstates the evidence.'
  question: How should benchmarks guide model choice?
  options:
  - Shortlist, then task tests
  - Pick the largest score
  - Ignore evaluation settings
  - Trust one stylish reply
  answer: 0
- type: compare
  title: Calling an API vs. running an open model yourself
  columns:
  - head: Hosted API
    points:
    - Provider runs model.
    - Check data/cost/version.
  - head: Local runtime
    points:
    - Manage weights/runtime.
    - Control chosen version.
  notes: 'In short: Hosted and local inference differ in operational responsibility, data handling and available measurement
    evidence.


    Explain: An API is a software request-and-response interface. A hosted provider runs the model hardware. Local inference
    loads weights into the chosen runtime. Both paths require version and configuration records. Costs and permitted inputs
    depend on the deployment.


    Example: The lab sends only an invented explanation through an optional shared provider and always prints a local rubric.
    A local checkpoint instead produces newly generated IDs that can be counted directly. The wrapper returns text without provider
    usage metadata, so that row keeps usage missing. Do not infer hosted token counts from the local tokenizer.


    Ask: Which responsibilities remain when you run downloadable weights locally?


    Answer: Memory, runtime maintenance, licence compliance, input protection, output checks and version monitoring still need
    to be managed.


    Watch out: OpenAI API costs are separate from a ChatGPT subscription; no API spending is required for the lab.'
- type: code
  title: Using pretrained models with Hugging Face pipelines
  code: "from transformers import pipeline\n\n# DECODER_ID and messages are lab variables\nrun = pipeline(\"text-generation\"\
    ,\n               model=DECODER_ID, device=-1)\nreply = run(messages, max_new_tokens=24,\n            do_sample=False)\n\
    print(reply[0][\"generated_text\"][-1][\"content\"])"
  bullets:
  - Template handles roles.
  - CPU explicitly selected.
  notes: 'In short: A pipeline can combine formatting, model inference and output processing, while explicit device and task
    checks remain necessary.


    Explain: A pipeline is a high-level runtime helper. A chat request contains role/content messages. The checkpoint''s template
    supplies its conversation format. Generation appends output tokens using fixed weights. The first model load can require
    file downloads.


    Example: The projected fragment uses the lab''s small checkpoint and a 24-token cap on CPU. Its chat output separates the
    assistant message through the pipeline''s returned structure. The notebook also exposes formatting and prefix slicing directly
    in the chat helper. These are two interfaces to inference, not two different training methods or guaranteed-quality responses.


    Ask: What should be checked before copying a chat pipeline example to another checkpoint?


    Answer: Confirm its supported task, chat template, output structure, generation parameters and device settings against that
    checkpoint''s documentation.


    Watch out: Do not apply a conversation template intended for another model or silently move the default to a GPU.'
- type: code
  title: Querying a hosted model through an API
  code: "# Shared setup handles provider access\nanswer = ask_model(\"Explain tokens in one sentence.\",\n                 \
    \  temperature=0.2, max_output_tokens=128)\nprint(answer or local_rubric)"
  bullets:
  - Both switches default False.
  - Enable exactly one; local fallback remains.
  notes: 'In short: Optional hosted feedback uses the shared provider controls and preserves a complete local fallback.


    Explain: The shared dispatcher selects one opted-in provider. Both provider switches default to false. The wrapper returns
    text or None. It manages secrets and bounded retries centrally. The local rubric remains available without provider access.


    Example: Send the supplied fictional study-guide explanation with a small output cap. If no response is obtained, print
    the local rubric and continue. Do not read or display keys in this cell. The call illustrates a request interface; it does
    not evaluate the provider broadly or reveal its internal tokenizer, usage or reasoning process.


    Ask: Does the presence of a saved key authorise a hosted request?


    Answer: No. The student must explicitly enable exactly one shared provider switch after considering account, region, cost
    and data-use terms.


    Watch out: A wrapper-call time can include retries and has a different boundary from a local generation measurement.'
- type: cards
  title: What LLMs are used for, and where they struggle
  cards:
  - head: Draft/extract
    text: Verify wording and source values.
  - head: Use tools
    text: Check tool inputs and results.
  - head: High-impact claims
    text: Verify facts, citations and calculations.
  notes: 'In short: Useful language-model applications need task-specific verification, including checks on any supporting tool
    outputs.


    Explain: Drafting produces candidate wording for review. Extraction selects fields from supplied material. Retrieval supplies
    potentially relevant sources. Tools can perform calculations or other operations. A hallucination is generated content unsupported
    by the relevant evidence.


    Example: A fictional course assistant can rewrite a supplied paragraph accurately while inventing an unsupported policy
    deadline in another answer. A retrieved passage helps only if it contains the needed fact and is used faithfully. A calculator
    helps only when its inputs and returned result are checked. These examples define failure checks rather than guaranteeing
    that tools eliminate mistakes.


    Ask: What distinguishes a fluent summary from a faithful summary?


    Answer: Faithfulness requires preserving the source''s meaning and important qualifications, without adding unsupported
    facts or removing essential constraints.


    Watch out: Check citations, numbers and high-impact claims against reliable evidence; polish alone does not establish reliability.'
- type: flow
  title: A practical process for choosing a model
  steps:
  - label: Specify task
    sub: Inputs/outputs
    role: tool
  - label: Constraints
    sub: Privacy/budget
    role: tool
  - label: Shortlist
    sub: Candidate IDs
    role: tool
  - label: Evaluate
    sub: Held-out examples
    role: metric
  - label: Monitor
    sub: Changes
    role: metric
  callout: Freeze choices before final testing.
  notes: 'In short: A disciplined selection workflow creates requirements, compares candidates and monitors a documented decision.


    Explain: The task specification names required outputs. Constraints capture operational and data requirements. A shortlist
    identifies eligible releases. Evaluation measures fixed models under documented settings. Monitoring checks changes in quality,
    cost or availability.


    Example: For an invented reading-list extractor, create development examples with unusual punctuation and a separate held-out
    final set. Shortlist compatible models, choose prompt settings on development data, then freeze them before testing. The
    diagram''s arrows carry specifications and evidence; its evaluation block checks frozen models rather than updating learned
    weights.


    Ask: Why should the final test remain separate from choosing prompts or candidates?


    Answer: Repeated choices based on the same test adapt the decision to that set and can overstate generalisation to new requests.


    Watch out: A provider version change can invalidate earlier evidence; record the change and repeat the relevant checks.'
  arrows:
  - task specification
  - requirements
  - candidate IDs
  - measured results
- type: bullets
  title: 'Responsible AI lens: large language models'
  bullets:
  - Check data rights and licence.
  - Record versions and review responsibility.
  notes: 'In short: Responsible model choice includes data rights, group performance, factual checks, privacy and review accountability.


    Explain: Provenance is the documented source history of data or outputs. Bias can change performance across groups or languages.
    Privacy concerns how information is stored and exposed. Review accountability identifies who handles errors. Version records
    connect results to configurations.


    Example: Use invented study-guide text for this lab''s optional API demonstration. A real deployment can require stronger
    data controls and review procedures. Test accented names and language variants without assuming one prompt establishes fairness.
    The comparison table names practical checks; it does not certify the model, release terms or application as suitable for
    all users.


    Ask: What evidence is missing from a single successful English demonstration?


    Answer: Representative language/group tests, failure cases, source verification, operational records and checks for the
    application''s own data-handling requirements.


    Watch out: Do not send confidential student or personal records through the optional example; retain its supplied invented
    data.'
  visual:
    type: mini_table
    header:
    - Risk
    - Check
    rows:
    - - Bias
      - Target groups
    - - Factual errors
      - Verify claims
    - - Privacy
      - Protect inputs
- type: lab
  title: 'Lab 6: compare LLM families and query a model'
  steps:
  - Count pieces.
  - Compare short replies.
  - Check decoding filters.
  - Score held-out text.
  - Verify completed answers.
  runtime: CPU core took {{W06_CORE_TIME}}. Additional models optional.
  deliverable: Outputs, settings, scores and checked explanations
  notes: 'In short: The required CPU lab separates tokenizer counts, controlled generation, predictability scoring and answer
    verification.


    Explain: One small instruction checkpoint supplies real local inference. Filters are checked on known score vectors. Perplexity
    measures supplied-text predictability. A request log records output length and timing. Optional stretches load additional
    family or reasoning models.


    Example: The core uses a 24-token reply cap, 16-step manual continuations and four short perplexity texts. On the course
    laptop the whole core took {{W06_CORE_TIME}} once the checkpoint was downloaded. Archived family and reasoning results remain
    labelled separately.


    Ask: Which evidence can the synthetic reasoning-scoring check establish?


    Answer: It verifies completion and final-number bookkeeping on known responses; it does not measure a reasoning checkpoint''s
    accuracy.


    Watch out: Enabling optional downloads or longer thinking creates a different workload requiring its own settings and measurement.'
- type: summary
  points:
  - Counts became learned contextual vectors.
  - Pre-training learns; post-training shapes behaviour.
  - Context is limited; select useful material.
  - Decoding changes token choice, not weights.
  - Architecture and access are separate choices.
  - Cards, licences and task tests support model selection.
  notes: 'In short: Connect model development, request formatting, token selection and task verification without confusing their
    measurements.


    Explain: Training learns parameters from examples. Inference uses fixed parameters. A tokenizer defines prediction units.
    Decoding selects output candidates. Evaluation checks whether outputs satisfy the actual task and constraints.


    Example: Return to the five illustrative candidate probabilities. Top-p 0.8 retains three candidates, but none of that arithmetic
    verifies a generated definition. The CPU notebook then supplies actual outputs and measured predictability for its named
    checkpoint. Stored diagrams and tables expose other architectures and configurations; keep their provenance distinct from
    the new run.


    Ask: Does a longer thinking trace prove that the final answer is better?


    Answer: No. Compare completed final correctness, token use and actual elapsed time across representative repeated examples.


    Watch out: Do not combine stored and fresh model results into one table without identifying their checkpoints, settings
    and dates.'
