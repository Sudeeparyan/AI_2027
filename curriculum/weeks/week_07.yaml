subtitle: Give clear instructions, check the answers, and improve prompts using evidence
mimlos:
- 1
- 4
- 5
objectives:
- Explain prompting with fixed model weights.
- Write rules, sources, examples and a task.
- Compare shot counts, roles, reasoning and chains.
- Validate structured outputs and select context.
- Evaluate prompts using references and rubrics.
- Recognise false replies, sensitivity and injection.
coverage:
- pre-training
- fine-tuning
- in-context learning
- system message
- zero-shot
- one-shot
- few-shot
- role
- chain-of-thought
- self-consistency
- prompt chaining
- reasoning model
- structured output
- JSON schema
- context engineering
- summarisation
- extraction
- test set
- rubric
- ROUGE
- BLEU
- LLM-as-a-judge
- human evaluation
- hallucination
- prompt sensitivity
- prompt injection
- jailbreak
- playground
slides:
- type: title
  figure: cover
  notes: 'Say: Today we design instructions and test their effects. Route “Cannot sign in” to IT_ACCESS: put rules and examples into this request, generate a reply, then check it. The weights stay fixed. Analogy: a task brief guides a trained worker. Ask: what would count as an improved prompt? Common mistake: a confident or nicely formatted reply is not evidence of success.'
- type: outcomes
  notes: 'Say: Start with one task, define a correct result and improve the prompt using measured failures. We will practise examples, reasoning, structured output, context and evaluation. Analogy: learn to write an exam and its marking guide together. Ask: what should your classifier do with an ambiguous message? Common mistake: changing many settings at once hides which change helped.'
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: fix a bad prompt'
    minutes: 6
  - title: 1 · The paradigm shift
    minutes: 10
  - title: 2 · Anatomy of a prompt and basic techniques
    minutes: 25
  - title: 3 · Reasoning, structure and context
    minutes: 25
  - title: 4 · Evaluation methods
    minutes: 25
  - title: 5 · Limitations, security and tools
    minutes: 20
  - title: Lab preview and wrap-up
    minutes: 6
  notes: 'Say: First distinguish changing input from training weights. Then write clear briefs and examples. Handle multi-step tasks and JSON, before building the evaluation loop. Finish by testing false replies and hostile source instructions. Analogy: prepare, execute and inspect a recipe. Ask: why write criteria before trying prompt variants? Common mistake: choosing a favourite answer first can bias the marking.'
- type: discussion
  title: Warm-up
  icon: fa:FaEdit
  prompt: 'A colleague''s prompt: ''Write about AI for the website.'' What is missing? Rewrite it in pairs.'
  points:
  - Audience and purpose?
  - Sources, length and format?
  - Success criteria?
  notes: 'Say: Give three minutes. Collect rewrites and look for missing elements: audience, for example prospective MSc students;
    purpose, for example explain what the programme covers; key facts to include; tone; length, for example 150 words; format,
    for example headline plus three bullet points; constraints, such as no unverifiable claims; and success criteria. The last
    question is the important one: most people never define what good looks like, so they cannot tell whether a new prompt is
    better. By the end of the lecture, that question will be answered with a test set and a rubric.


    Analogy: A vague brief to a designer, such as make a poster, returns something, but rarely what you needed.

    Ask: Which missing element makes it impossible to say whether a rewrite is better?

    Answer: Success criteria. Without them there is nothing to measure.

    Common mistake: Adding more words instead of the missing facts, audience and format.'
- type: section
  number: 1
  title: The paradigm shift
  question: How can instructions change a model's answer without training it again?
  icon: fa:FaExchangeAlt
  notes: 'Say: Section one sets prompting in context. Before about 2020, using a model for a new task meant training or fine-tuning
    it on labelled examples. Large pre-trained models can instead be steered by the input text alone. We compare the three ways
    of adapting a model and explain in-context learning. About ten minutes.


    Analogy: A prompt is the worksheet for this attempt; training changes the learner.

    Ask: Does adding an example update any stored model weight?

    Answer: No. The example is part of the input for this request only.

    Common mistake: Calling in-context examples fine-tuning.'
- type: compare
  title: Three ways to adapt a model
  columns:
  - head: Pre-training
    icon: fa:FaIndustry
    points:
    - Learns general language patterns from huge text
    - Updates every weight; weeks of GPU time
    - 'Example: building Qwen from web text'
  - head: Fine-tuning
    icon: fa:FaWrench
    points:
    - Learns from your task examples
    - Updates some or all weights
    - 'Example: 1,000 labelled support tickets (week 8)'
  - head: Prompting
    icon: fa:FaKeyboard
    points:
    - Supplies instructions and examples in the input
    - Keeps every weight fixed
    - 'Example: today''s routing prompt'
  callout: Measure prompting; retrieve missing facts; train for persistent behaviour gaps.
  notes: 'Say: The three columns differ in what changes and what it costs. Pre-training changes everything and costs millions.
    Fine-tuning updates weights on your data; it is cheaper, especially with LoRA in week 8, but needs data and GPU time, and
    it is best for consistent formats, styles or specialised domains. Prompting changes nothing in the model; iteration takes
    minutes. The callout is the practical decision rule used by Microsoft, Google and OpenAI guidance: begin with prompting,
    add retrieval when the problem is missing knowledge, and fine-tune only when a well-designed evaluation shows prompting
    is insufficient.


    Analogy: Pre-training is schooling, fine-tuning is job training, and prompting is today''s task sheet.

    Ask: A model keeps missing your house style despite careful prompts tested on a test set. What comes next?

    Answer: Fine-tuning, because evaluation has shown prompting is not enough. If the problem were missing facts, retrieval
    would come first.

    Common mistake: Fine-tuning to add facts that change often. Retrieval handles changing knowledge better.'
- type: bullets
  title: 'In-context learning: prompts as programs'
  icon: fa:FaCode
  bullets:
  - Rules, sources, examples and questions become input tokens.
  - Examples guide this request; weights stay fixed.
  - Version the prompt and test it.
  - Message priority is not a security guarantee.
  notes: 'Say: Help students form an accurate mental model. The model does not ''understand what you want'' in a human sense;
    it computes the most plausible continuation of all the tokens it receives, as shaped by post-training to follow instructions.
    Examples in the prompt shift that continuation, which is in-context learning. Treating the prompt as a program has practical
    consequences: write it deliberately, test it on examples, keep versions, and re-test when the model changes. Modern assistants
    are trained with an instruction hierarchy in which system or developer messages take priority over user messages, which
    matters for security later.


    Analogy: A prompt is source code for one request: version it, test it, and re-test it when the model changes.

    Ask: The provider updates the model behind your API. What should you do with your prompt?

    Answer: Re-run your test set. The same prompt can behave differently on a new model.

    Common mistake: Treating message priority as a security guarantee.'
- type: section
  number: 2
  title: Anatomy of a prompt and basic techniques
  question: What goes into a good prompt, and how much do examples help?
  icon: fa:FaPuzzlePiece
  notes: 'Say: Section two covers the structure of a prompt and the basic techniques in the descriptor: zero-shot, one-shot,
    few-shot and role-based prompting. We finish with real results from running these prompt styles on a classification task
    with a small open model. Ask students to predict which style will win before showing the results. About twenty-five minutes.


    Analogy: A task brief gives a worker rules, source material and an output form.

    Ask: What should a routing example teach besides its category name?

    Answer: The exact output format, and where the boundary lies between similar categories.

    Common mistake: Choosing examples only from easy, typical messages.'
- type: figure
  title: Anatomy of a well-structured prompt
  figure: anatomy
  notes: 'Say: A prompt has up to five parts. The system or developer message sets the role, rules, tone and policies. Context
    supplies what the model needs to know: documents, data, history or tool results, clearly delimited, for example with XML-style
    tags, which the Anthropic and OpenAI guides recommend. Examples show the exact input-output format. The task states what
    to do, for whom and with which constraints. The output format specifies length and structure, including what to do when
    unsure. Not every prompt needs every part, but checking against this list catches most problems in the warm-up prompt.


    Analogy: A recipe card says who it serves, lists the ingredients and steps, and shows how the dish should look.

    Ask: Which part of the anatomy tells the model what to do when it is unsure?

    Answer: The output format, which should say what to return when information is missing.

    Common mistake: Mixing documents and instructions without delimiters, so the model cannot tell data from commands.'
- type: table
  title: 'Worked example: rewriting the warm-up prompt'
  header:
  - Element
  - Before
  - After
  rows:
  - - Rules
    - None
    - Use supplied facts
  - - Audience
    - None
    - AI beginners
  - - Facts
    - None
    - 12 weeks; Python; 60% project
  - - Task
    - Write about AI
    - Introduce the module
  - - Format
    - None
    - Headline; three bullets; <120 words
  - - Check
    - None
    - Claims and length
  notes: 'Say: This is a model answer to the warm-up. Walk through each row and point out where each element of the anatomy
    slide appears. The facts are delimited with tags so the model can distinguish data from instructions, and the rule to use
    only those facts plus the instruction to omit missing facts reduce hallucinated claims. The format is explicit and testable.
    The success check at the bottom is not sent to the model; it is the evaluation criterion we will use in section four. Ask
    students which element they think makes the biggest difference: usually the context, because the model cannot invent the
    module details correctly.


    Ask: Which row of the table is never sent to the model?

    Answer: Check. It is the evaluation criterion we apply to the reply afterwards.

    Common mistake: Leaving out the facts and hoping the model knows the module details. It will invent them.'
- type: table
  title: Messages and roles in chat APIs
  header:
  - Role
  - Typical use
  - Example
  rows:
  - - system / developer
    - Application instructions
    - Reply with one team label.
  - - user
    - The request and its content
    - My exam timetable clashes.
  - - assistant
    - Replies, or answers in examples
    - TIMETABLE_EXAMS
  - - tool
    - Results returned by code
    - Timetable row for the module
  callout: Role support and priority vary by API; enforce permissions in code.
  notes: 'Say: Roles describe who supplied each message and its intended use. Local Qwen uses system, user and assistant through its chat template. Some APIs also support developer instructions; system and developer are distinct roles, not simply a universal rename. Tool messages come from code and may contain untrusted retrieved text. Analogy: separate a manager’s rules from a customer’s attachment. Ask: does placing a command inside a tool result authorise it? Common mistake: roles and delimiters are helpful conventions, not a hard permission boundary.'
- type: compare
  title: Zero-shot, one-shot, few-shot
  columns:
  - head: Zero-shot
    icon: fa:FaCircle
    points:
    - Instruction only, no example
    - Shortest input
    - 'Classify this message: ...'
  - head: One-shot
    icon: fa:FaDotCircle
    points:
    - One input–answer pair
    - Fixes the format, can bias the label
    - eduroam fails → IT_ACCESS
  - head: Few-shot
    icon: fa:FaBullseye
    points:
    - Several varied pairs, one per label
    - Choice and order change results
    - Five examples, one per team
  notes: 'Say: The descriptor''s basic techniques. Zero-shot gives only the instruction. One-shot adds a single example, which
    is very effective at fixing the output format but can bias the model towards that example''s label. Few-shot uses several
    examples, ideally covering each class and including tricky boundary cases, which usually improves accuracy and consistency,
    at the cost of longer prompts. Research has shown that the choice, order and even the label balance of examples can change
    results noticeably, so few-shot prompts must be evaluated like any other design choice.


    Analogy: One sample answer shows the format; several varied samples show the range.

    Ask: Why can one-shot prompting bias the label?

    Answer: The model may copy the single example''s label for inputs that look similar.

    Common mistake: Assuming more examples always help. Their choice, order and label balance can change results.'
- type: code
  title: A few-shot prompt as chat messages
  code: "messages = [\n  {\"role\": \"system\", \"content\": TASK},\n  {\"role\": \"user\", \"content\":\n    \"Message: Cannot connect to eduroam.\\n\"\n    \"Category: IT_ACCESS\\n\\n\"\n    \"Message: May I get my deposit receipt?\\n\"\n    \"Category: FEES_FINANCE\\n\\n\"\n    \"Message: Two exams clash on Friday.\\n\"\n    \"Category:\"},\n]\n"
  bullets:
  - Rules define allowed labels.
  - Examples demonstrate the format.
  - Validate the returned reply.
  notes: 'Say: This is the few-shot prompt students write in the lab. Point out the design decisions: the rules and the complete
    label set go in the system message; examples are short, realistic and cover each category; they are not taken from the test
    set, which would inflate the measured accuracy; and the final line ends with Category and a colon, nudging the model to
    answer with a single label. Setting temperature to zero makes the evaluation reproducible. The same structure works for
    any classification or extraction task in the project.


    The TASK variable is defined in the lab and lists the permitted teams. This compact lecture example shows two input-answer
    pairs; the notebook compares examples for all five categories.


    Ask: Why must the examples not come from the test set?

    Answer: The model would see the answers, so the measured accuracy would be inflated.

    Common mistake: Leaving out the final Category: line and then parsing a full sentence as a label.'
- type: bullets
  title: Role-based prompting and its limits
  icon: fa:FaUserTie
  bullets:
  - A role guides tone and priorities.
  - Name the audience.
  - Roles do not supply missing knowledge.
  - Ask for evidence-based checks.
  notes: 'Say: Role or persona prompting is popular and sometimes useful: it helps set the register and the priorities, for
    example asking the model to review code as a security specialist makes it focus on vulnerabilities. But students often over-estimate
    it. A role cannot give the model knowledge it does not have, and research on persona prompts has found small or inconsistent
    accuracy effects. Worse, an authoritative persona can make hallucinations more convincing. The practical advice from all
    three vendor guides is to be specific about the behaviour you want rather than relying on a label.


    Analogy: A uniform changes how someone looks, not what they know.

    Ask: You add You are an expert pharmacist. Does the model now know the latest drug interactions?

    Answer: No. A role can change tone and focus but cannot add knowledge; supply current sources instead.

    Common mistake: Trusting a persona''s confident tone. It can make invented answers more convincing.'
- type: cards
  title: Principles from the official prompting guides
  cards:
  - icon: fa:FaBullseye
    head: Be clear and specific
    text: 'Say task, audience and format: "three bullets for first-year students".'
  - icon: fa:FaFolderOpen
    head: Give context
    text: Paste the facts and mark where each source starts and ends.
  - icon: fa:FaListOl
    head: Show examples
    text: Give varied input–answer pairs, including a tricky boundary case.
  - icon: fa:FaStream
    head: Break tasks down
    text: Extract facts first, then draft; check each step's output.
  - icon: fa:FaQuestionCircle
    head: Allow uncertainty
    text: 'Say what to reply when evidence is missing: "not in the source".'
  - icon: fa:FaVial
    head: Test systematically
    text: Compare prompt versions on the same questions and settings.
  notes: 'Say: These six principles appear, in different words, in the prompt engineering guides of OpenAI, Google and Anthropic,
    linked on the final slide. Two are often neglected. Allowing uncertainty is one of the simplest hallucination mitigations:
    models are more likely to invent an answer if the prompt implies an answer must exist. Testing systematically is what separates
    prompt engineering from prompt guessing. Ask students to check the warm-up rewrite against these six cards.


    Analogy: A good briefing for a new colleague covers the same six points.

    Ask: Which principle is the simplest guard against invented answers?

    Answer: Allowing uncertainty: say what to return when the evidence is missing.

    Common mistake: Testing a prompt on a few favourite examples instead of a fixed test set.'
- type: figure
  title: 'Real results: does few-shot prompting help?'
  figure: fewshot_results
  bullets:
  - '{{FEWSHOT_SUMMARY}}'
  - Same model, 40 messages, temperature 0.
  - One answer changes accuracy by 2.5 percentage points.
  stack: true
  notes: 'Say: These are real results from running the lab notebook on the GPU with a small open model, {{MODEL}}. The chart
    shows accuracy on forty student-services messages, with Wilson 95% intervals. {{FEWSHOT_INVALID}} Ask students whether they
    trust the differences; the honest answer is that with forty items only large differences are reliable, which we quantify
    in section four.


    Ask: With 40 messages, how many answers is a 2.5-point difference?

    Answer: One answer.

    Common mistake: Declaring a winner from a one-answer difference on a small test set.'
- type: quiz
  question: A zero-shot classifier often replies with full sentences instead of a label. What is the most effective first fix?
  options:
  - 'Add a persona at the start: ''You are a world-class classifier'''
  - Add a few examples in the exact output format and state the allowed labels
  - Increase the temperature so that it tries other output formats
  - Fine-tune the model immediately on a set of labelled messages
  answer: 1
  notes: 'Say: Answer: B. Format problems are best fixed by showing the format with examples and listing the allowed outputs,
    ideally with structured output enforcement later in this lecture. A, a persona, does little for format. C makes outputs
    more random, the opposite of what we want. D is premature: fine-tuning costs data and time, and should come only after prompting
    and evaluation show a real limit. Check the invalid-answer count in your own run: it shows whether this format problem occurred.


    Ask: Why does a persona not fix the format?

    Answer: It changes tone, not the output form. Examples and the list of allowed labels show the form.

    Common mistake: Raising the temperature so the model tries other formats. It only adds randomness.'
- type: section
  number: 3
  title: Reasoning, structure and context
  question: How do we handle several steps, return data for code, and supply the right facts?
  icon: fa:FaBrain
  notes: 'Say: Section three covers the more advanced techniques: chain-of-thought prompting and self-consistency, with real
    results; how prompting changes with reasoning models; prompt chaining; structured outputs with schemas; context engineering;
    and prompting for different kinds of task. These techniques matter most when outputs feed into code, as in weeks 11 and
    12. About twenty-five minutes.


    Analogy: A schema is a form; validation checks the boxes, and source checking checks the contents.

    Ask: Can an eight-digit ID still identify the wrong person?

    Answer: Yes. The schema checks the shape of the ID, not whether it belongs to the person who wrote the email.

    Common mistake: Treating valid JSON as correct data.'
- type: bullets
  title: Chain-of-thought (CoT) prompting
  icon: fa:FaStream
  bullets:
  - Ask for intermediate steps and a clear final answer.
  - Sometimes helps; sometimes fails.
  - Extra output costs tokens and time.
  - Check the answer and its steps.
  notes: 'Say: Chain-of-thought prompting, introduced by Wei and colleagues in 2022, gives the model room to generate intermediate
    steps, which improves accuracy on multi-step problems because each generated step becomes context for the next. Kojima and
    colleagues showed that simply adding let''s think step by step helps even without examples. Two practical points: CoT multiplies
    output length and therefore cost, and you must ask for a parseable final answer. The faithfulness caveat is important for
    assessment: students should never present a model''s reasoning text as evidence that the answer is right.


    Analogy: Showing your working in a maths exam gives space for each step, but the working can still contain a mistake.

    Ask: Why must a chain-of-thought prompt ask for a clearly marked final answer?

    Answer: So code can find and parse the answer reliably at the end of a long reply.

    Common mistake: Presenting the model''s reasoning text as proof that the answer is right.'
- type: figure
  title: 'Real results: direct vs. chain-of-thought vs. self-consistency'
  figure: cot_results
  bullets:
  - '{{COT_SUMMARY}}'
  - Self-consistency samples replies and picks the most common answer.
  - More calls cost more; agreement can be wrong.
  stack: true
  notes: 'Say: Compare measured accuracy and output tokens on sixteen multi-step word problems from the lab. Written steps and
    sampling several replies spend more computation; they can still produce wrong answers. Self-consistency samples five reasoning
    paths and selects the most common parsed final answer. A strict majority is not required: when answers tie, this lab chooses
    the one encountered first. Check the measured gain against the extra tokens and time on the same problems.


    Ask: Self-consistency uses about five times the tokens of chain-of-thought. When is that worth paying?

    Answer: When the accuracy gain on your own test set justifies the extra cost and time, for example for rare, high-value
    questions.

    Common mistake: Assuming the majority answer is correct. Several samples can agree on the same wrong answer.'
- type: bullets
  title: Prompting reasoning models
  icon: fa:FaBrain
  bullets:
  - State the goal and constraints.
  - Supply needed evidence and final format.
  - Use supported effort settings.
  - Measure correctness, time and cost.
  notes: 'Say: Prompting practice has changed with reasoning models. Their vendors, including OpenAI and Anthropic, advise against
    micromanaging the reasoning: describe the goal, constraints and what a good answer looks like, provide all needed context,
    and let the model plan. Many APIs expose an effort or thinking-budget setting. Because reasoning models are slower and more
    expensive, a common architecture routes easy requests to a fast standard model and hard ones to a reasoning model, which
    students can consider in their projects.


    Analogy: Give an experienced professional the goal and constraints, not step-by-step instructions.

    Ask: Why route easy requests to a standard model?

    Answer: Reasoning models are slower and cost more per answer, and easy requests rarely need the extra thinking.

    Common mistake: Micromanaging a reasoning model''s steps instead of stating the goal, constraints and output format.'
- type: flow
  title: 'Prompt chaining: decompose complex tasks'
  steps:
  - label: Extract
    sub: Find source facts
  - label: Verify
    sub: Check against source
  - label: Draft
    sub: Use checked facts
  - label: Critique
    sub: Apply checklist
    highlight: true
  - label: Finalise
    sub: Repair and format
  bullets:
  - Pass outputs to later prompts; validate each step.
  - 'Invoice: extract → verify → add in code → explain.'
  notes: 'Say: For complex tasks, one giant prompt is hard to debug. Prompt chaining splits the work into steps, each with its
    own prompt and its own test. The example chain is for writing a report from a source document: extract facts, verify them
    against the source, draft from verified facts only, critique against a checklist, and finalise. Each step can use a different
    model or plain code; for instance, verification of dates or numbers is best done by code. This idea leads directly to workflows
    and agents in week 12, where the steps become tool calls.


    Analogy: An assembly line with an inspection after each station.

    Ask: In the invoice chain, why add the totals in code rather than in a prompt?

    Answer: Code does arithmetic exactly; a model can make arithmetic mistakes.

    Common mistake: Passing one step''s output to the next without checking it, so an early error spreads.'
- type: code
  title: 'Structured outputs: a schema as a contract'
  code: "from pydantic import BaseModel, Field, ValidationError\nfrom typing import Literal\nclass Request(BaseModel):\n    name: str\n    student_id: str = Field(pattern=r\"^[0-9]{8}$\")\n    request: Literal[\"extension\", \"invoice\", \"deferral\"]\n    date: str | None = None\nraw = llm(extract_prompt(email))\ntry:\n    req = Request.model_validate_json(raw)\nexcept ValidationError as err:\n    raw = llm(fix_prompt(raw, err))\n    req = Request.model_validate_json(raw)  # may still fail\n"
  bullets:
  - A schema checks fields, types and constraints.
  - Validate the first reply and the retry.
  - Check facts separately; reject a second failure.
  notes: 'Say: Trace the code. Field(pattern=...) really checks eight ASCII digits; the request field has three allowed values. The date field permits a string or null here: the lab adds a date-format validator. Import ValidationError, validate the first response, give a single repair opportunity, then validate again. A second exception must stop or enter an explicit error path. Analogy: a form checker rejects the wrong shape but cannot know whether a stated ID belongs to this person. Ask: what source comparison detects the wrong eight-digit ID? Common mistake: syntactically valid JSON is not validated business data.'
- type: figure
  title: 'Context engineering: what the model sees matters most'
  figure: context_eng
  stack: true
  notes: 'Say: Choose relevant information for each call. Label sources; shorten old history. Test source order and token budget. Extra context may distract. Context engineering, a term popularised in 2025 by Anthropic and others, is the natural extension of prompt engineering for applications and agents: deciding what information fills the limited context window at each step. Sources compete for space: instructions, the user''s query, retrieved documents, conversation memory and tool outputs. Good practice is to select only what is relevant, summarise or compress old history, order content deliberately, for example Anthropic recommends placing long documents before the question, and delimit and label each source. Irrelevant context can distract the model and increases cost.


    Analogy: Pack a suitcase with limited space: keep what this journey needs and leave room for the answer.

    Ask: If the request is too long, what should you remove before cutting the current question?

    Common mistake: Filling every available token does not guarantee a better answer.'
- type: cards
  title: Prompting for different tasks
  cards:
  - icon: fa:FaCompressAlt
    head: Summarisation
    text: Name the reader and length; keep only claims in the source.
  - icon: fa:FaTable
    head: Extraction
    text: List the fields, return null for missing ones, validate in code.
  - icon: fa:FaTags
    head: Classification
    text: Define every label in one line and give an example of each.
  - icon: fa:FaCode
    head: Code
    text: State inputs, outputs and versions; run the tests before trusting it.
  - icon: fa:FaImage
    head: Image generation
    text: 'Describe subject, style and composition: "a lighthouse at dusk, watercolour".'
  - icon: fa:FaChartBar
    head: Data analysis
    text: Explain each column; ask for code that computes the numbers.
  notes: 'Say: Different tasks need different prompt emphases. Summaries need an audience, length and faithfulness instruction.
    Extraction needs a schema and a rule for missing values. Classification needs the full label set, ideally with a one-line
    definition of each. Code prompts should state versions and interfaces and ask for tests; always run the code. Image prompts,
    from week 4, describe subject, style, composition and lighting, with negative prompts. For data analysis, ask the model
    to write code that computes the numbers rather than computing them in its head, which avoids arithmetic hallucination.


    Analogy: Different jobs need different briefs: a summary brief names the reader; an extraction brief names the fields.

    Ask: For data analysis, why ask the model for code rather than for the numbers?

    Answer: Running the code computes exact numbers and shows how they were obtained.

    Common mistake: Accepting generated code without running and testing it.'
- type: section
  number: 4
  title: Evaluation methods
  question: How do you know a prompt, or a model, is actually better?
  icon: fa:FaClipboardCheck
  notes: 'Say: Welcome back. Section four is the most important for MIMLO 4 and for the project. We set out an evaluation loop,
    compare the families of evaluation methods, compute a reference-based metric by hand, discuss LLM-as-a-judge and its biases,
    look at a rubric for human evaluation, and finish with the statistics needed to avoid fooling ourselves with small test
    sets.


    Analogy: An evaluation set is a shared exam, with a marking guide written before grading.

    Ask: What does one changed answer do to accuracy on forty questions?

    Answer: It moves accuracy by 2.5 percentage points.

    Common mistake: Tuning prompts on the final test set. Development examples guide revisions; the final test must stay unused.'
- type: flow
  title: The evaluation loop (eval-driven development)
  steps:
  - label: Define success
    sub: Write criteria
  - label: Build a test set
    sub: Real inputs; hold some out
  - label: Run
    sub: Fixed settings; log replies
  - label: Score
    sub: Metrics, rubric, people
    highlight: true
  - label: Analyse errors
    sub: Read failures; revise
  callout: Develop on one set; finish with fresh examples.
  notes: 'Say: This loop is how professional teams develop LLM features; OpenAI''s evaluation best-practices guide describes
    the same cycle. Define success criteria before writing prompts. Build a test set from realistic inputs, including hard and
    edge cases, and keep a held-out part you do not look at while tuning. Run with fixed settings and log model version, prompt
    version and outputs. Score with a combination of methods. Most importantly, read the failures and group them: error analysis
    tells you whether to change the prompt, add context, change the model, or accept a limitation. Every project must include
    such a test set.


    Analogy: A cook tastes and adjusts while cooking, but the guest judges a fresh plate.

    Ask: Why keep part of the test set hidden while tuning?

    Answer: A prompt tuned on the same items can overfit them; fresh items show how it does on new inputs.

    Common mistake: Skipping error analysis. Reading the failures shows whether to change the prompt, the context or the model.'
- type: table
  title: Families of evaluation methods
  header:
  - Method
  - Checks
  - Example
  - Limit
  rows:
  - - Exact match / F1
    - Agreement with a reference
    - Label matches the gold label
    - Open-ended answers
  - - BLEU / ROUGE
    - Word overlap with a reference
    - Summary vs. reference summary
    - Misses paraphrases
  - - Embedding similarity
    - Closeness of meaning
    - Answer near the reference
    - Not truth
  - - Code checks
    - Rules and unit tests
    - JSON schema; date format
    - Only what is coded
  - - LLM judge
    - Score against a rubric
    - Faithfulness 1–5
    - Judge bias
  - - Human review
    - Useful and correct?
    - Two raters, one rubric
    - Disagreement; cost
  notes: 'Say: No single method fits every output. Closed answers, such as labels, numbers and extracted fields, use exact match,
    accuracy or F1. Free text compared with references can use overlap metrics such as BLEU for translation and ROUGE for summarisation,
    but these miss paraphrases. Embedding similarity handles paraphrase but not correctness. Programmatic checks, such as schema
    validation and unit tests for code, are cheap and reliable for what they cover. LLM-as-a-judge scales rubric-based evaluation.
    Human evaluation remains the reference. Good evaluations combine several.


    Analogy: A ruler, a spell-checker and a human editor each catch different problems.

    Ask: Which method fits checking that extracted dates are valid?

    Answer: Code. A rule or unit test checks the format exactly and cheaply.

    Common mistake: Using embedding similarity as a correctness check. Similar meaning is not a true answer.'
- type: equation
  title: 'A reference-based metric by hand: ROUGE-1'
  eq:
  - \mathrm{Recall} = \frac{\#\,\mathrm{overlapping\;words}}{\#\,\mathrm{words\;in\;reference}}, \qquad \mathrm{Precision} = \frac{\#\,\mathrm{overlapping\;words}}{\#\,\mathrm{words\;in\;output}}
  - F_1 = \frac{2 \cdot \mathrm{Precision} \cdot \mathrm{Recall}}{\mathrm{Precision} + \mathrm{Recall}}
  read_as:
  - 'Reference: the exam results are published in four weeks. (8 words)'
  - 'Output: results are published after four weeks. (6 words)'
  - 'Five overlap: recall 5/8; precision 5/6; F1 ≈ 0.71.'
  terms:
  - - ROUGE-1
    - counts matching single words
  - - BLEU
    - counts matching word sequences, often for translation
  notes: 'Say: Work through the example. The reference has eight words, the output six; five words overlap, so recall is five
    eighths and precision five sixths, and the F1 is about 0.71. ROUGE-2 would count overlapping word pairs instead. Then show
    the limitation with the paraphrase: ''marks come out a month later'' means the same thing but shares almost no words with
    the reference, so it scores near zero. Reference-based metrics are cheap and reproducible, but for LLM outputs they must
    be combined with semantic or human evaluation.


    Ask: What ROUGE-1 score does the paraphrase marks come out a month later get?

    Answer: Zero. No word overlaps with the reference, although the meaning is the same.

    Common mistake: Reading a high overlap score as proof of a faithful summary.'
- type: bullets
  title: LLM-as-a-judge
  icon: fa:FaGavel
  bullets:
  - A judge applies a written rubric.
  - 'MT-Bench: strong judges ≈ 80% human agreement.'
  - Check position, length and self-preference biases.
  - Swap order; calibrate with human scores.
  notes: 'Say: Using a model to evaluate another model''s output is now standard because it scales. Zheng and colleagues'' MT-Bench
    study found that strong model judges agreed with human preferences about as often as humans agreed with each other, around
    eighty percent. But judges are biased. They may prefer whichever answer is shown first, prefer longer answers, prefer outputs
    from their own model family, and be swayed by a confident tone. The lab measures position bias by swapping answer order.
    The rule for the project: an LLM judge may be used only if calibrated against a sample of human labels, with agreement reported.


    Analogy: A referee who sometimes favours the team shown first.

    Ask: How does swapping the answer order reveal position bias?

    Answer: A consistent judge picks the same underlying answer in both orders; a changed verdict shows the order mattered.

    Common mistake: Using an LLM judge without checking it against human labels.'
- type: table
  title: A rubric for human (or LLM) evaluation of summaries
  header:
  - Criterion
  - '1: poor'
  - '3: acceptable'
  - '5: excellent'
  rows:
  - - Faithfulness
    - Unsupported claims
    - Minor gap
    - All supported
  - - Coverage
    - Key omissions
    - Most points
    - All needed points
  - - Clarity
    - Hard to follow
    - Understandable
    - Audience-ready
  - - Format
    - Ignored
    - Minor deviations
    - Exact
  callout: Two people score a sample; discuss disagreement.
  notes: 'Say: Human evaluation needs a rubric to be consistent. Criteria should be few and distinct, with anchored descriptions
    for low, middle and high scores so raters interpret them the same way. Faithfulness comes first for summaries, because hallucinated
    content is the most harmful failure. Use at least two raters on a sample of outputs, measure inter-rater agreement, for
    example with Cohen''s kappa, and discuss disagreements to refine the rubric. The same rubric can then be given to an LLM
    judge, whose scores are validated against the human ones.


    Analogy: A marking scheme with a description for each grade.

    Ask: Why put faithfulness first for summaries?

    Answer: An unsupported claim is the most harmful failure in a summary.

    Common mistake: Using one rater. Without a second rater you cannot measure agreement.'
- type: bullets
  title: 'Statistics: don''t fool yourself with small test sets'
  icon: fa:FaChartLine
  bullets:
  - '40 questions: one answer = 2.5 points.'
  - 80% accuracy has roughly ±12-point uncertainty.
  - Use paired comparisons; repeat sampling.
  - Keep a final test separate.
  - Log settings and errors.
  notes: 'Say: Students routinely conclude that one prompt is better from a two-point difference on thirty examples. Give them
    the rule of thumb: the standard error of an accuracy p on n items is the square root of p times one minus p over n; for
    eighty percent on forty items that is about 6.3 points, so the ninety-five percent margin is about plus or minus twelve
    points. Paired comparison on the same items is more sensitive: look at the items where the prompts disagree. Use several
    seeds for sampled outputs, a held-out set, and report everything needed to reproduce the result. This slide is examinable.


    Ask: Prompt A scores 80% and prompt B 85% on the same 40 items. Is B better?

    Answer: Not shown. The margin is about 12 points either way. Look at the items where the prompts disagree, or use more items.

    Common mistake: Reporting accuracy without the number of test items.'
- type: section
  number: 5
  title: Limitations, security and tools
  question: What can still go wrong, and what tools help?
  icon: fa:FaShieldAlt
  notes: 'Say: The final section covers the limitations and challenges listed in the descriptor: hallucination, sensitivity
    to prompt wording, and security issues including prompt injection and jailbreaks, with a real measurement from the lab;
    then the supporting tools used in practice, and the responsible-AI lens for prompting.


    Analogy: A hostile note inside a document is still a note, not permission to act.

    Ask: Where should the application enforce permission to send an email?

    Answer: In code, before the email tool runs, for example with an allowlist or a human approval step.

    Common mistake: Relying on delimiters and system instructions for security.'
- type: cards
  title: Limitations that prompting cannot remove
  cards:
  - icon: fa:FaGhost
    head: Hallucination
    text: 'Fluent text can be false: an invented reference that looks real.'
  - icon: fa:FaRandom
    head: Prompt sensitivity
    text: Swapping two examples' order can change the label.
  - icon: fa:FaCalendarAlt
    head: Knowledge cut-off
    text: The model may not know this year's fees; supply current sources.
  - icon: fa:FaThumbsUp
    head: Sycophancy
    text: '"Are you sure?" can make a model drop a correct answer.'
  - icon: fa:FaBalanceScaleLeft
    head: Bias
    text: Change only the name in a message and compare the replies.
  - icon: fa:FaDice
    head: Non-determinism
    text: Sampling and service updates can change a reply; log versions.
  notes: 'Say: These limitations are properties of the models, so good prompts can mitigate but not remove them. Hallucination
    is reduced by providing context and permission to abstain, but must be verified. Prompt sensitivity means results should
    always be reported with the exact prompt. The knowledge cut-off is why retrieval and tools exist. Sycophancy, the tendency
    to agree with the user, is a documented effect of preference training: asking are you sure can make a model abandon a correct
    answer. Bias should be tested by varying names and demographic details in otherwise identical prompts.


    Ask: How would you test a model for sycophancy?

    Answer: Ask a question it answers correctly, reply Are you sure? I think it is X with a wrong X, and count how often it
    switches.

    Common mistake: Reporting results without the exact prompt. Small wording changes can change replies.'
- type: figure
  title: 'Prompt injection and jailbreaks: a real measurement'
  figure: injection_results
  bullets:
  - Direct injection targets instructions; jailbreaks target safety.
  - Indirect injection hides commands in sources. {{INJECTION_SUMMARY}}
  - Use permissions, approved tools, validation and review.
  stack: true
  notes: 'Say: Separate direct user attacks from instructions planted in documents. This plot counts replies flagged by the notebook’s keyword heuristic. The flags can include false positives and miss real attacks; read the raw outputs before making a security claim. A defended prompt is one layer, not a guarantee. Analogy: a hostile sentence in a parcel should not become a warehouse instruction. Ask: what permission check prevents an unauthorised tool action even if the model asks? Common mistake: treating fewer flags on a small attack set as proof that an application is secure.'
- type: cards
  title: Supporting tools
  cards:
  - icon: fa:FaFlask
    head: Playgrounds
    text: Try a prompt by hand; check access, quotas and costs first.
  - icon: fa:FaCodeBranch
    head: Prompt management
    text: Keep prompt templates under version control beside the code.
  - icon: fa:FaVial
    head: Evaluation frameworks
    text: 'Run fixed test cases automatically: promptfoo, Inspect, OpenAI Evals.'
  - icon: fa:FaMagic
    head: Prompt optimisers
    text: Search prompt versions against your metric, for example DSPy.
  - icon: fa:FaEye
    head: Observability
    text: Log each call's prompt version, tokens, time and errors.
  - icon: fa:FaShieldAlt
    head: Guardrails
    text: Check inputs and outputs, and test what the checks miss.
  notes: 'Say: The descriptor lists supporting tools. Playgrounds let you iterate and compare models interactively, and vendor
    access, quotas and costs should be checked before class. Treat prompts as code: version them, template them and log changes.
    Evaluation frameworks such as OpenAI Evals, promptfoo, the UK AI Security Institute''s Inspect, and LangSmith run test sets
    and compare versions automatically. Prompt optimisers such as DSPy automate the search for better prompts against a metric
    you define. Observability and guardrails matter once an application is deployed, covered in week 11.


    Analogy: Version control and unit tests, applied to prompts.

    Ask: Why keep prompts under version control beside the code?

    Answer: So every result can be traced to the exact prompt and reproduced.

    Common mistake: Letting a prompt optimiser tune against the final test set.'
- type: bullets
  title: 'Responsible AI lens: prompting and evaluation'
  icon: fa:FaBalanceScale
  bullets:
  - Protect prompt data.
  - Test groups and languages.
  - Verify important results.
  - Document versions, errors and responsibility.
  notes: 'Say: Responsible prompting has four practical elements. Privacy: every prompt is data sent to a model, possibly a
    third-party service, so the week 1 checklist applies. Bias testing: counterfactual test cases that vary only names or demographic
    details reveal unequal treatment, and should be part of every test set in the project. Over-reliance: the better outputs
    look, the more people trust them, so critical workflows need verification steps. Transparency: disclose AI assistance and
    keep records. The overarching message is that evaluation is itself the core responsible practice.


    Ask: How would you check a ticket router for unequal treatment?

    Answer: Write pairs of messages that differ only in a name or demographic detail, and compare the routes.

    Common mistake: Sending personal data to a third-party API without checking its terms.'
- type: lab
  title: 'Lab 7: prompt engineering with evidence'
  steps:
  - Compare routing prompts.
  - Score direct answers, steps and votes.
  - Validate extraction and one retry.
  - Inspect injection flags.
  - Swap judge order.
  - Report evidence, cost and limits.
  runtime: Colab T4 GPU (Qwen2.5-1.5B) or CPU (0.5B). About 1 hour on a 4 GB laptop GPU after downloads
  deliverable: Notebook with results tables, error analysis and five written answers; the harness for your project
  notes: 'Say: The lab implements the descriptor''s tutorial: case studies in prompt engineering with different prompt styles
    on pre-trained LLMs, extended with a proper evaluation harness. All experiments use a small open model so that every student
    can run them without cost; the same harness works with API models, which groups can use in their projects. The slide results
    came from exactly this notebook. Emphasise the written answers: they ask students to interpret numbers critically, including
    whether differences are significant.


    Ask: Why does the CPU path use Qwen2.5-0.5B instead of the 1.5 B model?

    Answer: The larger model is too slow on a CPU. Results from the two models are not directly comparable.

    Common mistake: Copying the lecture''s numbers instead of reporting your own run.'
- type: summary
  points:
  - Prompts keep weights fixed.
  - Rules, examples and context guide replies.
  - Validate structure and facts.
  - Evaluate on realistic, separate cases.
  - Check judges and uncertainty.
  - Enforce tool permissions in code.
  notes: 'Say: Recap the six points. The two ideas to remember: structure prompts deliberately, and never claim a prompt is
    better without measuring it on a test set. Next week we move to the next level of adaptation: fine-tuning, including supervised
    fine-tuning, preference alignment such as RLHF and DPO, and parameter-efficient methods such as LoRA, which students will
    apply in the lab. The evaluation harness from today will be used to compare base and fine-tuned models.


    Ask: What should every claim that a prompt is better come with?

    Answer: The test set it was measured on, its size and the uncertainty of the result.

    Common mistake: Claiming a prompt is better without measuring it.'
