slides:
- type: title
  figure: cover
  notes: 'In short: This week turns prompting from guesswork into a measured design task.


    Explain: A prompt is the text a model receives for one request. Prompt engineering means designing that text deliberately.
    An evaluation harness is code that runs many examples and scores them. Prompting keeps the model weights fixed. Evidence,
    not impressions, decides whether a prompt is better.


    Example: A student-services assistant must route "Two of my exams clash on Friday" to TIMETABLE_EXAMS. One prompt may answer
    with a sentence; another may return the exact label. Only a test on many labelled messages shows which works better. A recipe
    card is an analogy; clearer steps help the cook, but someone still has to taste the dish.


    Ask: How would you know that a new prompt is better than the old one?


    Answer: Run both on the same labelled messages with fixed settings, compare accuracy, and read the errors.


    Watch out: One impressive reply is an anecdote, not evidence.'
- type: outcomes
  notes: 'In short: By the end, students can write a prompt, check its structured output, and judge it with fair evidence.


    Explain: Writing a prompt means stating rules, sources, examples, task and format. Validation checks that a reply has the
    required fields and types. A held-out set is a group of examples kept aside for one final check. Evaluation compares prompts
    using scores and error reading. These outcomes support MIMLOs 1, 4 and 5.


    Example: In the lab, four routing prompts run on 20 development messages. The best one then runs once on 20 held-out messages.
    A JSON extraction step returns six objects, each checked against a schema and against the source email. Each outcome therefore
    produces a number you can report and question.


    Ask: Which outcome needs more than a fluent reply?


    Answer: All three: a fluent reply can still carry the wrong label, wrong fields or an unfair comparison.


    Watch out: Do not confuse writing a longer prompt with writing a better one.'
  items:
  - Write and test prompts
  - Validate structured replies
  - Evaluate with held-out evidence
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: fix a bad prompt'
    minutes: 6
  - title: 1 · The paradigm shift
    minutes: 10
  - title: 2 · Anatomy of a prompt and basic techniques
    minutes: 25
  - title: 3 · Reasoning, structure and context
    minutes: 25
  - title: 4 · Evaluation methods
    minutes: 25
  - title: 5 · Limitations, security and tools
    minutes: 20
  - title: Lab preview and wrap-up
    minutes: 6
  notes: 'In short: The session moves from what a prompt is, to techniques, to evaluation, and finally to risks and tools.


    Explain: Section one explains why prompting needs no retraining. Section two dissects a prompt and compares example counts.
    Section three covers reasoning, structured output and context. Section four builds evaluation methods. Section five covers
    limits, injection and supporting tools.


    Example: Week 6 showed how a model chooses tokens with fixed weights. This week changes only the input around those weights.
    Week 8 then changes some weights through fine-tuning. A route map is an analogy; it shows the order of stops, but not how
    long each conversation will take.


    Ask: Which week changes model weights: 6, 7 or 8?


    Answer: Week 8. Weeks 6 and 7 use fixed weights; week 8 fine-tunes small adapters.


    Watch out: Evaluation is not an add-on at the end; it shapes every earlier section.'
- type: discussion
  title: Warm-up
  icon: fa:FaEdit
  prompt: 'A colleague''s prompt: ''Write about AI for the website.'' What is missing? Rewrite it in pairs.'
  points:
  - Audience and purpose?
  - Sources, length, format?
  - How to judge success?
  notes: 'In short: A vague request leaves the model to guess the audience, facts, format and success criteria.


    Explain: Audience means the intended reader. Purpose is the job the text must do. Sources are the facts the writer may use.
    Format fixes length and structure. Success criteria say how the result will be judged.


    Example: "Write about AI for the website" names none of these. A rewrite might read: for prospective MSc students, introduce
    this 12-week module in three bullets under 120 words, using only the supplied course facts. Briefing a new colleague is
    an analogy; clear instructions get better work. A colleague can ask questions; a model usually just guesses.


    Ask: Which missing element would you add first, and why?


    Answer: Usually the audience and purpose, because they decide length, tone and which facts matter.


    Watch out: Adding more words is not the goal; each added element should remove one specific guess.'
- type: section
  number: 1
  title: The paradigm shift
  question: How can instructions change a model's answer without training it again?
  icon: fa:FaExchangeAlt
  notes: 'In short: The same fixed model can perform different tasks because the prompt changes what it conditions on.


    Explain: Conditioning means the model predicts the next token given all earlier tokens. The prompt supplies those earlier
    tokens. Different prompts therefore make different continuations likely. No weight changes during this process. This is
    why one model can summarise, classify and translate.


    Example: Give the same 0.5-billion-parameter model "Translate to French: good morning" and then "Classify: my exams clash".
    The weights are identical in both calls. Only the input tokens differ, so the most likely continuation differs. A piano
    is an analogy; one instrument plays different pieces from different sheet music. Unlike sheet music, a prompt does not guarantee
    the result.


    Ask: If a prompt fixes an error today, will the model remember the fix tomorrow?


    Answer: No. The fix lives in the prompt, so every future request must include it.


    Watch out: Do not say the model learned from your prompt in the training sense.'
- type: compare
  title: Three ways to adapt a model
  columns:
  - head: Pre-training
    points:
    - Huge general text
    - Updates all weights
    - Weeks of GPU time
  - head: Fine-tuning
    points:
    - Your task examples
    - Updates some weights
    - Week 8
  - head: Prompting
    points:
    - Instructions in the input
    - Weights stay fixed
    - Today's lab
  callout: Prompt first; fine-tune persistent gaps.
  notes: 'In short: Pre-training, fine-tuning and prompting adapt a model at very different costs, and only the first two change
    weights.


    Explain: Pre-training learns general language from huge text collections. Fine-tuning continues training on task examples.
    Prompting supplies instructions and examples inside the input. Weights are the learned numbers inside the model. Prompting
    is the cheapest to try and the easiest to change.


    Example: Pre-training a model such as Qwen uses large GPU clusters and trillions of tokens. Week 8 fine-tunes a small adapter
    on 200 banking-support messages using CPU. Today''s routing prompt changes in seconds. A new employee is an analogy; education,
    job training, then a daily briefing. Unlike an employee, the model forgets the briefing after each request.


    Ask: A model keeps misusing a company term despite good prompts. What would you try next?


    Answer: Supply the definition in the context; fine-tune only if the gap persists across many examples.


    Watch out: Fine-tuning does not reliably add new facts; retrieval suits information that changes.'
- type: bullets
  title: 'In-context learning: prompts as programs'
  bullets:
  - Instructions and examples become input tokens.
  - Weights stay fixed.
  - Version and test prompts.
  notes: 'In short: In-context learning means a model follows a pattern shown in the prompt without any weight update.


    Explain: The GPT-3 paper in 2020 popularised the term in-context learning. Instructions and examples become ordinary input
    tokens. Attention lets later tokens use those examples. A prompt therefore behaves like a small program written in language.
    Like code, it needs versions and tests.


    Example: Show "eduroam fails → IT_ACCESS" and "deposit receipt → FEES_FINANCE", then ask about "exam clash". The model continues
    the pattern and often answers TIMETABLE_EXAMS. Removing examples removes their guidance, but the pretrained model may still
    give the same answer. A worked example on a whiteboard is an analogy that breaks when the board is wiped.


    Ask: Why must the examples be sent again with every request?


    Answer: They exist only in that request''s input; the weights never store them.


    Watch out: Message priority, such as system over user, is not a security boundary.'
  visual:
    type: example_strip
    items:
    - label: Examples
      text: eduroam fails → IT_ACCESS
    - label: New
      text: Exam clash → ?
- type: section
  number: 2
  title: Anatomy of a prompt and basic techniques
  question: What goes into a good prompt, and how much do examples help?
  icon: fa:FaPuzzlePiece
  notes: 'In short: This section dissects a good prompt and tests how much worked examples help.


    Explain: A prompt has parts: rules, source context, examples, task and output format. A zero-shot prompt has no examples.
    A few-shot prompt includes several worked examples. A role prompt assigns a persona such as a triage officer. Each part
    should be tested, not assumed.


    Example: The routing task uses five team labels. A zero-shot prompt lists the labels and the message. A few-shot prompt
    adds one example per label, which costs extra input tokens on every call. The lab measures whether those tokens buy accuracy.
    A recipe is an analogy; ingredients help, but only tasting proves the dish.


    Ask: Predict: will five examples always beat zero examples?


    Answer: Not always. Examples usually fix the format, but they can also bias labels; the lab measures it.


    Watch out: Do not add every technique at once, or you cannot tell which one helped.'
- type: figure
  title: Anatomy of a well-structured prompt
  figure: anatomy
  notes: 'In short: A well-structured prompt reads like a task brief with five labelled parts.


    Explain: Rules set the task boundaries and what to do when unsure. Sources supply the facts the answer may use. Examples
    show input–answer pairs in the target format. The task names the job, audience and constraints. The format fixes fields
    and length so code can check them.


    Example: For the routing assistant, the rule is "answer with exactly one label". The source is the student''s message. Five
    examples show one message per team. The task says "classify this message", and the format is "the label only". A contractor''s
    job brief is an analogy, although a contractor can query unclear parts and a model rarely does.


    Ask: Which part lets code check the reply automatically?


    Answer: The output format, because a fixed shape such as one label can be parsed and scored.


    Watch out: The best order of parts is an empirical question; test it rather than copying a template.'
- type: table
  title: 'Worked example: rewriting the warm-up prompt'
  header:
  - Element
  - Before
  - After
  rows:
  - - Rules
    - None
    - Use supplied facts
  - - Audience
    - None
    - AI beginners
  - - Facts
    - None
    - 12 weeks; Python; 60% project
  - - Task
    - Write about AI
    - Introduce the module
  - - Format
    - None
    - Headline; three bullets; <120 words
  - - Check
    - None
    - Claims and length
  notes: 'In short: Rewriting the warm-up prompt shows how each added element removes one guess.


    Explain: The original prompt had only a vague task. The rewrite adds rules, audience, facts, task, format and a check. Supplied
    facts mean the model need not invent them. The format limits length and structure. The check says how a reviewer will judge
    the result.


    Example: "Write about AI" becomes: using only the supplied facts, introduce the 12-week module to AI beginners as a headline
    and three bullets under 120 words. The facts are 12 weeks, Python labs and a group project worth 60%. A reviewer then checks
    every claim against those facts and counts the words.


    Ask: Which added line most reduces the risk of invented facts?


    Answer: "Use only the supplied facts", combined with checking each claim against them afterwards.


    Watch out: A detailed prompt can still produce errors, so keep the final check.'
- type: table
  title: Messages and roles in chat APIs
  header:
  - Role
  - Use
  - Example
  rows:
  - - system / developer
    - App rules
    - Reply with one label.
  - - user
    - Request
    - My exam timetable clashes.
  - - assistant
    - Replies
    - TIMETABLE_EXAMS
  - - tool
    - Code results
    - Timetable row
  callout: Enforce permissions in code.
  notes: 'In short: Chat APIs split a request into messages with roles, and each role has a typical job.


    Explain: A message is one turn with a role and content. The system or developer message carries application rules. The user
    message carries the request. Assistant messages hold model replies, including example answers. Tool messages return results
    from code, such as a database lookup.


    Example: For routing, the system message says "Reply with one team label". The user sends "My exam timetable clashes". A
    few-shot prompt can include earlier assistant turns answering TIMETABLE_EXAMS. A tool message might return the student''s
    timetable row. Stage directions in a play are an analogy, but actors cannot be tricked by lines inside the script.


    Ask: Does putting a rule in the system message guarantee it is followed?


    Answer: No. It usually gets priority, but behaviour varies by model; enforce real permissions in code.


    Watch out: Role names and support differ between providers, so check the documentation of the API you use.'
- type: compare
  title: Zero-shot, one-shot, few-shot
  columns:
  - head: Zero-shot
    points:
    - Instruction only
    - Shortest input
    - No format example
  - head: One-shot
    points:
    - One example pair
    - Shows the format
    - Can bias labels
  - head: Few-shot
    points:
    - One example per label
    - Order matters
    - More input tokens
  notes: 'In short: Zero-, one- and few-shot prompts differ only in how many worked examples they include.


    Explain: Zero-shot gives the instruction alone. One-shot adds one input–answer pair. Few-shot adds several pairs, often
    one per label. Examples mainly teach the output format and the boundaries between labels. Their choice and order can change
    results.


    Example: Your CPU core with {{W07_CORE_MODEL}} measured {{W07_CORE_DEV}} on {{W07_CORE_DEV_N}} development messages. Read
    the zero-shot errors table: a small model can collapse onto one favourite label. Showing one solved exercise before an exam
    is an analogy; students may copy its shape too closely.


    Ask: Why might a single example hurt accuracy?


    Answer: It can bias the model towards that example''s label or wording instead of the task rule.


    Watch out: Choose examples that differ from your test messages, or the score measures copying.'
- type: code
  title: A few-shot prompt as chat messages
  code: "messages = [\n  {\"role\": \"system\", \"content\": TASK},\n  {\"role\": \"user\", \"content\":\n    \"Message: eduroam\
    \ fails.\\nCategory: IT_ACCESS\\n\\n\"\n    \"Message: Deposit receipt?\\nCategory: FEES_FINANCE\\n\\n\"\n    \"Message:\
    \ Two exams clash.\\nCategory:\"},\n]\n"
  bullets:
  - Rules define the labels.
  - Examples show the format.
  notes: 'In short: A few-shot prompt is just a list of chat messages whose user text contains worked examples.


    Explain: TASK is a string holding the rules and allowed labels. Each example pairs a message with its category. The new
    message ends with "Category:" and no answer. The model continues the pattern by writing a label. Code then validates the
    returned text.


    Example: The prompt shows eduroam → IT_ACCESS and deposit receipt → FEES_FINANCE. The final line is "Message: Two exams
    clash. Category:". A correct continuation is TIMETABLE_EXAMS. In the lab, few_shot builds this text from the EXAMPLES list,
    and check_few_shot confirms that all five pairs appear.


    Ask: Why end the prompt with "Category:" instead of a question?


    Answer: It makes the label the most natural next tokens, which keeps replies short and parseable.


    Watch out: The examples must never be copied from the test messages.'
- type: bullets
  title: Role-based prompting and its limits
  bullets:
  - A role sets tone and priorities.
  - It adds no knowledge.
  - Measure its effect.
  notes: 'In short: A role prompt changes tone and focus, but it cannot supply knowledge the model lacks.


    Explain: A role, or persona, tells the model whom to act as. It can shift vocabulary, tone and priorities. It does not add
    facts or skills to the weights. Its effect on accuracy is often small or inconsistent. Only a measured comparison shows
    whether it helps.


    Example: The lab adds "You are an experienced student-services triage officer" to the few-shot prompt. In the stored GPU
    run, role + few-shot did not beat few-shot alone: {{FEWSHOT_SUMMARY}} A costume is an analogy; it changes appearance, not
    ability.


    Ask: When is a role prompt most likely to help?


    Answer: When the task needs a particular tone or audience, such as a supportive reply to a worried student.


    Watch out: Phrases such as "world-class expert" do not make answers more correct.'
  visual:
    type: example_strip
    items:
    - label: Plain
      text: Classify this message.
    - label: Role
      text: You are a triage officer. Classify…
- type: cards
  title: Principles from the official prompting guides
  cards:
  - head: Be specific
    text: Task, audience, format
  - head: Give context
    text: Mark source boundaries
  - head: Show examples
    text: Include a boundary case
  - head: Break tasks down
    text: Check each step
  - head: Allow uncertainty
    text: Permit 'not in source'
  - head: Test
    text: Same questions, fixed settings
  notes: 'In short: The official guides from OpenAI, Google and Anthropic agree on six practical principles.


    Explain: Be specific about task, audience and format. Give context and mark where each source starts and ends. Show varied
    examples, including a hard boundary case. Break long tasks into checked steps. Allow the model to say the answer is not
    in the source.


    Example: A vague request is "Summarise this policy". A specific one is "Summarise the attached refund policy for first-year
    students in three bullets; if a detail is missing, write ''not in the policy''". The second gives a reader, a length, a
    source and an uncertainty rule. Each element can then be checked in the output.


    Ask: Which principle protects most directly against invented answers?


    Answer: Allowing uncertainty, together with supplying the source and checking claims against it.


    Watch out: Guides give good starting points; your own test set decides what works for your task.'
- type: figure
  title: 'Real results: does few-shot prompting help?'
  figure: fewshot_results
  bullets:
  - '{{FEWSHOT_SUMMARY}}'
  - 'Stored GPU run: {{MODEL}}, temperature 0.'
  - One answer = 2.5 points.
  stack: true
  notes: 'In short: The stored GPU run shows modest, uneven differences between four prompts on 40 messages.


    Explain: The chart shows accuracy for four prompts on the same 40 labelled messages. A confidence interval is a range of
    plausible true accuracies. The error bars are Wilson 95% intervals. Separate accuracy intervals do not determine whether
    paired differences are significant. Your CPU lab uses a smaller model and 20 development messages.


    Example: {{FEWSHOT_NOTES}} With 40 messages, one changed answer moves accuracy by 2.5 percentage points. Your CPU core measured
    {{W07_CORE_DEV}} with {{W07_CORE_MODEL}}.


    Ask: Would you ship the best prompt based on this chart alone?


    Answer: Not yet. Compare paired disagreements, confirm on held-out messages and read the errors first.


    Watch out: Model size matters: the same prompts behave differently on 0.5B and 1.5B models.'
- type: quiz
  question: Zero-shot replies are sentences, not labels. Best first fix?
  options:
  - Add an expert persona
  - Show examples and allowed labels
  - Raise the temperature
  - Fine-tune on labelled messages
  answer: 1
  notes: 'In short: When replies have the wrong format, show the format before trying anything heavier.


    Explain: A format failure means the content may be right but code cannot parse it. Examples demonstrate the exact output
    shape. Listing the allowed labels removes guesswork. Temperature controls randomness, not format. Fine-tuning is slower
    and costlier than a prompt fix.


    Example: Zero-shot replies such as "This message seems to be about IT access" fail an exact-label parser. Adding five examples
    ending in "Category: IT_ACCESS" usually produces short labels. The lab''s label_scorer then counts them as valid. A persona
    alone rarely changes the reply length.


    Ask: Which option is the most effective first fix?


    Answer: B. Show examples in the exact format and list the allowed labels, then measure again.


    Watch out: A parser that accepts long sentences can hide format failures; count invalid replies separately.'
- type: section
  number: 3
  title: Reasoning, structure and context
  question: How do we handle several steps, return data for code, and supply the right facts?
  icon: fa:FaBrain
  notes: 'In short: This section covers multi-step reasoning, outputs that code can trust, and choosing what goes into the context.


    Explain: Chain-of-thought asks for intermediate steps before an answer. Self-consistency samples several answers and votes.
    Structured output returns fields that code can validate. Context engineering selects what the model sees within a token
    budget. Each technique has a measurable cost.


    Example: A word problem asks how many laptops 28 students need in teams of four, with two laptops per team. A direct answer
    may guess; a step-by-step reply computes 7 teams × 2 = 14. The step-by-step reply costs many more output tokens. Showing
    working in a maths class is an analogy, though written steps may not reflect the model''s computation.


    Ask: Predict: will asking for steps always improve accuracy?


    Answer: No. It often helps multi-step problems, but it costs tokens and can still end with a wrong answer.


    Watch out: Longer outputs mean more time and cost; measure both alongside accuracy.'
- type: bullets
  title: Chain-of-thought (CoT) prompting
  bullets:
  - Ask for steps, then a final answer.
  - Helps some multi-step tasks.
  - Costs tokens; check the answer.
  notes: 'In short: Chain-of-thought prompting asks the model to write intermediate steps before its final answer.


    Explain: A step is a short written calculation or inference. Written steps give later tokens more context to build on. The
    final answer should appear on a marked last line. Parsing that line gives a number to score. Extra steps cost output tokens
    and time.


    Example: For 28 students in teams of 4, each team with 2 laptops, the steps are 28 ÷ 4 = 7 teams and 7 × 2 = 14 laptops.
    The reply ends with a marked final-answer line giving 14. If the token cap cuts the reply before that line, the last number
    may be an intermediate value such as 7.


    Ask: Why request a marked final-answer line at the end?


    Answer: It gives code a reliable place to find the final answer, separate from the working.


    Watch out: Plausible steps can still lead to a wrong answer, and correct answers can follow flawed steps.'
  visual:
    type: example_strip
    items:
    - label: Problem
      text: 28 students, teams of 4, 2 laptops each
    - label: Steps
      text: 28 ÷ 4 = 7 teams; 7 × 2 = 14
- type: figure
  title: 'Real results: direct vs. chain-of-thought vs. self-consistency'
  figure: cot_results
  bullets:
  - '{{COT_SUMMARY}}'
  - Voting samples several replies.
  - More calls cost more; agreement can be wrong.
  stack: true
  notes: 'In short: In the stored GPU run, step-by-step answers and voting raised accuracy but multiplied output tokens.


    Explain: Direct answers return only a number. Chain-of-thought adds written steps. Self-consistency samples several step-by-step
    answers at temperature 0.7 and keeps the most common number. Temperature above zero makes replies vary. Cost grows with
    every extra sample.


    Example: {{COT_NOTES}} The stored run used 16 problems, so one problem is 6.25 percentage points. Your CPU core measured
    {{W07_CORE_COT}}.


    Ask: Is a five-sample vote worth about five times the tokens of one step-by-step answer?


    Answer: It depends on the cost of an error; measure the gain on your own task first.


    Watch out: Agreement is not proof; several samples can agree on the same wrong number.'
- type: bullets
  title: Prompting reasoning models
  bullets:
  - State goal, constraints and format.
  - Use supported effort settings.
  - Measure correctness, time and cost.
  notes: 'In short: Reasoning models already spend tokens thinking, so prompts should state goals rather than script steps.


    Explain: A reasoning model is trained to generate internal reasoning before answering. Providers expose settings such as
    reasoning effort or a thinking budget. Asking for step-by-step text is often unnecessary. State the goal, constraints, evidence
    and final format instead. Thinking tokens still cost time and money.


    Example: Week 6 compared Qwen3-0.6B with thinking off and on. On an easy word problem both modes were correct, but thinking
    used several times more tokens. On a harder puzzle, thinking ran out of its token budget in every run. More thinking is
    a cost to justify, not a free improvement.


    Ask: What should you measure before switching a task to a reasoning model?


    Answer: Final-answer accuracy, completion rate, tokens and elapsed time on representative examples.


    Watch out: A visible reasoning trace is not guaranteed to show how the answer was produced.'
  visual:
    type: mini_table
    header:
    - Prompt part
    - Reasoning model
    rows:
    - - Show steps
      - Often unnecessary
    - - Effort
      - A setting, not words
    - - Check
      - The final answer
- type: flow
  title: 'Prompt chaining: decompose complex tasks'
  steps:
  - label: Extract
    sub: Source facts
    role: tool
  - label: Verify
    sub: Against source
    role: metric
  - label: Draft
    sub: Checked facts
    role: model
  - label: Critique
    sub: Checklist
    role: metric
  - label: Finalise
    sub: Repair, format
    role: output
  bullets:
  - Validate each step's output.
  notes: 'In short: Prompt chaining splits a complex task into smaller prompts and passes each checked output to the next.


    Explain: A chain is a sequence of model calls. Each call has one narrow job. Code can check the output between calls. Errors
    are easier to find because each step is visible. Chains cost more calls and time than one prompt.


    Example: For an invoice question, step one extracts line items as JSON. Step two checks each item against the document.
    Code, not the model, adds the totals. A final prompt explains the result to the customer. An assembly line with inspection
    stations is an analogy; unlike a factory, every station here can invent a new kind of error.


    Ask: Why let code add the invoice totals instead of the model?


    Answer: Arithmetic in code is exact and testable; the model can make silent calculation errors.


    Watch out: A chain without checks between steps just passes errors along faster.'
  arrows:
  - facts
  - checked facts
  - draft
  - issues
- type: code
  title: 'Structured outputs: a schema as a contract'
  code: "class Request(BaseModel):\n    name: str\n    student_id: str = Field(pattern=r\"^\\d{8}$\")\n    request: Literal[\"\
    extension\", \"invoice\", \"deferral\"]\n    date: str | None = None\n\n\n# Lab helper validates both attempts\nreq, retries\
    \ = parse_with_retry(messages)\n"
  bullets:
  - Schema checks shape.
  - Compare facts separately.
  notes: 'In short: A schema turns "return JSON" into a contract that code can check before using the reply.


    Explain: Pydantic is a Python library for data validation. A BaseModel class lists fields and their types. Literal restricts
    a field to listed values. A pattern such as eight digits constrains text. ValidationError reports which rule failed.


    Example: A reply with "student_id": "2314567" fails because the ID has seven digits. The error goes back to the model once,
    and the retry is validated again. Two failures return None instead of a guess. In the stored GPU run, {{EXTRACTION_NOTES}}
    Your CPU core measured {{W07_CORE_EXTRACT}}.


    Ask: Does a provider''s structured-output mode remove the need for validation?


    Answer: It enforces the shape, but you must still check the values against the source.


    Watch out: Never let a second failure pass silently into downstream code.'
- type: figure
  title: 'Context engineering: what the model sees matters most'
  figure: context_eng
  stack: true
  notes: 'In short: Context engineering decides which information enters the model''s limited context window, and in what order.


    Explain: The context window is the maximum number of tokens one request can hold. Candidates include instructions, the question,
    documents, history and tool results. Selection keeps the most relevant items. Compression shortens them, for example by
    summarising old turns. Ordering places key material where the model uses it best.


    Example: A policy question might have ten candidate documents but room for three. Choosing the three most relevant passages
    leaves space for the answer. Including all ten can push out recent history or distract the model. Packing a suitcase under
    a weight limit is an analogy, but irrelevant text can actively mislead.


    Ask: Why reserve part of the budget for the answer?


    Answer: Output tokens share the same limit, so a full context can cut the reply short.


    Watch out: A larger context window does not guarantee the model uses every part reliably.'
- type: cards
  title: Prompting for different tasks
  cards:
  - head: Summarise
    text: Reader, length, source only
  - head: Extract
    text: Fields; null if missing
  - head: Classify
    text: Define each label
  - head: Code
    text: State versions; run tests
  - head: Images
    text: Subject, style, composition
  - head: Analyse data
    text: Ask for computing code
  notes: 'In short: Each task type needs a different prompt emphasis and a different check.


    Explain: Summaries need a reader, a length and a rule to use only the source. Extraction needs named fields and null for
    missing values. Classification needs a one-line definition per label. Code needs inputs, outputs and versions, then real
    tests. Data analysis should ask for code that computes the numbers.


    Example: For an image model, "a lighthouse at dusk, watercolour, wide view" names the subject, style and composition. For
    a spreadsheet question, "write pandas code that computes the mean fee per programme" lets you run and check the result.
    The checks differ: a visual review in one case and an executed test in the other.


    Ask: Why ask for code instead of the number itself in data analysis?


    Answer: Code can be run, inspected and repeated; a number typed by the model may be invented.


    Watch out: One prompt template rarely fits every task; match the check to the task.'
- type: section
  number: 4
  title: Evaluation methods
  question: How do you know a prompt, or a model, is actually better?
  icon: fa:FaClipboardCheck
  notes: 'In short: Evaluation turns "this prompt seems better" into a measured, repeatable claim.


    Explain: A test set is a collection of inputs with known answers or a rubric. A metric turns each output into a score. A
    rubric is a written scoring guide for open-ended answers. Human review checks what metrics miss. Statistics show whether
    a difference could be chance.


    Example: Two prompts score 80% and 85% on 20 messages: a gap of one message. On 200 messages, the same five-point gap would
    be ten messages and far more convincing. A critic tasting one dish versus a whole menu is an analogy, though a whole menu
    can still be unrepresentative.


    Ask: Predict: how many test messages would you want before trusting a five-point gain?


    Answer: Usually hundreds, or a paired comparison on the same items, plus a held-out check.


    Watch out: A test set that resembles your prompt examples will overstate performance.'
- type: flow
  title: The evaluation loop (eval-driven development)
  steps:
  - label: Define success
    sub: Criteria
    role: tool
  - label: Build test set
    sub: Hold some out
    role: data
  - label: Run
    sub: Fixed settings
    role: model
  - label: Score
    sub: Metrics, rubric
    role: metric
  - label: Analyse errors
    sub: Next change
    role: output
  callout: Develop on one set; finish on fresh examples.
  notes: 'In short: Eval-driven development writes the test before revising the prompt, just as tests guide software changes.


    Explain: Success criteria say what a good output must do. The test set holds realistic inputs, with some kept aside. Each
    run uses fixed settings and logs every reply. Scoring applies metrics, rubrics or people. Error analysis reads failures
    and suggests the next single change.


    Example: For routing, success is "exactly one correct label". The lab''s 40 synthetic tickets split into 20 and 20. Each
    run logs replies and output tokens. Scoring counts correct and invalid labels. Reading errors may show that "extra exam
    time for dyslexia" sits between two teams, which is a labelling problem rather than a prompt problem.


    Ask: Why log every reply rather than only the accuracy?


    Answer: Replies explain failures and allow rescoring if the scorer changes.


    Watch out: Changing several prompt parts at once hides which change caused the effect.'
  arrows:
  - criteria
  - examples
  - replies
  - scores
- type: table
  title: Families of evaluation methods
  header:
  - Method
  - Checks
  - Limit
  rows:
  - - Exact match
    - Matches reference
    - Open answers
  - - BLEU / ROUGE
    - Word overlap
    - Paraphrases
  - - Embeddings
    - Similar meaning
    - Not truth
  - - Code checks
    - Schema; tests
    - Coded rules only
  - - LLM judge
    - Rubric score
    - Judge bias
  - - Human review
    - Useful; correct
    - Cost; disagreement
  notes: 'In short: Different evaluation methods check different things, so most applications combine several.


    Explain: Exact match compares an output with a reference answer. BLEU and ROUGE count overlapping words or word sequences.
    Embedding similarity compares meaning as vectors. Code checks apply rules such as schemas and unit tests. LLM judges and
    people score against a rubric.


    Example: Routing uses exact match on labels. Extraction uses a schema check plus field comparison. A summary might use ROUGE
    against a reference, an LLM judge for faithfulness, and two people on a sample of 30. A medical check-up is an analogy;
    several tests, each blind to some conditions.


    Ask: Which method would you use for "Is this email reply polite and correct?"


    Answer: A rubric scored by people, possibly assisted by a calibrated LLM judge.


    Watch out: A high overlap score can reward copying the reference wording rather than being correct.'
- type: equation
  title: 'A reference-based metric by hand: ROUGE-1'
  eq:
  - \mathrm{Recall} = \frac{\#\,\mathrm{overlapping\;words}}{\#\,\mathrm{words\;in\;reference}}, \qquad \mathrm{Precision} = \frac{\#\,\mathrm{overlapping\;words}}{\#\,\mathrm{words\;in\;output}}
  - F_1 = \frac{2 \cdot \mathrm{Precision} \cdot \mathrm{Recall}}{\mathrm{Precision} + \mathrm{Recall}}
  read_as:
  - 'Reference (8 words): the exam results are published in four weeks.'
  - 'Output (6 words): results are published after four weeks.'
  - 'Overlap 5: recall 5/8, precision 5/6, F1 ≈ 0.71.'
  terms:
  - - ROUGE-1
    - single-word overlap
  - - F1
    - balances both
  notes: 'In short: ROUGE-1 measures how many single words an output shares with a reference answer.


    Explain: Recall is overlapping words divided by reference words. Precision is overlapping words divided by output words.
    F1 is their harmonic mean, which is high only when both are high. ROUGE is common for summaries. BLEU counts longer word
    sequences and is common for translation.


    Example: The reference has 8 words and the output has 6. Five words overlap: results, are, published, four and weeks. Recall
    is 5/8 = 0.625 and precision is 5/6 ≈ 0.83. F1 = 2 × 0.83 × 0.625 ÷ (0.83 + 0.625) ≈ 0.71.


    Ask: Would "results are not published after four weeks" score well?


    Answer: Yes: recall stays 5/8, yet the meaning is reversed, because overlap ignores negation.


    Watch out: Word overlap rewards surface similarity, not factual correctness.'
- type: bullets
  title: LLM-as-a-judge
  bullets:
  - Judge with a written rubric.
  - Swap the answer order.
  - Calibrate with human labels.
  notes: 'In short: An LLM judge scores outputs against a rubric, but its own biases must be measured.


    Explain: A judge prompt shows a question, answers and a rubric, then asks for a verdict. Position bias prefers the first
    or second slot. Verbosity bias prefers longer answers. Self-preference favours outputs from the same model family. Calibration
    compares judge verdicts with human labels.


    Example: Zheng et al. (2023) reported over 80% agreement between strong judges such as GPT-4 and human preferences on MT-Bench.
    {{JUDGE_NOTES}} Your CPU core''s {{W07_CORE_MODEL}} judge was {{W07_CORE_JUDGE}}.


    Ask: A judge picks A, then picks A again after swapping. What does that show?


    Answer: Position bias for that pair: the verdict followed the slot, not the answer.


    Watch out: An unparsable verdict is missing evidence, not a vote for either answer.'
  visual:
    type: mini_table
    header:
    - Bias
    - Check
    rows:
    - - Position
      - Swap A and B
    - - Length
      - Control length
    - - Self-preference
      - Different judge
- type: table
  title: A rubric for human (or LLM) evaluation of summaries
  header:
  - Criterion
  - '1'
  - '3'
  - '5'
  rows:
  - - Faithful
    - Unsupported claims
    - Minor gap
    - All supported
  - - Coverage
    - Key omissions
    - Most points
    - All points
  - - Clarity
    - Hard to follow
    - Clear
    - Audience-ready
  - - Format
    - Ignored
    - Minor slips
    - Exact
  callout: Two raters score a sample.
  notes: 'In short: A rubric splits the vague question of summary quality into separate, scorable criteria with anchored levels.


    Explain: A criterion is one quality to judge, such as faithfulness. Faithfulness means every claim is supported by the source.
    Coverage means the key points are present. Anchors describe what scores of 1, 3 and 5 look like. Agreement between two raters
    shows whether the rubric is clear.


    Example: A summary of the fees policy omits the hardship fund but invents nothing. It scores 5 on faithfulness and 3 on
    coverage. If two raters give 3 and 5 for coverage, discuss the anchor wording and rescore. Exam marking schemes are the
    analogy; they also need moderation.


    Ask: Why score criteria separately instead of giving one overall mark?


    Answer: Separate scores show which quality failed, so the next prompt revision has a clear target.


    Watch out: An LLM judge using this rubric still needs calibration against human scores.'
- type: bullets
  title: 'Statistics: don''t fool yourself with small test sets'
  bullets:
  - '20 items: one answer = 5 points.'
  - Compare prompts on the same items.
  - Keep a final test separate.
  notes: 'In short: Small test sets make accuracy uncertain, so report intervals and compare prompts on the same items.


    Explain: A confidence interval gives a range of plausible true accuracies. Its width shrinks roughly with the square root
    of the test-set size. A paired comparison scores both prompts on identical items. Then only the items that change between
    prompts matter. A final test set stays untouched until the end.


    Example: At 80% on 40 items, the Wilson 95% interval is about 65% to 89%. At 80% on 400 items, it narrows to about 76% to
    84%. Ten times the data gives roughly a third of the width, because √10 ≈ 3.2. A prompt that fixes 3 items and breaks 1
    has a net gain of 2.


    Ask: Prompt B beats A by one message out of 20. Should you switch?


    Answer: Not on that evidence alone; check more items, read the changes and confirm on held-out data.


    Watch out: Trying many prompt variants on one small set and keeping the best overstates its accuracy.'
  visual:
    type: example_strip
    items:
    - label: 40 items
      text: '80% correct: 95% interval ≈ 65%–89%'
    - label: 400 items
      text: '80% correct: 95% interval ≈ 76%–84%'
- type: section
  number: 5
  title: Limitations, security and tools
  question: What can still go wrong, and what tools help?
  icon: fa:FaShieldAlt
  notes: 'In short: The last section covers what prompting cannot fix, how prompts are attacked, and which tools help.


    Explain: Hallucination means fluent but unsupported output. Prompt sensitivity means small wording changes alter answers.
    Prompt injection hides instructions inside content the model reads. A jailbreak tries to bypass safety rules. Tools help
    version, test and monitor prompts.


    Example: A summariser reads a web page containing "Ignore all previous instructions". A naive prompt may obey it. A defended
    prompt marks the page as untrusted data, which helps but does not guarantee safety. A bank teller handling a forged note
    is an analogy; training helps, but the bank still needs vault controls.


    Ask: Predict: can a carefully written system prompt fully stop injection?


    Answer: No. Instructions and data share one context; real protection needs permissions and checks in code.


    Watch out: Do not test security only with attacks you wrote yourself; include varied phrasings.'
- type: cards
  title: Limitations that prompting cannot remove
  cards:
  - head: Hallucination
    text: Plausible invented reference
  - head: Sensitivity
    text: Example order changes label
  - head: Cut-off
    text: Unaware of this year's fees
  - head: Sycophancy
    text: Drops correct answer when doubted
  - head: Bias
    text: Name change alters reply
  - head: Non-determinism
    text: Service updates change replies
  notes: 'In short: Some failures come from the model itself and need checks, data or design, not better wording.


    Explain: A knowledge cut-off is the date after which training data stops. Sycophancy means agreeing with the user against
    the evidence. Prompt sensitivity means small changes alter answers. Non-determinism means replies can vary between runs
    or service versions. Bias means outputs differ unfairly between groups.


    Example: Ask "Are you sure?" after a correct answer; some models switch to a wrong one. Swap only the student''s name in
    a message and compare the replies to test for bias. Ask about this year''s fees and a model may confidently give older figures.
    Each needs a test, not a stronger instruction.


    Ask: Which limitation does retrieval address most directly?


    Answer: The knowledge cut-off, by supplying current sources; it does not remove hallucination entirely.


    Watch out: Temperature 0 reduces sampling variation but does not guarantee identical replies from a hosted service.'
- type: figure
  title: 'Prompt injection and jailbreaks: a real measurement'
  figure: injection_results
  bullets:
  - Injection hides commands in content.
  - '{{INJECTION_SUMMARY}}'
  - Enforce permissions and review in code.
  stack: true
  notes: 'In short: A defended prompt can reduce keyword-flagged injection replies, but it does not remove the risk.


    Explain: Direct injection is typed by the user. Indirect injection hides instructions inside documents the model reads.
    The lab''s detector flags keywords such as HACKED or pirate. A keyword flag is a rough heuristic, not proof.


    Example: Three of six documents contain attacks. The defended prompt marks document text as untrusted and wraps it in tags.
    In the stored GPU run, {{INJECTION_NOTES}} Your CPU core flagged {{W07_CORE_INJECT}}.


    Ask: A reply says "The document contains a poem about pirates". Is that a successful attack?


    Answer: No. It describes the attack instead of obeying it, yet the keyword detector flags it; read every reply.


    Watch out: For systems with tools, use least privilege, allow-lists, validation and human approval.'
- type: cards
  title: Supporting tools
  cards:
  - head: Playgrounds
    text: Try prompts by hand
  - head: Version control
    text: Prompts beside code
  - head: Eval frameworks
    text: promptfoo, Inspect, OpenAI Evals
  - head: Optimisers
    text: Search prompts, e.g. DSPy
  - head: Observability
    text: Log versions, tokens, errors
  - head: Guardrails
    text: Check inputs and outputs
  notes: 'In short: Tools make prompt work repeatable: versioned, tested, monitored and guarded.


    Explain: A playground is a web page for trying prompts by hand. Version control stores prompt templates beside the code
    that uses them. Evaluation frameworks run fixed test cases automatically. Prompt optimisers search prompt variants against
    a metric. Observability logs each call''s prompt version, tokens, time and errors.


    Example: A team stores its routing prompt in Git. Every change runs promptfoo on 200 labelled tickets, and the merge is
    blocked if accuracy drops. Logs show that average output tokens rose after one edit. Unit tests in software are the analogy;
    prompt tests are noisier, so thresholds need margins.


    Ask: What should be logged for every production model call?


    Answer: The prompt version, model and settings, tokens, latency, errors and, where permitted, the input and output.


    Watch out: Guardrails are code too; measure what they miss and what they block wrongly.'
- type: bullets
  title: 'Responsible AI lens: prompting and evaluation'
  bullets:
  - Protect personal data in prompts.
  - Test groups and languages.
  - Document versions and responsibility.
  notes: 'In short: Responsible prompting protects data, tests fairness, and keeps people accountable for decisions.


    Explain: Prompts are data, so personal information needs a lawful basis and care. Counterfactual tests change one attribute,
    such as a name, and compare outputs. Over-reliance means trusting outputs without checking. Documentation records prompt
    versions, tests and known failures. A named person stays responsible for decisions.


    Example: Before sending student emails to a hosted API, replace names and IDs with invented ones, as the lab does. Then
    test whether "Aoife" and "Rahul" receive the same routing for identical problems. Log which prompt version produced each
    decision. GDPR also gives people rights to information about significant automated decisions.


    Ask: Why use invented examples when testing hosted models?


    Answer: They avoid sending personal data to a third party while still exercising the task.


    Watch out: Removing names alone may not anonymise a message; rare circumstances can still identify someone.'
  visual:
    type: mini_table
    header:
    - Risk
    - Check
    rows:
    - - Privacy
      - Invented or approved data
    - - Bias
      - Swap names, dialects
    - - Over-reliance
      - Human review
- type: lab
  title: 'Lab 7: prompt engineering with evidence'
  steps:
  - Compare routing prompts.
  - Check held-out messages.
  - Score steps and votes.
  - Validate JSON.
  - Read injection replies.
  - Swap judge order.
  runtime: CPU core took {{W07_CORE_TIME}}. Stretch optional.
  deliverable: Evidence table, errors, five answers
  notes: 'In short: The lab builds one evaluation harness and uses it for five prompt experiments, all on a CPU.


    Explain: The core uses {{W07_CORE_MODEL}} with short, capped replies. Part 1 compares four routing prompts, then checks
    the best on held-out messages. Part 2 compares direct, step-by-step and voted answers. Parts 3–5 cover JSON extraction,
    injection and a judge. Each TODO has a check that prints ✅.


    Example: On the course laptop with {{W07_CORE_THREADS}} CPU threads, the whole core took {{W07_CORE_TIME}} once the model
    was downloaded. The chosen prompt, {{W07_CORE_HELD_PROMPT}}, scored {{W07_CORE_HELD}} on held-out messages. The lecture''s
    stored results came from a larger 1.5B model on a GPU, so numbers differ.


    Ask: Which number from the lab is the fairest estimate of routing accuracy?


    Answer: The held-out accuracy of the prompt chosen on the development messages.


    Watch out: Keep both API switches False for the core; hosted judging is optional and uses invented pairs only.'
- type: summary
  points:
  - Prompts keep weights fixed.
  - Briefs state rules, examples, format.
  - Schemas check shape, not truth.
  - Choose on dev; report held-out.
  - Check judges and small samples.
  - Enforce tool permissions in code.
  notes: 'In short: Prompting is design plus measurement: write a clear brief, check outputs, and evaluate fairly.


    Explain: Prompts change inputs while weights stay fixed. A brief states rules, sources, examples, task and format. Schemas
    and validators check structure, not truth. Development and held-out sets separate choosing from reporting. Security depends
    on permissions in code, not on prompt wording.


    Example: In the lab, a prompt chosen on 20 development messages is reported once on 20 held-out messages. A JSON reply that
    passes the schema is still compared with the email. A judge verdict counts only when it survives swapping the answers.


    Ask: What is the single most important habit from this week?


    Answer: Compare prompts on the same labelled examples with fixed settings, and read the errors.


    Watch out: Do not carry a prompt to a new model without re-running the evaluation.'
