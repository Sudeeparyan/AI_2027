  notes: 'In short: Use the official guides for current practice and the papers for the evidence behind each technique.


    Explain: Provider guides describe recommended prompt structure for their models. The Anthropic tutorial offers interactive
    notebooks. Context-engineering articles extend prompting to agents and tools. Evaluation guides explain how to build test
    sets. Papers such as Wei et al. (2022) report the original experiments.


    Example: Start with the Google or OpenAI prompting guide and rewrite the warm-up prompt using its checklist. Then read the
    evaluation best-practices guide and design 30 test cases for your project. Finally, skim the chain-of-thought paper''s results
    tables to see which tasks improved.


    Ask: Why prefer an official guide over a viral list of prompt tricks?


    Answer: Official guides are maintained for current models and explain their advice; viral tricks may be outdated or untested.


    Watch out: Guides change as models change, so note the date you read them.'
