  notes: 'Say: The three vendor guides from OpenAI, Google and Anthropic are the most authoritative, current references for
    prompting; students should read at least one in full. Anthropic''s interactive tutorial is a hands-on course in notebooks.
    The context engineering article extends prompting to agents. OpenAI''s evaluation guide describes the evaluation loop we
    used. The chain-of-thought and LLM-as-a-judge papers are the key research references. Ozdemir''s Quick Start Guide, from
    the descriptor reading list, also has good chapters on prompting. All links were last checked on 9 October 2026.


    Ask: Which guide would you read in full first?

    Answer: The guide for the model provider you plan to use in your project.

    Common mistake: Copying prompt tricks without testing them on your own task.'
