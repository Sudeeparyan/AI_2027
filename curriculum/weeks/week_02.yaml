  notes: 'In short: Use the original derivation, a runnable implementation and a teaching video to connect the VAE''s mathematics
    and behaviour.


    Explain: The original VAE paper explains approximate inference and Gaussian reparameterisation. The PyTorch example links
    those ideas to a concrete training loop. The MIT video provides a spoken explanation with visual demonstrations. Diffusers
    documents VAE-style encoding and decoding inside image-generation systems. These resources use different model settings,
    frameworks and levels of detail.


    Example: Trace one line in the PyTorch loss back to our Gaussian KL equation. Then identify its reduction over latent dimensions
    and images. Comparing resources resembles comparing annotated maps of one region; notation and emphasis differ, so translate
    symbols rather than copying code without understanding.


    Ask: Which resource is the best starting point for checking the equation-to-code connection?


    Answer: The PyTorch VAE implementation is a direct starting point, supported by the original paper for the mathematical
    argument.


    Watch out: A tutorial''s runtime, tensor shape or default setting does not automatically apply to this notebook or every
    VAE.'
