objectives:
- Explain reconstruction and prior sampling.
- Trace encoder, sampled code and decoder.
- Read reconstruction and KL in the ELBO.
- Use reparameterisation to train the encoder.
- Build a VAE and compare beta settings.
- Evaluate samples, anomalies and data risks.
