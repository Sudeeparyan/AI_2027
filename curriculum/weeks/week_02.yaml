subtitle: How a VAE learns short hidden codes, rebuilds images and generates new digits
mimlos:
- 1
- 3
- 4
objectives:
- Explain reconstruction and prior sampling.
- Trace encoder, sampled code and decoder.
- Read reconstruction and KL in the ELBO.
- Use reparameterisation to train the encoder.
- Build a VAE and compare beta settings.
- Evaluate samples, anomalies and data risks.
coverage:
- autoencoder
- latent space
- encoder
- decoder
- reparameterisation
- reconstruction
- KL divergence
- ELBO
- evidence lower bound
- Conditional VAE
- β-VAE
- VQ-VAE
- interpolation
- anomaly detection
- latent diffusion
- PyTorch
slides:
- type: title
  figure: cover
  notes: 'Welcome to week 2. Last week we said that every generative model learns a probability distribution and
    samples from it, and that latent variables let us generate complex data from simple hidden causes. Today we
    build the first deep generative model of the module that uses that idea directly: the variational autoencoder,
    or VAE. The image on this slide is not a drawing: it was produced by a small VAE trained on handwritten digits,
    decoding a grid of points from its two-dimensional latent space. By the end of today you will understand, and
    in the lab implement, every part of that model.

    '
- type: outcomes
  notes: 'Six outcomes today. The first two are conceptual: why plain autoencoders fail as generators and what the
    three parts of a VAE are. The third is the mathematical core, the evidence lower bound or ELBO, which students
    must be able to write down and interpret for the exam. The fourth, the reparameterisation trick, is a small
    idea with huge influence; it appears again in diffusion models. The fifth is practical: in the lab you implement
    and train a VAE in PyTorch. This week practises MIMLO 1 on concepts and maths, MIMLO 3 on implementing a model,
    and MIMLO 4 on evaluating it.

    '
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: compress a face into 32 numbers?'
    minutes: 7
  - title: 1 · From autoencoders to VAEs
    minutes: 20
  - title: 2 · The VAE model and the ELBO
    minutes: 33
  - title: '3 · Training: the reparameterisation trick'
    minutes: 17
  - title: 4 · Exploring and evaluating the latent space
    minutes: 20
  - title: 5 · Variants and applications
    minutes: 15
  - title: Lab preview and wrap-up
    minutes: 8
  notes: 'Here is the plan. Section two, the model and the ELBO, is the mathematical heart and takes the most time;
    take the break after it. Section four shows real results from VAEs trained for these slides, so students can
    see what the maths produces before they reproduce it in the lab. If you run short of time, shorten section five,
    since variants return in weeks 4 and 9: the VQ-VAE idea reappears when we discuss image and audio tokens, and
    the latent-diffusion autoencoder reappears next-but-one week.

    '
- type: discussion
  title: Warm-up
  icon: fa:FaCompressArrowsAlt
  prompt: Could you describe any face using just 32 numbers, and then redraw it from those numbers?
  points:
  - Which 32 properties would you choose? (age, hair length, smile, pose, lighting…)
  - Could you invent a **new** face by picking 32 new numbers?
  - What would go wrong if two very different faces got almost the same numbers, or if some combinations of numbers
    never appeared in your data?
  notes: 'Give two minutes in pairs. Students will propose interpretable features such as age, pose, glasses and
    smile. Point out that this is exactly what an encoder does automatically, except that a neural network chooses
    the features, and they are usually not so interpretable. The second question leads to generation: if the numbers
    are a good description, choosing new numbers should give a new face. The third question previews the key problem
    of today: if some combinations of numbers were never seen in training, the decoder has no idea what to draw
    there. VAEs encourage a known sampling region; no loss guarantees every code gives a good image.

    '
- type: section
  number: 1
  title: From autoencoders to VAEs
  question: An autoencoder can compress and rebuild images. Why can random codes fail?
  icon: fa:FaCompress
  notes: 'Section one motivates the VAE. We start with the ordinary autoencoder, which students may have seen in
    a deep learning module: a network trained to reproduce its input through a narrow bottleneck. It is great at
    compression and denoising but poor at generation. We will see, using real models trained on handwritten digits,
    exactly why, and what change turns an autoencoder into a generative model. This section takes about twenty minutes.

    '
- type: figure
  title: 'An autoencoder: squeeze, then rebuild'
  figure: ae_diagram
  notes: 'An autoencoder has two networks. The encoder maps a 784-pixel digit image to a code of perhaps two to
    thirty-two numbers; the decoder maps the code back to an image. Training minimises reconstruction error, so
    the code must keep the information needed to redraw the input. Because the bottleneck is narrow, the network
    is forced to learn structure rather than copy pixels. Autoencoders are useful for compression, removing noise,
    learning features for other tasks, and spotting unusual inputs that reconstruct badly. Ask: if the code were
    as large as the image, what would the autoencoder learn? Probably just to copy, which is useless.


    Figure discussion prompts: Encoder: pixels → short code z. Decoder: code → reconstructed pixels. Train to reduce
    reconstruction error. Random-code generation needs extra structure.

    '
- type: figure
  title: 'The problem: an autoencoder''s latent space has gaps'
  figure: latent_ae_vs_vae_slide
  caption: Real models trained on MNIST with a 2-D code. Each dot is a test image, coloured by digit.
  notes: 'These are real results. Both models have a two-dimensional code so that we can plot it. On the left, the
    plain autoencoder places each digit class somewhere in the plane, but the clusters are irregular, stretched
    and separated by empty regions, and their scale is arbitrary. On the right, the VAE''s codes are packed into
    a roughly circular region around zero, with classes touching each other. The VAE was told to keep its codes
    close to a standard Gaussian. Ask students: if you picked a random point in the left-hand plot, would you land
    on a digit? Often not.

    '
- type: figure
  title: 'Consequence: random codes decode to nonsense in an autoencoder'
  figure: samples_ae_vs_vae
  caption: The same 16 random points z ~ N(0, I) decoded by each model.
  callout: Prior codes must reach regions the decoder learned.
  notes: 'The same random codes are decoded by both models. Ask students to count recognisable digits and identify
    a poor sample. Ordinary autoencoder training does not align codes with our Gaussian sampling rule. The VAE penalty
    encourages that alignment, making more random codes useful in this experiment. It does not guarantee a perfectly
    filled space or a realistic image at every possible code. Judge the measured samples rather than promising ideal
    behaviour.

    '
- type: compare
  title: Autoencoder vs. variational autoencoder
  columns:
  - head: Autoencoder
    icon: fa:FaDotCircle
    points:
    - One exact code point per image.
    - 'Trained only to rebuild: reconstruction loss.'
    - Codes can scatter, leaving gaps between groups.
    - 'Example: a random code in a gap decodes to a smudge.'
  - head: Variational autoencoder
    icon: fa:FaBullseye
    points:
    - A small cloud of codes per image (mean and spread).
    - Rebuild loss plus a KL penalty towards N(0, I).
    - Clouds overlap, so the space has fewer gaps.
    - 'Example: draw z from N(0, I), decode, get a digit.'
  callout: KL encourages useful codes. Inspect generation failures.
  notes: 'This comparison is the one-slide summary of the section. Two changes turn an autoencoder into a VAE. First,
    the encoder outputs the mean and variance of a Gaussian instead of a single point, so each input maps to a small
    cloud of possible codes. Second, the loss adds a penalty, the KL divergence, that pulls every cloud towards
    a standard Gaussian prior. The KL penalty encourages overlap and prior-compatible codes. The decoder can still
    give poor outputs in some regions. The result is a proper probabilistic generative model with a principled training
    objective, which we derive next.

    '
- type: quiz
  question: Why do random codes decode to nonsense in a plain autoencoder?
  options:
  - The decoder is too small to draw clear digits from any code it is given
  - The reconstruction loss compares the wrong pixels, so the decoder learns shifted images
  - Autoencoders cannot use more than two latent dimensions, too few to describe a digit
  - Training never makes the codes fill a known region, so random points fall in untrained gaps
  answer: 3
  notes: 'Answer: D. The autoencoder is only trained to reconstruct training images, so it only ever sees codes produced by
    its encoder. Those codes can sit anywhere, at any scale, with gaps between clusters. A random point from a standard Gaussian
    often lands in a gap where the decoder''s behaviour is undefined. A is wrong because the same decoder reconstructs real
    digits well. C is wrong: autoencoders can use any code size. B is a distractor. This answer sets up the KL term: it encourages
    code distributions towards a known prior, without guaranteeing complete coverage.

    '
- type: section
  number: 2
  title: The VAE model and the ELBO
  question: What exactly does a VAE maximise, and why a 'lower bound'?
  icon: fa:FaSquareRootAlt
  notes: 'Section two is the mathematical core of the week. We write the VAE as a latent variable model, see why
    its likelihood cannot be computed directly, introduce the approximate posterior produced by the encoder, and
    derive the evidence lower bound. Then we read the bound term by term, compute the KL divergence for Gaussians
    with worked numbers, and connect the reconstruction term to familiar loss functions. Go slowly; students who
    follow this section will find diffusion models in week 4 much easier.

    '
- type: flow
  title: The VAE as a probabilistic model
  steps:
  - label: Prior
    sub: Draw a code
  - label: Decoder
    sub: Predict pixel distribution
  - label: Data
    sub: Observe an image
  - label: Encoder
    sub: Estimate useful codes
    highlight: true
  bullets:
  - Generate with prior + decoder.
  - Train with encoder + decoder.
  notes: 'Here is the probabilistic story. Nature, in our model, first draws a hidden code from a standard Gaussian,
    then the decoder turns it into an image. That is all we need to generate. To train, however, we need to know
    which codes are responsible for each real image, which is the posterior p of z given x. The true posterior is
    too difficult to calculate exactly, so we train a second network, the encoder, to approximate it. That is why
    it is called variational: variational inference approximates a hard distribution with a simpler, described by
    adjustable numbers one. Theta and phi are just the two networks'' weights.

    '
- type: figure
  title: VAE architecture in one picture
  figure: vae_arch
  notes: 'Walk through the diagram from left to right. The encoder reads the image and outputs two vectors, the
    mean mu and the log-variance, one number per latent dimension. We use the log-variance because it can be any
    real number, while a variance must be positive. We then draw a code by adding scaled noise to the mean; this
    is the reparameterisation trick we meet in section three. The decoder turns the code into a reconstruction.
    The loss has two parts, written at the bottom: how well we rebuild the input, and how far each encoder distribution
    is from the prior. Students implement exactly this in the lab.

    '
- type: equation
  title: Why we cannot maximise the likelihood directly
  eq:
  - p_\theta(x) = \int p_\theta(x \mid z)\, p(z)\, dz
  - p_\theta(z \mid x) = \dfrac{p_\theta(x \mid z)\, p(z)}{p_\theta(x)}
  read_as:
  - Combine predictions over possible codes.
  - The exact integral is difficult.
  - The encoder proposes a tractable approximation.
  terms:
  - - p(z)
    - prior over codes, N(0, I)
  - - pθ(x | z)
    - decoder
  - - pθ(z | x)
    - true posterior (too difficult to calculate exactly)
  - - qφ(z | x)
    - encoder's approximation
  notes: 'Last week we met the latent variable integral. For a VAE, the decoder is a neural network, so the integral
    over all codes has no formula, and estimating it by randomly sampling codes is hopelessly inefficient because
    almost all random codes explain a given image very poorly. Bayes'' rule shows that the posterior has the same
    integral in the denominator. The variational idea is to stop trying to compute these exactly and instead introduce
    a flexible approximation, the encoder, and improve a quantity we can compute that is guaranteed to lie below
    the true log-likelihood.

    '
- type: equation
  title: The evidence lower bound (ELBO)
  eq:
  - \log p_\theta(x) \;\geq\; \mathbb{E}_{q_\phi(z \mid x)}\left[\log p_\theta(x \mid z)\right] \;-\; D_{\mathrm{KL}}\left(q_\phi(z
    \mid x)\,\|\,p(z)\right)
  - \log p_\theta(x) = \mathrm{ELBO} + D_{\mathrm{KL}}\left(q_\phi(z \mid x)\,\|\,p_\theta(z \mid x)\right)
  read_as:
  - 'Reconstruction: rebuild the known input.'
  - 'KL: compare encoder distribution with prior.'
  - Nonnegative posterior KL explains the lower-bound gap.
  panel_h: 2.0
  notes: 'This is the most important equation of the week. Evidence means p(x), the marginal likelihood. The ELBO
    is a lower bound on its logarithm, log p(x). The first term rewards good reconstructions of x from codes sampled
    from the encoder. The second term penalises encoder distributions that stray from the prior. The second line
    explains why it is a bound: the true log-likelihood equals the ELBO plus a KL divergence between the approximate
    and true posteriors, and KL divergences are never negative. Improving the ELBO improves our training bound.
    A particular joint update need not increase the exact likelihood or improve every posterior. We train by minimising
    the negative ELBO.

    '
- type: compare
  title: 'Reading the ELBO: two forces in tension'
  columns:
  - head: Reconstruction term
    icon: fa:FaImage
    points:
    - Keep enough information in z to rebuild the image.
    - Lower when predicted pixels are closer to the real ones.
    - 'Alone, it pushes codes apart: sharp rebuilds, gappy space.'
  - head: KL term
    icon: fa:FaMagnet
    points:
    - Pull each code cloud towards the prior N(0, I).
    - Lower when each cloud is centred near 0 with spread near 1.
    - 'Alone, it erases information: every image gets the same N(0, I) cloud.'
  callout: $\beta$ weights KL; compare both costs.
  notes: 'Present the two terms as forces pulling in opposite directions. The reconstruction term wants a precise,
    unique code for each image, which pushes variances towards zero and codes apart. The KL term wants every image''s
    distribution to be the same standard Gaussian, which would destroy all information. The trained VAE is a compromise:
    codes carry enough information to reconstruct, but they overlap enough that the whole region is covered. This
    compromise is also why VAE samples tend to be slightly blurry: overlapping codes mean the decoder averages over
    similar images. We will see the effect of changing the balance with beta.

    '
- type: equation
  title: KL divergence between two Gaussians has a closed form
  eq: D_{\mathrm{KL}}\left(\mathcal{N}(\mu, \sigma^2)\,\|\,\mathcal{N}(0, 1)\right) = \frac{1}{2}\left(\mu^2 + \sigma^2
    - \log \sigma^2 - 1\right)
  read_as:
  - Compute one cost per latent coordinate; add.
  - Mean 0, standard deviation 1 gives KL = 0.
  - logvar is log variance, not spread.
  terms:
  - - μ
    - encoder mean for one latent dimension
  - - σ²
    - encoder variance
  - - log σ²
    - what the network actually outputs
  notes: 'KL divergence measures how different one distribution is from another; it is zero only when they are identical
    and it is not symmetric. For two Gaussians it has a formula, which is one reason VAEs use Gaussian encoders
    and priors: no sampling is needed for this term. Point out each part. Mu squared penalises codes whose mean
    is far from zero. Sigma squared minus log sigma squared minus one is zero at sigma equal to one and grows when
    the spread is either too small or too large. Show how the formula becomes the one line of PyTorch that students
    write in the lab.

    '
- type: figure
  title: 'Worked examples: how far is the encoder from the prior?'
  figure: kl_gaussians
  notes: 'Work these on the board. With mean zero and standard deviation one, the encoder equals the prior and the
    KL is zero. Shifting the mean to one costs half a nat. Shrinking the standard deviation to one half costs 0.32
    nats, because the log of 0.25 is minus 1.39. Both together, a confident code far from zero, costs 2.32 nats.
    In a trained VAE each latent dimension pays a cost like this, and the total KL printed during training, typically
    a few nats per image for a small latent space, is the sum over dimensions averaged over images.


    Figure discussion prompts: μ = 1, σ = 1: KL = 0.50. μ = 0, σ = 0.5: KL ≈ 0.32. μ = 2, σ = 0.5:
    KL ≈ 2.32.

    '
- type: equation
  title: The reconstruction term in practice
  eq: -\log p_\theta(x \mid z) = -\sum_{i=1}^{784}\left[x_i \log \hat{x}_i + (1 - x_i)\log(1 - \hat{x}_i)\right]
  read_as:
  - Sum pixel cross-entropy over the image.
  - Binary targets give a Bernoulli likelihood.
  - Greyscale targets use a conventional soft-target surrogate.
  terms:
  - - xᵢ
    - true intensity of pixel i
  - - x̂ᵢ
    - decoder's predicted probability for pixel i
  - - '784'
    - 28 × 28 pixels
  notes: 'The reconstruction term is just a familiar loss function once we choose the decoder''s output distribution.
    For binary pixels a Bernoulli likelihood gives binary cross-entropy. The greyscale MNIST lab uses soft targets
    as a conventional surrogate, summed over pixels. For colour photographs a Gaussian decoder is common, giving
    squared error. The expectation over the encoder''s distribution is estimated with a single sampled code per
    image in each training step; the noise averages out over many steps. Important implementation detail: sum over
    pixels rather than averaging, otherwise the KL term dominates and samples become very blurry.

    '
- type: quiz
  question: Which loss term encourages encoder distributions towards the prior?
  options:
  - The KL divergence to the prior N(0, I)
  - The reconstruction (binary cross-entropy) term
  - The Adam optimiser's learning rate
  - The size of the decoder's hidden layer
  answer: 0
  notes: 'Answer: A. KL pulls encoder code distributions towards the shared Gaussian prior. This encourages overlap and helps
    prior sampling. It does not guarantee there are no poorly learned regions. Reconstruction is the other pressure: keep enough
    input information to rebuild the image. Ask students to predict what happens when beta becomes very large, then compare
    the later measured results.

    '
- type: section
  number: 3
  title: 'Training: the reparameterisation trick'
  question: How do we backpropagate through a random sample?
  icon: fa:FaRandom
  notes: 'Welcome back from the break. We know what to maximise; now we need to train it with gradient descent.
    The obstacle is that the loss depends on a random sample of the code, and you cannot differentiate a random
    draw. The reparameterisation trick removes that obstacle with one line of algebra. After that we look at the
    complete PyTorch model in about twenty lines, and at practical training details, including how to monitor the
    two loss terms and a failure mode called posterior collapse.

    '
- type: equation
  title: The reparameterisation trick
  eq: z = \mu_\phi(x) + \sigma_\phi(x) \odot \epsilon, \qquad \epsilon \sim \mathcal{N}(0, I)
  read_as:
  - Draw independent Gaussian noise $\epsilon$.
  - Compute centre + spread × noise.
  - Gradients reach learned centre and spread.
  terms:
  - - ε
    - standard Gaussian noise
  - - ⊙
    - element-wise product
  - - σ
    - exp(½ · log σ²)
  notes: 'The trick rewrites a sample from a Gaussian with mean mu and standard deviation sigma as mu plus sigma
    times standard noise. Mathematically the distribution of z is identical. Computationally, the difference is
    decisive: the random part epsilon no longer depends on the network''s parameters, so z is an ordinary function
    of mu and sigma and we can backpropagate through it. Kingma and Welling introduced this in the original 2013
    VAE paper. The same idea, writing a noisy variable as a clean one plus scaled noise, is central to diffusion
    models in week 4, so it is worth making sure everyone understands it now.

    '
- type: figure
  title: Why the trick matters for backpropagation
  figure: reparam
  notes: 'The left diagram shows the problem: a sampling node sits between the encoder''s outputs and the loss,
    and a direct PyTorch sample() draw disconnects the pathwise autograd route. Reconstruction gradients then do
    not reach the encoder through that sample. The right diagram shows the fix: the noise is drawn outside the network
    and combined with mu and sigma by multiplication and addition, which are differentiable. Gradients now flow
    back to mu and sigma and into the encoder weights. An alternative, the score-function or REINFORCE estimator,
    can handle non-differentiable sampling but has much higher variance, which is why the reparameterisation trick
    made VAEs practical.

    '
- type: code
  title: A complete VAE in PyTorch
  code: |-
    class VAE(nn.Module):
        # Layers are created in __init__ (see the lab).
        def encode(self, x):
            h = self.enc(x)
            return self.mu_head(h), self.logvar_head(h)

        def reparameterise(self, mu, logvar):
            std = torch.exp(0.5 * logvar)
            eps = torch.randn_like(std)
            return mu + std * eps

        def forward(self, x):
            mu, logvar = self.encode(x)
            z = self.reparameterise(mu, logvar)
            return self.dec(z), mu, logvar
  bullets:
  - 'encode: image → mu, logvar.'
  - 'reparameterise: mu + std × noise → z.'
  - 'forward: z → 784 pixel logits.'
  - 'vae_loss (in the lab): pixel cost + $\beta$ × KL.'
  notes: 'This projected fragment shows the three methods used in training; the layer definitions, decode and the
    loss are in the lab and the teaching notes. Walk through one tensor at a time. The enc layers produce features. The
    mu_head and logvar_head layers describe a Gaussian for each input. The expression exp(0.5 * logvar) converts log-variance into standard deviation. Fresh independent
    noise produces z, and dec gives pixel logits. Analogy: the two heads write the centre and spread of a cloud,
    and eps chooses a point within it. Ask: why do we halve logvar before exponentiating? Answer: we need standard
    deviation, not variance. Common mistake: treating pixel logits as probabilities; apply sigmoid when displaying
    decoded samples. Reconstruction and KL are computed by the separate vae_loss function.'
- type: figure
  title: 'Training in practice: watch both terms'
  figure: training_curves
  notes: 'These curves come from the model that produced today''s figures. Always log the two terms separately,
    never just the total. Reconstruction error falls quickly. In this run the KL term dips after the first epoch,
    as the encoder first pulls its codes towards the prior, and then rises steadily: as the model learns to use
    the code, each image''s distribution moves away from the prior to carry more information. Both terms are still
    changing at epoch ten, which is normal for a short run. Persistently small KL can signal posterior collapse;
    inspect whether the decoder uses the code, a common problem with powerful autoregressive decoders. Remedies
    include gradually increasing beta from zero, called warm-up, or free bits, which removes the loss incentive
    to reduce KL further below a chosen allowance. Free bits does not guarantee the actual KL reaches that allowance.



    Ask: why plot reconstruction and KL separately? Their sum can hide a change in latent use. Common mistake: diagnosing
    collapse from one low-KL observation without testing the decoder.


    Figure discussion prompts: Track reconstruction and KL separately. Near-zero KL may indicate ignored codes.
    Try KL warm-up, free bits or a smaller decoder. Check samples as well as losses.

    '
- type: section
  number: 4
  title: Exploring and evaluating the latent space
  question: What has the model learned, and how do we measure it?
  icon: fa:FaSearch
  notes: 'Section four is visual. We look at reconstructions, decode a whole grid of latent points, interpolate
    between digits, and change beta to see the trade-off between sharpness and a well-behaved latent space. All
    images are from real models trained for these slides with the same code students use in the lab. Then we discuss
    how to evaluate a VAE properly, because pretty pictures are not enough evidence for a report or a project.

    '
- type: figure
  title: 'Reconstructions: good, but a little blurry'
  figure: reconstructions
  callout: Basic VAEs often blur uncertain details. Pixel losses can reward average-looking pixels.
  notes: 'The top row shows test images the model never saw during training; the bottom row shows the VAE''s reconstructions
    from a sixteen-dimensional code. The digits are clearly recognisable, but edges are softer. Ask students why.
    Two reasons: the KL term forces overlapping codes, so a code is compatible with several slightly different images
    and the decoder outputs their average; and pixel-wise losses reward predicting the average intensity when uncertain,
    which looks blurry. GANs, next week, attack exactly this weakness, at the price of harder training. Diffusion
    models use a fixed noise-prediction target and can produce detailed samples, but optimisation and coverage still
    need testing.

    '
- type: figure
  title: 'Decoding a grid of latent points: a map of the learned space'
  figure: manifold
  figure_width: 5.3
  bullets:
  - Each cell is the decoder's drawing of one code (z₁, z₂).
  - 15 × 15 codes cover the middle 94% of N(0, 1) on each axis.
  - 'Neighbours change gradually: the bottom row turns 0 into 6, then 5.'
  - Some cells blend two digits, such as 9 and 3.
  notes: 'Read one grid row slowly. Each cell decodes a different two-number code; the axes show the code values,
    from −1.88 to +1.88, which are the 3rd and 97th percentiles of the standard normal prior. Nearby cells often
    share strokes and change gradually: the bottom row turns a 0 into a 6 and then a 5, and the top row turns a
    7 into a 9 and then a 1. Many points in this measured grid look digit-like, but some cells blend two digits,
    because two numbers are a very small summary of an image. This is evidence about the trained model, rather
    than proof that every code is realistic. In higher dimensions a grid is difficult to draw, so interpolate between
    two chosen codes and inspect the resulting sequence.


    Figure discussion prompts: Each cell decodes one 2-D code. Compare neighbouring cells. Inspect unclear or malformed
    digits. A useful grid is no universal guarantee.

    '
- type: figure
  title: 'Interpolation: walk in a straight line through latent space'
  figure: interpolation
  stack: true
  bullets:
  - Each row decodes 10 evenly spaced codes on the straight line between two test digits.
  - 'Top row: the 1 gains a bar and turns smoothly into a 7.'
  - 'Bottom row: the middle of 3 → 8 is smudged, and the decoded 8 itself is unclear.'
  notes: 'Interpolation is the main tool for exploring higher-dimensional latent spaces. Encode two test images
    to their means, draw a straight line between them, and decode points along it. A latent path can show gradual
    changes, but intermediate images may be unclear or malformed: in this measured run the 1 to 7 path is smooth,
    while the 3 to 8 path passes through smudged shapes and even its 8 end point decodes poorly. Show both kinds
    of path in a report. Compare the observed path with pixel blending.
    Mention spherical interpolation: in high dimensions, samples from a Gaussian concentrate near a sphere, and
    the straight line between two such points passes through the lower-norm interior, so walking along the sphere
    often gives better images. Students implement interpolation in the lab as a TODO.


    Figure discussion prompts: Encode two images as means z1 and z2. Decode (1 − t)z1 + t z2. At t = 0.5, use their
    midpoint. Inspect intermediate images.

    '
- type: figure
  title: β changes the balance between sharpness and structure
  figure: beta_samples
  notes: 'Beta multiplies the KL term. With a small beta the model behaves more like an autoencoder: reconstructions
    are good but the aggregate distribution of codes does not match the prior, so sampling from the prior gives
    more broken digits. With a large beta the codes are forced very close to the prior; samples are well formed
    but blurrier and less varied, and reconstructions lose detail. Beta equal to one corresponds to the true ELBO.
    The numbers in each title are the measured reconstruction and KL terms. Beta-VAE, with beta larger than one,
    is also used to encourage disentangled latent dimensions. This is the rate-distortion trade-off: the KL is the
    rate, how many nats the code carries, and reconstruction error is the distortion; every nat saved costs detail.


    Figure discussion prompts: Beta multiplies the KL term. Lower beta often improves reconstruction. Higher beta
    pressures codes towards the prior. Inspect prior samples and both costs.

    '
- type: table
  title: How to evaluate a VAE
  header:
  - What we check
  - How to measure it
  - Watch out for
  rows:
  - - Fit to new data
    - Negative ELBO on held-out images
    - It is a bound; compare models with the same pixel likelihood
  - - Reconstruction
    - Pixel error (BCE or MSE) on test images
    - Good rebuilds do not prove good new samples
  - - New samples
    - FID score plus people rating images
    - FID depends on its feature network; show the samples too
  - - The codes
    - Interpolation paths and traversals
    - Show failures, not only the best paths
  - - A real task
    - For example, anomaly ROC AUC
    - Test on realistic anomalies, not just easy ones
  notes: 'A VAE is evaluated on several axes because no single number captures everything. The held-out negative
    ELBO is the principled measure of fit, but it is a bound, so comparisons are only fair across models with the
    same decoder likelihood. Reconstruction error and pictures show closeness to real examples. Sample quality needs
    a metric such as the Fréchet Inception Distance, which we define next week, or careful human evaluation. Latent-space
    quality is usually shown with traversals. Finally, if the VAE serves a task, measure the task. In the project,
    students must report at least one quantitative and one human-centred evaluation, which links to MIMLO 4.

    '
- type: section
  number: 5
  title: Variants and applications
  question: Where are VAEs used in 2026?
  icon: fa:FaSitemap
  notes: 'Section five looks beyond the basic model. Pure VAEs are rarely the image generator of choice today, because
    diffusion models produce sharper samples. But VAE ideas are everywhere: conditional generation, disentanglement,
    discrete image tokens with VQ-VAE, and most importantly the autoencoder that compresses images inside latent
    diffusion models such as Stable Diffusion and FLUX. We finish with applications and a responsible AI lens before
    the lab preview.

    '
- type: cards
  title: Important VAE variants
  cards:
  - icon: fa:FaTags
    head: Conditional VAE
    text: 'Give both networks a label, such as “7”; then ask the decoder for a 7.'
  - icon: fa:FaSlidersH
    head: β-VAE
    text: Set β above 1 so each code number tends to hold one factor, such as slant. Test it.
  - icon: fa:FaTh
    head: VQ-VAE
    text: Snap each code to the nearest entry of a learned codebook, so an image becomes a grid of tokens.
  - icon: fa:FaLayerGroup
    head: Hierarchical VAEs
    text: Stack several code levels, from overall layout to fine detail (for example NVAE).
  notes: 'Four variants students should know by name. A conditional VAE feeds a label or other condition into both
    networks, so you can ask for a specific digit or attribute; students can try this as a lab extension. Beta-VAE
    uses beta greater than one to encourage each latent dimension to capture one factor of variation, useful for
    interpretability. VQ-VAE replaces the continuous Gaussian code with the nearest entry in a learned codebook,
    so an image becomes a grid of discrete tokens; this idea underlies image tokenizers used by autoregressive and
    multimodal models, and audio codecs. Hierarchical VAEs stack several latent layers and close much of the quality
    gap.

    '
- type: flow
  title: 'Where you meet VAEs every day: inside latent diffusion'
  steps:
  - label: Random latent
    sub: 64 × 64 × 4 noise
  - label: Diffusion model
    sub: Removes noise step by step, guided by the prompt
    highlight: true
  - label: VAE decoder
    sub: Turns the latent into pixels
  - label: Image
    sub: 512 × 512 × 3
  bullets:
  - The latent holds 48 times fewer numbers than the image.
  - The VAE encoder is used in training and for editing an existing photo.
  notes: 'This is the most important modern application. Diffusion directly in pixel space is expensive for large
    images. Latent diffusion, introduced by Rombach and colleagues in 2022 and used in Stable Diffusion, first trains
    an autoencoder that compresses a 512 by 512 colour image into a 64 by 64 grid with four channels, forty-eight
    times fewer numbers, and then runs the diffusion process in that latent space. Read the flow from left to right
    as text-to-image generation: it starts from random noise in the small latent space, the diffusion model removes
    the noise step by step while following the prompt, and the VAE decoder turns the final latent into a full image.
    The encoder is not used in that path. It is used during training, to turn every training photo into a latent,
    and in image-to-image editing, where an existing picture is encoded first. These autoencoders use only a small
    KL penalty and add perceptual and adversarial losses so that reconstructions are sharp. Next week''s GAN ideas
    therefore also reappear here.

    '
- type: cards
  title: Applications of VAEs
  cards:
  - icon: fa:FaExclamationTriangle
    head: Anomaly detection
    text: Flag inputs that rebuild badly, such as a scratched part on a production line.
  - icon: fa:FaDatabase
    head: Synthetic data
    text: Sample extra training records for rare cases; check that no real record is copied.
  - icon: fa:FaFlask
    head: Molecule and design search
    text: Move through the code space towards better predicted properties, then decode new candidates.
  - icon: fa:FaFileArchive
    head: Compression & tokens
    text: Store images or audio as short codes, such as the image tokens used by multimodal models.
  notes: 'Beyond latent diffusion, VAEs are used for anomaly detection in manufacturing, cybersecurity and medicine,
    because unusual inputs reconstruct poorly. They generate synthetic data to augment small datasets, although
    synthetic data can leak information about real records. In drug discovery, molecules are encoded into a continuous
    space where optimisation is easier, then decoded. Learned compression for images, audio and video relies on
    autoencoder ideas, and VQ-style codes turn images and sounds into tokens for multimodal transformers, which
    we meet in weeks 9 and 10.

    '
- type: figure
  title: 'Application demo: detecting unusual inputs'
  figure: anomaly
  figure_width: 7.7
  bullets:
  - Trained only on digits; tested on new digits and on clothing.
  - Clothing rebuilds badly, so a high error means “unusual”.
  - A random clothing image scores higher than a random digit {{W02_AUC_PCT}} of the time.
  - 'Easy test: real defects can look almost normal.'
  notes: 'This is a real result, and students reproduce it in the lab. We trained the VAE only on handwritten digits,
    then measured reconstruction error on 2,000 unseen digits and 2,000 clothing images from Fashion-MNIST. The
    two histograms barely overlap and the ROC area under the curve, shown in the title, is close to one: a randomly
    chosen clothing image has a higher error than a randomly chosen digit {{W02_AUC_PCT}} of the time, so reconstruction
    error is an excellent anomaly score here. The small dark bars near an error of 150 are bins where both histograms
    overlap. Stress the limitation: clothing versus digits is an easy, artificial
    anomaly. A defect on a circuit board or an unusual heart rhythm is much subtler, and some anomalies can even
    reconstruct well. Evaluation must use realistic anomalies.


    Figure discussion prompts: Train on digits. Test on unseen digits and on Fashion-MNIST clothing images. In this
    experiment, clothing tends to have higher reconstruction error. Choose and test a threshold. Real defects can
    be much harder to distinguish.

    '
- type: bullets
  title: 'Responsible AI lens: VAEs and synthetic data'
  icon: fa:FaBalanceScale
  bullets:
  - Synthetic data may leak records.
  - Ask “normal for whom?” in anomaly detection.
  - Check consent, lawful basis and licences.
  - Show typical outputs and failures.
  notes: 'Each week has a responsible AI lens tied to the model family. For VAEs, synthetic data is the headline
    risk: people often assume generated data is automatically anonymous, but models can memorise rare training examples.
    Anomaly detection raises fairness questions: if the training data under-represents a group, their normal inputs
    look anomalous, for example in fraud or medical screening. Data rights matter as soon as students move from
    MNIST to faces or health data. Finally, report honestly: carefully selected best interpolations are a common
    form of overclaiming, which the project marking scheme penalises.

    '
- type: lab
  title: 'Lab 2: implement and explore a VAE in PyTorch'
  steps:
  - Inspect images and tensor shapes.
  - Implement encoder, sampling and loss.
  - Train; log both costs.
  - Explore grids and paths.
  - Compare $\beta$ values using fixed codes.
  - Evaluate digits versus clothing.
  runtime: Colab or local CPU. About 9 min on a laptop CPU after downloads
  deliverable: Five TODOs, figures, β table, four answers
  notes: 'The lab follows the lecture exactly. Students fill in the encoder output, the reparameterisation line
    and the loss, then train. With the two-dimensional model they reproduce the latent scatter and grid; with a
    sixteen-dimensional model they interpolate. The beta experiment asks them to connect numbers to pictures, and
    the anomaly detection part turns the model into a tool and asks for a proper metric, ROC AUC. The conditional
    VAE extension is for students who finish early. Remind them that the trained model and the evaluation code can
    be reused in the group project.

    '
- type: summary
  points:
  - Encoder predicts a code distribution.
  - Decoder maps codes to pixels.
  - Loss balances reconstruction and KL.
  - Reparameterisation carries encoder gradients.
  - Generate using prior + decoder.
  - Evaluate quality, variety and task performance.
  notes: 'Recap the six points, ideally asking students to supply the key word before you reveal it. If they remember
    one equation, it should be the ELBO; if they remember one trick, the reparameterisation. Next week we meet the
    other classic answer to blurry samples: generative adversarial networks, which drop the likelihood altogether
    and train a generator against a critic. Ask students to finish the lab, read Foster chapter 3 and watch the
    suggested video before next week.

    '
