    notes: |
      Foster chapter 3 follows almost the same path as this lecture with Keras code, which is useful for students who prefer TensorFlow; the descriptor allows either framework. The original Kingma and Welling paper is short and readable after today. Lilian Weng's blog post is the best single written reference for the derivations and variants. The TensorFlow tutorial is a convolutional VAE students can compare with our PyTorch model. The VQ-VAE and latent diffusion papers are for students who want to look ahead. All links were checked in September 2026.
