slides:
- type: title
  figure: cover
  notes: 'In short: A variational autoencoder learns short image codes and a decoder that can generate new images.


    Explain: An image is an array of pixel values. An encoder turns those values into a smaller hidden representation. A decoder
    maps the representation back to pixels. A variational autoencoder, or VAE, describes possible codes using a probability
    distribution. Training learns both networks by balancing reconstruction with a penalty on that distribution.


    Example: The cover uses an archived model trained on handwritten digits. Each small square decodes a different two-number
    code. It resembles a map of handwriting, but the coordinates are learned numbers rather than named handwriting features.


    Ask: Does each square require its own input digit?


    Answer: No. After training, the decoder receives a chosen code and predicts an image without running the encoder.


    Watch out: A recognisable grid does not establish that every possible code generates a good digit.'
- type: outcomes
  notes: 'In short: Today connects two image-making routes to the maths and code that train a VAE.


    Explain: Reconstruction means rebuilding a supplied image. Generation means drawing a fresh code and decoding it. The encoder
    predicts the centre and spread of possible codes. The loss combines a pixel comparison with KL divergence, a difference
    between distributions. Reparameterisation expresses sampling in a form that allows gradients to train the encoder.


    Example: Follow an eight-image batch through the lab: images [8,1,28,28], encoder outputs [8,2], and decoder scores [8,784].
    Shapes are contracts between operations, much like matching plug sizes; matching shapes alone does not ensure correct learning.


    Ask: Which outcome needs an actual weight update?


    Answer: Building and training the VAE requires optimiser steps, while inspecting tensors or displaying samples changes no
    weights.


    Watch out: Do not judge a generator using reconstruction error alone; also inspect fresh samples and task performance.'
  items:
  - Trace encoding and generation
  - Explain the VAE loss
  - Build, train, evaluate a VAE
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: compress a face into 32 numbers?'
    minutes: 7
  - title: 1 · From autoencoders to VAEs
    minutes: 20
  - title: 2 · The VAE model and the ELBO
    minutes: 33
  - title: '3 · Training: the reparameterisation trick'
    minutes: 17
  - title: 4 · Exploring and evaluating the latent space
    minutes: 20
  - title: 5 · Variants and applications
    minutes: 15
  - title: Lab preview and wrap-up
    minutes: 8
  notes: 'In short: The lecture moves from rebuilding images to a trainable probability model and then to evaluation.


    Explain: Start by asking why random codes can fail in an ordinary autoencoder. Next, distinguish a prior from the encoder''s
    distribution. A prior is our chosen distribution before seeing an image. The evidence lower bound, or ELBO, gives a usable
    training objective. Reparameterisation connects that objective to code, and evaluation checks the resulting behaviour.


    Example: The longest block studies the ELBO. Work a one-coordinate Gaussian example before adding dimensions. This is like
    learning one component of a circuit before connecting several; latent coordinates can interact through the decoder, so they
    are not separate image properties.


    Ask: Why show generated images before deriving the equation?


    Answer: They give a concrete question for the mathematics: which training terms make randomly chosen codes useful?


    Watch out: The course map preserves the module''s week order; variants preview later ideas without changing today''s core
    objective.'
- type: discussion
  title: Warm-up
  icon: fa:FaCompressArrowsAlt
  prompt: Could 32 numbers describe a face well enough to redraw it?
  points:
  - Which properties matter?
  - Can new codes invent faces?
  - What if a code is unfamiliar?
  notes: 'In short: A short code can describe an image, but useful reconstruction does not automatically make every code meaningful.


    Explain: Imagine sending a face description instead of every pixel. An encoder learns a compact description from examples.
    A decoder learns to turn such descriptions into images. Compression means using fewer numbers, not necessarily fewer stored
    bytes. Generation requires choosing descriptions that the decoder learned to use.


    Example: A 28 by 28 digit contains 784 intensities. A two-number code is much shorter, yet the decoder still predicts 784
    values. Human descriptions such as smile and pose provide intuition; learned coordinates need not correspond to those named
    features.


    Ask: What happens if a new code combines unfamiliar features?


    Answer: The decoder can still calculate pixels, but those pixels may form an unrealistic or ambiguous image.


    Watch out: Distinct images can share similar codes; compression can lose detail and does not guarantee interpretable coordinates.'
- type: section
  number: 1
  title: From autoencoders to VAEs
  question: An autoencoder can compress and rebuild images. Why can random codes fail?
  icon: fa:FaCompress
  notes: 'In short: An ordinary autoencoder learns to rebuild known images, while a VAE also structures the codes used for generation.


    Explain: An autoencoder contains an encoder and a decoder. The encoder makes a short latent code, meaning a hidden numerical
    representation. The decoder rebuilds pixels from that code. Reconstruction training rewards accurate rebuilding. It does
    not specify a distribution from which we should draw fresh codes.


    Example: Think of the decoder as a translator trained on a limited set of messages. It handles familiar messages well but
    may mistranslate unfamiliar combinations. Unlike a human translator, it always returns numbers, even when those numbers
    describe no plausible image.


    Ask: If reconstruction is excellent, can random-code generation still fail?


    Answer: Yes. Random codes can lie outside the regions supplied by the encoder during training.


    Watch out: A narrow bottleneck encourages compression, but meaningful factors and good random samples require additional
    evidence.'
- type: figure
  title: 'An autoencoder: squeeze, then rebuild'
  figure: ae_diagram
  notes: 'In short: An autoencoder squeezes pixels into a short code and then learns to rebuild the original image.


    Explain: The input is a grayscale image with one intensity per pixel. Flattening arranges its values into a vector. The
    encoder maps that vector to a latent code. The decoder predicts the original pixel values from the code. Training compares
    those predictions with the supplied image and changes both networks.


    Example: For a batch of eight digits, flattening changes [8,1,28,28] to [8,784]. With two latent coordinates, the encoder
    returns [8,2]. This resembles packing essentials into a small bag; unlike packing objects, numerical codes can mix information
    from many pixels.


    Ask: What could happen if the code were as large as the image?


    Answer: Copying the input could become an easy solution, giving little useful compression.


    Watch out: The decoder learns from encoded training images; this reconstruction route does not define a reliable random-code
    sampling rule.'
- type: figure
  title: 'The problem: an autoencoder''s latent space has gaps'
  figure: latent_ae_vs_vae_slide
  caption: Real models trained on MNIST with a 2-D code. Each dot is a test image, coloured by digit.
  notes: 'In short: The plotted codes illustrate why a sampling rule needs to match the region learned by the decoder.


    Explain: Each dot comes from a held-out digit. Colour identifies the digit label for inspection, not for ordinary VAE training.
    The autoencoder plot contains encoded points. The VAE plot contains encoder means, not every sampled code. KL regularisation
    encourages encoder distributions towards a standard Gaussian prior centred at zero.


    Example: Both archived models use two latent coordinates so we can plot them. Compare their scale and empty regions before
    decoding any point. A city map suggests occupied neighbourhoods, but these clouds are learned distributions and have no
    sharp boundaries.


    Ask: Does a dense patch of encoder means prove every nearby code works?


    Answer: No. Decode candidate codes and inspect their images; plotted means do not show the decoder''s behaviour everywhere.


    Watch out: Do not interpret colour-separated groups as proof that individual coordinates have learned named digit properties.'
- type: figure
  title: 'Consequence: random codes decode to nonsense in an autoencoder'
  figure: samples_ae_vs_vae
  caption: The same 16 random points z ~ N(0, I) decoded by each model.
  callout: Prior codes must reach regions the decoder learned.
  notes: 'In short: The same prior codes expose differences between reconstruction training and prior-compatible generation.


    Explain: A prior is the distribution chosen for generating latent codes. Here it is a standard Gaussian, written N(0,I).
    The identity matrix means independent coordinates with unit variance. Each trained decoder receives the same codes in this
    comparison. Ordinary autoencoder training does not explicitly align its codes with that prior.


    Example: The archived figure decodes sixteen fixed random points using each model. Ask students to identify a recognisable
    digit and an unclear output in each panel. Holding the inputs fixed resembles testing two printers with the same file; different
    training histories still influence the comparison.


    Ask: What does a poor random-code sample tell us?


    Answer: The chosen code and learned decoder did not produce a convincing digit in this experiment.


    Watch out: KL encourages useful prior sampling; it cannot guarantee perfect coverage or realistic output for every possible
    code.'
- type: compare
  title: Autoencoder vs. variational autoencoder
  columns:
  - head: Autoencoder
    points:
    - One point per image
    - Reconstruction training
    - Unspecified sampling region
  - head: VAE
    points:
    - Distribution per image
    - Reconstruction plus KL
    - Chosen prior for generation
  callout: Check prior samples; KL offers no guarantee.
  notes: 'In short: A VAE replaces an exact image code with a distribution and adds a penalty towards a chosen prior.


    Explain: An ordinary autoencoder returns one point for each image. A VAE encoder predicts a mean and a variance for each
    latent coordinate. Sampling draws a code from that distribution. Reconstruction still asks the decoder to rebuild the input.
    KL divergence compares the encoder distribution with the prior used for fresh generation.


    Example: A point address becomes a small cloud of possible addresses. Clouds give the decoder varied nearby inputs during
    training. The analogy explains uncertainty, but Gaussian codes are continuous numbers rather than literal addresses, and
    overlap alone does not prove realistic outputs.


    Ask: Which two changes distinguish this VAE from the plain autoencoder?


    Answer: The encoder predicts a distribution, and training adds KL regularisation towards a known prior.


    Watch out: Avoid promising that every cloud overlaps usefully; inspect reconstructions, randomly generated images and failures
    separately.'
- type: quiz
  question: Why can random codes fail in an autoencoder?
  options:
  - Decoder cannot draw digits
  - Pixel targets are always misaligned
  - Only two code dimensions are allowed
  - Training leaves the sampling region unspecified
  answer: 3
  notes: 'In short: Random-code generation can fail when reconstruction training leaves the chosen sampling region poorly learned.


    Explain: A reconstruction uses the encoder''s output for a known image. A fresh random code comes from a distribution chosen
    by us. Those two sources need not cover the same locations. An ordinary autoencoder does not train a KL penalty towards
    that chosen prior. The decoder therefore receives unfamiliar codes during random generation.


    Example: Suppose encoded digits sit near coordinate 10, while our Gaussian samples lie mostly near zero. Good reconstructions
    near 10 say little about decoding zero. This is a hypothetical location example, not a measured description of the plotted
    models.


    Ask: Which option explains the mismatch?


    Answer: D. Training does not align codes with a known sampling region. The other options confuse capacity, pixel alignment
    or latent dimensionality.


    Watch out: A weak sample does not prove the decoder is too small; the same decoder may rebuild familiar codes accurately.'
- type: section
  number: 2
  title: The VAE model and the ELBO
  question: What exactly does a VAE maximise, and why a 'lower bound'?
  icon: fa:FaSquareRootAlt
  notes: 'In short: The ELBO gives us a computable objective for learning a model whose exact image likelihood is difficult
    to calculate.


    Explain: A likelihood measures how much probability the model assigns to an observed image. The decoder supplies likelihoods
    conditional on latent codes. The full image likelihood combines contributions from all possible codes. A neural decoder
    makes that calculation difficult. The encoder proposes likely explanatory codes, allowing a tractable lower bound.


    Example: Imagine evaluating every possible handwriting style before scoring one digit. An encoder instead proposes plausible
    styles for that digit. The analogy describes computational focus; the encoder is a numerical approximation and can omit
    important possibilities rather than reason like a person.


    Ask: Does using a bound remove the need for probability modelling?


    Answer: No. The bound comes from the chosen prior, decoder likelihood and approximate encoder distribution.


    Watch out: Keep prior, approximate posterior and true posterior distinct; they answer different probability questions.'
- type: flow
  title: The VAE as a probabilistic model
  steps:
  - label: Supply image
    sub: x [B,784]
    role: data
  - label: Encode
    sub: μ, logvar
    role: model
  - label: Draw posterior
    sub: q(z|x)
    role: data
  - label: Draw prior
    sub: N(0,I)
    role: data
  - label: Decode
    sub: p(x|z)
    role: model
  - label: Inspect pixels
    sub: '[B,784]'
    role: output
  bullets:
  - 'Reconstruct: image route'
  - 'Generate: prior route'
  notes: 'In short: Generation uses a prior and decoder; the encoder supplies useful codes when learning from an observed image.


    Explain: The prior gives probabilities to codes before an image is seen. The decoder maps a code to a distribution over
    pixels. Observing an image reverses the question: which codes could explain it? The true posterior answers that question
    exactly. The encoder estimates it using a simpler distribution that we can sample and differentiate. Both sampled routes
    meet at the same decoder.


    Example: For one digit, the encoder might return two means and two log-variances. For a fresh generated digit, draw just
    a two-number prior code and call the decoder. Think of forward construction and reverse explanation; they share components
    but are different computations.


    Ask: Must the encoder run during generation from the prior?


    Answer: No. Generation can start with the prior code; reconstruction and training use the observed-image encoder route.


    Watch out: The prior and encoder distribution can both be Gaussian while having different parameters and roles.'
  arrows:
  - x [B,784]
  - μ, logvar
  - null
  - z [B,d]
  - pixels [B,784]
  branches:
  - from: 2
    to: 4
    label: z [B,d]
- type: figure
  title: VAE architecture in one picture
  figure: vae_arch
  notes: 'In short: The VAE architecture separates learned distribution parameters from the random code used by the decoder.


    Explain: The encoder reads an input image. Two output heads predict the mean and log-variance of its latent Gaussian. Independent
    noise enters the sampling operation. The decoder receives the resulting code and predicts pixel logits, which are raw scores.
    Sigmoid maps logits to probabilities between zero and one for display.


    Example: With batch size eight and latent size two, both encoder outputs and noise have shape [8,2]. The decoder returns
    [8,784]. The diagram resembles two controls setting centre and spread; those controls vary with the image and do not identify
    named handwriting factors.


    Ask: Which tensor enters the decoder: the image, mean, or sampled code?


    Answer: The sampled code enters the decoder. The mean and log-variance also enter KL calculation directly.


    Watch out: Log-variance is not standard deviation; compute exp(0.5 times log-variance) before scaling the noise.'
- type: equation
  title: Why we cannot maximise the likelihood directly
  eq:
  - p_\theta(x) = \int p_\theta(x \mid z)\, p(z)\, dz
  - p_\theta(z \mid x) = \dfrac{p_\theta(x \mid z)\, p(z)}{p_\theta(x)}
  read_as:
  - Average over possible codes.
  - Exact neural integral is difficult.
  terms:
  - - x, z
    - image, code
  - - θ, φ
    - decoder, encoder weights
  - - p(z)
    - prior
  - - pθ(x|z)
    - decoder likelihood
  - - qφ(z|x)
    - encoder approximation
  notes: 'In short: An image likelihood combines decoder predictions across all possible codes, making the exact posterior difficult
    to obtain.


    Explain: The symbol x denotes an observed image and z denotes a latent code. Decoder weights are named theta. The vertical
    bar means given, and p denotes a probability model. The integral averages code-specific image likelihoods using prior weights.
    The exact posterior needs that same image likelihood in its denominator. Encoder weights are named phi, and q denotes their
    tractable approximation.


    Example: In a two-code toy model, prior probabilities 0.5 and 0.5 weight likelihoods 0.2 and 0.6. Their sum is 0.4. A continuous
    code space replaces this sum with an integral; the toy calculation does not solve the neural model''s integral.


    Ask: Why does Bayes'' rule remain difficult here?


    Answer: Its denominator requires the full image likelihood, which has no convenient exact neural-decoder calculation.


    Watch out: An encoder approximation is useful, but it is not automatically equal to the true posterior.'
- type: equation
  title: The evidence lower bound (ELBO)
  eq:
  - \log p_\theta(x) \;\geq\; \mathbb{E}_{q_\phi(z \mid x)}\left[\log p_\theta(x \mid z)\right] \;-\; D_{\mathrm{KL}}\left(q_\phi(z
    \mid x)\,\|\,p(z)\right)
  - \log p_\theta(x) = \mathrm{ELBO} + D_{\mathrm{KL}}\left(q_\phi(z \mid x)\,\|\,p_\theta(z \mid x)\right)
  read_as:
  - Reconstruction reward minus prior KL.
  - Posterior KL is the nonnegative gap.
  panel_h: 2.0
  notes: 'In short: The evidence lower bound rewards reconstruction and subtracts KL to the prior, while remaining below image
    log-likelihood.


    Explain: ELBO means evidence lower bound. Evidence here means the observed image''s probability under the model. The expectation
    averages reconstruction log-probability over encoder codes. KL to the prior penalises differences from our generation distribution.
    A separate KL to the true posterior is the nonnegative gap between ELBO and exact log-likelihood.


    Example: Use illustrative reconstruction log-probability minus 120 and prior KL 3. ELBO is minus 123, so its negative is
    123. If posterior-gap KL is 2, image log-likelihood is minus 121. These arithmetic values explain the identity and are not
    training results.


    Ask: Which quantity do ordinary minimising optimisers receive?


    Answer: The negative ELBO, or the corresponding reconstruction surrogate plus KL used in our greyscale lab.


    Watch out: Prior KL inside the objective and posterior-gap KL in the identity compare different distributions.'
- type: compare
  title: 'Reading the ELBO: two forces in tension'
  columns:
  - head: Reconstruction
    points:
    - Retain image information
    - Compare predicted pixels
    - 'Lower: closer rebuild'
  - head: KL to prior
    points:
    - Limit code information
    - Compare distributions
    - 'Lower: closer prior'
  callout: $\beta$ changes the KL weight.
  notes: 'In short: Reconstruction preserves useful image detail, while KL limits how far the image''s code distribution departs
    from the prior.


    Explain: A cost is a number that training tries to reduce. Reconstruction cost compares predicted pixels with their targets.
    KL divergence compares probability distributions rather than individual pixels. Lower reconstruction often needs more information
    in the code. Stronger KL pressure can remove some of that information. Beta multiplies the KL term and changes this balance.


    Example: With illustrative reconstruction cost 120 and KL 3, beta one gives 123; beta four gives 132. Think of two bills
    contributing to one total, but they are mathematical quantities measured in compatible loss units rather than money.


    Ask: Can we compare total losses across beta values as if the objective were unchanged?


    Answer: No. The multiplier changes the objective, so compare reconstruction, KL and sample behaviour separately.


    Watch out: Driving KL close to zero is not sufficient evidence of a good generator or an informative code.'
- type: equation
  title: KL divergence between two Gaussians has a closed form
  eq: D_{\mathrm{KL}}\left(\mathcal{N}(\mu, \sigma^2)\,\|\,\mathcal{N}(0, 1)\right) = \frac{1}{2}\left(\mu^2 + \sigma^2
    - \log \sigma^2 - 1\right)
  read_as:
  - Add coordinate costs.
  - '$\mu=0$, $\sigma=1$: KL = 0.'
  terms:
  - - μ
    - mean
  - - σ²
    - variance
  - - log σ²
    - encoder log-variance
  notes: 'In short: For Gaussian encoder codes and a standard Gaussian prior, KL has a direct formula for each coordinate.


    Explain: Mu is the encoder mean, which sets the centre. Sigma squared is variance, the square of standard deviation. The
    logarithm uses the natural-log scale. The formula compares one encoder coordinate with a zero-mean, unit-variance prior.
    For independent coordinates, add their KL costs. The lab predicts log-variance so the derived variance stays positive.


    Example: Set mean zero and standard deviation one. The terms become zero plus one minus log one minus one, giving zero KL.
    Moving the mean to one adds a cost of 0.5. These are exact worked calculations, not measured model outputs.


    Ask: Does logvar zero describe a code with no spread?


    Answer: No. Its variance is exp(0), which is one, and its standard deviation is also one.


    Watch out: Do not substitute standard deviation where the equation needs variance, or reverse the KL arguments casually.'
- type: figure
  title: 'Worked examples: how far is the encoder from the prior?'
  figure: kl_gaussians
  notes: 'In short: Shifting a Gaussian''s centre or changing its spread both increase KL relative to the standard prior.


    Explain: The shaded prior is centred at zero with standard deviation one. The encoder curves show other means and spreads.
    KL is zero only when these distributions match in this Gaussian example. It is nonnegative and generally asymmetric. Each
    latent coordinate contributes its own cost to the diagonal-Gaussian sum.


    Example: A mean of one with standard deviation one costs 0.50 nats. A mean of zero with standard deviation 0.5 costs approximately
    0.32 nats. Moving the mean to two while retaining that spread gives approximately 2.32 nats. These values come from the
    displayed formula rather than training.


    Ask: Which plotted change has the largest cost?


    Answer: The combination of a shifted centre and narrow spread at mean two, standard deviation 0.5.


    Watch out: A smaller KL can mean less image information; judge it alongside reconstruction and generated samples.'
- type: equation
  title: The reconstruction term in practice
  eq: -\log p_\theta(x \mid z) = -\sum_{i=1}^{784}\left[x_i \log \hat{x}_i + (1 - x_i)\log(1 - \hat{x}_i)\right]
  read_as:
  - Sum pixel costs; average images.
  - 'Binary observations: Bernoulli likelihood.'
  - 'Greyscale: soft-target surrogate.'
  terms:
  - - xᵢ
    - target pixel
  - - x̂ᵢ
    - predicted probability
  - - i
    - pixel index
  notes: 'In short: A pixel likelihood turns reconstruction into a familiar loss, but its interpretation depends on the observation
    model.


    Explain: The index i selects one pixel. The target intensity is xᵢ, and the decoder prediction is x̂ᵢ. Binary cross-entropy
    adds costs for predicting each target pixel. For binary observations it is a Bernoulli negative log-likelihood. Our greyscale
    intensities use the same expression as a soft-target surrogate. The sum covers all 784 pixels before averaging images.


    Example: For a binary white pixel, predicting 0.8 costs minus log 0.8, approximately 0.223. Predicting 0.2 costs approximately
    1.609. One pixel is a worked calculation; real reconstruction adds costs across the complete image and uses a sampled latent
    code.


    Ask: Why sum pixels before dividing by batch size?


    Answer: We need a per-image reconstruction scale that is compatible with per-image KL.


    Watch out: Averaging BCE over pixels while summing KL changes their balance by a factor of 784.'
- type: quiz
  question: Which term encourages encoder distributions towards the prior?
  options:
  - KL divergence to N(0,I)
  - Reconstruction binary cross-entropy
  - Adam's learning rate
  - Decoder hidden-layer width
  answer: 0
  notes: 'In short: KL to the prior is the loss term that encourages encoder distributions to match our generation distribution.


    Explain: The encoder distribution depends on an observed image. The prior is chosen independently of that image. KL divergence
    compares these distributions and supplies a training penalty. Reconstruction measures pixel fit instead. Adam''s learning
    rate controls update size, while hidden-layer width controls network capacity; neither is this distribution-comparison term.


    Example: If mean zero and variance one match the standard prior, this Gaussian KL is zero. A mean shift to one with unchanged
    variance gives KL 0.5. These small calculations identify the correct term without inferring sample quality from its value
    alone.


    Ask: Which option names the relevant loss component?


    Answer: A. KL divergence to N(0,I). Reconstruction, learning rate and decoder size play different roles.


    Watch out: KL regularisation encourages prior compatibility; it does not certify that every prior code produces a valid
    image.'
- type: section
  number: 3
  title: 'Training: the reparameterisation trick'
  question: How do we backpropagate through a random sample?
  icon: fa:FaRandom
  notes: 'In short: Reparameterisation makes a random latent code depend differentiably on the encoder''s learned centre and
    spread.


    Explain: Backpropagation computes how a loss changes when learned weights change. An ordinary sample call does not provide
    the pathwise gradient we need here. We instead draw noise from a fixed distribution. The encoder stretches and shifts that
    noise to produce its code. For a fixed noise draw, these arithmetic operations are differentiable.


    Example: Take mean two, standard deviation 0.5 and noise minus one. Stretching gives minus 0.5; shifting gives code 1.5.
    This is like positioning a mark using a ruler and an offset, but the mark is redrawn randomly on later passes.


    Ask: Does the noise distribution need learned weights?


    Answer: No. The independent standard-normal noise stays fixed in form; the encoder learns the shift and scale.


    Watch out: Other gradient estimators exist; the claim concerns this convenient Gaussian pathwise construction, not all random
    operations.'
- type: equation
  title: The reparameterisation trick
  eq: z = \mu_\phi(x) + \sigma_\phi(x) \odot \epsilon, \qquad \epsilon \sim \mathcal{N}(0, I)
  read_as:
  - Centre + spread × independent noise.
  - Gradients reach centre and spread.
  terms:
  - - μ, σ
    - encoder centre, spread
  - - ε
    - standard-normal noise
  - - ⊙
    - matching-entry multiplication
  notes: 'In short: Draw independent noise, then calculate centre plus spread times noise to obtain a trainable Gaussian code.


    Explain: The decoder receives code z for image x. Learned encoder weights φ predict mean μ and positive standard deviation
    σ. Epsilon denotes independent standard-normal noise. The circle-times symbol means multiplying matching entries, rather
    than a matrix product. Reconstruction gradients can reach both learned encoder branches through this calculation.


    Example: With mean one, spread 0.5 and noise minus two, z equals zero. A noise value two instead gives z equals two. The
    same input image can therefore produce different codes; their distribution is controlled by the same learned centre and
    spread.


    Ask: Where does randomness enter this equation?


    Answer: It enters through epsilon. Given epsilon, the shift and scale are ordinary differentiable arithmetic.


    Watch out: Compute spread as exp(0.5 times logvar); using exp(logvar) scales by variance and changes the distribution.'
- type: figure
  title: Why the trick matters for backpropagation
  figure: reparam
  notes: 'In short: Moving randomness to an input restores the reconstruction gradient path to the encoder''s distribution parameters.


    Explain: The left panel represents an ordinary non-reparameterised sample call. Its draw does not carry the desired pathwise
    gradient to mean and spread. The right panel draws independent noise first. Shift and scale then form the latent code. Dashed
    feedback shows gradients through that arithmetic, while solid arrows carry forward values.


    Example: For fixed noise minus one, increasing mean from two to three increases the sampled code from 1.5 to 2.5. This local
    dependence allows gradient calculation. It does not mean later draws reuse the same noise, or that every stochastic computation
    has this convenient form.


    Ask: What does the encoder still learn when reconstruction gradients cannot cross a plain sample?


    Answer: Its KL term may still provide gradients, but the desired pathwise reconstruction signal is absent through that draw.


    Watch out: Avoid the overstatement that a random draw prevents every possible kind of learning; distinguish the two loss
    paths.'
- type: code
  title: Trace a VAE forward pass in PyTorch
  code: 'mu, logvar = model.encode(x)

    std = torch.exp(0.5 * logvar)

    z = mu + std * torch.randn_like(std)

    logits = model.dec(z)'
  bullets:
  - Image [B,784]
  - Code [B,d]
  - Pixel logits [B,784]
  notes: 'In short: The PyTorch forward pass connects image encoding, Gaussian sampling and pixel-logit decoding.


    Explain: A method is a function attached to a model object. The encode method predicts mean and log-variance. Reparameterise
    draws fresh noise and calculates a latent code. The forward method calls those operations and runs the decoder. It returns
    logits and both distribution parameters because the reconstruction and KL costs need different inputs.


    Example: For eight images with two-dimensional codes, unpacking returns logits [8,784], mean [8,2], and logvar [8,2]. Think
    of three labelled output cables, but Python tuple unpacking only assigns objects; it does not itself verify their shapes
    or mathematical meaning.


    Ask: Why return mu and logvar if the decoder only uses z?


    Answer: The KL term needs the encoder distribution parameters directly, independently of the sampled code.


    Watch out: Do not apply sigmoid before binary_cross_entropy_with_logits; that function already handles the logit transformation
    numerically.'
- type: figure
  title: 'Training in practice: watch both terms'
  figure: training_curves
  notes: 'In short: Monitor reconstruction and KL separately because their changes reveal different parts of learning.


    Explain: An epoch is one pass through the training examples. Reconstruction cost measures pixel mismatch. KL measures departure
    of encoder distributions from the prior. Training may reduce one term while increasing the other. Posterior collapse means
    the decoder largely ignores the latent code, often accompanied by very small KL.


    Example: These curves come from the archived two-dimensional lecture model. Inspect the early and later epochs rather than
    assuming both lines must decline together. A dashboard analogy helps separate signals; unlike independent gauges, both losses
    affect the same networks and can trade off against each other.


    Ask: Does an increasing KL automatically mean training has failed?


    Answer: No. Codes may carry more useful image information while reconstruction improves; inspect both terms and outputs.


    Watch out: A KL value near zero alone does not diagnose collapse; also test whether changing the code changes the decoder
    output.'
- type: section
  number: 4
  title: Exploring and evaluating the latent space
  question: What has the model learned, and how do we measure it?
  icon: fa:FaSearch
  notes: 'In short: Evaluation distinguishes rebuilding familiar inputs, generating fresh samples and succeeding at an intended
    task.


    Explain: A held-out image is excluded from model training. Reconstruction checks how the model rebuilds such an image. Prior
    sampling checks new outputs without supplying an image. Interpolation checks outputs along a path between codes. An anomaly
    task checks whether scores distinguish unusual inputs. These questions require different evidence and cannot be answered
    by one loss value.


    Example: Compare a sharp reconstruction with a malformed fresh sample from the same model. The first demonstrates one route
    and the second exposes another. Like testing both copying and free drawing, the tasks differ; neither image by itself estimates
    performance across a population.


    Ask: Which evaluation starts without an input image?


    Answer: Generation from a newly drawn prior code starts without an input image or encoder pass.


    Watch out: Choose evaluation settings on development data and keep final held-out examples separate from selecting improvements.'
- type: figure
  title: 'Reconstructions: good, but a little blurry'
  figure: reconstructions
  callout: Basic VAEs often blur uncertain details. Pixel losses can reward average-looking pixels.
  notes: 'In short: Good reconstructions can remain soft because the code and pixel objective leave some image details uncertain.


    Explain: A reconstruction begins with a held-out image and uses the encoder. Its decoder output estimates pixel intensities.
    A small latent code can discard details. Pixel-wise losses can reward average intensities when several images remain plausible.
    The VAE also balances reconstruction information against KL pressure, so sharpness is not its only objective.


    Example: Compare the original and rebuilt strokes in the archived figure. Identify one preserved feature and one softened
    edge. Averaging several possible drawings suggests why blur appears, but the network predicts conditional pixels rather
    than literally stacking a fixed set of training images.


    Ask: Would a blurry reconstruction always indicate incorrect code?


    Answer: No. Some blur follows the model and objective; severe or unexpected blur still warrants checking shapes and loss
    scaling.


    Watch out: Do not use only attractive reconstructions as proof of generation quality; display typical outputs and failures.'
- type: figure
  title: 'Decoding a grid of latent points: a map of the learned space'
  figure: manifold
  figure_width: 5.3
  bullets:
  - 225 chosen prior codes
  - Two coordinates vary
  - 94% marginal interval per axis
  - Inspect gradual changes and failures
  notes: 'In short: A two-dimensional latent grid shows how the trained decoder responds as each code coordinate changes.


    Explain: Every grid cell supplies a different two-number code to the decoder. The axes name those coordinates. A Gaussian
    quantile selects a point by its cumulative probability. The archived grid uses quantiles from 0.03 to 0.97 on each axis.
    Nearby coordinates often give gradually changing images, but some codes remain ambiguous.


    Example: The fifteen-by-fifteen grid contains 225 decoded images. At the centre, both coordinates are zero; opposite corners
    use different signs. This resembles a map of possible handwriting, but there is no guarantee that a coordinate has a single
    named meaning or that the grid exhausts possible digits.


    Ask: Is this grid a plot of 225 input images?


    Answer: No. It decodes 225 chosen latent points without first encoding those images.


    Watch out: The covered interval has 94 percent marginal probability on each axis, not 94 percent joint probability.'
- type: figure
  title: 'Interpolation: walk in a straight line through latent space'
  figure: interpolation
  stack: true
  bullets:
  - Ten codes per path
  - $z_t=(1-t)z_1+t z_2$
  - Same decoder throughout
  - Inspect ambiguous intermediate images
  notes: 'In short: Latent interpolation blends two codes before decoding, while pixel blending directly mixes two images.


    Explain: Interpolation chooses intermediate points between endpoints. Here the endpoints are encoder means for two test
    digits. The parameter t selects a position along the straight latent path. At zero it gives the first code, and at one the
    second. The decoder uses the same trained weights for every point on the path.


    Example: If one scalar code is zero and another is two, t equals 0.25 gives code 0.5. The displayed archived rows decode
    ten such positions. Walking between map locations provides intuition; a straight latent path can still pass through regions
    that produce implausible images.


    Ask: Must every intermediate image look like a valid digit?


    Answer: No. Inspect the actual path, including ambiguous middle images and imperfect endpoint reconstructions.


    Watch out: A smooth decoder provides smooth numerical changes, which do not automatically correspond to a meaningful semantic
    transition.'
- type: figure
  title: β changes the balance between sharpness and structure
  figure: beta_samples
  notes: 'In short: Beta changes the strength of KL pressure, so sample behaviour must be checked alongside both costs.


    Explain: Beta is the multiplier on KL in the training objective. With beta one, the standard objective balances reconstruction
    and prior matching. A smaller beta weakens prior pressure. A larger beta can reduce code information and worsen reconstruction.
    Neither setting guarantees sharper images or interpretable latent factors.


    Example: The archived figure compares separately trained sixteen-dimensional models at beta 0.1, one and four using the
    same prior codes. Identify both recognisable and malformed digits. Holding codes fixed controls input randomness, but different
    initial weights and training histories remain sources of variation.


    Ask: Why can we not decide solely from total loss across these rows?


    Answer: Each row uses a different objective weight, so compare reconstruction, KL and the intended task rather than one
    total.


    Watch out: Treat one seed per beta as an illustration; repeat seeds before claiming a general causal improvement.'
- type: table
  title: How to evaluate a VAE
  header:
  - Question
  - Check
  - Limit
  rows:
  - - Fit
    - Held-out ELBO
    - Compatible likelihood
  - - Rebuild
    - Pixel cost
    - No sample guarantee
  - - Generate
    - Samples/FID
    - Feature dependence
  - - Codes
    - Paths
    - Show failures
  - - Task
    - Anomaly AUC
    - Realistic anomalies
  notes: 'In short: A useful VAE evaluation reports separate evidence for pixel fit, prior samples and the intended application.


    Explain: Negative ELBO checks a bound on held-out log-likelihood when the decoder likelihood is comparable. Reconstruction
    loss checks known-image rebuilding. FID compares image-feature distributions and returns in next week''s evaluation discussion.
    Paths inspect latent behaviour. Anomaly AUC measures score ranking across unusual and ordinary examples.


    Example: A model may reconstruct digits well while producing weak prior samples. It may also separate clothing from digits
    yet miss a small defect in a digit-like image. Like several examination papers, these checks assess different abilities;
    their scores should not be treated as interchangeable evidence.


    Ask: Which metric alone proves a generator is useful?


    Answer: None. Choose metrics for the intended task and pair them with typical outputs, limitations and failures.


    Watch out: Compare ELBO-based scores only under compatible likelihood and scaling conventions, and freeze settings before
    final testing.'
- type: section
  number: 5
  title: Variants and applications
  question: Where are VAEs used in 2026?
  icon: fa:FaSitemap
  notes: 'In short: VAE variants change the code or conditioning, while applications require evidence beyond a convincing demonstration.


    Explain: Conditioning supplies extra information, such as a digit label, to a model. A beta-VAE changes KL weighting. A
    VQ-VAE chooses codes from a learned table rather than sampling a Gaussian code. Hierarchical models use multiple latent
    levels. These designs extend particular capabilities without making every application reliable automatically.


    Example: A conditional VAE can receive label seven along with a random code, asking its decoder for a seven. The label is
    a request rather than a guarantee. A codebook resembles a vocabulary of learned vectors; its entries are numerical representations,
    not necessarily human-readable image parts.


    Ask: Does a new VAE variant remove the need to evaluate samples?


    Answer: No. Test the behaviour that matters, including requested classes, reconstruction, realism, diversity and failures.


    Watch out: The later diffusion and multimodal weeks reuse these ideas; their placement does not change this module''s binding
    sequence.'
- type: cards
  title: Important VAE variants
  cards:
  - head: Conditional VAE
    text: Supply a label
  - head: β-VAE
    text: Reweight KL
  - head: VQ-VAE
    text: Choose codebook vectors
  - head: Hierarchical VAE
    text: Use multiple levels
  notes: 'In short: VAE variants modify the model''s information pathway, distribution or training balance.


    Explain: A conditional VAE gives both networks additional information such as a class label. A beta-VAE changes the KL multiplier.
    A VQ-VAE uses a learned codebook of discrete vector choices. Hierarchical VAEs use more than one level of hidden variables.
    Each change addresses a different modelling goal and introduces its own evaluation questions.


    Example: For a conditional digit model, a ten-entry one-hot vector represents the requested digit alongside the latent code.
    One entry is one and the others zero. The label resembles an instruction card, but a model can ignore or misread conditioning
    if training is inadequate.


    Ask: Does beta above one guarantee that a coordinate means slant?


    Answer: No. It can encourage simpler factors, but interpretability and independence need direct tests.


    Watch out: Do not treat VQ-VAE as merely rounding Gaussian codes; its learned codebook and objective change the mechanism.'
- type: flow
  title: 'Where you meet VAEs every day: inside latent diffusion'
  steps:
  - label: Encode prompt
    sub: Text
    role: model
  - label: Draw noise
    sub: '[64,64,4]'
    role: data
  - label: Denoise
    sub: ''
    role: model
  - label: Decode
    sub: VAE
    role: model
  - label: Display
    sub: '[512,512,3]'
    role: output
  bullets:
  - 'Historical design: 48× fewer latent values'
  - Other architectures use different shapes
  notes: 'In short: Latent diffusion uses a compact image representation and decodes its final latent back into pixels.


    Explain: A latent is a hidden numerical representation of an image. The diffusion model repeatedly removes noise in that
    representation. Text conditioning guides that denoising process. A trained autoencoder decoder then maps the final latent
    to pixels. The encoder is used when compressing training images or preparing an existing image for editing.


    Example: The historical 512-pixel design shown here uses 64 by 64 by four latent values. That is 16,384 values versus 786,432
    image values, a factor of 48. This dimensional comparison is arithmetic, not a runtime or file-size measurement, and other
    designs use different shapes.


    Ask: Which VAE component is needed for this fresh text-to-image route?


    Answer: The decoder is needed at the final step; an input-image encoder is unnecessary for the shown generation route.


    Watch out: Its specialised autoencoder training differs from our simple digit VAE; do not generalise these shapes to every
    diffusion model.'
  arrows:
  - null
  - noise [64,64,4]
  - latent [64,64,4]
  - pixels [512,512,3]
  branches:
  - from: 0
    to: 2
    label: conditioning
  feedback: state
  feedback_from: 2
  feedback_to: 2
- type: quiz
  title: Applications of VAEs
  notes: 'In short: Generation from the prior bypasses the encoder, even when the model was trained using encoded images.


    Explain: An encoder maps a supplied image to a distribution of possible codes. That route is used for reconstruction and
    training. For fresh generation, sample a code from the chosen prior instead. The decoder turns that code into pixel predictions.
    Neither averaging training images nor minimising a held-out score is the generation route.


    Example: A sixteen-dimensional model can decode a tensor [12,16] into twelve images [12,28,28]. No input image was required
    for this batch. A recipe analogy separates choosing ingredients from copying a meal, but random numerical codes do not have
    fixed named ingredients.


    Ask: Which option generates a new digit without an input image?


    Answer: C. Sample the prior and decode. The other routes either require an image or describe evaluation rather than generation.


    Watch out: Computing pixels is not enough to establish useful generation; inspect realism, variety and typical failures.'
  question: Which route generates a new digit without an input image?
  options:
  - Encode a test image twice
  - Average every training image
  - Sample the prior; decode
  - Minimise held-out reconstruction error
  answer: 2
- type: figure
  title: 'Application demo: detecting unusual inputs'
  figure: anomaly
  figure_width: 7.7
  bullets:
  - 'Train: digits'
  - 'Test: digits versus clothing'
  - 'Clothing outranks digits: {{W02_AUC_PCT}}'
  - Real defects require harder tests
  notes: 'In short: Reconstruction scores can distinguish unusual inputs in a demonstration, but realistic anomaly detection
    needs harder tests.


    Explain: An anomaly is an input considered unusual for the intended task. This archived VAE was trained on handwritten digits.
    Clothing images belong to a visibly different dataset. Reconstruction error is one score per image. ROC AUC measures how
    often an unusual example ranks above an ordinary example across possible thresholds.


    Example: The archived rank comparison favoured clothing {{W02_AUC_PCT}} of the time. Keep that figure attached to its original
    digit-versus-clothing setting. Clothing versus digits resembles checking fruit against tools: separation can be easy, while
    distinguishing a slightly damaged fruit is a much harder problem.


    Ask: Would this AUC establish reliable detection of factory scratches?


    Answer: No. Factory defects differ from these artificial anomalies, and decision thresholds and false alarms need realistic
    validation.


    Watch out: Choose thresholds on development examples, preserve a final test, and report failures rather than presenting
    an almost-one AUC as perfection.'
- type: bullets
  title: 'Responsible AI lens: VAEs and synthetic data'
  bullets:
  - Check for copied records
  - 'Ask: normal for whom?'
  - Show typical failures
  notes: 'In short: Synthetic outputs and anomaly scores still need privacy, fairness and honest reporting checks.


    Explain: Synthetic data is produced by a model rather than directly collected. A generator can still reproduce training
    records. An anomaly detector defines unusual relative to the data it learned. Under-represented ordinary examples can therefore
    receive high scores. Consent, appropriate permissions and transparent reporting matter when moving beyond public teaching
    datasets.


    Example: A generated face that closely matches one training portrait may reveal personal information. A detector trained
    on one lighting condition may flag harmless changes in another. These hypothetical examples describe failure mechanisms;
    they are not measured privacy or fairness findings from our digit experiment.


    Ask: Does calling a dataset synthetic make it anonymous?


    Answer: No. Check for copied or near-copied records and assess the data and intended use directly.


    Watch out: Show representative successes and failures; selecting only convincing outputs hides limits that matter to downstream
    decisions.'
  visual:
    type: mini_table
    header:
    - Example
    - Possible failure
    rows:
    - - Synthetic portrait
      - Near-copy
    - - New lighting
      - False anomaly
    caption: Synthetic does not mean anonymous
- type: lab
  title: 'Lab 2: implement and explore a VAE in PyTorch'
  steps:
  - Inspect image shapes
  - Implement five TODOs
  - Train a bounded CPU model
  - Decode grids and paths
  - Compare costs and anomalies
  runtime: CPU core took {{W02_CORE_TIME}}; longer training optional
  deliverable: Checks, figures, cost table, self-check answers
  notes: 'In short: The CPU lab implements real VAE learning, then explores codes, costs and an anomaly-score application.


    Explain: Complete the encoder, sampling, loss, interpolation and per-image score functions. Their checks test shapes and
    small numerical examples before training. The shared setup supplies the seed and CPU default. Core training uses a bounded
    dataset and a small dense model. Repeated beta training and conditioning are optional stretches with explicit switches.


    Example: Start with eight images: predict [8,2] encoder parameters and [8,784] logits. Then train and inspect generated
    grids. The lecture''s archived images came from earlier settings, so a shorter core run need not reproduce their quality
    or measured values.


    Ask: What should be recorded when reporting the lab''s behaviour?


    Answer: Record the settings, reconstruction and KL separately, typical outputs and limitations, plus the measured waiting
    time.


    Watch out: The recorded {{W02_CORE_TIME}} assumes MNIST is already downloaded; a first Colab run also spends time downloading
    data.'
- type: summary
  points:
  - Encode a distribution
  - Sample via shift and scale
  - Decode pixels
  - Balance reconstruction and KL
  - Generate from the prior
  - Evaluate separate behaviours
  notes: 'In short: A VAE learns image-dependent code distributions while keeping a chosen prior available for fresh generation.


    Explain: The encoder predicts mean and log-variance. Reparameterisation combines centre, positive spread and independent
    noise. The decoder maps the resulting code to pixel predictions. Reconstruction compares known pixels, while KL compares
    the encoder distribution with the prior. Fresh generation uses the prior and decoder without an input image.


    Example: For illustrative reconstruction cost 120 and KL three, beta one gives 123 and beta four gives 132. With logvar
    zero, standard deviation is one. These calculations check the mechanism; they are not experimental outcomes or evidence
    that one beta produces better images.


    Ask: What can low reconstruction error fail to prove?


    Answer: It can fail to prove good prior samples, meaningful latent coordinates, privacy or successful real-world anomaly
    detection.


    Watch out: Next week adds a learned realism checker; continue distinguishing training objectives from the evidence needed
    to evaluate outputs.'
