    Explain: A visual overview explains the information route. A worked example establishes the arithmetic. The original paper
    states the architecture and equations. Official API documentation defines implementation conventions. A coding walkthrough
    connects shapes with executable operations.

    Example: A student confused by softmax can redo the supplied [2,0,0] row before watching the attention video. A student
    confused by a mask can compare the custom blocked convention with the official SDPA allowed convention. Neither watching
    code run nor citing a paper replaces explaining a cell’s actual inputs and outputs.

    Ask: Which resource helps resolve a Boolean mask convention before implementation?

    Answer: The official PyTorch attention API documentation, alongside the custom function’s definition.

    Watch out: Keep historical model examples separate from current software behaviour. Predict shapes and run semantic checks
    before copying a walkthrough or claiming equivalent results.'
