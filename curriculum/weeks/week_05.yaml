subtitle: Follow text through a transformer, calculate attention, then build a small character model
mimlos:
- 1
- 3
objectives:
- Explain why attention helps with distant words.
- Turn text into numbered tokens and vectors.
- Calculate one attention mixture.
- Explain heads, masks and positions.
- Compare three transformer architectures.
- Build, train and evaluate a small model.
coverage:
- recurrent
- long-range
- parallel
- tokenisation
- embedding
- positional encoding
- rotary
- self-attention
- query
- key
- value
- multi-head
- cross-attention
- causal mask
- residual
- layer norm
- feed-forward
- encoder-only
- decoder-only
- encoder–decoder
- masked
- next-token
- perplexity
- KV cache
- FlashAttention
- mixture-of-experts
- long context
- vision transformer
- speech
slides:
- type: title
  figure: cover
  notes: 'Say: Imagine typing a message and seeing a suggested next word. Today we trace how a transformer makes that suggestion.
    Our lab predicts characters. The cover is an illustrative attention table, not a measured experiment. Analogy: A writing
    assistant consults the existing sentence. Ask: What helps predict a character after ROMEO and a colon? Answer: The earlier
    characters. In the play''s layout a speaker name and colon are followed by a new line and that speaker''s words. Common
    mistake: Treating a plausible continuation as knowledge of facts or understanding of the story.'
- type: outcomes
  notes: 'Say: Follow one piece of text through the model and explain each operation. We calculate attention before writing
    its equation, then implement the same operation in Python. Analogy: Learning an engine begins with following fuel through
    its parts. Ask: Which outcome is least familiar: vectors, attention or training? Answer: Any choice is useful; note the
    most common one and spend extra time on it. Common mistake: Thinking that knowing a model''s name means knowing what its
    inputs and outputs contain. We build understanding one operation at a time.'
- type: course_map
  title: Where we are in the course
  figure: beginner_course_map
  notes: 'Say: We have met VAEs, GANs and diffusion. This week''s transformer connects many later topics: language models, prompting,
    adaptation, multimodal systems, deployment, retrieval and agents. Analogy: Today''s station connects several routes on a
    railway map. Ask: Where have we already seen a model reading a prompt? Answer: Week 1''s SmolLM2 chat lab, and Week 4, where
    Stable Diffusion''s text encoder read the prompt. Common mistake: Treating a transformer as a chatbot or a complete application.
    It is an architecture; later weeks combine it with data, tools and software.'
- type: discussion
  title: Warm-up
  icon: fa:FaComments
  prompt: The animal avoided the street because it was tired. What does "it" refer to? Change "tired" to "wide".
  points:
  - Which words changed your answer?
  notes: 'Say: With tired, most readers choose the animal. With wide, they choose the street. Our later model inspection uses
    a closely related sentence. Analogy: A detective gathers clues from several sentence positions. Ask: Could the representation
    at it use an adjective that appears later? Answer: In a bidirectional encoder such as BERT, yes. In a causal decoder such
    as GPT-2, not at the position of it. Common mistake: Reading one attention plot as proof of a coreference decision.'
- type: section
  number: 1
  title: Why transformers?
  question: How can distant words share information?
  icon: fa:FaQuestionCircle
  notes: 'Say: An early name may matter near the end of a long sentence. Recurrent networks pass a memory state through successive
    steps. Attention connects allowed positions directly. Analogy: Compare passing a message along a queue with consulting the
    original speaker. Ask: Which route needs more intermediate steps when the sentence grows? Answer: The recurrent route. Information
    passes through every state in between, while attention links any two positions directly. Common mistake: Assuming direct
    access guarantees correct reasoning. The model must still learn useful comparisons and useful information mixtures.'
- type: figure
  title: Recurrence vs. attention
  figure: rnn_vs_attention
  notes: 'Say: Follow the recurrent arrows. Each hidden memory depends on the previous step, limiting parallelisation across
    time. Information and learning signals can weaken over many steps. LSTMs help with long-term dependencies. Analogy: A recurrent
    route is a relay; attention gives allowed destinations direct information routes. Ask: Why can transformer training process
    many known positions together? Answer: The whole training text is known, so with a causal mask every position can be predicted
    in one pass. Common mistake: Assuming generation is parallel too. Each new token still depends on the tokens generated before
    it.'
- type: compare
  title: RNN / LSTM vs. transformer
  columns:
  - head: Recurrent network
    icon: fa:FaLink
    points:
    - Reads one token at a time and passes a memory vector on
    - 'Example: by "it", "animal" is five steps back and may have faded'
    - Each step waits for the one before, even in training
    - Generates one token at a time
  - head: Transformer
    icon: fa:FaNetworkWired
    points:
    - Each token looks directly at every allowed earlier token
    - 'Example: "it" can weight "animal" highly in one step'
    - Training scores all known positions of a text at once
    - Still generates one token at a time
  notes: 'Say: RNN means recurrent neural network. An LSTM learns how to keep and forget information. A transformer removes
    recurrence from this sequence-processing path. Basic attention compares each query with each allowed key. Analogy: Replace
    a relay with a meeting where participants exchange information. Ask: If token count doubles, how many token pairs are there?
    Answer: Four times as many, because pairs grow with the square of the count. Common mistake: Answering twice as many. Direct
    routes bring computational costs as well as benefits.'
- type: section
  number: 2
  title: Tokens, embeddings and position
  question: How does text become a list of vectors?
  icon: fa:FaFont
  notes: 'Say: Python strings do not enter attention directly. A tokenizer assigns vocabulary IDs. An embedding table converts
    each ID into a vector, an ordered list of numbers. Position information tells the model where each item occurs. Analogy:
    A catalogue number selects a record from a table. Ask: Does vocabulary ID seven mean sentence position seven? Answer: No.
    Token identity and token position are different information, represented separately in our lab. Common mistake: Reading
    a token''s ID as its place in the sentence.'
- type: bullets
  title: From text to vectors
  icon: fa:FaTable
  bullets:
  - '**Token:** one unit of text; one character in our lab.'
  - '**ID:** its vocabulary number.'
  - '**Embedding:** its learned vector.'
  - 'Three IDs become three vectors: shape [3, 8] for width 8.'
  notes: 'Say: Use an illustrative three-character prefix, cat. Three positions remain three positions whatever IDs the tokenizer
    assigns. Looking up width-eight embeddings gives a three-by-eight table. The lab prints its actual vocabulary and uses a
    wider model. Analogy: Three catalogue numbers select three table rows. Ask: Which axis counts characters, and which counts
    features? Answer: In shape [3, 8], the first axis counts the three characters and the second counts the eight features.
    Common mistake: Treating an ID''s numerical size as its meaning. Token lookup vectors are also not automatically good document-search
    embeddings.'
- type: figure
  title: 'Positional encoding: sinusoidal and rotary'
  figure: positional
  notes: 'Say: Plain unrestricted self-attention has no built-in coordinates. Shuffling input rows shuffles output rows in the
    same way. Sinusoidal encoding adds fixed patterns. Our lab learns a vector per position. Rotary encoding rotates query and
    key feature pairs. Analogy: Give playing cards numbered places on a table. Ask: Is RoPE added to input embeddings like learned
    absolute positions? Answer: No. It rotates queries and keys inside attention. Common mistake: Assuming a longer context
    setting works without suitable training and testing.'
- type: section
  number: 3
  title: Attention
  question: How does one token combine information from others?
  icon: fa:FaEye
  notes: 'Say: Attention makes a new vector at each query position by mixing information from allowed source positions. We compute
    a small example before introducing notation. Analogy: A librarian matches your request against catalogue entries, then brings
    relevant contents. Ask: Which part should find sources, and which should carry their information? Answer: Queries and keys
    find sources, because their match makes the scores. Values carry the information mixed into the output. Common mistake:
    Treating matching and transferring as one operation.'
- type: figure
  title: Queries, keys and values
  figure: qkv
  notes: 'Say: Three learned projections turn an input vector into a query, a key and a value. Queries and keys make scores.
    The value branch bypasses score calculation and supplies the final mixture. Analogy: A request matches catalogue descriptions;
    book contents are what you take away. Ask: Do the weights multiply keys or values to form the output? Answer: Values. Common
    mistake: Reading queries, keys and values as literal questions, keywords or human meanings. They are learned numerical features.'
- type: figure
  title: 'Worked example: three tokens, $d_k = 2$'
  figure: attn_worked
  notes: 'Say: These are chosen classroom vectors, not trained-model measurements. Follow cat''s row first. Its query is [1,
    0]. Scaled scores are approximately [0.71, 0, 0.71], producing weights [0.40, 0.20, 0.40]. Analogy: Weights are shares in
    a recipe. Mixing the shown values gives approximately [0.60, 0.40]. Ask: Why does a zero score get positive weight? Answer:
    Softmax exponentiates scores, and exp of zero is one. Common mistake: Treating a zero score as blocked. Only a masked score
    of minus infinity gets zero weight.'
- type: equation
  title: Scaled dot-product attention
  eq: \mathrm{Attention}(Q,K,V)=\mathrm{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V
  read_as:
  - Compare; scale; make row weights; mix values.
  terms:
  - - Q / K / V
    - query / key / value tables
  - - T
    - 'transpose: swap axes'
  - - $d_k$
    - numbers per query/key
  notes: 'Say: Read inside outward, following the worked example. Q times K transposed compares every query with every key.
    Divide by the square root of query/key width. Softmax makes row weights; those weights multiply V. Analogy: The equation
    compresses our four-step recipe. Ask: For three queries and three keys, what is the score-table shape? Answer: Three by
    three: one score for each query and key pair. Common mistake: Using the feature width as a table dimension. The output width
    comes from the values.'
- type: quiz
  title: Why scale the scores?
  question: Why divide a dot product by $\sqrt{d_k}$?
  options:
  - To make every attention weight equal
  - To remove scores for future tokens
  - To prevent overly extreme softmax weights
  - To reduce the size of the vocabulary
  answer: 2
  notes: 'Say: Answer C. With independent, mean-zero, unit-variance entries, dot-product variance grows with d_k, the query/key
    width. Width sixty-four gives standard deviation eight. Dividing by eight controls score scale and can prevent weak softmax
    gradients. Analogy: Reduce volume before a sensitive amplifier. Ask: Which separate operation removes future positions?
    Answer: The causal mask. Common mistake: Thinking scaling masks the future or forces uniform weights. Learned comparisons
    can still produce strong preferences.'
- type: figure
  title: 'Multi-head attention: several views at once'
  figure: multihead
  notes: 'Say: Each head learns its own query, key and value projections in a smaller feature space. Join the head outputs,
    then mix them with an output projection. Width thirty-two with four heads means eight features per head. Analogy: Readers
    examine a passage through different lenses. Ask: What width returns after joining four eight-feature outputs? Answer: Thirty-two.
    Common mistake: Answering one hundred and twenty-eight, or giving each head a tidy human job. Real heads can have mixed
    roles.'
- type: equation
  title: Multi-head attention, formally
  eq:
  - \mathrm{head}_i=\mathrm{Attention}(XW_Q^{(i)},XW_K^{(i)},XW_V^{(i)})
  - \mathrm{MultiHead}(X)=\mathrm{Concat}(\mathrm{head}_1,\ldots,\mathrm{head}_h)W_O
  read_as:
  - Run smaller heads; join outputs; mix features.
  terms:
  - - X
    - input vectors
  - - i / h
    - head index / count
  - - W
    - learned projection; subscript names its role
  notes: 'Say: X is the input table. Superscript i identifies a head. W with Q, K or V names its learned projection. Concat
    joins features; W_O mixes joined outputs. Analogy: Join specialists'' short reports, then edit one report of the original
    width. Ask: Does a head index identify a layer? Answer: No. Heads and layers are different axes; every layer has its own
    set of heads. Common mistake: Assuming more heads means much more matrix work. At a fixed model width the main matrix-product
    work stays similar, while stored score-table memory grows with head count.'
- type: figure
  title: 'Causal masking: no peeking at the future'
  figure: causal_mask
  notes: 'Say: At position t, the model reads that input and earlier inputs. Its training target is position t plus one. Later-position
    scores become negative infinity before softmax, giving zero future weights. Analogy: Cover tomorrow''s answers while practising
    today''s prediction. Ask: For input cat and target ats, what may c see? Answer: Only c, not a or t. Common mistake: Blocking
    the diagonal. The current input stays allowed because it helps predict the following token.'
- type: compare
  title: Self-attention vs. cross-attention
  columns:
  - head: Self-attention
    icon: fa:FaSyncAlt
    points:
    - Queries, keys and values come from the same sequence
    - Each word gathers context from its own sentence
    - 'Example: "it" reads "animal" in the same sentence'
    - Used in every encoder and decoder block
  - head: Cross-attention
    icon: fa:FaExchangeAlt
    points:
    - Queries come from one sequence; keys and values from another
    - The output side reads the input side
    - 'Example: while writing French, the decoder reads the English source'
    - Stable Diffusion's image features read the prompt this way (week 4)
  notes: 'Say: Self-attention compares positions within one sequence. Cross-attention reads another sequence through the same
    calculation. Three translated-token queries and five source-token keys produce a three-by-five score table. Analogy: One
    group consults a second group''s notes. Ask: Where do translation-decoder queries come from? Answer: From decoder states.
    The encoded source states supply keys and values. Common mistake: Expecting a square score table. Cross-attention compares
    target positions with source positions, so the lengths can differ. Diffusion image features can similarly read prompt vectors.'
- type: figure
  title: 'A real BERT head: inspecting ''it'''
  figure: bert_summary
  notes: 'Say: This summary uses measured attention from pretrained BERT, separate from our character model. The selected head,
    layer {{w05_bert_layer}}, head {{w05_bert_head}}, gives animal weight {{w05_attention_weight}} from the query at it. It
    is the strongest of all 144 heads, chosen with the same rule as lab TODO 5. Analogy: A highlighted route shows a connection,
    not the whole journey''s purpose. Ask: Would the strongest head represent every head fairly? Answer: No. Inspect the full
    matrices and the distribution across heads. Common mistake: Treating a bright cell as proof of a coreference decision.'
- type: figure
  title: 'Measured GPT-2 heads: no weight on later tokens'
  figure: gpt2_causal_summary
  notes: 'Say: These are measured weights from pretrained GPT-2 for our sentence. Each row is one current token; each column
    is a token it may read. Everything above the diagonal is a later token, and its measured weight is exactly zero in all 144
    heads. The two heads still behave differently: the left head spreads weight over several earlier tokens, while the right
    head reads the previous token. At it, later tired or wide is blocked, so changing that adjective leaves the earlier it row
    unchanged. Analogy: A reader stopped halfway has not seen the final clue. Ask: Where could we test use of that adjective?
    Answer: At a later position, or in the prediction after the complete sentence. Common mistake: Reading unchanged earlier
    attention as proof that full-sentence reasoning failed.'
- type: quiz
  question: 'Scaled scores [2, 0, 0]: which weights does softmax produce?'
  options:
  - '[1.00, 0.00, 0.00]'
  - '[0.67, 0.17, 0.17]'
  - '[0.50, 0.25, 0.25]'
  - '[0.79, 0.11, 0.11]'
  answer: 3
  notes: 'Say: Answer D. Exponentiating gives approximately 7.39, one and one. Divide by their sum, approximately 9.39. The
    weights are approximately 0.79, 0.11 and 0.11. Rounded entries can total 1.01 although unrounded weights total one. Analogy:
    Convert positive amounts into shares of their total. Ask: Why is answer A too extreme? Answer: A puts all the weight on
    the largest score, like a hard maximum. Softmax turns each zero score into exp of zero, which is one, so each keeps about
    0.11. Common mistake: Dividing the original scores by their sum, which skips the exponentiation and also gives answer A.'
- type: section
  number: 4
  title: The transformer architecture
  question: What happens around the attention operation?
  icon: fa:FaCubes
  notes: 'Say: Attention is one operation inside a block. A complete block also transforms features at each position and preserves
    an input route. We follow these operations before comparing complete architectures. Analogy: A workshop combines group discussion
    with individual revision. Ask: Which stage exchanges information between positions? Answer: Attention. Common mistake: Thinking
    the feed-forward network mixes positions. It acts on each position separately, and within one layer the same feed-forward
    weights are used at every position.'
- type: figure
  title: Inside one transformer block
  figure: block
  notes: 'Say: This is our lab''s pre-norm block. Normalise features, apply attention, then add the unchanged
    input. Next normalise, apply a per-position feed-forward network and add its input. Shapes return to the original
    width. Analogy: Each stage proposes a correction while preserving the earlier draft. Ask: Add correction [0.3,
    −0.1] to input [1, 2]. Answer: [1.3, 1.9]. Common mistake: thinking a residual concatenates
    vectors or updates weights; it adds them.'
- type: figure
  title: Three families of transformers
  figure: three_archs
  notes: 'Say: Read each row from left to right. Encoder-only BERT reads both sides of the supplied input. Decoder-only GPT-2
    uses causal self-attention, and the dashed loop shows generation repeating with the longer prefix. Encoder-decoder T5 encodes
    a source, then generates an output using cross-attention. Analogy: An encoder annotates a document; a decoder continues
    it; an encoder-decoder transforms a source into a new document. Ask: Which standard family predicts a missing token from
    both neighbours? Answer: The encoder family, such as BERT. Common mistake: Using a standard BERT encoder as a chat generator.
    Family names describe information access, not guaranteed task quality.'
- type: figure
  title: Choose an architecture for the job
  figure: architecture_comparison
  notes: 'Say: Choose using required inputs and outputs. Complete-sentence classification suits an encoder. Extending a prefix
    suits a decoder. Mapping a source into a generated sequence suits an encoder-decoder. Modern decoders also perform many
    source-to-output tasks through prompting. Analogy: Choose a tool by the job before its brand. Ask: Can search and answer
    generation use different models? Answer: Yes. Applications can combine an embedding model for search with a decoder for
    answers. Common mistake: Treating architecture guidance as an exclusive task rule.'
- type: quiz
  question: Which combination fits document search plus generated answers?
  options:
  - Trained text embeddings; generating decoder
  - Decoder search; BERT chat
  - BERT alone for everything
  - Only encoder-decoders use attention
  answer: 0
  notes: 'Say: Answer A. A trained text-embedding model makes queries and documents comparable for search. A generating decoder
    then writes using the retrieved material. We build this combination in week twelve. Analogy: A librarian finds books before
    a writer composes an answer. Ask: Why does trained matter for the search component? Answer: Search needs vectors trained
    so that related queries and documents land close together. Arbitrary token lookup vectors do not do this. Common mistake:
    Answer D. All three transformer families use attention.'
- type: code
  title: Attention in PyTorch (what you write in the lab)
  code: "def attention(q, k, v, causal=False):\n    scores = q @ k.transpose(-2, -1) / q.size(-1)**0.5\n    if\
    \ causal:\n        n = q.size(-2)\n        blocked = torch.ones(n, n, dtype=torch.bool,\n                \
    \             device=q.device).triu(1)\n        scores = scores.masked_fill(blocked, float(\"-inf\"))\n  \
    \  weights = scores.softmax(dim=-1)\n    return weights @ v, weights"
  notes: 'Say: This compact example matches the calculation in the lab, which passes an explicit blocked-position mask. Keep
    the mask on q''s device for GPU tensors. Row softmax runs over source positions. Analogy: Each line implements a step in
    our recipe. Ask: Does True mean blocked in PyTorch''s built-in scaled_dot_product_attention? Answer: No. Our custom mask
    uses True for blocked; SDPA uses True for allowed. Common mistake: Passing the custom mask to SDPA unchanged. Use is_causal=True
    or invert the boolean mask.'
- type: section
  number: 5
  title: Training, efficiency and applications
  question: How does the model learn, and what costs time or memory?
  icon: fa:FaTachometerAlt
  notes: 'Say: Training compares model scores with known targets, then changes learned parameters to reduce prediction error.
    Inference uses learned parameters without that update. We then consider uncertainty, memory costs and non-text inputs. Analogy:
    Practice changes a musician''s skill; a performance uses the skill already learned. Ask: Does generating a new character
    update our model''s weights? Answer: No. Sampling extends the prefix; only the optimizer updates parameters. Common mistake:
    Mixing up the sampling loop and the training loop. They have different purposes.'
- type: compare
  title: Training objectives
  columns:
  - head: 'Masked: BERT'
    icon: fa:FaMask
    points:
    - Hide about 15% of tokens; predict them from both sides
    - 'Input: The [MASK] sat on the mat'
    - 'Target: cat'
    - Suits search and labelling
  - head: 'Next token: GPT'
    icon: fa:FaArrowRight
    points:
    - Predict each token from the ones before it
    - 'Text: "cats"'
    - 'Inputs: c, a, t'
    - 'Targets: a, t, s'
    - Suits generation, as in our lab
  - head: 'Missing spans: T5'
    icon: fa:FaExchangeAlt
    points:
    - Replace word spans with a marker
    - 'Input: The <X> on the mat'
    - 'Target: <X> cat sat'
    - The decoder writes the hidden words
  notes: 'Say: Targets come from text itself, called self-supervised learning. BERT predicts selected tokens using both sides.
    Our character decoder predicts the next character at every allowed position. T5 reconstructs missing spans. Analogy: Make
    exercises from a finished worksheet by hiding different parts. Ask: In cats, what target belongs to input c? Answer: a.
    Common mistake: Thinking shifted targets make the mask unnecessary. The causal mask must still block later inputs.'
- type: bullets
  title: 'Perplexity: read the model''s uncertainty'
  icon: fa:FaCalculator
  bullets:
  - Test on text kept separate from training.
  - 'Illustration: average loss = ln(4); perplexity = 4.'
  - Think of four equally likely choices.
  - Compare the same text and tokenizer.
  - Lower perplexity does not prove truthfulness.
  notes: 'Say: Perplexity is exp of average negative log-probability on separate test text. Ln of four is a classroom illustration,
    not our measured loss. Its uncertainty equals four equally likely choices, rather than exactly four candidates everywhere.
    Analogy: Summarise how surprising actual text was to a predictor. Ask: Can character and subword perplexities be compared
    directly? Answer: No. Tokenization changes the prediction task. Common mistake: Applying ordinary causal perplexity to masked
    BERT, or reading low perplexity as proof that answers are correct.'
- type: figure
  title: A real small transformer, trained for this lecture
  figure: chargpt_loss
  notes: 'Say: These values come from the stored measured experiment. Tiny Shakespeare is a small collection of Shakespeare
    text. The curve scores separate-text character predictions, not factual understanding. Your run may differ. Analogy: A learner
    recognises spelling and dialogue patterns while practising a narrow writing exercise. Ask: What would show whether generated
    dialogue maintains a coherent story? Answer: Reading actual samples and noting where they succeed and fail. Lower loss alone
    cannot show this. Common mistake: Assuming fluent samples mean understanding.'
- type: figure
  title: The cost of attention grows as n squared
  figure: complexity
  notes: 'Say: Full attention makes n squared comparisons for n positions. This plot shows theoretical one-head score-table
    memory, not a runtime benchmark. FlashAttention avoids storing the entire table. Restricted attention changes which positions
    interact. Analogy: Doubling a square''s side quadruples its area. Ask: Does avoiding storage remove all quadratic arithmetic?
    Answer: No. FlashAttention still computes every score; it only avoids storing the whole table. Common mistake: Assuming
    more available context guarantees reliable use. Grouped-query attention reduces KV storage and sliding windows restrict
    comparisons, but long context also needs suitable positions, training and evaluation.'
- type: figure
  title: 'Faster generation: the KV cache'
  figure: kv_cache
  notes: 'Say: Each layer stores keys and values for processed tokens. The newest known token supplies a query and new keys
    and values. Its query reads cached and current information to predict the next token. Analogy: Keep earlier calculations
    on a scratchpad. Ask: Does caching change the model''s learned task? Answer: No. It saves repeated work and consumes memory.
    Common mistake: Expecting our CharGPT to use a cache. It recomputes its context; the optional GPT-2 experiment measures
    caching separately, and timing depends on hardware.'
- type: figure
  title: 'Mixture-of-experts: run a few networks per token'
  figure: moe
  notes: 'Say: A mixture-of-experts layer offers several feed-forward networks. A learned router selects a few for each token
    vector. Routing weights combine their outputs. More total parameters need not all run for one token. Analogy: Send a case
    to selected specialists. Ask: Do expert names guarantee recognisable human specialties? Answer: No. Roles are learned during
    training. Common mistake: Assuming more parameters come with free computation. Every expert''s weights need storage, and
    routing and moving them can add cost.'
- type: figure
  title: 'Beyond text: images and speech'
  figure: vit_patches
  notes: 'Say: A Vision Transformer embeds image patches into vectors with position information. Whisper encodes audio spectrogram
    features, then generates transcript text with a decoder. Analogy: Cut a picture into numbered tiles, then exchange information
    between tile representations. Ask: Are patches words, or do they share a useful vector-sequence interface? Answer: They
    are not words, but like tokens they become a sequence of vectors that the same transformer operations can process. Common
    mistake: Assuming each modality needs a different architecture. Diffusion transformers likewise process image-latent patches,
    and transformers also handle code and time series.'
- type: quiz
  title: What does an attention picture show?
  question: A bright attention cell supports which claim?
  options:
  - This head assigns that source high weight
  - The model's answer to the question is true
  - Every head in the model resolved the pronoun
  - We proved how the model reasoned to its answer
  answer: 0
  notes: 'Say: Answer A. One cell shows a mixing weight in one head for one input. Values, residual routes and feed-forward
    layers also affect outputs. Removing or changing a component can test its effect. Analogy: Traffic counts show a busy route,
    not why a traveller chose a destination. Ask: What makes a displayed head a biased example? Answer: Selecting the strongest-looking
    head without saying so. Common mistake: Reporting attention pictures but not the compute used. Also consider that token
    costs differ between languages.'
- type: lab
  title: 'Lab 5: build attention and a small GPT'
  steps:
  - Check attention and masks.
  - Assemble heads and blocks.
  - Train next-character predictions.
  - Measure loss; sample text.
  - Inspect pretrained attention.
  runtime: Colab T4 GPU; CPU uses fewer steps. About 10 min on a 4 GB laptop GPU after downloads
  deliverable: Checks, loss curve, samples and explanations
  notes: 'Say: Read, predict, run, change and check. Complete attention checks before training. Your character model is separate
    from pretrained BERT and GPT-2 used for inspection. Record measured results from your run. Analogy: Assemble a small engine
    before inspecting larger engines built by others. Ask: Which function creates next-character targets? Answer: get_batch,
    by shifting the text one position. Common mistake: Copying the lecture''s measurements instead of reporting your own results,
    or expecting smoke-run samples to show full-training quality.'
- type: summary
  points:
  - IDs become vectors with positions.
  - Queries match keys; weights mix values.
  - Heads offer learned views.
  - Masks block future information.
  - Blocks add corrections.
  - Training updates weights; inference extends prefixes.
  - Evaluate predictions and inspect limitations.
  notes: 'Say: Rebuild the route aloud. IDs select vectors; positions supply order; blocks exchange and transform information.
    A vocabulary head scores next tokens. Training checks known targets; generation samples with fixed learned weights. Analogy:
    Reassemble an engine from input route to output route. Ask: Which operation would you explain first to someone new to transformers?
    Answer: Any operation works if it is explained with its inputs and outputs. Common mistake: Replacing mechanisms with model
