subtitle: "Attention is how modern AI reads: queries, keys and values, multi-head attention, and the transformer block behind every LLM"
mimlos: [1, 3]
objectives:
  - "Explain the **limitations of recurrent networks** (long-range dependencies, sequential computation) that transformers address."
  - "Describe **tokenisation, embeddings** and why transformers need **positional encoding** (sinusoidal, rotary)."
  - "Compute **scaled dot-product self-attention** with queries, keys and values, and explain the √d_k scaling."
  - "Explain **multi-head**, **cross-attention** and **causal masking**, and interpret attention maps critically."
  - "Describe the transformer block and the **encoder-only, decoder-only and encoder–decoder** families."
  - "Explain training objectives, **perplexity**, efficiency variants (**KV cache, efficient attention, mixture-of-experts, long context**) and applications beyond text; implement attention in PyTorch."
