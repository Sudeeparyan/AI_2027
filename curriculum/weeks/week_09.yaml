    are available as open weights on Hugging Face. Next week adds the natively multimodal assistants and generators.


    Ask students: Which model in the table would you pick to search a sound library with text?

    Expected answer: CLAP, the audio-text dual encoder.


    Common mistake: Choosing a model without checking its licence and supported modalities.'
- type: section
  number: 5
  title: Audio, evaluation and responsible AI
  question: How well does it work, and at what cost to whom?
  icon: fa:FaBalanceScale
  notes: 'The final section returns to audio with real Whisper results, defines word error rate, summarises how
    multimodal models are evaluated, and discusses the responsible-AI issues of multimodal data, which are serious:
    consent, harmful content in scraped datasets, bias in zero-shot classification, and surveillance. About twenty
    minutes.


    Analogy: A transcription is an intermediate message passed to search. A wrong word can change every later result.


    Ask students: Four of five search results match the query class. What is precision@5?

    Expected answer: It is 4/5 = 0.8. This does not say how many of all relevant gallery images were retrieved.


    Common mistake: WER, image accuracy and retrieval precision use different denominators and answer different
    questions.'
- type: figure
  title: Speech recognition with Whisper (real)
  figure: lab_spectrogram
  bullets:
  - '{{WER_NOTES}}'
  - This plot uses linear frequency bins; Whisper uses log-mel features.
  stack: true
  notes: 'An illustrative spectrogram of the first LibriSpeech clip from the lab, with time on the horizontal axis and linear
    frequency bins on the vertical. This plot is not Whisper''s exact preprocessing, which uses log-mel features. Bright bands
    show harmonics of the speaker''s voice. Whisper transcribed ten clips in the lab run with the word error rate reported in
    the bullet. LibriSpeech is clean read audiobook speech, one of the easier benchmarks.


    Analogy: A transcription is an intermediate message passed to search; a wrong word can change every later result.


    Ask students: Why might Whisper do worse on a recorded lecture than on LibriSpeech?

    Expected answer: LibriSpeech is clean read speech; lectures add noise, accents, technical terms and overlapping speakers.


    Common mistake: Treating this spectrogram plot as Whisper''s input. Whisper uses log-mel features.'
- type: equation
  title: Word error rate (WER)
  eq: \mathrm{WER} = \frac{S + D + I}{N}
  read_as:
  - Count substitutions S, deletions D and insertions I.
  - Divide their sum by the reference word count N.
  - One missing word among six gives WER = 1/6.
  terms:
  - - S / D / I
    - Changed / missing / extra words
  - - N
    - Reference words
  notes: 'Word error rate is the standard metric for speech recognition. The hypothesis is aligned to the reference with the
    minimum number of word edits, the edit or Levenshtein distance used in the lab''s TODO, and the errors are divided by the
    number of reference words. Work through the example. Note that WER can exceed one hundred percent if the system inserts
    many words, and that it treats all errors equally, so a wrong name costs the same as a wrong article.


    Ask students: A reference has 10 words; the output has 2 substitutions and 1 insertion. What is the WER?

    Expected answer: (2 + 0 + 1) / 10 = 0.3.


    Common mistake: Assuming WER cannot exceed 100%. Many inserted words can push it higher.'
- type: table
  title: How multimodal models are evaluated
  header:
  - Capability
  - Metric
  - Common benchmark
  rows:
  - - Classification
    - Accuracy
    - CIFAR / ImageNet
  - - Retrieval
    - Recall@k
    - COCO / Flickr30k
  - - Captioning
    - CIDEr / CLIPScore
    - COCO
  - - VQA
    - Accuracy
    - ChartQA / DocVQA
  - - Speech
    - WER
    - LibriSpeech
  - - Fairness
    - Group comparisons
    - Task audit
  notes: 'Each capability has standard metrics and benchmarks. Retrieval uses recall at k in both directions, typically on MS-COCO
    and Flickr30k. Captioning uses reference-based metrics such as CIDEr plus CLIPScore and human rating. Visual question answering
    has many benchmarks, including ones for charts and documents that matter for business applications. Speech recognition uses
    word error rate on benchmarks such as LibriSpeech and the multilingual FLEURS.


    Ask students: Which metric would you report for text-to-image search?

    Expected answer: Recall@k, in both directions if both are used.


    Common mistake: Comparing WER, accuracy and precision as if they shared a denominator.'
- type: bullets
  title: 'Responsible AI lens: multimodal data and models'
  icon: fa:FaUserShield
  bullets:
  - Check image, audio and video rights.
  - Audit harmful errors across relevant groups.
  - Printed text and altered audio can mislead models.
  - Protect privacy; review dataset curation and consent.
  notes: 'Multimodal data raises the sharpest responsible-AI issues of the module. Scraped images, voices and videos rarely
    come with consent. In December 2023 the Stanford Internet Observatory reported child sexual abuse material in LAION-5B,
    a dataset used to train open image models; LAION withdrew it and released a cleaned version in 2024. CLIP''s own paper and
    follow-up audits reported biased misclassification of people into offensive categories. OpenAI showed that writing a word
    on an object can fool CLIP.


    Ask students: How can a word written on an object fool CLIP?

    Expected answer: CLIP learned to read text in images, so a handwritten label can outweigh the visual evidence.


    Common mistake: Assuming scraped images and voices were collected with consent.'
- type: lab
  title: 'Lab 9: CLIP embeddings, zero-shot classification and Whisper'
  steps:
  - Encode image/text pairs; inspect similarity.
  - Compare class prompts and classification errors.
  - Search images; measure precision@k.
  - Compare paired/shuffled contrastive loss.
  - Inspect PCA; transcribe and measure WER.
  runtime: Colab T4 GPU or CPU (slower). About 1 min on a 4 GB laptop GPU after downloads
  deliverable: Notebook with similarity plots, accuracy table, retrieval metrics, loss values, WER table and three
    answers
  notes: 'The lab implements the descriptor''s tutorial: understand modalities and embeddings; explore text-image embeddings,
    alignment and retrieval with pretrained models like CLIP. It adds the contrastive loss, so students connect the equation
    to real embeddings, and a speech part with Whisper and word error rate, so that audio is covered as the descriptor''s modality
    list requires. The slide results came from this notebook. The chained speech-to-image retrieval previews the cross-modal
    systems of week 10.


    Ask students: Which lab part chains two modalities?

    Expected answer: The speech-to-image search: Whisper''s transcript becomes a CLIP text query.


    Common mistake: Comparing your scores with the slides without noting hardware and library versions.'
- type: summary
  points:
  - Modalities become vectors.
  - Alignment learns correspondence; fusion combines information.
  - CLIP compares pairs in both directions.
  - Frozen encoders classify and retrieve.
  - Whisper transcribes; WER counts word errors.
  - Check task performance, rights and group differences.
  notes: 'Recap the six points. Students should be able to define the key terms, write and explain the contrastive loss, and
    describe how zero-shot classification and retrieval work. Next week we build on these foundations: multimodal LLMs that
    chat about images and documents, generation across modalities including speech and video, how multimodal generation is evaluated,
    and responsible use including deepfakes and content provenance.


    Ask students: In one sentence, how does CLIP label an image class it was never trained to label?

    Expected answer: It compares the image vector with vectors of class descriptions and picks the most similar.


    Common mistake: Calling zero-shot training-free in every sense. CLIP itself was trained on 400 million pairs.'
