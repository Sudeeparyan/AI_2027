subtitle: Connect words, images and speech through vectors, matching scores and careful checks
mimlos:
- 1
- 2
- 4
objectives:
- Define **modality** (a data type), representation, alignment, fusion and grounding with concrete examples.
- 'Explain how image, text and audio encoders turn inputs into **vectors**: lists of numbers.'
- Trace **CLIP** training on matching image-caption pairs and read its contrastive loss; compare SigLIP.
- Use a frozen model for image classification and text-to-image search; measure accuracy and precision@k.
- Compare multimodal architectures, including the vision-encoder-to-LLM design used by LLaVA.
- Use Whisper for speech recognition; calculate word error rate and discuss data rights, bias and attacks.
coverage:
- modality
- cross-modal
- multimodal
- alignment
- fusion
- early fusion
- late fusion
- cross-attention
- representation learning
- vision transformer
- audio
- spectrogram
- shared embedding space
- contrastive
- CLIP
- SigLIP
- zero-shot
- retrieval
- dual encoder
- fusion encoder
- encoder–decoder
- vision-language
- Whisper
- word error rate
- modality gap
slides:
- type: title
  figure: cover
  notes: 'Welcome to week 9, the start of the multimodal part of the module. So far our models have handled one kind of data
    at a time: images in weeks 2 to 4, text in weeks 5 to 8. Real-world information mixes text, images, audio and video, and
    the most capable systems of 2026 handle them together.


    Analogy: A photo library whose search box accepts words needs a numerical description of every picture.


    Ask students: Which earlier week already joined an image model and a text model?

    Expected answer: Week 4: Stable Diffusion''s CLIP text encoder conditioned the image generator, and the lab''s CLIP score
    measured prompt alignment.


    Common mistake: Thinking multimodal always means one giant model. Many systems join separate encoders.'
- type: outcomes
  notes: 'Six outcomes, matching the descriptor''s week 9 and MIMLO 2, which asks students to analyse and apply multimodal techniques
    including alignment and cross-modal reasoning. The first two are vocabulary and representations. The third, contrastive
    learning with CLIP, is the technical core and includes a loss students should be able to write and compute. The fourth surveys
    architectures and vision-language transformers. The fifth adds audio with Whisper and evaluation metrics, touching MIMLO
    4.


    Ask students: Which outcome includes a loss you should be able to compute by hand?

    Expected answer: Contrastive learning with CLIP.


    Common mistake: Treating alignment and fusion as synonyms.'
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: search photos with no captions'
    minutes: 5
  - title: 1 · Modalities and terminology
    minutes: 15
  - title: 2 · Representation learning across modalities
    minutes: 17
  - title: '3 · Contrastive learning: CLIP and SigLIP'
    minutes: 33
  - title: 4 · Multimodal architectures
    minutes: 20
  - title: 5 · Audio, evaluation and responsible AI
    minutes: 20
  - title: Lab preview and wrap-up
    minutes: 7
  notes: 'The plan follows the descriptor: definition of modalities; key concepts and terminology; representation learning across
    modalities; key multimodal architectures and models; contrastive learning with CLIP; and vision-language transformers. Section
    three is the longest because it contains the maths and the real results from the lab, run in advance on CIFAR-10. Take the
    break after section three.


    Ask students: Why does section three take the longest?

    Expected answer: It contains the contrastive loss, its maths and the real lab results.


    Common mistake: Skipping the maths and remembering only model names.'
- type: discussion
  title: Warm-up
  icon: fa:FaImages
  prompt: Find “a dog on a beach” among uncaptioned holiday photos. What must the system compare?
  points:
  - 'Try a second query: “red umbrella”.'
  - Name the input and desired output.
  notes: 'Give two minutes. Students usually propose training a classifier, then realise that they would need a
    class for every possible query and labelled data for each. The key insight to draw out is the last point: if
    text and images can be turned into vectors in the same space, where a matching image and description land close
    together, then any query can be compared with any image by a similarity score, with no task-specific training.


    Analogy: Think of a photo library whose search box accepts words. The stored pictures need a comparable numerical
    description.


    Ask students: What goes into image search, and what comes out?

    Expected answer: A text query goes in; a ranked set of gallery images comes out.


    Common mistake: A search result is a model match, not proof that every requested detail is present.'
- type: section
  number: 1
  title: Modalities and terminology
  question: What exactly does 'multimodal' mean?
  icon: fa:FaLayerGroup
  notes: 'Section one establishes the vocabulary: modalities and how each is represented, the precise meanings of
    cross-modal, multimodal, alignment and fusion, the difference between multimodal understanding and generation,
    and the three ways of fusing modalities. These terms appear in the exam and in every multimodal paper. About
    fifteen minutes.


    Analogy: Two languages can describe the same scene. Encoders supply comparable numerical descriptions; fusion
    combines information.


    Ask students: How are alignment and fusion different?

    Expected answer: Alignment learns correspondence; fusion combines information inside a system.


    Common mistake: Sharing vector dimensions alone does not teach matching meanings.'
- type: figure
  title: 'Four main modalities, one idea: turn everything into vectors'
  figure: modalities
  notes: 'A modality is a type of data with its own structure: text is a sequence of discrete symbols; images are two-dimensional
    grids of pixels; audio is a one-dimensional waveform, usually converted to a time-frequency spectrogram; video is a sequence
    of images with time and often audio. Each modality is split into units: sub-word tokens, image patches, spectrogram frames
    or codec tokens, and video frames with patches. A modality-specific encoder turns those units into vectors.


    Analogy: Different instruments can be written in the same musical notation.


    Ask students: What unit does each modality become before its encoder?

    Expected answer: Text becomes sub-word tokens, images become patches, audio becomes spectrogram frames or codec tokens,
    and video becomes frames split into patches.


    Common mistake: Thinking Whisper reads raw audio samples. It uses log-mel spectrogram features.'
- type: table
  title: Key terms
  header:
  - Term
  - Meaning
  - Example
  rows:
  - - Modality
    - A type of data
    - A photo; a voice recording
  - - Unimodal
    - One type only
    - A text-only chatbot
  - - Cross-modal
    - From one type to another
    - Search photos with words
  - - Multimodal
    - Several types together
    - Ask a question about a photo
  - - Alignment
    - Learn which items correspond
    - A photo lands near its caption
  - - Fusion
    - Combine information in a model
    - LLaVA joins image and question
  - - Grounding
    - Link a claim to evidence
    - Box the dog the caption names
  notes: 'These definitions come straight from the descriptor''s list: modality, cross-modal, multimodal, alignment and fusion;
    grounding is added because it appears in many vision-language papers. The distinction between cross-modal and multimodal
    is subtle: cross-modal emphasises going from one modality to another, for example text-to-image search, while multimodal
    means processing several together. Alignment is about correspondence between modalities; fusion is about how information
    is combined inside a model. Encourage students to use these terms precisely in their reports.


    Ask students: Is text-to-image search cross-modal or multimodal?

    Expected answer: Cross-modal: the query is text and the results are images. A model that reads an image and a question together
    is multimodal.


    Common mistake: Using alignment and fusion interchangeably. Alignment learns correspondence; fusion combines information.'
- type: compare
  title: Multimodal understanding vs. multimodal generation
  columns:
  - head: Understanding
    icon: fa:FaEye
    points:
    - Media → text, labels or vectors
    - 'Whisper: lecture audio → transcript'
    - 'CLIP: query → matching photos'
  - head: Generation
    icon: fa:FaPaintBrush
    points:
    - Text → images, speech or video
    - 'SD-Turbo: prompt → picture'
    - 'MMS-TTS: sentence → speech'
  callout: Check the exact model’s supported inputs and outputs.
  notes: 'Separate the two directions. Understanding maps non-text inputs to text, labels or vectors; generation maps text to
    non-text outputs. They are closely linked: the text encoder inside Stable Diffusion from week 4 is CLIP''s text transformer,
    and we measured prompt alignment with CLIP score in the week 4 lab. This week focuses on understanding and alignment; next
    week covers multimodal LLMs and generation across modalities, including audio and video.


    Ask students: Is Whisper an understanding model or a generation model?

    Expected answer: Understanding: it maps audio to text.


    Common mistake: Assuming a model can produce every modality it can read. Check its supported outputs.'
- type: figure
  title: Three ways to fuse modalities
  figure: fusion
  bullets:
  - '**Early fusion:** combine inputs first.'
  - '**Late fusion:** compare separately encoded outputs.'
  - '**Cross-attention:** one modality queries another.'
  stack: true
  notes: 'Fusion is about where information is combined. Early fusion puts all modalities into one model from the start, allowing
    rich interactions, at higher cost; natively multimodal models such as those in the Gemini family process interleaved text
    and image tokens. Late fusion keeps separate encoders and combines only their outputs, as CLIP does with a similarity score;
    it is efficient because each item is encoded once, which is ideal for search over millions of images.


    Analogy: Early fusion is a joint meeting; late fusion compares two separate reports; cross-attention lets one team question
    the other.


    Ask students: Why is late fusion efficient for searching millions of images?

    Expected answer: Each image is encoded once and stored; a new query needs one text encoding and a similarity lookup.


    Common mistake: Assuming early fusion is always better. Every pair must pass through the model together, which costs more.'
- type: quiz
  question: CLIP encodes images and texts separately and compares them with cosine similarity. Which fusion strategy
    is this?
  options:
  - Late fusion
  - Early fusion
  - Cross-attention fusion
  - 'No fusion: CLIP is unimodal'
  answer: 0
  notes: 'Answer: A, late fusion. CLIP''s image and text encoders never see each other''s inputs; the modalities meet only at
    the end, in the similarity score between two embeddings. This is what makes CLIP so efficient for retrieval: you can encode
    a million images once, store the vectors, and compare any new text query against them. B and C describe designs where modalities
    interact inside the network. D is wrong: CLIP is multimodal because it aligns two modalities in one space.


    Ask students: Why is option D wrong?

    Expected answer: CLIP aligns two modalities in one space, so it is multimodal.


    Common mistake: Thinking CLIP''s encoders see each other''s inputs. They meet only in the similarity score.'
- type: section
  number: 2
  title: Representation learning across modalities
  question: How does each modality become vectors that can be compared?
  icon: fa:FaVectorSquare
  notes: 'Section two covers representation learning: how images, audio and video are turned into sequences of vectors
    that transformers can process, and the idea of a shared embedding space in which different modalities can be
    compared directly. It links back to tokens and embeddings from weeks 5 and 6. About seventeen minutes.


    Analogy: A map can record coordinates for different places. An embedding stores learned features, rather than
    a literal address.


    Ask students: Can we directly compare arbitrary image and text vectors of equal length?

    Expected answer: No. Encoders need a learned shared representation and compatible preprocessing.


    Common mistake: A two-dimensional plot discards information from the full vectors.'
- type: bullets
  title: 'Representation learning: vectors that capture meaning'
  icon: fa:FaCompass
  bullets:
  - A **representation** describes useful input features with numbers.
  - '**Alignment** learns correspondence from paired examples.'
  - Noisy captions can teach wrong matches; more data does not remove the problem.
  notes: 'Representation learning is the thread connecting this whole module: VAE latents, transformer embeddings and now multimodal
    embeddings are all vectors that capture meaning. Unimodal models learn good representations within one modality by self-supervision.
    Multimodal alignment needs paired data, where two modalities describe the same thing, and the web provides it at enormous
    scale: images with alt-text captions, videos with subtitles, podcasts with transcripts. This data is noisy, since captions
    often do not describe the image well, and scale does not remove misleading or missing labels.


    Ask students: What makes web image-caption pairs noisy?

    Expected answer: Alt text often describes the page or the product, not what the picture shows.


    Common mistake: Assuming more pairs remove the noise. Wrong captions still teach wrong matches.'
- type: cards
  title: Every modality as a sequence of tokens
  cards:
  - head: Images
    icon: fa:FaTh
    text: A 224 × 224 photo becomes 49 patches of 32 × 32 pixels, each with a position.
  - head: Audio
    icon: fa:FaWaveSquare
    text: Spectrogram frames become vectors, as in Whisper; or a codec turns sound into IDs.
  - head: Video
    icon: fa:FaFilm
    text: Frames sampled a few times a second, cut into patches with time positions.
  - head: Discrete tokens
    icon: fa:FaCubes
    text: A learned codebook maps image or audio pieces to IDs a model can predict.
  notes: 'The unifying trick of modern multimodal AI is to turn every modality into a sequence of tokens, so the same transformer
    machinery applies. Images become patches, as in the Vision Transformer from week 5. Audio is first converted into a spectrogram,
    a picture of frequency content over time; its frames become tokens, as in Whisper, or audio can be compressed into discrete
    codec tokens for generation.


    Analogy: Cutting a photo into numbered tiles before describing each tile.


    Ask students: A 224 × 224 image is cut into 32 × 32 patches. How many patch tokens is that?

    Expected answer: 7 × 7 = 49.


    Common mistake: Forgetting positions. Patch vectors need position information, as words do.'
- type: figure
  title: 'Audio as input: the Whisper pipeline'
  figure: whisper_pipeline
  bullets:
  - Waveform → log-mel features → audio encoder.
  - Text decoder attends to audio and predicts words.
  - Check transcription against a reference.
  stack: true
  notes: 'Whisper, released by OpenAI in 2022 and available as open weights, is our audio representation example. The waveform,
    sampled at sixteen kilohertz, becomes a log-mel spectrogram. The encoder processes these time-frequency features. The decoder
    generates transcript tokens while attending to the audio, using the encoder-decoder design from week 5. It was trained on
    680,000 hours of weakly supervised audio with web transcripts. Large datasets still require data-quality checks and evaluation
    across accents and recording conditions. Students transcribe real speech with Whisper in the lab.


    Analogy: A stenographer listens to the recording, then types the transcript word by word.


    Ask students: Which part of Whisper attends to the audio while writing?

    Expected answer: The decoder, through cross-attention to the encoder''s outputs.


    Common mistake: Assuming 680,000 hours of training removes accent and noise errors. Evaluate on your own recordings.'
- type: bullets
  title: Shared embedding spaces
  icon: fa:FaProjectDiagram
  bullets:
  - Learn comparable image and text vectors from matching pairs.
  - Normalised dot products give cosine similarity.
  - Rank candidates; a high score does not prove every detail matches.
  notes: 'A shared embedding space is the direct answer to the warm-up. If a photo of a dog on a beach and the text a dog on
    a beach at sunset map to nearby vectors, search becomes a nearest-neighbour lookup. The space enables many applications
    without retraining: retrieval in both directions, zero-shot classification by comparing an image with class descriptions,
    deduplication and clustering of image collections. CLAP does this for audio and text.


    Analogy: A shared map on which a place and its description land at the same spot.


    Ask students: Name two uses of a shared space that need no retraining.

    Expected answer: Retrieval in either direction and zero-shot classification; also deduplication and clustering.


    Common mistake: Reading a high similarity score as proof that every detail matches.'
- type: section
  number: 3
  title: 'Contrastive learning: CLIP and SigLIP'
  question: How do you teach a model that a picture and a sentence mean the same thing?
  icon: fa:FaMagnet
  notes: 'Section three is the technical core. We describe CLIP, its training data and objective, write the contrastive
    loss, and then look at what CLIP can do without further training, zero-shot classification and retrieval, using
    real results from the lab run on CIFAR-10. We then introduce SigLIP''s sigmoid loss and the modality gap. About
    thirty minutes; take the break afterwards.


    Analogy: Matching photo cards with caption cards is a batch-wide identification game. Read one row, then one
    column.


    Ask students: Three pairs have equal choice probabilities. What is their loss?

    Expected answer: Each correct choice has probability 1/3, so the uniform-choice loss is ln 3, about 1.10.


    Common mistake: Calculating loss does not train a model; training also updates weights with gradients.'
- type: bullets
  title: 'CLIP: Contrastive Language–Image Pre-training (OpenAI, 2021)'
  icon: fa:FaLink
  bullets:
  - Two encoders; one shared comparison space.
  - Train by identifying each image’s caption and each caption’s image.
  - CLIP used 400 million web pairs and batches of 32,768.
  - Use class descriptions without task-specific training.
  notes: 'CLIP, by Radford and colleagues in 2021, is one of the most influential models in generative AI. Its data was four
    hundred million image-text pairs collected from the internet. Its architecture is a dual encoder: an image encoder, a Vision
    Transformer in the model we use, and a text transformer, each projecting into a shared five-hundred-and-twelve-dimensional
    space. The training objective is contrastive: within each batch, every image must pick out its own caption from all the
    captions, and every caption its own image.


    Ask students: In a batch of 32,768 pairs, how many wrong captions does each image compete against?

    Expected answer: 32,767.


    Common mistake: Thinking CLIP was trained on class labels. It learned from captions.'
- type: figure
  title: The contrastive objective as a matrix
  figure: clip_matrix
  notes: 'Picture a batch of N image-caption pairs as an N by N matrix of similarities: row i is image i, column j is caption
    j. The correct pairs are on the diagonal. Training increases the diagonal similarities and decreases the off-diagonal ones,
    treating each row as a classification problem, which caption belongs to this image, and each column as a classification
    problem, which image belongs to this caption.


    Analogy: Matching photo cards with caption cards: read one row, then one column.


    Ask students: In a 4 × 4 similarity matrix, how many cells are correct pairs?

    Expected answer: Four, on the diagonal; the other twelve are negatives.


    Common mistake: Training only one direction. CLIP averages the image-to-text and text-to-image losses.'
- type: equation
  title: The contrastive (InfoNCE) loss
  eq:
  - \mathcal{L}_{\mathrm{img}\to\mathrm{txt}} = -\dfrac{1}{N}\sum_{i=1}^{N} \left[ s_{ii} - \log \sum_{j=1}^{N}
    \exp(s_{ij}) \right]
  - s_{ij} = \dfrac{u_i \cdot v_j}{\tau}, \qquad \mathcal{L}_{\mathrm{CLIP}} = \frac{1}{2}\left(\mathcal{L}_{\mathrm{img}\to\mathrm{txt}}
    + \mathcal{L}_{\mathrm{txt}\to\mathrm{img}}\right)
  read_as:
  - Normalise vectors; divide dot products by temperature $\tau$.
  - Softmax turns scores into caption-choice probabilities.
  - Cross-entropy penalises wrong choices; average both directions.
  terms:
  - - u / v
    - Image / text vectors
  - - $\tau$
    - Temperature
  - - N
    - Pairs in this batch
  panel_h: 2.2
  notes: 'Write the loss on the board. The similarity s i j is the cosine similarity between image i and text j, divided by
    a temperature; CLIP learns the temperature and it ends up around one hundredth, which sharpens the softmax, the same temperature
    idea as in week 1. For each image, the softmax over all captions should put its probability on the matching caption; the
    loss is the negative log of that probability, a cross-entropy with the diagonal as the target.


    Ask students: What does a temperature of 0.01 do to the scores?

    Expected answer: It multiplies them by 100, which sharpens the softmax so the best match dominates.


    Common mistake: Forgetting to normalise the vectors. Without it the dot product is not a cosine similarity.'
- type: bullets
  title: The loss in numbers (from the lab)
  icon: fa:FaCalculator
  bullets:
  - '{{LOSS_NOTES}}'
  - 'Compare measured loss with uniform choice: ln N.'
  - Frozen embeddings illustrate the objective; no optimiser runs.
  notes: 'These numbers come from the lab run: six CIFAR-10 images from different classes and six matching captions, embedded
    with the pretrained CLIP. With the correct pairing the loss is far below the uniform-choice baseline of the log of six,
    about 1.79, because each image is most similar to its own caption. When the captions are shuffled the loss rises above that
    baseline, because the model is now confidently wrong. Students compute exactly this in part four of the lab, which makes
    the abstract equation concrete.


    Ask students: Why does shuffling the captions raise the loss above ln 6?

    Expected answer: The model is confidently wrong: each image still prefers its true caption, which is now in the wrong position.


    Common mistake: Thinking this calculation trains CLIP. No optimiser runs; the embeddings stay frozen.'
- type: figure
  title: 'Zero-shot classification: describe the classes, then compare'
  figure: zeroshot_pipeline
  notes: 'Zero-shot classification with CLIP takes no training. Write each class name into a caption template such as a photo
    of a cat, embed all the captions with the text encoder, embed the image with the image encoder, and predict the class whose
    caption is most similar. The classifier is defined entirely by text, so changing the classes means changing a list of words.
    This is also why prompt engineering matters for CLIP, as the next slide shows.


    Analogy: A matching game in which you write the label cards yourself.


    Ask students: How do you add an eleventh class to a zero-shot classifier?

    Expected answer: Write one more caption, such as a photo of a bicycle, and embed it. No training is needed.


    Common mistake: Assuming any wording works equally well. The caption template changes accuracy.'
- type: figure
  title: 'Real results: prompt templates matter for CLIP too'
  figure: zeroshot_results
  bullets:
  - '{{ZS_NOTES}}'
  - Describe classes in caption-like templates.
  - Average template vectors, then measure whether ensembling helps.
  stack: true
  notes: 'Real results from the lab: CLIP ViT-B/32 classifying CIFAR-10 test images zero-shot, with only the text prompt changing.
    Here the bare class name did slightly worse than the template a photo of a, because CLIP''s text encoder was trained on
    natural captions. Averaging several templates, including ones that mention blur and low resolution, which suits CIFAR''s
    tiny images, helped a little more. On 1,000 images a one-point difference is ten images, so check whether such gaps hold
    on other data. The lesson from week 7 transfers: prompts are part of the model and must be evaluated.


    Ask students: Why can a photo of a cat beat the bare word cat?

    Expected answer: CLIP''s text encoder was trained on caption-like sentences, not single words.


    Common mistake: Choosing the best template on the test images. Choose it on separate data.'
- type: figure
  title: Where zero-shot CLIP goes wrong (real confusion matrix)
  figure: lab_confusion
  caption: 'Measured heatmap: each row is a true class; each column is a prediction. Dark diagonal cells are correct.'
  notes: 'The confusion matrix from the lab run shows where the zero-shot classifier fails. The diagonal is strong, and the
    largest off-diagonal counts are between classes that look alike at low resolution: deer predicted as horses, dogs and frogs
    predicted as cats, and airplanes predicted as ships. CIFAR''s thirty-two by thirty-two images are upscaled to CLIP''s input
    size, which is a distribution shift from the web photos it was trained on.


    Ask students: Which classes does the model confuse most, and why?

    Expected answer: Look-alike classes at low resolution: deer with horses, dogs and frogs with cats, airplanes with ships.


    Common mistake: Reporting overall accuracy without looking at which classes fail.'
- type: figure
  title: Text-to-image retrieval (real)
  figure: lab_retrieval
  bullets:
  - Encode each query once; reuse gallery vectors.
  - '{{PREC_NOTES}}'
  stack: true
  notes: 'Retrieval uses the same embeddings in the other direction. The query text is embedded once and compared with the stored
    embeddings of all images; the top results are returned. The strip shows the top six CIFAR images for a free-text query about
    a red sports car, and the bullet gives the measured precision at k for class-name queries.


    Ask students: Precision@5 is 0.8. How many of the five results were relevant?

    Expected answer: Four.


    Common mistake: Reading precision@k as recall. It says nothing about relevant images that were not returned.'
- type: equation
  title: 'SigLIP: a sigmoid loss instead of softmax (Zhai et al., 2023)'
  eq: \mathcal{L}_{\mathrm{SigLIP}} = -\frac{1}{N}\sum_{i=1}^{N} \;\; \sum_{j=1}^{N} \, \log \sigma\left(z_{ij}\left(t\, u_i
    \cdot v_j + b\right)\right), \qquad z_{ij} = +1 \ \mathrm{if}\ i = j,\ \mathrm{else}\ -1
  read_as:
  - 'Each pair asks: match or non-match?'
  - Sigmoid scores pairs independently, without row-wide softmax.
  - This changes the training objective and batch requirements.
  terms:
  - - $\sigma$
    - Sigmoid
  - - t / b
    - Learned scale / offset
  - - $z_{ij}$
    - +1 match; −1 non-match
  notes: 'SigLIP, from Google in 2023, replaces the softmax over the batch with an independent sigmoid, a logistic regression,
    for every image-text pair: matching pairs should score high, all others low. Because each pair is scored separately, there
    is no need to normalise over the whole batch, which reduces communication between devices and works well even with smaller
    batches. SigLIP image encoders are widely used as the vision backbone of recent open vision-language models. The lab''s
    optional extension compares SigLIP''s zero-shot accuracy with CLIP''s.


    Ask students: Why does SigLIP work with smaller batches?

    Expected answer: Each pair is scored on its own, so no softmax over the whole batch is needed.


    Common mistake: Thinking the sigmoid and softmax losses give the same training signal.'
- type: figure
  title: The modality gap (real embeddings from the lab)
  figure: lab_modality_gap
  caption: 'Real saved projection: circles are images; stars are class descriptions. PCA compresses 512 dimensions into two.'
  notes: 'A surprising property of CLIP-style spaces is visible when we project real embeddings to two dimensions
    with PCA: images and texts form two separate clouds. This modality gap, studied by Liang and colleagues in 2022,
    arises from initialisation and the contrastive objective. It does not break retrieval, because what matters
    is which caption is closest to an image relative to the others. But it has practical consequences: image-to-image
    similarities are typically much higher than image-to-text similarities, so thresholds must be set separately
    for each comparison type.


    Analogy: A flat map of a mountain preserves some relationships and loses height. A PCA plot similarly loses
    information from the original 512-dimensional vectors.


    Ask students: Does a point pair being nearby in this plot prove it is nearby in all 512 dimensions?

    Expected answer: No. Check the original-vector similarities as well as this compressed picture.


    Common mistake: Separate clouds do not mean retrieval is broken. Ranking compares an image with the given
    text candidates in the original space.'
- type: quiz
  question: Why did CLIP use very large batches (32,768 pairs)?
  options:
  - Fewer model parameters are then needed
  - More negative pair comparisons per step
  - Large image files must be loaded together
  - Batch size has no effect on what is learned
  answer: 1
  notes: 'Answer: B. In the contrastive loss, every other caption in the batch is a negative for a given image. With a larger
    batch, each image must be distinguished from more, and more similar, captions, which forces the embeddings to capture finer
    distinctions. A and C are irrelevant. D is wrong for softmax-based contrastive learning, although SigLIP''s sigmoid loss
    reduces the dependence on batch size, which is one of its selling points.


    Ask students: What makes a negative caption hard?

    Expected answer: It is close to the true caption, such as a photo of a truck for an automobile, so the model must learn
    finer distinctions.


    Common mistake: Choosing A. Batch size does not change the number of parameters.'
- type: section
  number: 4
  title: Multimodal architectures and vision-language transformers
  question: How can a language model use visual features to answer an image question?
  icon: fa:FaSitemap
  notes: 'Welcome back. Section four surveys the architectures named in the descriptor: dual encoders like CLIP,
    fusion encoders, encoder-decoders, and a common design connecting a vision encoder to a language model. We trace
    the history of vision-language transformers and finish with a map of important models.


    Analogy: A bridge lets visual features enter a language model in a useful format. Its learned mapping connects
    representation spaces.


    Ask students: Why does LLaVA need a projector?

    Expected answer: The projector maps vision features to vectors usable by the language component.


    Common mistake: A CLIP similarity score alone cannot answer a detailed visual question.'
- type: figure
  title: Four families of multimodal architecture
  figure: architectures
  notes: 'Four families. Dual encoders, like CLIP and SigLIP, encode inputs separately and compare their vectors. They support
    fast retrieval and zero-shot classification; a similarity score alone cannot answer a detailed visual question. Fusion encoders
    read image and text jointly with attention. Encoder-decoders read one modality and generate another, as in captioning and
    speech recognition. The fourth family connects a vision encoder to an LLM through a bridge. It is a common multimodal assistant
    design and the focus of next week.


    Ask students: Which family would you choose to search a million product photos with text?

    Expected answer: A dual encoder such as CLIP: encode the photos once, then compare each query.


    Common mistake: Using a dual encoder to answer detailed visual questions. A similarity score cannot describe an image.'
- type: bullets
  title: 'Vision-language transformers: a short history'
  icon: fa:FaHistory
  bullets:
  - '2019: joint image-region and text models.'
  - '2021: CLIP/ALIGN dual encoders.'
  - '2022: Flamingo cross-attention; BLIP.'
  - '2023: BLIP-2 Q-Former; LLaVA projector.'
  - 'Week 10: applications using several modalities.'
  notes: 'The history shows a convergence. Early vision-language transformers in 2019 extended BERT to image regions detected
    by an object detector, with either one shared stream or two streams linked by cross-attention. CLIP and Google''s ALIGN
    in 2021 showed the power of contrastive learning at web scale. DeepMind''s Flamingo in 2022 connected a frozen language
    model to image features with gated cross-attention, enabling few-shot visual tasks.


    Ask students: What did Flamingo add in 2022?

    Expected answer: Gated cross-attention that lets a frozen language model read image features, enabling few-shot visual tasks.


    Common mistake: Thinking each new design replaced the old ones. Dual encoders are still the standard for search.'
- type: flow
  title: 'The LLaVA recipe: connect a vision encoder to an LLM'
  steps:
  - label: Image
    sub: Pixels
  - label: Vision encoder
    sub: Patch features
  - label: Projector
    sub: Map features for LLM
    highlight: true
  - label: LLM
    sub: Visual + text → answer
  bullets:
  - Train the bridge, then visual instruction examples.
  - Resolution limits readable detail.
  notes: 'LLaVA, by Liu and colleagues in 2023, made this design popular because it is remarkably simple. A pretrained CLIP
    vision encoder turns the image into a grid of patch features; a small projection network maps each patch feature into the
    LLM''s token-embedding space, producing visual tokens; the LLM reads them followed by the text prompt and generates an answer.


    Analogy: An interpreter turns visual features into vectors the language model can read.


    Ask students: Which part does LLaVA train first?

    Expected answer: The projector, on image-caption pairs; then the projector and the language model together on visual instruction
    examples.


    Common mistake: Assuming the model sees every detail. Image resolution limits small text and objects.'
