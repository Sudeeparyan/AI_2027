- type: lab
  title: 'Lab 9: CLIP embeddings, zero-shot classification and Whisper'
  steps:
  - Encode images and captions.
  - Classify with class texts.
  - Search; measure precision@k.
  - Compare correct and shuffled loss.
  - Transcribe; measure WER.
  runtime: CPU core took {{W09_CORE_TIME}}. SigLIP optional.
  deliverable: Accuracy, precision, loss, WER, answers
  notes: 'In short: The lab uses frozen CLIP and Whisper on a CPU to classify, search, score a loss and transcribe, measuring
    each step.


    Explain: CLIP ViT-B/32 encodes 1,000 CIFAR-10 test images once. Ten class texts give zero-shot predictions and accuracy.
    Class queries give precision@k. Six pairs give the contrastive loss. Whisper-base transcribes ten audiobook clips for WER.


    Example: On the course laptop with {{W09_CORE_THREADS}} CPU threads, the whole core took {{W09_CORE_TIME}} once the models
    and data were downloaded. It measured {{W09_CORE_ZS}} and a mean WER of {{W09_CORE_WER}}.


    Ask: Which part of the lab updates CLIP''s weights?


    Answer: None. Every part uses the frozen model; the loss is only measured.


    Watch out: Keep both API switches False for the core; the hosted caption cell is optional and sends text only.'
- type: summary
  points:
  - Modalities become vectors.
  - Pairs align the spaces.
  - CLIP scores both directions.
  - Frozen encoders classify and search.
  - WER measures transcripts.
  - Check scores against the task.
  notes: 'In short: Multimodal models turn different data types into comparable vectors, learned from matching pairs and checked
    with task metrics.


    Explain: Encoders map images, text and audio to vectors. Contrastive training aligns matching pairs in both directions.
    Zero-shot classification and retrieval reuse the frozen space. Whisper adds speech through transcription. Accuracy, precision@k
    and WER measure each capability.


    Example: The lab''s 1,000 image vectors are computed once and reused for classification, search and the modality-gap plot.
    A transcript error changes the query before CLIP sees it. Each number is read beside the actual images or words.


    Ask: Which single habit matters most when using similarity scores?


    Answer: Inspect the returned items and measure on labelled examples rather than trusting the scores.


    Watch out: A system that works on CIFAR-10 thumbnails may fail on your own photos.'
