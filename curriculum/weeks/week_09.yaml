- type: flow
  title: 'The LLaVA recipe: connect a vision encoder to an LLM'
  steps:
  - label: Image
    sub: Pixels
    role: data
  - label: Vision encoder
    sub: CLIP ViT
    role: model
  - label: Projector
    sub: Trainable bridge
    role: model
  - label: LLM
    sub: Reads question too
    role: model
  - label: Answer
    sub: Text
    role: output
  bullets:
  - Train the bridge first.
  - Resolution limits detail.
  notes: 'In short: LLaVA connects a frozen vision encoder to a language model through a small trainable projector.


    Explain: The vision encoder, a CLIP ViT, turns the image into patch features. The projector maps each feature into the LLM''s
    token-embedding size. These visual tokens are placed before the question''s text tokens. The LLM generates the answer. Training
    first fits the projector, then fine-tunes on visual instruction examples.


    Example: A 336 × 336 image with 14 × 14 patches gives 24 × 24 = 576 visual tokens. With a 20-token question, the LLM reads
    about 600 tokens. Small text in the image may vanish at this resolution.


    Ask: Why train the projector before fine-tuning the whole system?


    Answer: The projector must first map vision features into the LLM''s input space; instruction data then teaches useful answers.


    Watch out: Higher resolution means more visual tokens, more memory and slower answers.'
  arrows:
  - pixels
  - patch features
  - visual tokens
  - tokens
