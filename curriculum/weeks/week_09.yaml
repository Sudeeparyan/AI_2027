subtitle: "How AI connects text, images, audio and video: representations, alignment, fusion, and contrastive models such as CLIP"
mimlos: [1, 2, 4]
objectives:
  - "Define **modalities** and the key terms: modality, **cross-modal, multimodal, alignment, fusion** (early, late, cross-attention)."
  - "Explain **representation learning across modalities**: vision transformers, audio encoders, image/audio tokens and **shared embedding spaces**."
  - "Explain **contrastive learning** with **CLIP** and **SigLIP**, write the contrastive loss and use it for **zero-shot classification** and retrieval."
  - "Compare multimodal architectures: **dual encoders, fusion encoders, encoder–decoders** and vision encoders connected to LLMs; describe **vision-language transformers**."
  - "Transcribe speech with **Whisper** and evaluate with word error rate; evaluate multimodal models with retrieval and zero-shot metrics."
  - "Discuss the responsible-AI issues of web-scale multimodal data: consent, bias, harmful content and surveillance."
