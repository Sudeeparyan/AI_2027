subtitle: Connect words, images and speech through vectors, matching scores and careful checks
mimlos:
- 1
- 2
- 4
objectives:
- Define **modality** (a data type), representation, alignment, fusion and grounding with concrete examples.
- 'Explain how image, text and audio encoders turn inputs into **vectors**: lists of numbers.'
- Trace **CLIP** training on matching image-caption pairs and read its contrastive loss; compare SigLIP.
- Use a frozen model for image classification and text-to-image search; measure accuracy and precision@k.
- Compare multimodal architectures, including the vision-encoder-to-LLM design used by LLaVA.
- Use Whisper for speech recognition; calculate word error rate and discuss data rights, bias and attacks.
coverage:
- modality
- cross-modal
- multimodal
- alignment
- fusion
- early fusion
- late fusion
- cross-attention
- representation learning
- vision transformer
- audio
- spectrogram
- shared embedding space
- contrastive
- CLIP
- SigLIP
- zero-shot
- retrieval
- dual encoder
- fusion encoder
- encoder–decoder
- vision-language
- Whisper
- word error rate
- modality gap
slides:
- type: title
  figure: cover
  notes: 'In short: This week connects images, words and speech by turning each into vectors that can be compared.


    Explain: A modality is a type of data, such as images, text or audio. An encoder turns one input into a vector. A shared
    space lets vectors from different modalities be compared. CLIP aligns images and captions this way. Whisper turns speech
    into text.


    Example: A photo of a cat and the caption "a photo of a cat" become two 512-number vectors pointing in similar directions.
    Their cosine similarity is high, while "a ship at sea" scores lower. A shared map is an analogy; places from two guidebooks
    can be compared once both use the same coordinates.


    Ask: What must two encoders share for their outputs to be comparable?


    Answer: A common vector space, learned from matching pairs during training.


    Watch out: Comparable vectors do not mean identical meaning; the scores are learned match scores.'
- type: outcomes
  notes: 'In short: Students leave able to explain multimodal terms, use frozen CLIP and Whisper, and measure what they get
    right and wrong.


    Explain: Alignment means learning which items correspond across modalities. Fusion means combining information from several
    modalities. Zero-shot classification uses class descriptions without task training. Precision@k measures search quality.
    Word error rate measures transcription errors.


    Example: The lab classifies 1,000 CIFAR-10 images with ten class texts, searches them with text queries, and transcribes
    ten audiobook clips. Each part produces a number: accuracy, precision@k or WER. The numbers are then read beside the actual
    images and transcripts.


    Ask: Which outcome checks speech recognition?


    Answer: Measuring word error rate against reference transcripts.


    Watch out: CLIP compares images and text; it does not generate either.'
  items:
  - Explain multimodal terms
  - Use CLIP and Whisper
  - Measure accuracy, precision and WER
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: search photos with no captions'
    minutes: 5
  - title: 1 · Modalities and terminology
    minutes: 15
  - title: 2 · Representation learning across modalities
    minutes: 17
  - title: '3 · Contrastive learning: CLIP and SigLIP'
    minutes: 33
  - title: 4 · Multimodal architectures
    minutes: 20
  - title: 5 · Audio, evaluation and responsible AI
    minutes: 20
  - title: Lab preview and wrap-up
    minutes: 7
  notes: 'In short: The session moves from multimodal vocabulary, to shared vector spaces, to contrastive training, architectures,
    and finally speech and evaluation.


    Explain: Section one defines modality, alignment, fusion and grounding. Section two shows how each modality becomes vectors.
    Section three explains CLIP''s contrastive training and SigLIP. Section four surveys vision-language architectures such
    as LLaVA. Section five covers Whisper, evaluation and responsible use.


    Example: Week 5 introduced transformers on text, and week 6 the language models built from them. This week attaches image
    and audio encoders to that idea. Week 10 then uses several modalities in applications. A railway map is an analogy; each
    section is a station on one line.


    Ask: Which earlier idea does a Vision Transformer reuse?


    Answer: The transformer from week 5, applied to image patches instead of word tokens.


    Watch out: Multimodal does not mean one giant model; many systems chain separate models.'
- type: discussion
  title: Warm-up
  icon: fa:FaImages
  prompt: Find “a dog on a beach” among uncaptioned holiday photos. What must the system compare?
  points:
  - 'Try a second query: “red umbrella”.'
  - Name the input and desired output.
  notes: 'In short: Searching uncaptioned photos with words needs a way to compare text with pixels.


    Explain: The input is a text query and a set of photos. The output is a ranked list of photos. Keywords cannot help, because
    the photos have no captions. The system must describe photos and words in one comparable form. A score then ranks each photo
    against the query.


    Example: "A dog on a beach" should rank a photo of a dog on sand above a dog on grass. "Red umbrella" tests colour and object
    together. If both queries return the same photos, the system is matching something too general.


    Ask: What would the system need to have learned beforehand?


    Answer: Which images and descriptions correspond, from many matching pairs.


    Watch out: A top result is the best available match, not proof that the photo shows everything in the query.'
- type: section
  number: 1
  title: Modalities and terminology
  question: What exactly does 'multimodal' mean?
  icon: fa:FaLayerGroup
  notes: 'In short: Multimodal means a system that handles more than one type of data, and the details of how matter.


    Explain: Unimodal systems use one data type. Cross-modal systems go from one type to another, such as text to images. Multimodal
    systems combine several types in one task. Alignment, fusion and grounding name different ways to connect them. Each needs
    different data and evaluation.


    Example: A text-only chatbot is unimodal. Searching photos with words is cross-modal. Asking a question about a chart image
    is multimodal. Whisper converting speech to text is cross-modal speech recognition.


    Ask: Is CLIP-based text-to-image search cross-modal or multimodal?


    Answer: Cross-modal retrieval: a text query finds images, using a model trained on both modalities.


    Watch out: Marketing often calls any model multimodal; check which inputs and outputs it actually supports.'
- type: figure
  title: 'Four main modalities, one idea: turn everything into vectors'
  figure: modalities
  notes: 'In short: Images, text, audio and video can all be turned into vectors, which lets one model family handle them.


    Explain: Text is split into tokens and embedded. Images are cut into patches and embedded. Audio becomes spectrogram frames.
    Video becomes sampled frames with time positions. After encoding, each becomes vectors of numbers.


    Example: A 224 × 224 image with 32 × 32 patches gives 7 × 7 = 49 patch vectors. A 30-second clip at 16,000 samples per second
    has 480,000 samples before Whisper turns it into spectrogram frames. Different inputs end in one numerical form.


    Ask: How many 32 × 32 patches does a 224 × 224 image have?


    Answer: 49, because 224 ÷ 32 = 7 patches per side, and 7 × 7 = 49.


    Watch out: Turning everything into vectors does not make the vectors comparable; that needs alignment training.'
- type: table
  title: Key terms
  header:
  - Term
  - Meaning
  rows:
  - - Modality
    - A type of data
  - - Unimodal
    - One type only
  - - Cross-modal
    - One type to another
  - - Multimodal
    - Several types together
  - - Alignment
    - Learn which items correspond
  - - Fusion
    - Combine information
  - - Grounding
    - Link claims to evidence
  notes: 'In short: Seven terms describe how modalities relate: unimodal, cross-modal and multimodal, plus alignment, fusion
    and grounding.


    Explain: Unimodal means one data type, such as a text-only chatbot. Cross-modal means mapping between types, such as searching
    photos with words. Multimodal means combining types, such as asking about a photo. Alignment learns which items correspond.
    Fusion combines information inside a model, and grounding links a claim to evidence.


    Example: CLIP aligns a photo with its caption. LLaVA fuses an image with a question to produce an answer. A grounded caption
    system draws a box around the dog its caption mentions. One photo can therefore be used in three different ways.


    Ask: Which term describes drawing a box around the object a sentence mentions?


    Answer: Grounding, because the claim is linked to visible evidence.


    Watch out: Alignment is learned from data; it does not guarantee the model knows what every word means.'
- type: compare
  title: Multimodal understanding vs. multimodal generation
  columns:
  - head: Understanding
    points:
    - Media → text, labels, vectors
    - 'Whisper: audio → transcript'
    - 'CLIP: query → photos'
  - head: Generation
    points:
    - Text → images, speech, video
    - 'SD-Turbo: prompt → picture'
    - 'MMS-TTS: sentence → speech'
  callout: Check supported inputs and outputs.
  notes: 'In short: Multimodal understanding turns media into text, labels or vectors, while multimodal generation turns descriptions
    into new media.


    Explain: Understanding models read images, audio or video and produce text or vectors. Generation models produce images,
    speech or video from inputs such as text. Some systems do both. Each model supports specific input and output types. The
    model card lists them.


    Example: Whisper turns lecture audio into a transcript. CLIP turns a query into matching photos by comparing vectors. SD-Turbo
    turns a prompt into a picture, and MMS-TTS turns a sentence into speech.


    Ask: Is CLIP an understanding or a generation model?


    Answer: Understanding: it compares images and text but cannot create new images.


    Watch out: A model that reads images cannot necessarily produce them, and the reverse.'
- type: figure
  title: Three ways to fuse modalities
  figure: fusion
  stack: true
  notes: 'In short: Modalities can be fused early, late or through cross-attention, and the choice decides what each part of
    the model can see.


    Explain: Early fusion combines inputs before one model reads them. Late fusion encodes each modality separately and combines
    the outputs. Cross-attention lets tokens of one modality attend to features of another. Late fusion is cheap for search.
    Cross-attention allows detailed question answering.


    Example: CLIP is late fusion: image and text vectors meet only in a dot product. Flamingo uses cross-attention; text tokens
    attend to image features while generating an answer. Early fusion might feed image patches and words into one transformer
    together.


    Ask: Why does late fusion suit searching millions of images?


    Answer: Image vectors can be computed once and stored; each query then needs only dot products.


    Watch out: Late fusion cannot answer questions that need detailed interaction, such as counting objects named in the question.'
- type: quiz
  question: CLIP encodes images and texts separately, then compares them. Which fusion?
  options:
  - Late fusion
  - Early fusion
  - Cross-attention fusion
  - 'No fusion: CLIP is unimodal'
  answer: 0
  notes: 'In short: CLIP is late fusion, because its two encoders work separately and meet only in a similarity score.


    Explain: Late fusion combines modalities after separate encoding. CLIP''s image and text encoders never see each other''s
    inputs. Their normalised outputs meet in a dot product. Early fusion would mix inputs first. Cross-attention would let one
    modality read the other''s features.


    Example: A gallery of 1,000 images is encoded once into a [1000, 512] table. Each new query needs one text encoding and
    one matrix product. That efficiency comes from late fusion.


    Ask: Which option is correct?


    Answer: A. Late fusion: separate encoders, combined only by the similarity score.


    Watch out: CLIP is not unimodal; it is trained on two modalities, even though each encoder sees one.'
- type: section
  number: 2
  title: Representation learning across modalities
  question: How does each modality become vectors that can be compared?
  icon: fa:FaVectorSquare
  notes: 'In short: Representation learning turns each modality into vectors whose geometry reflects useful similarities.


    Explain: A representation is a vector describing an input''s useful features. Encoders learn representations during training.
    Similar inputs should get nearby vectors. Alignment training makes vectors from different modalities comparable. The quality
    of representations depends on the training data.


    Example: Two photos of cats should have more similar vectors than a cat and a ship. After alignment, the caption "a cat
    sleeping" should sit near the cat photos too. In the lab, cosine similarities make this measurable.


    Ask: Predict: will a cat photo score higher with "a cat sleeping" than with "a ship at sea"?


    Answer: Usually yes; the lab''s 6 × 6 table shows whether the diagonal wins.


    Watch out: Vectors capture what the training data emphasised, including its biases.'
- type: bullets
  title: 'Representation learning: vectors that capture meaning'
  bullets:
  - A representation describes features with numbers.
  - Alignment learns correspondence from pairs.
  - Noisy captions teach wrong matches.
  notes: 'In short: A representation is a vector of learned features, and alignment trains image and text representations to
    agree for matching pairs.


    Explain: Features are measurable properties, such as shapes or word meanings. A representation stores them as numbers. Alignment
    uses matching pairs to pull corresponding vectors together. Web captions are noisy, so some pairs teach wrong matches. More
    data reduces the effect of noise on average but cannot remove it.


    Example: A photo captioned "my holiday" teaches little about what is in the photo. A photo captioned "a red car parked by
    a river" teaches colour, object and setting. CLIP trained on about 400 million such pairs, good and bad.


    Ask: Why can more web data not remove caption noise entirely?


    Answer: Noise is part of how web captions are written, so it grows with the data.


    Watch out: A representation is not a readable description; it is a set of numbers learned for comparison.'
  visual:
    type: example_strip
    items:
    - label: Photo
      text: cat on a sofa → 512 numbers
    - label: Caption
      text: '"a sleeping cat" → 512 numbers'
- type: cards
  title: Every modality as a sequence of tokens
  cards:
  - head: Images
    text: 224 × 224 → 49 patches
  - head: Audio
    text: Spectrogram frames
  - head: Video
    text: Frames + time positions
  - head: Discrete tokens
    text: Codebook IDs
  notes: 'In short: Transformers can read any modality once it is cut into a sequence of tokens with positions.


    Explain: Images are cut into square patches, each embedded as a vector. Audio becomes spectrogram frames over time. Video
    adds a time position to frame patches. Some models learn a codebook that maps pieces to discrete IDs. A transformer then
    processes the sequence as it would words.


    Example: A 224 × 224 image with 32 × 32 patches gives 49 patches, as in CLIP ViT-B/32. Whisper turns 30 seconds of audio
    into 3,000 spectrogram frames before its encoder reduces them. A codebook of 8,192 entries can turn an image into a grid
    of IDs that a model predicts like text.


    Ask: Why does each patch need a position?


    Answer: Attention ignores order, so positions tell the model where each patch sits.


    Watch out: Smaller patches mean more tokens and more computation for the same image.'
- type: figure
  title: 'Audio as input: the Whisper pipeline'
  figure: whisper_pipeline
  bullets:
  - Compare the transcript with a reference.
  stack: true
  notes: 'In short: Whisper turns a waveform into a log-mel spectrogram, encodes it, and decodes text that attends to the audio
    features.


    Explain: A waveform is a list of air-pressure samples over time. A log-mel spectrogram shows energy in frequency bands over
    time. The encoder turns spectrogram frames into feature vectors. The decoder generates words one token at a time. Cross-attention
    lets each word attend to the audio features.


    Example: A clip sampled at 16,000 samples per second is cut into 25 ms windows every 10 ms. Each window gives 80 mel-band
    energies, so 30 seconds become an 80 × 3,000 table. The decoder then writes the transcript token by token.


    Ask: Why use a spectrogram instead of the raw samples?


    Answer: It shows which frequencies are present over time, which is closer to what distinguishes speech sounds.


    Watch out: A transcript can be fluent but wrong; check it against a reference where one exists.'
- type: bullets
  title: Shared embedding spaces
  bullets:
  - Learn comparable vectors from pairs.
  - Normalised dot product = cosine.
  - High score ≠ every detail matches.
  notes: 'In short: In a shared embedding space, normalised dot products give cosine similarities that rank candidates across
    modalities.


    Explain: Normalising divides a vector by its length, making the length 1. The dot product of two unit vectors is their cosine
    similarity. Cosine ranges from −1 to 1. Ranking sorts candidates by this score. The top result is the closest match in the
    learned space.


    Example: [3, 4] normalises to [0.6, 0.8], and [4, 3] to [0.8, 0.6]. Their dot product is 0.48 + 0.48 = 0.96. In CLIP the
    same calculation runs over 512 numbers per vector.


    Ask: What does a cosine similarity of 0.96 tell you?


    Answer: The two vectors point in almost the same direction, so the model describes the inputs similarly.


    Watch out: A high score is relative; compare it with the scores of the other candidates.'
  visual:
    type: example_strip
    items:
    - label: u · v
      text: '[0.6, 0.8] · [0.8, 0.6] = 0.96'
    - label: Rank
      text: Highest score first
- type: section
  number: 3
  title: 'Contrastive learning: CLIP and SigLIP'
  question: How do you teach a model that a picture and a sentence mean the same thing?
  icon: fa:FaMagnet
  notes: 'In short: Contrastive learning teaches matching by asking the model to pick the right partner for each item among
    many wrong ones.


    Explain: A positive pair is an image with its own caption. Negative pairs mix an image with other captions. The loss rewards
    high scores for positives and low scores for negatives. CLIP uses a softmax over each row and column. SigLIP scores each
    pair independently with a sigmoid.


    Example: In a batch of three pairs, the 3 × 3 score table has three positives on the diagonal and six negatives elsewhere.
    Training raises the diagonal and lowers the rest. With 32,768 pairs, each image has 32,767 negatives.


    Ask: Predict: how many negatives does each image have in a batch of N pairs?


    Answer: N − 1, the captions of all the other images.


    Watch out: Some negatives may describe the image well; the loss still pushes them away.'
- type: bullets
  title: 'CLIP: Contrastive Language–Image Pre-training (OpenAI, 2021)'
  bullets:
  - Two encoders, one shared space.
  - Match pairs in both directions.
  - 400 million pairs; batch 32,768.
  notes: 'In short: CLIP trains an image encoder and a text encoder together so that matching image–caption pairs score highest.


    Explain: CLIP stands for Contrastive Language–Image Pre-training. OpenAI released it in 2021. It trained on about 400 million
    image–caption pairs from the web. Each batch held 32,768 pairs. After training, class descriptions allow classification
    without task-specific training.


    Example: CLIP ViT-B/32 cuts a 224 × 224 image into 49 patches of 32 × 32 pixels. Its image and text encoders each output
    512 numbers. The lab uses this checkpoint, with about 151 million parameters, frozen.


    Ask: Why is CLIP useful without training on CIFAR-10?


    Answer: Class names written as captions land near matching images in the space it already learned.


    Watch out: CLIP compares; it does not generate captions or images.'
  visual:
    type: example_strip
    items:
    - label: Image encoder
      text: ViT-B/32 → 512 numbers
    - label: Text encoder
      text: Transformer → 512 numbers
- type: figure
  title: The contrastive objective as a matrix
  figure: clip_matrix
  notes: 'In short: The contrastive objective is easiest to see as a square table whose diagonal holds the matching pairs.


    Explain: Rows are images and columns are captions. Each cell is a scaled cosine similarity. The diagonal cells are the true
    pairs. A row softmax asks each image to choose its caption. A column softmax asks each caption to choose its image.


    Example: With three pairs, a good table might have 0.30 on the diagonal and 0.10 elsewhere before scaling. Dividing by τ
    = 0.07 gives about 4.3 and 1.4, so each row''s softmax gives the diagonal about 0.90.


    Ask: Where should the highest value in each row be?


    Answer: On the diagonal, at the matching caption.


    Watch out: A row can be right while its column is wrong; that is why both directions count.'
- type: equation
  title: The contrastive (InfoNCE) loss
  eq:
  - \mathcal{L}_{\mathrm{img}\to\mathrm{txt}} = -\dfrac{1}{N}\sum_{i=1}^{N} \left[ s_{ii} - \log \sum_{j=1}^{N}
    \exp(s_{ij}) \right]
  - s_{ij} = \dfrac{u_i \cdot v_j}{\tau}, \qquad \mathcal{L}_{\mathrm{CLIP}} = \frac{1}{2}\left(\mathcal{L}_{\mathrm{img}\to\mathrm{txt}}
    + \mathcal{L}_{\mathrm{txt}\to\mathrm{img}}\right)
  read_as:
  - Normalise vectors; divide dot products by temperature $\tau$.
  - Softmax turns scores into caption-choice probabilities.
  - Cross-entropy penalises wrong choices; average both directions.
  terms:
  - - u / v
    - Image / text vectors
  - - $\tau$
    - Temperature
  - - N
    - Pairs in this batch
  panel_h: 2.2
  notes: 'In short: The CLIP loss is cross-entropy over each row and column of the scaled score table, averaged over both directions.


    Explain: s_ij is the scaled similarity of image i and text j. τ is the temperature, a small positive number such as 0.07.
    The image-to-text loss treats each row as a choice among N captions. The text-to-image loss does the same over columns.
    The CLIP loss averages the two.


    Example: For three orthogonal pairs with τ = 1, each row is softmax([1, 0, 0]) ≈ [0.58, 0.21, 0.21], so each row''s loss
    is −ln 0.58 ≈ 0.55. A smaller τ sharpens the softmax and lowers the loss when the diagonal already wins.


    Ask: What loss would a model that scores every pair equally get?


    Answer: ln N, because each row would give the correct caption probability 1/N.


    Watch out: τ is learned during CLIP training; a fixed value in the lab only illustrates its effect.'
- type: bullets
  title: The loss in numbers (from the lab)
  bullets:
  - '{{LOSS_NOTES}}'
  - 'Uniform choice: ln N.'
  notes: 'In short: On six real image–caption pairs, the measured loss is lowest for correct pairs and highest for shuffled
    ones.


    Explain: The lab encodes six images and six captions with frozen CLIP. It computes the symmetric loss for the correct order.
    It repeats the calculation with the captions shuffled. A uniform guess would give ln 6 ≈ 1.79. No optimiser runs, so the
    weights never change.


    Example: {{LOSS_NOTES}} Correct pairs score below the uniform baseline because most diagonal entries win. Shuffled pairs
    score above it because the targets now point at wrong captions.


    Ask: Why is the shuffled loss finite rather than enormous?


    Answer: Softmax probabilities never reach zero, and some shuffled captions may still partly match.


    Watch out: Six pairs illustrate the objective; they do not measure CLIP''s overall quality.'
  visual:
    type: example_strip
    items:
    - label: Correct
      text: Diagonal wins → low loss
    - label: Shuffled
      text: Wrong targets → high loss
- type: figure
  title: 'Zero-shot classification: describe the classes, then compare'
  figure: zeroshot_pipeline
  notes: 'In short: Zero-shot classification describes each class in words, encodes the descriptions, and picks the class closest
    to each image.


    Explain: Each class name fills a caption template. The text encoder turns each description into a vector. Several templates
    per class can be averaged. Each image vector is compared with every class vector. The highest similarity gives the predicted
    class.


    Example: For CIFAR-10, the template "a photo of a {}." gives a [10, 512] class table. 1,000 image vectors give a [1000,
    10] score table. The argmax of each row is that image''s prediction, and accuracy compares predictions with labels.


    Ask: Why is this called zero-shot?


    Answer: No CIFAR-10 example is used for training; only the class names are supplied.


    Watch out: The labels are still needed to measure accuracy; zero-shot means no training on them.'
- type: figure
  title: 'Real results: prompt templates matter for CLIP too'
  figure: zeroshot_results
  bullets:
  - '{{ZS_NOTES}}'
  - Use caption-like templates.
  - Measure whether ensembling helps.
  stack: true
  notes: 'In short: In the stored run, caption-like templates and template ensembling raised zero-shot accuracy slightly.


    Explain: A template frames the class name like a caption. CLIP''s text encoder was trained on captions, not single words.
    An ensemble averages several template vectors per class. The average is normalised again. Accuracy is measured on the same
    1,000 images for every choice.


    Example: {{ZS_NOTES}} With 1,000 images, one image is 0.1 percentage points, so convert each gain into images before judging
    it. Your CPU core measured {{W09_CORE_ZS}}.


    Ask: Is the gain from ensembling large or small?


    Answer: Small; it is a few images out of 1,000, so check it on more data before relying on it.


    Watch out: Templates tuned on the test images overstate accuracy, as with any prompt tuning.'
- type: figure
  title: Where zero-shot CLIP goes wrong (real confusion matrix)
  figure: lab_confusion
  caption: 'Measured heatmap: each row is a true class; each column is a prediction. Dark diagonal cells are correct.'
  notes: 'In short: The confusion matrix shows which CIFAR-10 classes zero-shot CLIP mixes up.


    Explain: Each row is a true class and each column a predicted class. Diagonal cells count correct predictions. Off-diagonal
    cells count specific confusions. Bright off-diagonal cells reveal systematic errors. CIFAR images are only 32 × 32 pixels,
    upscaled to 224 × 224.


    Example: Look for pairs such as cat and dog, or deer and horse, which are hard to separate at this resolution. A row with
    100 images and 80 on the diagonal has 80% accuracy for that class.


    Ask: What does a bright cell in row cat, column dog mean?


    Answer: Many cat images were predicted as dogs.


    Watch out: Overall accuracy can hide a class that fails badly; read the rows.'
- type: figure
  title: Text-to-image retrieval (real)
  figure: lab_retrieval
  bullets:
  - Encode each query once; reuse gallery vectors.
  - '{{PREC_NOTES}}'
  stack: true
  notes: 'In short: Text-to-image retrieval ranks the stored image vectors against a query, and precision@k checks the top results.


    Explain: Each class query is encoded once. Its vector is compared with all stored image vectors. The images are sorted by
    score. Precision@k is the fraction of the top k that match the queried class. It ignores relevant images ranked lower.


    Example: {{PREC_NOTES}} If four of the first five images for "a photo of a car." are cars, precision@5 is 0.8. Recall would
    instead ask how many of the gallery''s 100 cars were found.


    Ask: Can precision@5 be high while recall is low?


    Answer: Yes. Five correct cars out of 100 in the gallery give precision@5 = 1.0 but recall of 0.05.


    Watch out: Benchmarks such as COCO report recall@k, which uses a different denominator.'
- type: equation
  title: 'SigLIP: a sigmoid loss instead of softmax (Zhai et al., 2023)'
  eq: \mathcal{L}_{\mathrm{SigLIP}} = -\frac{1}{N}\sum_{i=1}^{N} \;\; \sum_{j=1}^{N} \, \log \sigma\left(z_{ij}\left(t\, u_i
    \cdot v_j + b\right)\right), \qquad z_{ij} = +1 \ \mathrm{if}\ i = j,\ \mathrm{else}\ -1
  read_as:
  - Independent pairs.
  - Average losses.
  terms:
  - - N,i,j
    - Batch size; image/text indices
  - - u,v
    - Image/text vectors
  - - σ,t,b
    - Sigmoid; scale; offset
  - - $z_{ij}$
    - +1 match; −1 non-match
  notes: 'In short: SigLIP replaces CLIP''s row-wide softmax with an independent yes-or-no sigmoid decision for every image–text
    pair.


    Explain: σ is the sigmoid function, mapping a score to between 0 and 1. z_ij is +1 for matching pairs and −1 otherwise.
    t is a learned scale and b a learned offset. Each pair contributes its own loss term. No pair needs to be compared with
    the whole row.


    Example: For a matching pair with scaled score 2, σ(2) ≈ 0.88 and the loss term is −ln 0.88 ≈ 0.13. For a non-matching pair
    with score 2, the term is −ln σ(−2) ≈ 2.13. A batch of N pairs gives N² independent terms.


    Ask: Why can SigLIP train well with smaller batches than CLIP?


    Answer: Each pair is scored independently, so it does not need many negatives in one softmax.


    Watch out: Sigmoid scores are still not calibrated probabilities that a caption is true.'
- type: figure
  title: The modality gap (real embeddings from the lab)
  figure: lab_modality_gap
  caption: 'Real saved projection: circles are images; stars are class descriptions. PCA compresses 512 dimensions into two.'
  notes: 'In short: Even after alignment, image vectors and text vectors occupy different regions of CLIP''s space.


    Explain: PCA projects 512-number vectors onto the two directions of greatest spread. Circles are images and stars are class
    texts. The two groups sit apart, which is called the modality gap. Matching still works because ranking compares relative
    scores. The 2-D plot compresses the true distances.


    Example: Your CPU core measured a mean image–image similarity of {{W09_CORE_COS_II}} and a mean image–text similarity of
    {{W09_CORE_COS_IT}}. A cat photo can be closer to a ship photo than to the text "a photo of a cat", yet "cat" still beats
    "ship" among the texts.


    Ask: If texts and images sit apart, why does retrieval still work?


    Answer: Ranking compares scores among one modality''s candidates, so only the relative order matters.


    Watch out: Do not read exact distances from a PCA plot; check claims with full-space cosine values.'
- type: quiz
  question: Why did CLIP use very large batches (32,768 pairs)?
  options:
  - Fewer parameters are needed
  - More negatives per step
  - Large files must load together
  - Batch size has no effect
  answer: 1
  notes: 'In short: Large batches give each image many negative captions per step, which makes contrastive learning more informative.


    Explain: Each image''s row compares it with every caption in the batch. All captions except its own are negatives. More
    negatives make the matching task harder. Harder tasks give more useful learning signals. Large batches also need much more
    memory.


    Example: With 32,768 pairs, each image competes against 32,767 wrong captions. With 32 pairs it competes against only 31,
    so easy distinctions dominate. CLIP''s score table had over a billion cells per batch.


    Ask: Which option is correct?


    Answer: B. More negative comparisons per step.


    Watch out: Batch size does not change the number of model parameters.'
- type: section
  number: 4
  title: Multimodal architectures and vision-language transformers
  question: How can a language model use visual features to answer an image question?
  icon: fa:FaSitemap
  notes: 'In short: Vision-language models connect image features to a language model so it can answer questions about pictures.


    Explain: A vision encoder turns an image into feature vectors. A connector maps those features into the language model''s
    input space. The language model then reads visual and text tokens together. Some designs use cross-attention instead. These
    models generate text about images.


    Example: Asked "How many people are in this photo?", a vision-language model reads image features and the question, then
    writes "three". CLIP alone could only score given captions such as "three people" against the image.


    Ask: Predict: can CLIP answer an open question about an image?


    Answer: No. It scores given captions; answering needs a generating language model connected to vision features.


    Watch out: Fluent answers about images can still describe things that are not there.'
- type: figure
  title: Four families of multimodal architecture
  figure: architectures
  notes: 'In short: Four families cover most multimodal designs: dual encoders, fusion encoders, encoder-decoders and encoder-to-LLM
    connectors.


    Explain: Dual encoders such as CLIP encode each modality separately for fast search. Fusion encoders mix modalities in one
    transformer. Encoder-decoders such as Whisper read one modality and generate text. Connector models such as LLaVA project
    image features into an LLM. Each trades speed against depth of interaction.


    Example: For searching a million photos, a dual encoder computes image vectors once. For answering "What is written on the
    sign?", a connector model reads the image together with the question. The task decides the family.


    Ask: Which family would you choose for a photo-search app?


    Answer: A dual encoder, because image vectors can be precomputed and compared quickly.


    Watch out: Real systems often combine families, such as a dual encoder for search and an LLM for answers.'
- type: bullets
  title: 'Vision-language transformers: a short history'
  bullets:
  - Dual encoders came first.
  - LLM connectors came next.
  - Week 10 builds applications.
  notes: 'In short: Vision-language models moved from joint region–text encoders to dual encoders, then to models that connect
    vision to large language models.


    Explain: Models from 2019, such as ViLBERT and LXMERT, jointly encoded image regions and text. CLIP and ALIGN in 2021 used
    separate encoders trained on web pairs. Flamingo in 2022 added cross-attention to a frozen language model. BLIP-2 in 2023
    used a Q-Former bridge. LLaVA in 2023 used a simple projector into an LLM.


    Example: LLaVA''s projector is a small network mapping CLIP patch features into the LLM''s embedding size. Training the
    bridge first, then on visual instruction examples, made a capable visual chat model cheaply.


    Ask: What does a Q-Former or projector do?


    Answer: It translates vision features into a form the language model can read as input tokens.


    Watch out: Dates mark publication; capabilities improved through many smaller steps.'
