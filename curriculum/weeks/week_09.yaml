  notes: 'In short: A handful of model families cover search, question answering, captioning and speech, and their type predicts
    their strengths.


    Explain: CLIP and SigLIP are dual encoders for image–text search. Flamingo uses cross-attention for visual question answering.
    BLIP-2 bridges a vision encoder and an LLM with a Q-Former. Whisper is an encoder–decoder for transcription. CLAP aligns
    audio and text, and ImageBind aligns six modalities through images.


    Example: To search a photo library by text, use a dual encoder such as SigLIP. To ask questions about a chart, use a vision-language
    model such as LLaVA. To find sound effects by description, CLAP plays the role CLIP plays for images.


    Ask: Which model would you use to search audio clips with text?


    Answer: CLAP, the audio–text dual encoder.


    Watch out: Check each checkpoint''s licence and supported languages before using it.'
- type: section
  number: 5
  title: Audio, evaluation and responsible AI
  question: How well does it work, and at what cost to whom?
  icon: fa:FaBalanceScale
  notes: 'In short: The last section measures how well multimodal systems work and asks who bears the cost of their errors.


    Explain: Evaluation needs a metric matched to each capability. Speech recognition uses word error rate. Retrieval uses precision
    or recall at k. Classification uses accuracy, read by class. Responsible use adds rights, privacy and fairness checks.


    Example: A transcription system with 10% WER makes about one error per ten reference words. If errors concentrate on one
    accent, those speakers bear more of the cost. The average hides that.


    Ask: Predict: can two systems with the same average WER treat users differently?


    Answer: Yes. Errors can concentrate on particular accents or recording conditions.


    Watch out: Report results by group whenever the task affects people.'
- type: figure
  title: Speech recognition with Whisper (real)
  figure: lab_spectrogram
  bullets:
  - '{{WER_NOTES}}'
  - Linear bins here; Whisper uses log-mel.
  - '"mister" vs "Mr." counts as an error.'
  stack: true
  notes: 'In short: In the stored run, Whisper transcribed audiobook clips with a low but non-zero word error rate.


    Explain: The spectrogram shows energy over time and frequency for one clip. This plot uses linear frequency bins. Whisper''s
    input uses log-mel bands instead. Word error rate counts substitutions, deletions and insertions. Text normalisation decides
    whether "mister" and "Mr." match.


    Example: {{WER_EXAMPLE}} Normalising both texts to the same spelling before scoring would remove that error. Your CPU core
    measured a mean WER of {{W09_CORE_WER}}.


    Ask: Is "Mr." versus "mister" a real recognition error?


    Answer: Not for meaning; it is a formatting difference that a normaliser should handle before scoring.


    Watch out: Clean audiobook speech is easier than noisy, accented or overlapping speech.'
- type: equation
  title: Word error rate (WER)
  eq: \mathrm{WER} = \frac{S + D + I}{N}
  read_as:
  - Count substitutions, deletions and insertions.
  - Divide by the reference word count.
  - 'One missing word among six: 1/6.'
  terms:
  - - S / D / I
    - Changed / missing / extra words
  - - N
    - Reference words
  notes: 'In short: WER counts the word edits needed to turn the transcript into the reference, divided by the reference length.


    Explain: S counts substituted words. D counts deleted words, missing from the transcript. I counts inserted words, extra
    in the transcript. N is the number of reference words. An edit-distance table finds the smallest total.


    Example: Reference "a red car", transcript "a blue car": one substitution, so WER = 1/3. A six-word reference with one missing
    word gives WER = 1/6 ≈ 0.17. A transcript with many extra words can push WER above 1.


    Ask: What is the WER for reference "the cat sat" and transcript "the cat sat down"?


    Answer: One insertion over three reference words, so 1/3.


    Watch out: WER treats every word equally; a wrong name can matter far more than a wrong "the".'
- type: table
  title: How multimodal models are evaluated
  header:
  - Capability
  - Metric
  - Common benchmark
  rows:
  - - Classification
    - Accuracy
    - CIFAR / ImageNet
  - - Retrieval
    - Recall@k
    - COCO / Flickr30k
  - - Captioning
    - CIDEr / CLIPScore
    - COCO
  - - VQA
    - Accuracy
    - ChartQA / DocVQA
  - - Speech
    - WER
    - LibriSpeech
  - - Fairness
    - Group comparisons
    - Task audit
  notes: 'In short: Each multimodal capability has its own metric and benchmark, and none of them covers fairness on its own.


    Explain: Classification uses accuracy on labelled images. Retrieval uses recall@k on benchmarks such as COCO. Captioning
    uses CIDEr or CLIPScore. Visual question answering uses answer accuracy. Speech recognition uses WER on sets such as LibriSpeech.


    Example: The lab measures precision@k because each class query has many relevant images. COCO retrieval reports recall@k,
    where each caption has one correct image. Group comparisons check whether errors fall unevenly.


    Ask: Why can a benchmark score overstate performance on your own task?


    Answer: Your images, speakers and questions may differ from the benchmark''s data.


    Watch out: CLIPScore uses CLIP to judge captions, so it inherits CLIP''s blind spots.'
- type: bullets
  title: 'Responsible AI lens: multimodal data and models'
  bullets:
  - Check image, audio and video rights.
  - Audit errors across groups.
  - Printed text can mislead models.
  notes: 'In short: Multimodal data raises extra rights, privacy and fairness questions, and images or audio can be manipulated
    to mislead models.


    Explain: Photos and recordings can identify people. Consent and licences govern their use for training and search. Performance
    can differ across groups, accents or skin tones. Typographic attacks place misleading text in an image. Altered audio can
    change a transcript.


    Example: OpenAI showed that a paper label reading "iPod" stuck on an apple could make CLIP classify it as an iPod. A face
    search tool trained on web photos may include people who never consented.


    Ask: Why do typographic attacks work on CLIP?


    Answer: CLIP learned that text in images often names what is shown, so printed words strongly influence its scores.


    Watch out: Removing names does not remove identity from faces or voices.'
