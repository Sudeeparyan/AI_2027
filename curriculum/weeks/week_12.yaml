subtitle: Search trustworthy sources, answer with evidence, and control tool-using agents
mimlos:
- 3
- 4
- 5
objectives:
- Explain why a language model may lack current or private facts, then define **retrieval-augmented generation (RAG)**.
- 'Trace document preparation: split into chunks, make vectors, store metadata, and build a searchable index.'
- Compare meaning-based, keyword and combined search; re-rank results and measure retrieval separately from answer
  quality.
- Explain advanced search ideas such as query rewriting, HyDE, contextual retrieval, GraphRAG and agentic RAG.
- 'Trace an **agent**: a model proposing tool calls in a controlled decide → act → observe loop; compare fixed workflows
  and multi-agent designs.'
- Explain MCP tool connections and defend against hostile document instructions with permissions, validation, limits,
  approval and logs.
coverage:
- static knowledge
- hallucination
- private data
- embedding
- vector database
- chunking
- indexing
- dense
- hybrid
- re-ranking
- citations
- query rewriting
- GraphRAG
- faithfulness
- answer relevance
- retrieval quality
- agent
- function calling
- memory
- planning
- ReAct
- workflows
- multi-agent
- Model Context Protocol
- prompt injection
- human oversight
- LangGraph
- LlamaIndex
slides:
- type: title
  figure: cover
  notes: 'In short: A course assistant needs verifiable evidence and controlled tools to answer questions about an invented
    handbook.

    Explain: RAG means retrieval-augmented generation: search passages before answering. Embeddings represent text as comparison
    vectors. An agent proposes intermediate tool calls within a loop. Application code runs permitted tools. These processes
    reuse prompting, evaluation and deployment from earlier weeks.

    Example: A public model has no reliable basis for an invented late penalty. An open-book assistant first finds the relevant
    handbook passage, then cites it. The analogy explains access to evidence, but neither a retrieved page nor a fluent answer
    establishes truth without checking its source and meaning.

    Ask: Does reading handbook passages train the language model?

    Answer: No. Retrieval changes the current input context while learned model weights remain fixed.

    Watch out: A useful answer and a permitted action need different checks. Keep source support separate from tool execution
    permission.'
- type: outcomes
  notes: 'In short: Build an evidence route and a controlled action route, then evaluate both against their intended tasks.

    Explain: A chunk is one searchable passage. A vector index helps locate compatible embeddings. Grounding means an answer
    claim is supported by supplied evidence. A tool is a named operation the application can execute. MIMLO means minimum intended
    module learning outcome.

    Example: Trace a penalty question into a cited passage and a grade question into handbook search followed by calculation.
    The first route tests evidence selection and use. The second also tests whether code validates and records operations. Implementing
    either route requires more than naming a framework or showing a plausible final sentence.

    Ask: Which outcome requires implementation rather than only describing retrieval?

    Answer: Build and check the retrieval and tool routes, corresponding to this week’s implementation outcomes.

    Watch out: Metrics must match the operation being tested. A document hit, citation marker or successful calculator call
    each supports a narrower claim than overall reliability.'
  items:
  - Explain RAG.
  - Trace indexing.
  - Measure evidence.
  - Implement tools.
  - Control actions.
  - Justify design.
- type: agenda
  items:
  - title: Hook
    minutes: 5
  - title: Why retrieval
    minutes: 15
  - title: Prepare indexes
    minutes: 15
  - title: Find; evaluate evidence
    minutes: 30
  - title: Tools; loops; protocols
    minutes: 30
  - title: Risks; controls
    minutes: 13
  - title: Lab; recap
    minutes: 5
  notes: 'In short: The lesson moves from evidence preparation to answer checks, then from tool proposals to bounded execution.

    Explain: Indexing prepares passages; retrieval selects evidence; generation writes from the supplied context. A VAE compresses
    and rebuilds data; a GAN trains a generator against a critic. An LLM predicts text; RAG retrieves evidence before answering.
    An agent repeats decisions after observations. A guardrail restricts inputs or executable operations.

    Example: Prepare the handbook once, then use the same index for a penalty question and a calculator-assisted grade task.
    Reserve time to inspect failures: a wrong passage needs a different correction from a wrong calculation. The recipe analogy
    describes a fixed workflow; an agent instead chooses intermediate steps after each result.

    Ask: Where should the class inspect the hostile forum instruction?

    Answer: In the risks section, alongside the proposed call, code decision and recorded observation.

    Watch out: An impressive demonstration cannot replace separate retrieval, support and execution tests. Keep the original
    syllabus order while connecting each stage to an observable result.'
- type: discussion
  title: Warm-up
  prompt: A chatbot states an invented late penalty. What would establish evidence?
  points:
  - Find the exact passage.
  - Check permission and claim support.
  notes: 'In short: A plausible handbook answer is a guess until the assistant has an authorised supporting passage.

    Explain: Private rules may be absent from training data. A hallucination is a generated claim without an adequate factual
    basis. Context supplies text for this response. Abstention means declining to answer when evidence is insufficient. Citations
    identify evidence that a reader can inspect.

    Example: Ask about the fictional late penalty before showing any sources. A coincidentally correct number still has no demonstrated
    evidence route. A new colleague needs the relevant, dated handbook page rather than confidence alone. The analogy breaks
    if we assume either the colleague or the model always interprets the page correctly.

    Ask: What evidence would justify a specific late-penalty answer?

    Answer: The current authorised penalty passage, with the claimed rule actually supported by its text.

    Watch out: Do not reward confident guessing about a private rule. Check what was supplied, what was claimed and whether
    the cited passage entails that claim.'
- type: section
  number: 1
  title: Why RAG?
  question: What can't an LLM do on its own?
  icon: fa:FaBookOpen
  notes: 'In short: Retrieval supplies missing evidence without replacing the need to verify source quality and answer use.

    Explain: A language model predicts text from learned patterns and current input. Its learned knowledge can be incomplete
    or outdated. Retrieval searches an external collection for passages. Fine-tuning changes learned parameters. Long context
    places more supplied material directly into one request.

    Example: The handbook changes its deadline. Re-index the changed source, retrieve the new passage and check the answer’s
    citation. Searching resembles a librarian locating pages; it does not make those pages authoritative or force the writer
    to use them correctly. The right choice depends on the measured failure rather than a fashionable architecture.

    Ask: Does adding retrieved text fine-tune the model?

    Answer: No. It adds evidence to this request without changing stored language-model weights.

    Watch out: A search can find irrelevant, stale or misleading passages. Generation can misuse correct passages, so evaluate
    the two stages independently.'
- type: cards
  title: LLM limitations that retrieval addresses
  cards:
  - head: Changing facts
    text: Retrieve current versions.
  - head: Private sources
    text: Check authorised access.
  - head: Unsupported claims
    text: Inspect each claim.
  - head: Citations
    text: Read the cited passage.
  notes: 'In short: RAG addresses evidence access and traceability while leaving interpretation and source verification as separate
    responsibilities.

    Explain: Changing facts require current sources. Private documents require authorised access. Hallucinations remain possible
    when evidence is incomplete or misread. A citation is a pointer to a passage. It is not a certificate that every answer
    claim follows from that passage.

    Example: A late-policy answer can cite the correct handbook yet invent an extra deadline. The citation helps the reader
    inspect the error but does not remove it. An open-book exam can still contain a wrong inference. Similarly, retrieval lowers
    some information gaps while source quality and faithful interpretation still determine the result.

    Ask: Which limitation does retrieval reduce without eliminating?

    Answer: Unsupported answers: the model can still add or misinterpret information despite receiving useful sources.

    Watch out: Separate the source’s authority, its relevance and the answer’s support. These are three different questions
    even when one citation number is visible.'
- type: table
  title: RAG, fine-tuning or long context?
  header:
  - Method
  - Updates
  - Evidence
  rows:
  - - RAG
    - Index
    - Selected passages
  - - Fine-tuning
    - Weights
    - Needs separate sources
  - - Long context
    - Prompt
    - Included documents
  notes: 'In short: Choose between retrieval, fine-tuning and direct context according to the information gap and measured workload.

    Explain: RAG selects passages for a question. Fine-tuning changes model behaviour through learned weights. Long context
    includes documents directly in the request. Source permissions must hold for any supplied text. A method can be combined
    with another when their roles remain clear.

    Example: A few short authorised policies may fit directly in a prompt. A changing collection may need search and versioned
    source IDs. A stable output-format problem may justify training. The filing-cabinet analogy explains selective access, but
    retrieval overhead can outweigh savings for a tiny collection; measure tokens, latency and quality rather than assuming
    a winner.

    Ask: Why use retrieval when documents already fit in the context window?

    Answer: It may reduce supplied text and simplify selective permissions or updates; test those benefits.

    Watch out: Knowledge stored in weights is difficult to cite or selectively remove. Larger context also does not guarantee
    that the relevant detail influences the answer.'
  callout: Compare quality, tokens and permissions.
- type: figure
  title: The RAG pipeline
  figure: rag_pipeline
  notes: 'In short: Indexing prepares reusable search representations; answering retrieves passages and checks the generated
    evidence use.

    Explain: Splitting creates passages with source IDs. A fixed embedding model maps each passage into a vector. Storage preserves
    vector-to-passage correspondence. At question time, ranking and selection supply a short evidence list. Generation and support
    checks operate on that selected text.

    Example: Thirty passages at embedding width 384 form a [30,384] table. A question vector [1,384] produces thirty similarity
    scores. The selected IDs recover actual text for the answer prompt. These are illustrative shapes, not a measured collection
    size. Updating a source requires refreshing its text, vectors and metadata together.

    Ask: Which phase runs after a source document changes?

    Answer: Indexing refreshes the affected passages and stored representations before later questions use them.

    Watch out: Search scores are not truth probabilities. Retain source identity and inspect the exact passages rather than
    treating a high score as verification.'
- type: quiz
  question: Changing policies need exact source links. Try?
  options:
  - Monthly fine-tuning.
  - All policies every request.
  - General training knowledge.
  - Refresh RAG; verify citations.
  answer: 3
  notes: 'In short: For changing policies with required evidence links, start by refreshing retrieval and checking cited support.

    Explain: Policy updates change source content. Re-indexing updates searchable passages. Retrieved source IDs permit evidence
    links. Access filters restrict which passages may enter a request. Fine-tuning changes weights rather than attaching a reliable
    source trail.

    Example: Monthly HR updates can replace one versioned policy and refresh its index. A fixed final question set then checks
    both the answer and its cited passage. Pasting every policy may suit a tiny authorised collection, but each request carries
    that text. The library analogy explains locating current editions, not automatic interpretation or permission enforcement.

    Ask: Why is option B potentially expensive as the collection grows?

    Answer: D. Every request includes every policy’s tokens, and per-document access must still be enforced.

    Watch out: D is the intended answer. A cannot guarantee evidence links, and general training knowledge cannot establish
    the current internal policy.'
- type: section
  number: 2
  title: Embeddings, chunking and vector databases
  question: How can numbers represent a question and help find an answering passage?
  icon: fa:FaDatabase
  notes: 'In short: An index must preserve both searchable representations and the metadata needed to verify each returned passage.

    Explain: An embedding is a numerical representation for comparison. Chunking determines the text represented by one vector.
    Metadata records source, section, version and permissions. An index maps search results back to passage rows. Compatible
    question and passage vectors use the same learned encoder.

    Example: A returned row can point to the assessment document but omit its pass-mark sentence. The index-card analogy helps
    connect representation with location; an index card alone does not contain every fact in its parent book. Inspect passage
    text, encoder truncation and source labels before concluding that useful evidence reached the generator.

    Ask: What happens if the embedding model changes?

    Answer: Re-encode stored passages so query and passage vectors occupy the same representation space.

    Watch out: Row order and source IDs are part of the contract. Losing either can attach a correct-looking citation to the
    wrong passage.'
- type: bullets
  title: Text embeddings for retrieval
  bullets:
  - Encode questions and passages compatibly.
  - Similarity ranks text; it does not verify truth.
  notes: 'In short: Separate question and passage encoding makes reusable vector search possible, provided their representations
    remain compatible.

    Explain: A bi-encoder processes each text separately. Its embeddings are learned numerical descriptions. Cosine similarity
    compares vector directions. Normalising vectors gives unit length. Then their dot product equals cosine similarity rather
    than an answer-correctness probability.

    Example: The local MiniLM example maps thirty short passages to [30,384] and a question to [1,384]. Their matrix product
    gives [1,30] search scores. These illustrative shapes expose the matching operation. A map analogy explains nearby representations,
    but two nearby texts can contradict one another or omit the fact needed.

    Ask: Why encode questions and passages with the same model?

    Answer: Their coordinates must have compatible meanings for a similarity comparison to be useful.

    Watch out: The verified MiniLM encoder truncates long input. Inspect token lengths; a leaderboard score or vector match
    cannot establish performance on this handbook.'
  visual:
    type: example_strip
    items:
    - label: Passages
      text: '[N,384] stored vectors'
    - label: Question
      text: '[1,384] → N scores'
- type: figure
  title: 'Chunking: splitting documents into retrievable pieces'
  figure: chunking
  bullets:
  - Preserve boundaries and source metadata.
  - Test size and overlap.
  stack: true
  notes: 'In short: Chunk boundaries decide which pieces of evidence remain together and which facts retrieval can actually
    return.

    Explain: A chunk is one searchable passage. Overlap repeats some boundary text. Structure-aware splitting follows headings
    or paragraphs. Metadata retains the source and version. No single chunk size is optimal for every document or question.

    Example: A rule and its exception may sit on opposite sides of a boundary. Overlap helps only if enough text remains together;
    it cannot guarantee that every split preserves the complete exception. The lab’s size and overlap count approximate characters
    at whole-word boundaries, while an encoder’s limit counts tokens. Inspect both units.

    Ask: Why overlap adjacent chunks?

    Answer: To reduce the chance that relevant boundary information disappears from every individual returned passage.

    Watch out: Larger chunks can add distraction and smaller chunks can lose context. Test actual evidence spans rather than
    assuming that parent-document identity proves answer coverage.'
- type: table
  title: Where to store vectors
  header:
  - Store
  - Use
  rows:
  - - NumPy / FAISS
    - Local exact search
  - - Chroma
    - Collections; metadata
  - - pgvector
    - Existing PostgreSQL
  - - Vector services
    - Persistence; scale
  notes: 'In short: Start with exact local search, then choose storage features according to persistence, filtering and workload
    needs.

    Explain: NumPy can compare a question against a small vector table. FAISS is a vector-search library. Chroma adds collection
    and metadata operations. pgvector adds vector search to PostgreSQL. A managed service introduces deployment and access configuration.

    Example: A classroom collection with tens of passages needs no elaborate service to rank vectors. A growing application
    may need persistent storage, concurrent users, filtering or existing database integration. A filing cabinet explains organisation,
    but installing one does not define who may read its contents or ensure that stale entries are removed.

    Ask: Which approach is sufficient to inspect a small notebook collection?

    Answer: Exact NumPy search is enough; optional FAISS or Chroma illustrates additional storage choices.

    Watch out: An in-memory collection is not persistent merely because it is called a database. Describe its lifecycle, metadata
    and permission checks explicitly.'
  callout: Test permissions and lifecycle.
- type: bullets
  title: Searching millions of vectors quickly
  bullets:
  - Approximate search may miss evidence.
  - Apply access rules before prompting.
  notes: 'In short: Approximate search can reduce comparisons, while permission filtering must still precede supplying evidence
    to the model.

    Explain: Exact search compares every stored vector. ANN means approximate nearest-neighbour search. HNSW searches a graph
    of nearby vectors. IVF restricts comparisons through clusters. Product quantisation compresses vector parts. Approximation
    can miss relevant passages.

    Example: If a relevant passage ranks twelfth but only three are supplied, generation never sees it. Faster candidate search
    is useful only when its evidence loss is acceptable for the task. A shortcut-map analogy explains fewer comparisons, but
    the route may skip a useful destination; measure retrieval and response quality together.

    Ask: Why enforce permissions before passages enter the prompt?

    Answer: Restricted information can influence an answer once supplied, even if a later display filter hides the passage.

    Watch out: The local handbook has no production access-control system. Do not mistake public invented documents or a metadata
    label for a tested permission implementation.'
  visual:
    type: mini_table
    header:
    - Index
    - Operation
    rows:
    - - HNSW
      - Navigate neighbours
    - - IVF
      - Search clusters
    - - PQ
      - Compress vector parts
- type: section
  number: 3
  title: Retrieval, advanced RAG and evaluation
  question: How do we retrieve well, answer faithfully and prove it?
  icon: fa:FaBullseye
  notes: 'In short: Diagnose evidence selection and evidence use separately before adding another retrieval or generation component.

    Explain: Dense retrieval compares learned vectors. BM25 ranks weighted word matches. Hybrid retrieval combines rankings.
    A re-ranker scores shortlisted question-passage pairs together. Retrieval metrics describe what was found; answer metrics
    describe what the response did with it.

    Example: A query containing an exact module code may favour keyword search, while a deadline paraphrase may favour dense
    search. Compare both against labelled evidence spans. A second reader can reorder candidates, but cannot recover a passage
    absent from the shortlist. Each extra component adds computation and another setting to validate.

    Ask: Why measure retrieval separately from answer quality?

    Answer: Missing evidence and misuse of supplied evidence require different corrections.

    Watch out: The archived chart measures document hits. The upgraded core also checks specific relevant passages; a digit-presence
    proxy remains insufficient for complete claim support.'
- type: compare
  title: Dense vs. keyword retrieval
  columns:
  - head: Dense
    points:
    - Compare meaning vectors.
    - Paraphrases; imperfect identifiers.
  - head: BM25
    points:
    - Weight matching words.
    - Rare codes; imperfect paraphrases.
  callout: Hybrid combines rankings; test the result.
  notes: 'In short: Keyword and vector retrieval capture different signals, so compare them rather than assuming either always
    wins.

    Explain: BM25 weights matching words by their distribution in the collection. Dense retrieval compares semantic representations.
    Rare identifiers may favour exact word matches. Paraphrases can favour embeddings. RRF, reciprocal rank fusion, combines
    ranking positions without mixing incompatible score scales.

    Example: ZX-4471 illustrates a rare code, while handing work in after the deadline paraphrases late submission. An index
    of words and a map of meanings supply complementary routes. The analogy breaks if meaning similarity is treated as logical
    agreement: a passage about a different deadline can sound very similar.

    Ask: Which route is likely useful for an exact rare identifier?

    Answer: Keyword retrieval, though the result still needs a relevance check on the actual collection.

    Watch out: Hybrid is an option to test, not a guaranteed winner. Freeze settings on development questions before reporting
    final held-out measurements.'
- type: equation
  title: Fusing rankings and measuring retrieval
  eq:
  - \mathrm{RRF}(d) = \sum_r \frac{1}{c + \mathrm{rank}_r(d)},\qquad c=60
  - \text{lab hit@}K = \frac{\#\text{questions with a gold-document hit in top }K}{\#\text{answerable questions}},\qquad \mathrm{MRR}=\dfrac{1}{|Q|}\sum_q
    \dfrac{1}{\mathrm{rank}_q}
  read_as:
  - Fuse rank positions, not score scales.
  - 'Archive: document hit@K and MRR.'
  - 'Core: labelled-passage recall@K.'
  terms:
  - - c
    - Fusion smoothing
  - - K
    - Result cutoff
  - - $\mathrm{rank}_q$
    - First relevant rank
  - - d
    - Passage
  - - r
    - Retriever
  - - Q
    - Question set
  notes: 'In short: Fusion combines rank evidence; distinguish the archived document-hit equation from current passage-level
    recall.

    Explain: RRF adds one over c plus each rank. Here r identifies a retriever, d a passage, rank its position, and c smooths
    at sixty. K is the returned-result cutoff. MRR averages reciprocal first-relevant ranks for each question q in Q; |Q| counts
    questions. Missing relevant results contribute zero. Passage recall divides retrieved relevant passages by all labelled
    relevant passages.

    Example: Ranks one and five contribute 1/61 plus 1/65, approximately 0.03178. With two labelled useful passages and one
    retrieved, passage recall is one-half. The displayed historical hit equation instead gives a question one hit when its target
    document appears. Neither calculation establishes that a generated answer uses evidence correctly.

    Ask: Can we add raw BM25 and cosine scores directly?

    Answer: Their scales differ; rank fusion combines positions instead.

    Watch out: Define relevance and denominators explicitly. Keep the historical document-hit metric labelled, and use exact
    passage evidence for the new core.'
- type: bullets
  title: 'Re-ranking: a second, more careful look'
  bullets:
  - Score shortlisted pairs jointly.
  - Measure evidence gain and elapsed time.
  notes: 'In short: Re-ranking spends more attention on a shortlist and must justify its extra latency with better selected
    evidence.

    Explain: A cross-encoder reads question and passage together. Its scores reorder an existing shortlist. A bi-encoder permits
    stored passage vectors. Re-ranking cannot recover excluded candidates. Candidate selection and final passage cutoff are
    separate settings.

    Example: First return ten candidate IDs, then compare each question-passage pair and retain three. These are illustrative
    counts. A careful second reader can reject a superficially similar paragraph, but cannot read a page that was never collected.
    The CPU core keeps this optional and reports which route actually ran.

    Ask: Why avoid running a cross-encoder over the whole large collection?

    Answer: It performs a joint model calculation for each question-passage pair, increasing work as the collection grows.

    Watch out: Measure useful evidence and elapsed time together. A better rank score alone does not demonstrate better grounded
    answers or acceptable waiting time.'
  visual:
    type: example_strip
    items:
    - label: Fast search
      text: Ten illustrative candidates
    - label: Cross-encoder
      text: Question + passage → rank
- type: figure
  title: 'Measured: retrieval quality on the handbook questions'
  figure: lab_retrieval
  bullets:
  - Archived document-hit scores.
  - Inspect the exact useful passage.
  stack: true
  notes: 'In short: The stored retrieval bars compare source-document hits, while the new core requires labelled passage evidence.

    Explain: Each archived question names a target document. A hit counts any returned chunk from that document. Rank-one results
    show ordering differences. MRR rewards earlier first hits. Specific passage recall is a different metric and needs explicit
    relevance labels.

    Example: {{RETRIEVAL_NOTES}} A returned assessment chunk can omit the pass-mark sentence while still counting as a document
    hit. An exam analogy distinguishes finding the correct chapter from finding the paragraph that answers the question. Inspect
    the retrieved text before using the archive to claim complete evidence coverage.

    Ask: Why inspect passages even when document hit@3 is high?

    Answer: A passage from the right document may lack the needed fact.

    Watch out: These bars retain the documented archived model and corpus. Do not transfer their scores to the new encoder,
    chunks or CPU generator.'
- type: figure
  title: 'Measured: RAG vs. no retrieval'
  figure: lab_rag
  bullets:
  - Archived generator; same questions.
  - Number matches are limited proxies.
  stack: true
  notes: 'In short: Compare no-retrieval and retrieved-context answers on identical questions, then separate correctness, support
    and abstention.

    Explain: The no-retrieval baseline lacks the invented handbook. RAG supplies selected passages. Reference matching checks
    an expected answer. Citation support checks the cited evidence. Abstention tests missing information. These signals can
    disagree for one response.

    Example: {{RAG_NOTES}} The external-examiner question has no handbook answer. A guessed name can be fluent but unsupported;
    a correct abstention can have no citation. The archived digit check is a narrow proxy, while the new core separately checks
    verbatim quoted claims against their cited passages.

    Ask: Why include an unanswerable question?

    Answer: It checks whether the system declines missing evidence instead of inventing a fact.

    Watch out: Prompt placement affected the recorded run, not every model. Report actual inputs, model and check definitions;
    neither a citation marker nor matching digits proves complete semantic support.'
- type: cards
  title: Advanced RAG techniques
  cards:
  - head: Rewrite
    text: Resolve follow-up context.
  - head: HyDE
    text: Search hypothetical answers.
  - head: Contextualise
    text: Add section meaning.
  - head: GraphRAG
    text: Summarise linked entities.
  - head: Parent-child
    text: Return larger sections.
  - head: Agentic RAG
    text: Bound repeated search.
  notes: 'In short: Advanced retrieval techniques should target an observed failure rather than increase complexity without
    evidence.

    Explain: Query rewriting makes a conversational question self-contained. HyDE searches with a hypothetical answer representation.
    Contextualisation adds a passage’s surrounding meaning. GraphRAG uses linked entities and summaries. Parent-child retrieval
    matches small passages but supplies larger sections. Agentic RAG permits bounded repeated search.

    Example: And for the exam? needs the earlier topic before search can interpret it. If a passage lacks its heading, added
    context may help. A hypothetical answer can also invent misleading terms. Each technique changes the selected evidence,
    so compare it with a simple baseline on development questions before using held-out tests.

    Ask: Which technique makes a follow-up question searchable by itself?

    Answer: Query rewriting, using the conversation’s relevant context.

    Watch out: Published gains belong to their tested setting. More stages can add errors, tokens and latency; inspect the original
    failure and measure the proposed correction.'
- type: table
  title: 'Evaluating RAG: retrieval and generation separately'
  header:
  - Check
  - Meaning
  rows:
  - - Retrieval
    - Useful passages found?
  - - Faithfulness
    - Supported claims?
  - - Relevance
    - Question answered?
  - - Correctness
    - Reference agreement?
  - - Citations
    - Cited passage supports?
  - - Abstention
    - Missing evidence declined?
  notes: 'In short: Evaluate whether evidence arrived, whether claims follow from it, and whether the response answers the intended
    question.

    Explain: Retrieval measures selected evidence. Faithfulness means claims follow from supplied sources. Relevance concerns
    answering this question. Correctness compares with known reference facts. Citation support checks the actual cited passage.
    Abstention concerns missing evidence.

    Example: An answer can quote a real exam duration when asked about office hours: supported, but irrelevant. Another can
    cite assessment while inventing a deadline: relevant topic, unsupported claim. The core’s conservative quote check accepts
    only text present in its cited passage. Valid paraphrases need separate semantic or human review rather than automatic rejection
    as false.

    Ask: Which check fails when a cited document does not contain the added deadline?

    Answer: Faithfulness and citation support fail for that claim.

    Watch out: Do not report a single score as complete reliability. Preserve claim-level errors and evidence text, including
    zero-claim abstentions, so a reviewer can diagnose the failure.'
- type: quiz
  question: Evidence ranks twelfth; three passages reach the prompt. Improve?
  options:
  - Retrieval or chunking.
  - Generator size.
  - Temperature.
  - Accuracy instruction.
  answer: 0
  notes: 'In short: If useful evidence never reaches the prompt, improve evidence selection before changing the generator.

    Explain: The candidate rank describes retrieval order. The prompt cutoff limits supplied passages. Re-ranking changes order
    within a shortlist. Chunking changes what one result contains. Generation can faithfully answer only from evidence actually
    supplied.

    Example: A relevant passage at rank twelve is excluded when only three reach the model. A larger generator may guess the
    right fact, but the evidence route still failed. The open-book analogy requires the right page to be open. Compare selected
    passage IDs and text, not merely whether search somewhere found the correct document.

    Ask: What should be measured after changing retrieval?

    Answer: A. Passage recall at the supplied cutoff, then correctness and support of the resulting answers.

    Watch out: A is correct. Temperature and an accuracy instruction do not supply the missing passage. Recheck evidence before
    attributing an answer improvement to better grounding.'
- type: section
  number: 4
  title: Agentic AI
  question: What changes when the model can act?
  icon: fa:FaRobot
  notes: 'In short: Tool use changes the application from answering with text to proposing operations that code must control.

    Explain: An agent chooses intermediate steps using a model. A tool call names an operation and its arguments. Application
    code validates that proposal before execution. An observation is the returned result. A bounded loop stops after an answer
    or budget limit.

    Example: A grade task needs assessment weights before calculation. The model proposes handbook search; the program returns
    evidence, then may execute a calculator proposal. A colleague asking to borrow a calculator does not already operate it.
    Likewise, a generated call is not an executed action or an authorised permission grant.

    Ask: Who executes a proposed tool call?

    Answer: Application code executes only a permitted, validated operation.

    Watch out: Protocol compatibility and clear tool descriptions do not enforce trust. The local fallback uses a disclosed
    fixed policy; do not label its planned decisions as autonomous model reasoning.'
- type: cards
  title: Components of an LLM agent
  cards:
  - head: Model
    text: Proposes next step.
  - head: Tools
    text: Named checked functions.
  - head: Memory
    text: Current task history.
  - head: Planning
    text: Uses observed results.
  - head: Budget
    text: Bounds repetition.
  - head: Oversight
    text: Permissions and audit.
  notes: 'In short: An agent combines a decision model, tools, task history, a loop budget and application oversight.

    Explain: Tools expose named operations. Memory here contains current-task messages and observations. Planning chooses or
    revises intermediate steps. The loop requests decisions until stopping. Oversight supplies permissions, validation and audit
    records. These components have distinct responsibilities.

    Example: For the grade task, task history initially contains two marks. After search it also contains the handbook weights.
    Only then can a calculator expression use observed values. A notebook margin can hold working notes, but that analogy does
    not make temporary history permanent knowledge or prove that stored text is trustworthy.

    Ask: Which component prevents indefinite repeated calls?

    Answer: The application’s step and resource budget stops the loop.

    Watch out: More memory is not automatically better. Retain relevant observations, track their sources, and keep external
    results from acquiring the authority of the user’s actual goal.'
- type: figure
  title: 'The agent loop (ReAct: reason, act, observe)'
  figure: agent_loop
  notes: 'In short: The agent loop observes one actual tool result before deciding whether another step is needed.

    Explain: ReAct interleaves reasoning, action and observation. A parser converts proposed text into a structured call. Validation
    checks names and argument fields. Execution runs permitted code. Recording appends the result or error to history. A final
    answer or limit ends the loop.

    Example: Search returns a 60% project weight and 40% exam weight in the fictional handbook. A later calculator call uses
    those observed numbers. These supplied values illustrate the task, while the archived trajectory separately records a real
    model’s behaviour. Executing multiple dependent proposals at once can compute with values invented before search finishes.

    Ask: What is an observation?

    Answer: The actual tool result or error supplied to the next decision.

    Watch out: A model may stop incorrectly or propose malformed calls. Keep the final answer, executed trajectory, failed proposals
    and budget status as separate evidence.'
- type: code
  title: 'Function calling: tools are described, the model proposes, your code executes'
  code: "calls = parse_tool_calls(reply)[:1]\nif calls:\n    result = execute(calls[0])\n    messages.append({\"role\": \"tool\"\
    , \"content\": result})"
  notes: 'In short: A tool schema describes a request; the executor still checks the proposed name, arguments and permissions.

    Explain: Function calling produces structured operation proposals. A schema names allowed argument fields and types. Parsing
    does not establish validity. The executor checks the allowlist and required fields. Only then does application code call
    the function.

    Example: A calculator proposal containing an expression must be checked as a string and parsed as bounded arithmetic. A
    proposed unknown shell tool must be rejected. A form analogy explains named fields, but receiving a filled form does not
    mean its contents are valid or that the action is approved.

    Ask: Why execute only one dependent tool call per turn?

    Answer: The next proposal can use the observed result rather than invent its inputs.

    Watch out: The email operation and domain gate are simulated. Real consequential actions need actual review mechanisms;
    generated arguments alone never supply that review.'
  caption: Proposal → checked execution → observation.
- type: figure
  title: 'Measured: a real agent trajectory from the lab'
  figure: agent_trace
  bullets:
  - Archived tool observations; independently check the answer.
  stack: true
  notes: 'In short: The archived trajectory shows what executed, while an independently checked answer establishes task success.

    Explain: A trajectory records tool calls and observations. The final answer is a separate output. Task success requires
    a predeclared check. Tool use alone does not demonstrate success. Step limits can stop a run before completion.

    Example: {{AGENT_NOTES}} Independently calculate 0.6 times 72 plus 0.4 times 64, giving 68.8 for the fictional exercise.
    This arithmetic is reproducible; it is not a new measurement of agent accuracy. A receipt analogy helps trace operations,
    but a complete-looking receipt can still contain a wrong input or missing action.

    Ask: Why use calculator output rather than trusting mental arithmetic in generated text?

    Answer: Code can perform and check the defined arithmetic; the model may miscalculate.

    Watch out: Read the original source weights and actual observations. New model runs may differ from this archived trajectory
    and must not inherit its success claim.'
- type: figure
  title: Workflows vs. agents
  figure: workflows
  bullets:
  - 'Fixed path: workflow.'
  - 'Chosen next step: agent.'
  stack: true
  notes: 'In short: Use a workflow for a known route and an agent when choosing intermediate steps provides measured value.

    Explain: A workflow follows paths defined in code. An agent uses model decisions to choose its next step. Chaining, routing
    and parallel work are workflow patterns. Worker delegation splits tasks. Evaluation and revision form another controlled
    pattern.

    Example: A course assistant that always retrieves and answers follows a workflow even though it calls a language model.
    Open-ended investigation may need another search after inspecting a result. A recipe describes a known sequence; a cook
    adapting the recipe illustrates decisions, but neither analogy removes the need for time, tool and permission limits.

    Ask: Is a fixed search-then-answer assistant an agent?

    Answer: It is a workflow because code predefines its route.

    Watch out: Autonomy adds decision failures and calls. Compare task success, elapsed time and resource use with the simpler
    design before claiming that flexible planning helps.'
- type: bullets
  title: Multi-agent systems
  bullets:
  - Divide roles and permissions.
  - Measure calls, failures and task success.
  notes: 'In short: Multiple agents can divide work and permissions, but their coordination adds observable failure and resource
    costs.

    Explain: A role assigns one part of a task. A coordinator or message exchange connects roles. Parallelism runs independent
    work together. Errors can propagate between agents. A2A is a protocol for agent communication rather than an answer-quality
    guarantee.

    Example: A researcher supplies evidence, a writer drafts and a reviewer checks claims. Independent searches may overlap
    usefully, while a shared false premise can infect every role. A team analogy explains division of work, but generating three
    agreeing opinions is not three independent verifications. Compare a single-agent baseline using the same task and evidence.

    Ask: What should be measured when adding another agent?

    Answer: Task success, extra calls and tokens, elapsed time, and errors that spread between roles.

    Watch out: Report resource cost per successful task and handle zero successes explicitly. Agreement or the number of agents
    alone is insufficient evidence that the design improved.'
  visual:
    type: example_strip
    items:
    - label: Researcher
      text: Collects source evidence
    - label: Reviewer
      text: Checks claims against evidence
- type: figure
  title: The Model Context Protocol (MCP)
  figure: mcp
  bullets:
  - Host clients discover server capabilities.
  - Compatibility does not grant trust.
  stack: true
  notes: 'In short: MCP standardises capability discovery and calls while the host remains responsible for trust and permissions.

    Explain: MCP means Model Context Protocol. A host application manages clients. A server exposes capabilities such as tools
    or resources. The client discovers and requests them. A standard connection does not make returned content trustworthy or
    authorise every proposed operation.

    Example: A handbook server can expose a search tool with one query field. The host discovers its schema, validates a request
    and receives passages. A shared socket analogy explains interoperability, but a compatible device can still be faulty or
    malicious. The dated specification is 2026-07-28; implementation details must match the version used.

    Ask: Which side exposes tools and resources?

    Answer: The server exposes them; the client within the host discovers and requests them.

    Watch out: The notebook writes an incomplete SDK scaffold, not a running server. Connect retrieval and load its index before
    claiming that the exported file serves searches.'
- type: table
  title: Frameworks and tools for RAG and agents
  header:
  - Toolkit
  - Focus
  rows:
  - - LangGraph
    - Stateful paths
  - - LlamaIndex
    - Retrieval
  - - OpenAI Agents SDK
    - Tools; tracing
  - - Google ADK
    - Orchestration
  - - Microsoft Agent Framework
    - Python; .NET
  - - HF smolagents
    - Open-model tools
  notes: 'In short: Frameworks package retrieval, state and tool orchestration after the application’s required route has been
    chosen.

    Explain: A framework supplies reusable components and control structures. LangGraph represents stateful paths. LlamaIndex
    emphasises data indexing and retrieval. Provider and open-model kits offer tool orchestration. Checkpoints record state
    for resuming or review. They do not independently establish evidence or permission.

    Example: A fixed handbook search needs indexing, selection, generation and checks before it needs a multi-agent framework.
    A larger application may need resumable state or handoffs. A toolbox analogy explains reusable parts, but choosing a toolkit
    does not specify which operations are appropriate or which results should count as success.

    Ask: Why learn the loop before selecting a framework?

    Answer: It makes the decision, validation, execution and observation boundaries easier to inspect and debug.

    Watch out: Vendor kits and interfaces evolve. Use the verified official documentation, retain a simple baseline, and test
    the actual route rather than attributing reliability to a framework name.'
- type: quiz
  question: Initial design for handbook deadlines and rules?
  options:
  - Three cooperating agents.
  - Autonomous web/email agent.
  - RAG; sources; abstention.
  - Fine-tuning without evidence.
  answer: 2
  notes: 'In short: A fixed RAG workflow is a sensible first design for factual questions over an authorised handbook.

    Explain: The source collection defines available evidence. Retrieval supplies selected passages. Generation answers or abstains.
    The workflow’s order is known in advance. Additional autonomous steps need a reason supported by evaluation.

    Example: A deadline question usually needs one evidence search and a cited response. An autonomous email agent introduces
    unrelated write capability. Three cooperating agents add calls without necessarily adding useful evidence. A service-desk
    checklist explains a known route, but it still needs up-to-date sources, error checks and a human escalation path when information
    is absent.

    Ask: Why is option B risky for this initial task?

    Answer: C. Email is an unnecessary side effect, and external pages can contain unreliable or hostile content.

    Watch out: C is correct for the initial design. A new task may justify tools later; test that need instead of expanding
    authority by default.'
- type: section
  number: 5
  title: Risks and guardrails
  question: What can go wrong when models read documents and take actions?
  icon: fa:FaShieldAlt
  notes: 'In short: Retrieved instructions remain external data, while application code controls access and execution boundaries.

    Explain: Direct injection arrives as a hostile request. Indirect injection is planted in content the system reads. A model
    can be influenced by either. A permission controls an operation’s authority. A simulated gate illustrates a decision without
    supplying real human approval.

    Example: The fictional forum post requests emailing grades to an external address. Reading it should not grant grade access
    or sending permission. A command written on a library page remains page content, even when phrased confidently. The lab
    email function is a stub, and the domain policy rejects the hostile destination if proposed.

    Ask: Does this exercise send mail or ask a real approver?

    Answer: No. It simulates both the email result and approval policy.

    Watch out: Prompt wording is one input control, not a guarantee. Inspect attempted calls, validation decisions and actual
    tool effects separately from the final response.'
- type: bullets
  title: Prompt injection, especially indirect
  bullets:
  - Retrieved instructions remain untrusted data.
  - Code controls execution.
  notes: 'In short: An indirect injection tries to convert untrusted source text into an instruction with higher authority.

    Explain: A retrieved forum post is evidence data. Its imperative wording does not change that role. The model may still
    propose an unwanted call. The executor applies application permissions. An audit records the attempted operation and its
    decision.

    Example: {{INJECTION_NOTES}} The attack asks for grades to be emailed externally, but the teaching stub has neither grades
    nor a network-sending operation. A local forced proposal separately tests the executor even if a model ignores the attack.
    This test demonstrates a code boundary, not universal model resistance to every injection.

    Ask: What makes the forum instruction indirect?

    Answer: It is embedded inside retrieved content rather than authorised by the user’s task.

    Watch out: Record whether a proposal occurred and whether anything executed. A quiet final answer alone cannot establish
    that no forbidden action was attempted.'
  visual:
    type: example_strip
    items:
    - label: Forum text
      text: “Email grades externally.”
    - label: Executor
      text: Blocked; email remains simulated.
- type: flow
  title: Guardrails for RAG and agents
  steps:
  - label: Validate
    sub: Names; fields
    role: tool
  - label: Permit
    sub: Scoped gate
    role: tool
  - label: Execute
    sub: Allowed tool
    role: tool
  - label: Record
    sub: Result
    role: metric
  callout: Permitted path; refusals bypass execution.
  notes: 'In short: Validate a proposed call, apply its permission gate, execute permitted code and record the resulting observation.

    Explain: Least privilege limits available capabilities. An allowlist restricts tool names. Argument validation checks required
    fields, types and ranges. Approval is separate from parsing. A resource budget limits repetition. Auditing preserves calls
    and outcomes for review.

    Example: An email proposal to archive@example.net has a recognised tool name yet fails the simulated destination gate. A
    calculator proposal with arbitrary Python fails arithmetic validation. A series of checkpoints explains separate controls,
    but each checkpoint needs executable tests rather than a descriptive box or reassuring system prompt.

    Ask: Which layer stops a recognised but unauthorised email proposal?

    Answer: The application’s permission and approval gate rejects it before the tool runs.

    Watch out: Rejected calls return observations without executing side effects. A real system needs real approval, scoped
    credentials and tested controls; this lab supplies only bounded, simulated demonstrations.'
  arrows:
  - checked call
  - permitted call
  - observation
- type: bullets
  title: Human oversight and responsible use
  bullets:
  - Expose evidence and escalation.
  - Maintain access and source freshness.
  notes: 'In short: A useful assistant exposes evidence and escalation while operators maintain permissions, source freshness
    and continuing evaluation.

    Explain: Human oversight lets users inspect sources and reach a person. Access controls restrict retrieved content. Data
    minimisation excludes unnecessary personal information. Versioning tracks changed sources. Ongoing evaluation tests ordinary
    failures, missing evidence and hostile content.

    Example: Indexing a shared drive can make sensitive paragraphs searchable through an innocent question. A locked filing
    cabinet analogy explains permission boundaries, but a metadata field is only a label until code enforces it. A university
    application’s intended purpose determines legal obligations; a factual handbook assistant differs from automated admissions
    or grading decisions.

    Ask: Why can indexing a shared drive create a privacy problem?

    Answer: Documents may become retrievable beyond the people and purposes originally authorised to read them.

    Watch out: Legal scope and dates require current authoritative guidance. Do not infer classification from the word education
    alone, or treat evaluation as complete at launch.'
  visual:
    type: mini_table
    header:
    - Control
    - Check
    rows:
    - - Access
      - Authorised passages
    - - Lifecycle
      - Refresh; delete
    - - Oversight
      - Inspect; escalate
- type: lab
  title: 'Lab 12: a RAG assistant and a tool-using agent, measured'
  steps:
  - Inspect no-retrieval answers.
  - Prepare compatible passage vectors.
  - Measure passage recall and citations.
  - Trace bounded tools and refusal.
  - 'Optional: databases, re-ranking, MCP.'
  runtime: 'CPU core: {{W12_CORE_TIME}}.'
  deliverable: Evidence tables, traces and explanations
  notes: 'In short: The CPU core builds genuine retrieval and grounded answering, then checks a bounded loop and simulated hostile
    proposal.

    Explain: MiniLM supplies learned passage vectors. NumPy performs exact local ranking. BM25 and RRF provide alternative search
    routes. A small pretrained local generator receives numbered evidence. A bounded executor runs validated tools. Optional
    APIs compare synthetic explanations while keeping a local route.

    Example: Inspect one [N,384] passage table, one cited answer and one search-to-calculator trace. The complete CPU time target
    awaits measurement. Database and re-ranking demonstrations remain optional. Archived GPU figures use their original models
    and metric definitions, so current outputs must be reported from their own actual run.

    Ask: What establishes that a claimed answer is supported?

    Answer: Inspect its cited passage and each claim; the core also supplies a conservative verbatim-quote check.

    Watch out: No API spending is required. Keep semantic claim review distinct from digit matches, label fixed fallback decisions
    honestly, and record stopped or unsuccessful tasks.'
- type: summary
  points:
  - Sources remain external evidence.
  - Preserve passage IDs.
  - Check claims and citations.
  - Code controls tools.
  - Bound and audit loops.
  - Measure success and resources.
  notes: 'In short: An evidence route and a tool route are reliable only within the claims supported by their separate checks.

    Explain: Retrieval supplies context without weight updates. Passage IDs preserve evidence identity. Claim checks examine
    what an answer asserts. An agent proposes operations. Code controls execution and budgets. Audits connect decisions with
    observed outcomes.

    Example: A penalty answer needs the correct passage and faithful use. A grade answer also needs observed weights and valid
    arithmetic. The complete module connects these routes with training, evaluation and deployment. A finished project should
    explain inputs, outputs, failure cases and measured resource use rather than only showing an attractive application demonstration.

    Ask: What should protect execution when a model follows a hostile instruction?

    Answer: Code-enforced permissions, validation, approval where needed, bounded loops and audit records.

    Watch out: A known path often suits a workflow. More agents, citations or low latency do not remove the need to verify evidence
    and define task success.'
- type: resources
  items:
  - kind: paper
    label: RAG foundation
    note: Retrieved memory
    url: https://arxiv.org/abs/2005.11401
  - kind: paper
    label: ReAct loop
    note: Actions; observations
    url: https://arxiv.org/abs/2210.03629
  - kind: doc
    label: Effective agents
    note: Design choices
    url: https://www.anthropic.com/engineering/building-effective-agents
  - kind: doc
    label: MCP tools
    note: Versioned interface
    url: https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  - kind: video
    label: Agents course Q&A
    note: Visual explanation
    url: https://www.youtube.com/watch?v=iLVyYDbdSmM
  notes: 'In short: Combine foundational papers, official interfaces and a worked notebook to understand retrieval and controlled
    tool use.

    Explain: The RAG paper introduces retrieved external memory. ReAct connects decisions with actions and observations. Official
    MCP documentation specifies capability exchange. An engineering guide compares workflows and agents. A course video gives
    another explanation before code practice.

    Example: A student confused by fusion should calculate 1/61 plus 1/65, then inspect the ranked IDs. A student confused by
    tools should trace a parsed calculator proposal through execute and its returned observation. Reading a tutorial or watching
    an agent run is useful, but neither replaces explaining the boundaries and checking the actual evidence.

    Ask: Which reading helps choose between a workflow and an agent?

    Answer: Anthropic’s Building effective agents, alongside a measured comparison for the actual task.

    Watch out: Follow official versioned interfaces for implementation. External examples can contain outdated assumptions;
    preserve a complete local path and verify each claim before reusing it.'
