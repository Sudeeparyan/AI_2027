  notes: 'The RAG and ReAct papers are the foundations. Anthropic''s two engineering posts are practical guides to agent design
    and retrieval quality. OpenAI''s function-calling guide explains tool schemas; Google''s Gemini function-calling guide is
    equivalent. The Hugging Face Agents course and Microsoft''s AI Agents for Beginners are free, hands-on courses. The Model
    Context Protocol site has the specification and SDKs. Ozdemir''s Quick Start Guide to Large Language Models, chapters on
    semantic search and retrieval, is the textbook reading. All links were last checked on 9 October 2026.


    Ask students: Which resource explains when to use workflows rather than agents?

    Expected answer: Anthropic''s Building effective agents.


    Common mistake: Reading framework tutorials before the RAG and ReAct papers'' core ideas.'
