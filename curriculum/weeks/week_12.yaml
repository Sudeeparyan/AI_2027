subtitle: "Connecting models to knowledge and tools: retrieval-augmented generation, evaluation, agents, the Model Context Protocol and guardrails"
mimlos: [3, 4, 5]
objectives:
  - "Explain the **limitations of LLMs** that motivate RAG: static knowledge, hallucination, no access to private data, no citations."
  - "Build a **RAG pipeline**: chunking, **embeddings**, **vector databases**, dense, keyword and **hybrid retrieval**, **re-ranking**, grounded generation with **citations**."
  - "Describe **advanced RAG** (query rewriting, HyDE, contextual retrieval, **GraphRAG**, agentic RAG) and **evaluate** RAG: retrieval quality, **faithfulness**, answer relevance."
  - "Explain **agentic AI**: LLM, **tools / function calling**, memory, planning, the **ReAct** loop; **workflows vs agents**; **multi-agent** systems; the **Model Context Protocol**."
  - "Identify agent risks, especially **prompt injection**, and design **guardrails** with **human oversight**."
  - "Choose between a RAG workflow and an agent for a real task, and justify the choice with evaluation."
