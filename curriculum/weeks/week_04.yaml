subtitle: "From noise to images: the forward and reverse processes, latent diffusion, guidance, fast samplers and flow matching"
mimlos: [1, 2, 3, 4]
objectives:
  - "Explain which limitations of **GANs and VAEs** diffusion models address, and what they cost."
  - "Describe the **forward (noising)** process and its closed form, and the learned **reverse (denoising)** process."
  - "Derive and implement the **noise-prediction** training objective; relate it to the score-based view."
  - "Describe the core architecture: **U-Net** and **diffusion transformers**, and **latent diffusion** with a VAE and text encoder."
  - "Use a pretrained pipeline and explain the effect of **steps, samplers, classifier-free guidance, seeds and negative prompts**."
  - "Explain modern variants (**flow matching**, distillation, editing, video and audio) and evaluate outputs (FID, CLIP score, human preference)."
