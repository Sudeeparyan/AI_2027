slides:
- type: title
  figure: cover
  notes: 'In short: Diffusion learns to predict deliberately added noise, then uses those predictions to generate new samples.


    Explain: A generative model produces examples resembling its training distribution. Gaussian noise contains random values
    drawn from a bell-shaped distribution. A denoiser is a network that predicts noise from a corrupted input. A sampler repeatedly
    updates the input using that prediction.


    Example: Imagine practising repairs on many noisy sketches whose original versions are available. Later, begin with fresh
    static and use learned drawing patterns. The analogy breaks because generation has no particular hidden sketch to recover.
    Our cover contains stored Stable Diffusion outputs from a separate measured image experiment.


    Ask: When generation starts from random noise, is there an original photograph waiting underneath?


    Answer: There is no original photograph. The trained model and optional conditions influence which new sample emerges.


    Watch out: Recognisable output can still contain errors, resemble training material or fail a requested constraint.'
- type: outcomes
  notes: 'In short: Today you will explain the diffusion loops, implement their updates and judge controlled generation experiments.


    Explain: The forward process adds noise using a fixed rule. Training changes network weights to improve noise predictions.
    The reverse process generates examples through repeated updates. Latent diffusion performs these updates in a compact numerical
    representation. Evaluation checks outputs against the intended task.


    Example: For a point batch shaped [256, 2], predict two noise coordinates per point. For an image batch [16, 1, 28, 28],
    predict an equally shaped tensor. The small point model teaches the same noise objective while keeping each calculation
    inspectable; it does not establish image-model quality.


    Ask: Which outcome requires looking at generated samples rather than only writing a correct equation?


    Answer: Judging quality, variety and prompt fit requires observed outputs and a stated evaluation method.


    Watch out: A correct implementation and a low training loss do not establish complete coverage or useful generation.'
  items:
  - Train denoisers.
  - Trace diffusion.
  - Evaluate outputs.
