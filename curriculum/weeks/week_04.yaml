subtitle: How adding noise creates training examples, and how repeated denoising generates an image
mimlos:
- 1
- 2
- 3
- 4
objectives:
- Compare generator quality, variety and cost.
- Separate fixed noising from learned denoising.
- Train a network with known noise targets.
- Trace latent diffusion components.
- Test samplers, guidance, seeds and prompts.
- Explain flow matching and evaluate outputs.
coverage:
- forward process
- noise schedule
- reverse process
- noise prediction
- score
- U-Net
- diffusion transformer
- latent diffusion
- text encoder
- DDPM
- DDIM
- classifier-free guidance
- negative prompt
- seed
- flow matching
- rectified flow
- distill
- inpainting
- ControlNet
- video
- audio
- FID
- CLIP score
- human preference
- Stable Diffusion
- Diffusers
slides:
- type: title
  figure: cover
  notes: 'Welcome to week 4, diffusion models. Almost every image and video generator you have used since 2022 is
    built on the ideas of today: Stable Diffusion, the image generators in chat assistants, Midjourney-style tools,
    and video models. The images on this slide were generated for this lecture by Stable Diffusion running on an
    ordinary laptop. Today we connect three threads: last week''s GANs, whose sample quality diffusion matches;
    week 2''s VAEs, whose latent space diffusion runs in; and week 1''s probability, because diffusion is trained
    with a bound on the likelihood. The lab trains a small diffusion model and uses a pretrained one.

    '
- type: outcomes
  notes: 'Six outcomes. The first sets up the motivation by comparing with the previous two weeks. Outcomes two
    and three are the theoretical core: the forward process with its closed form, the reverse process, and the remarkably
    simple training objective of predicting the noise. Outcome four covers the architecture used in practice, particularly
    latent diffusion, which explains how Stable Diffusion works. Outcome five is hands-on: in the lab students generate
    images and vary steps, guidance, seeds and negative prompts. Outcome six brings us to 2026: flow matching, few-step
    distillation, editing, video and audio, and how to evaluate generators. This week touches MIMLOs 1 to 4.

    '
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: restoring a photo from static'
    minutes: 5
  - title: 1 · Why diffusion?
    minutes: 12
  - title: 2 · Forward and reverse processes
    minutes: 33
  - title: 3 · Architecture and latent diffusion
    minutes: 17
  - title: 4 · Sampling, guidance and prompts
    minutes: 23
  - title: 5 · Variants, evaluation and responsible use
    minutes: 22
  - title: Lab preview and wrap-up
    minutes: 8
  notes: 'The plan follows the descriptor: motivation and limitations of GANs and VAEs, theoretical foundations,
    core architecture, the denoising process, variants, evaluation and applications, and a comparison with other
    generative models. Section two has the equations, so take the break after it. Section four shows real Stable
    Diffusion outputs generated for these slides, so students can see what each setting does before trying it themselves.
    If time is short, compress the variants cards; the video and audio models return in week 10.

    '
- type: discussion
  title: Warm-up
  icon: fa:FaTv
  prompt: Could you restore a photo covered in light static? What if you had to start from pure static and remove
    a little at a time, a thousand times?
  points:
  - How would you learn which part is noise?
  - If you always start from different random static, will you get the same photo?
  - What information would help you decide what the final photo should show?
  notes: 'Two minutes in pairs. A partly visible image provides clues, but the exact clean image is not uniquely
    recoverable. Analogy: restore a damaged sketch using patterns learned from other sketches. The model receives
    the noisy state and its noise level, not the clean original. Ask: where does the target noise come from during
    training? We add and record it. Common mistake: treating generation as recovering a hidden original from fresh
    random noise. Generation instead produces a new sample. Starting noise and optional conditions influence the
    result; inspect actual variety and prompt fit.'
- type: section
  number: 1
  title: Why diffusion?
  question: How does diffusion train and sample differently from VAEs and GANs?
  icon: fa:FaQuestionCircle
  notes: 'Section one motivates diffusion by comparison with the two families we have studied. We summarise their
    limitations, place the three families on a trade-off triangle of quality, diversity and speed, and state the
    core idea of diffusion in one slide. Ask students to recall one weakness of VAEs and one of GANs before you
    show the next slide. About twelve minutes.

    '
- type: table
  title: Limitations of VAEs and GANs that diffusion addresses
  header:
  - ''
  - VAE (week 2)
  - GAN (week 3)
  - Diffusion (today)
  rows:
  - - Image quality
    - Often slightly blurry
    - Often sharp
    - Detailed with enough steps
  - - Coverage of the data
    - Usually broad; still check
    - Can miss whole classes
    - Usually broad; still check
  - - Training
    - One stable loss
    - Two networks in a moving game
    - 'One stable loss: predict the added noise'
  - - Following a prompt or label
    - Possible
    - Possible
    - Strong, with guidance
  - - Generation cost
    - One network pass
    - One network pass
    - Many passes (fewer if distilled)
  notes: 'Use this table to compare mechanisms and practical tendencies. A VAE has a reconstruction-and-KL objective;
    a GAN has two changing players; this diffusion model predicts known noise with a fixed regression target. None
    guarantees useful quality or complete coverage. Analogy: one learner practices against an answer sheet, while
    two players adapt to each other. Ask: which model needs repeated calls at generation time? Traditional diffusion
    does. Common mistake: reading a model family as a guarantee of sharpness, stability or diversity. Evaluate samples,
    failures, coverage and cost in the actual task.'
- type: figure
  title: 'The generative trilemma: quality, diversity, speed'
  figure: trilemma
  notes: 'The triangle organises three measurements: useful quality, varied coverage and generation speed. Positions
    are schematic tendencies, not numerical rankings. Analogy: compare vehicles by journey time, carrying capacity
    and running cost. Ask: what evidence would justify a model choice? Use matched tasks and settings, sampled outputs,
    coverage checks and recorded runtime. Common mistake: assuming diffusion automatically covers every mode or
    that flow matching always generates in one to four calls. Some distilled models need few calls after extra training;
    measure their quality and failures.


    Figure discussion prompts: Measure useful quality, varied coverage and speed. Traditional diffusion uses many
    steps. Distillation can reduce network calls. No family guarantees success on every task.

    '
- type: bullets
  title: The core idea in one slide
  icon: fa:FaLightbulb
  bullets:
  - 'Training: take a real image and add noise that you drew yourself.'
  - The network learns to predict exactly that noise.
  - 'Generation: start from fresh random noise; no real image exists.'
  - Remove a little predicted noise at a time, many times.
  callout: Training has a known answer (the added noise); generation does not.
  notes: 'State the loop before the equations. A fixed rule adds sampled noise to known clean data. A network receives
    the noisy state and timestep and learns to predict that recorded noise. At generation time, fresh noise starts
    a repeated reverse update; there is no known original image. Analogy: practice restoring many damaged sketches,
    then use the learned patterns to build a new sketch from static. Ask: which values are known to the trainer?
    Clean data, timestep and sampled noise. Common mistake: feeding the target noise to the denoiser or promising
    that every local update is easy.'
- type: section
  number: 2
  title: Forward and reverse processes
  question: What exactly is added, what exactly is learned?
  icon: fa:FaExchangeAlt
  notes: 'Section two gives the theoretical foundations. We define the forward process and its very useful closed
    form, look at real images being noised and at noise schedules, define the reverse process, and derive the training
    objective that predicts the added noise. We then connect this to the score-based view, show the training and
    sampling code, and see real results from small diffusion models trained for these slides. This is the core exam
    material; allow about thirty minutes.

    '
- type: equation
  title: The forward (noising) process
  eq:
  - q(x_t \mid x_{t-1}) = \mathcal{N}\left(\sqrt{1 - \beta_t}\, x_{t-1},\; \beta_t I\right)
  - q(x_t \mid x_0) = \mathcal{N}\left(\sqrt{\bar{\alpha}_t}\, x_0,\; (1 - \bar{\alpha}_t) I\right), \quad \bar{\alpha}_t
    = \prod_{s=1}^{t}(1 - \beta_s)
  read_as:
  - Mix scaled signal and Gaussian noise.
  - The schedule supplies known coefficients.
  - Create a selected noise level directly.
  terms:
  - - x₀
    - clean image; $x_t$ noisy image at step $t$
  - - $\beta_t$
    - noise added at step t (the schedule)
  - - ᾱ_t
    - fraction of original signal variance left
  - - ε
    - standard Gaussian noise
  panel_h: 2.1
  notes: 'Define the forward process as a Markov chain: each step multiplies the current image by the square root
    of one minus beta and adds Gaussian noise with variance beta. The scaling preserves unit marginal variance when
    the input already has unit variance; general data variance tends towards one. Because Gaussians compose, we
    can jump to any step directly, and the reparameterised form, x t equals root alpha-bar times x nought plus root
    one minus alpha-bar times epsilon, is the one we implement. Point out the link to week 2: this is exactly the
    reparameterisation trick. After a thousand steps essentially no signal remains.

    '
- type: figure
  title: The forward process on real digits
  figure: forward_mnist_slide
  caption: Real MNIST digits noised with the DDPM linear schedule (T = 1000). ᾱ shows the fraction of signal variance
    remaining.
  notes: 'Three real digits at increasing timesteps. At t equals fifty the digit is clearly visible; by five hundred
    it is barely perceptible; by nine hundred and ninety-nine only noise remains. Ask students: if you were the
    network and saw the image at t equals seven hundred and fifty, could you predict exactly which noise was added?
    Not exactly, but you could make a reasonable guess of which digit shape is underneath, and that partial information
    is what the model learns to exploit. Note that most information is destroyed in the middle timesteps, which
    motivates better schedules on the next slide.

    '
- type: figure
  title: Noise schedules decide how fast information is destroyed
  figure: schedules
  notes: 'The schedule is a design choice. With the original linear schedule, alpha-bar falls to near zero well
    before the last step, so many training steps are spent on almost pure noise. The cosine schedule keeps more
    signal for longer. The plot on the right shows the signal-to-noise ratio on a log scale, which is the quantity
    that later work, such as the EDM framework of Karras and colleagues, identified as the natural way to describe
    schedules. Students do not need to memorise schedules, but should know that the schedule affects both training
    quality and how many sampling steps are needed.


    Figure discussion prompts: Schedule sets remaining signal. Linear and cosine remove it differently. SNR compares
    signal and noise power. Check the actual end-of-schedule signal.

    '
- type: equation
  title: The reverse (denoising) process is learned
  eq:
  - p_\theta(x_{t-1} \mid x_t) = \mathcal{N}\left(\mu_\theta(x_t, t),\; \sigma_t^2 I\right)
  - \mu_\theta(x_t, t) = \frac{1}{\sqrt{\alpha_t}}\left(x_t - \frac{\beta_t}{\sqrt{1 - \bar{\alpha}_t}}\, \epsilon_\theta(x_t,
    t)\right)
  read_as:
  - One network handles many noise levels.
  - Use its prediction to calculate a reverse mean.
  - DDPM adds sampling noise except at the final step.
  terms:
  - - $\epsilon_\theta(x_t, t)$
    - the network's noise prediction
  - - $\alpha_t$
    - $1 - \beta_t$
  - - $\sigma_t^2$
    - sampling noise, often $\beta_t$
  panel_h: 2.1
  notes: 'The reverse process runs the chain backwards. When each forward step adds only a small amount of noise,
    the true reverse step is also approximately Gaussian, so we model it as a Gaussian whose mean is produced by
    a network. DDPM parameterises that mean through a noise-prediction network: given the noisy image and the timestep,
    it predicts the noise, and the formula converts that prediction into the mean of the slightly cleaner image.
    The same network is used at every step and receives the timestep as an extra input, usually through a sinusoidal
    embedding like the positional encodings we meet next week.

    '
- type: equation
  title: 'Training objective: predict the noise'
  eq: \mathcal{L}_{\mathrm{simple}}(\theta) = \mathbb{E}_{x_0,\, t,\, \epsilon}\left[\left\| \epsilon - \epsilon_\theta\left(\sqrt{\bar{\alpha}_t}\,
    x_0 + \sqrt{1 - \bar{\alpha}_t}\, \epsilon,\; t\right)\right\|^2\right]
  read_as:
  - Draw real $x_0$, timestep $t$ and noise $\epsilon$.
  - Construct $x_t$ directly; predict $\epsilon$ from $x_t$ and $t$.
  - Minimise squared prediction error.
  terms:
  - - t
    - uniform random step in 1…T
  - - ε
    - the noise we added (the target)
  - - $\epsilon_\theta$
    - the network's guess
  notes: 'Draw a real image, a timestep and fresh noise; construct the noisy input directly and compare the predicted
    and recorded noise. The loss averages squared errors. Ho et al. derived a weighted objective from an evidence
    lower bound and found a simpler reweighting useful. Analogy: a learner practices against an answer sheet that
    the teacher created. Ask: why is a discriminator unnecessary? The recorded noise supplies the target. Common
    mistake: calling optimisation guaranteed stable or assuming a likelihood connection proves complete sample coverage.
    Check actual training and outputs.'
- type: code
  title: Training and sampling in a few lines
  code: "# One training prediction per image\nt = torch.randint(0, T, (len(x0),), device=x0.device)\neps = torch.randn_like(x0)\n\
    a = abar.to(x0.device)[t].view(-1, 1, 1, 1)\nxt = a.sqrt() * x0 + (1 - a).sqrt() * eps\nloss = F.mse_loss(model(xt,\
    \ t), eps)\n\n# Reuse trained weights: reverse_step is in the lab\nmodel.eval()\nwith torch.no_grad():\n   \
    \ x = torch.randn(n, 1, 28, 28, device=x0.device)\n    for k in reversed(range(T)):\n        x = reverse_step(model,\
    \ x, k, betas, alphas, abar)\n"
  bullets:
  - Training uses one selected noise level.
  - Sampling repeats the lab reverse_step.
  - The timestep and coefficients match the image batch.
  notes: 'This is a fragment using the model and schedules defined in the lab. Each training image gets a timestep
    tensor entry. Reshape its scalar coefficient to one by one by one so it broadcasts across that image. The reverse_step
    helper forms a timestep tensor for every image in the sampling batch, predicts noise and applies the DDPM mean
    and optional noise. Analogy: one practice question versus a sequence of refinement passes. Ask: where do weights
    change? In the training optimiser step, never in this sampling loop. Common mistake: passing a Python integer
    directly to TinyUNet, which expects a batch of timestep values. The notes retain the expanded update.'
- type: bullets
  title: The score-based view (Song et al., 2021)
  icon: fa:FaCompass
  bullets:
  - 'Score: the direction in which an image becomes more likely, at one noise level.'
  - 'A rescaled noise prediction estimates the score: removing noise moves towards likely data.'
  - 'Continuous view: noise is added smoothly over time, as an SDE (a change with randomness).'
  - Its deterministic twin, the probability-flow ODE, underlies fast samplers such as DDIM and DPM-Solver.
  notes: 'A score is a gradient of log probability, giving a local direction towards more likely data at a noise
    level. The displayed scale converts noise prediction into a score estimate. Introduce SDE as a continuous equation
    with random changes and ODE as a deterministic equation for a changing state. Numerical samplers approximate
    such paths with finite updates. These connections explain related methods. Avoid claiming every discrete DDIM
    setting is exactly the continuous probability-flow ODE.

    '
- type: figure
  title: 'A real diffusion model on 2-D data: noise becomes structure'
  figure: reverse_2d_slide
  stack: true
  bullets:
  - The same 2,000 points are shown at six reverse steps, from t = 199 down to t = 0.
  - The cloud only settles onto the grey spiral in the last 20 steps.
  - 'Most points end on the spiral, but its inner end is covered less well: inspect coverage.'
  caption: 'A small MLP trained with the noise-prediction loss on a 2-D swiss roll (grey). Blue: 2,000 samples during
    the reverse process.'
  notes: 'A real result on data we can see. We trained a tiny three-layer network on points from a two-dimensional
    swiss roll using exactly the loss on the previous slides, then ran the reverse process from pure Gaussian noise.
    At the first reverse step the points are a shapeless cloud; as the steps proceed, they are pulled onto the spiral,
    and at the end they lie on the data. No adversary or learned encoder is used. Inspect the observed spiral coverage
    and deviations; this example does not prove complete coverage. Students train this model in the first part of
    the lab.

    '
- type: figure
  title: A tiny diffusion model on MNIST, trained for this lecture
  figure: reverse_mnist_slide
  bullets:
  - Rows run from pure noise (t = 999) to finished digits (t = 0).
  - Digit shapes appear between t = 400 and t = 200; strokes sharpen at the end.
  - One tiny U-Net ({{UNET_PARAMS}} parameters), trained for about {{MNIST_MIN}} minutes on {{MNIST_DEVICE}}.
  - Not every sample is a clean digit, so inspect them all.
  notes: 'These digits come from a very small U-Net trained for a few epochs with the same code as the lab. Reading
    down the rows, the reverse process starts from noise, coarse shapes emerge around the middle timesteps, and
    fine strokes are refined at the end. This coarse-to-fine behaviour is typical of diffusion: early reverse steps
    decide the global layout, late steps add detail. It is also why editing methods such as SDEdit start from a
    partially noised image: they keep the layout decided by the input and let the model repaint details.


    Figure discussion prompts: One tiny timestep-aware U-Net. Inspect structure across reverse steps. Judge the
    recorded samples and failures.

    '
- type: quiz
  question: During DDPM training, what does the network learn to predict?
  options:
  - The clean image, predicted directly from pure noise in a single step
  - The value of the next pixel, given all the previous pixels in raster order
  - The class label of the image, so that sampling can be guided by class
  - The Gaussian noise that was added to create $x_t$, for a randomly chosen step $t$
  answer: 3
  notes: 'Answer: D. The network receives a noisy image and its timestep and predicts the noise that was mixed in; the loss
    is mean squared error against the true noise. A does not describe this training target. Some trained and distilled systems
    can generate in one step; our model instead learns a conditional noise prediction at each selected level. Some variants
    do predict the clean image or a velocity, but always at a given noise level, not from pure noise in one shot. C describes
    a classifier and B an autoregressive model. B is a good distractor because it is how autoregressive image models such as
    PixelCNN work.

    '
- type: section
  number: 3
  title: Architecture and latent diffusion
  question: What network does the denoising, and how does text get in?
  icon: fa:FaProjectDiagram
  notes: 'Welcome back. Section three moves from maths to engineering. Which network predicts the noise, U-Net or
    transformer? Why do practical systems run diffusion in the latent space of an autoencoder, connecting back to
    week 2? And how does a text prompt influence the denoiser? By the end students should be able to explain the
    full Stable Diffusion pipeline component by component, which is a common exam question.

    '
- type: figure
  title: 'Two denoiser architectures: U-Net and diffusion transformer'
  figure: unet_dit
  notes: 'U-Net combines downsampling, upsampling and saved skip features. A diffusion transformer instead represents
    image or latent patches as tokens. Both need timestep information. Text-conditioned designs also accept text
    vectors, while the small MNIST lab model has no text condition. Ask students to trace input and output shapes.
    In this lab noise prediction has the same shape as the noisy input. The architecture can change while this training
    target stays the same.


    Figure discussion prompts: U-Net: shrink, expand, join saved features. DiT: process image or latent patches.
    Supply timestep and applicable conditions. Noise output matches the input shape.

    '
- type: figure
  title: 'Latent diffusion: the Stable Diffusion pipeline'
  figure: ldm_pipeline
  notes: 'Walk through the pipeline left to right. The prompt is tokenised and encoded by a pretrained text encoder,
    CLIP''s text transformer in Stable Diffusion 1.5, T5 as well in later models. Generation starts from random
    noise in the latent space, not in pixel space. The denoiser runs for a number of steps, each time attending
    to the text embeddings through cross-attention, a mechanism explained next week. The final clean latent is decoded
    to pixels by the VAE decoder. For scale: Stable Diffusion 1.5 has a U-Net of about 860 million parameters, a
    123-million-parameter CLIP text encoder and an 84-million-parameter VAE.


    Figure discussion prompts: Text encoder: prompt → vectors. Denoiser: repeatedly update a small latent. Scheduler:
    choose numerical update steps. VAE decoder: final latent → pixels.

    '
- type: cards
  title: What each component contributes
  cards:
  - icon: fa:FaCompressArrowsAlt
    head: Autoencoder (VAE)
    text: Shrinks a 512 × 512 image to a 64 × 64 × 4 latent; decodes the final latent back to pixels.
  - icon: fa:FaFont
    head: Text encoder
    text: Turns the prompt into vectors (CLIP's text model in SD 1.5) that guide every step.
  - icon: fa:FaBrain
    head: Denoiser
    text: A U-Net or transformer that predicts the noise in the current latent, given t and the text.
  - icon: fa:FaClock
    head: Scheduler / sampler
    text: 'Not a network: a formula that turns each noise prediction into the next, cleaner latent.'
  notes: 'Summarise the division of labour. The autoencoder is trained first and frozen; it makes the whole system
    affordable, which is why latent diffusion made open-source image generation possible on consumer GPUs. The text
    encoder is usually a frozen pretrained model; weaknesses in prompt following, such as counting objects or rendering
    text, often trace back to it, which is why newer models use larger text encoders. The denoiser is the part trained
    on hundreds of millions of image-caption pairs. The scheduler is not a network at all; in the Hugging Face Diffusers
    library you can swap it with one line, which students do in the lab.



    This diagram is the Stable Diffusion 1.5 example. Other models can use different autoencoders, text encoders
    and denoiser architectures. Swap only compatible schedulers whose prediction type and coefficients match the
    trained model. Ask which component runs repeatedly: the denoiser. Common mistake: treating the scheduler as
    learned weights or decoding pixels at every latent update.'
- type: section
  number: 4
  title: Sampling, guidance and prompts
  question: Why do steps, guidance scale, seeds and negative prompts change the picture?
  icon: fa:FaSlidersH
  notes: 'Section four is practical and visual. Every image generator exposes a few controls: number of steps, sampler,
    guidance scale, seed and negative prompt. Students will use all of them in the lab and in the project. We explain
    what each one does in terms of the maths from section two, using real Stable Diffusion outputs generated with
    a fixed seed so that only one setting changes at a time.

    '
- type: compare
  title: 'Samplers: from 1000 steps to a handful'
  columns:
  - head: DDPM
    icon: fa:FaWalking
    points:
    - Follows all 1,000 small steps, adding a little fresh noise each time.
    - Slow, but the reference baseline.
  - head: DDIM / ODE methods
    icon: fa:FaRunning
    points:
    - Visits only selected noise levels, for example 50 of the 1,000.
    - Same trained network; only the update rule changes.
  - head: Distilled models
    icon: fa:FaRocket
    points:
    - A student network is trained to make big jumps.
    - Some generate in 1–4 steps (for example SD-Turbo).
  notes: 'Three groups of samplers. DDPM''s ancestral sampler follows a stochastic reverse chain. This lab''s DDIM
    uses deterministic updates over selected timesteps spanning the full schedule; ODE solvers such as DPM-Solver
    are another route to fewer evaluations. Neither requires retraining the noise predictor. Simply lowering the
    steps argument in the lab''s DDPM function truncates its loop, so use the full DDPM schedule as the baseline
    and DDIM for timestep skipping. Measure quality and runtime in the actual experiment. Distillation goes further
    by training a student model for large jumps, giving few-step generation. Consistency models and adversarial
    diffusion distillation, which connects with last week''s GAN discriminator, are examples.

    '
- type: figure
  title: Effect of the number of steps (Stable Diffusion 1.5, same seed)
  figure: sd_steps
  stack: true
  bullets:
  - Same prompt, seed and guidance; only the number of denoising steps changes.
  - '2 steps: a blurred colour layout. 5: the scene is recognisable. 10–25: details settle.'
  - 'Time on the lecture CPU: {{W04_T2}} s for 2 steps, {{W04_T25}} s for 25.'
  caption: DPM-Solver++ sampler, guidance 7.5, seed 42. Real outputs generated for this lecture.
  notes: 'Real outputs with everything fixed except the number of steps. With two steps the image is a blurry colour
    layout, showing that the global composition is decided early. By five steps the scene is recognisable; ten steps
    add most details; twenty-five steps refine textures. Beyond about twenty-five to thirty steps with a good solver,
    improvements are small, which is why most tools default to twenty to fifty. Ask students to connect this with
    the coarse-to-fine MNIST figure. With the same model and guidance, more steps usually increase denoiser work;
    fixed overhead means total runtime need not be exactly linear; the timings are in the teaching notes.

    '
- type: equation
  title: Classifier-free guidance (Ho & Salimans, 2022)
  eq: \hat{\epsilon} = \epsilon_\theta(x_t, \varnothing) + w \cdot \left(\epsilon_\theta(x_t, c) - \epsilon_\theta(x_t,
    \varnothing)\right)
  read_as:
  - Train with the condition sometimes dropped.
  - Combine conditional and reference predictions.
  - Here w = 1 gives the conditional prediction.
  terms:
  - - c
    - text condition (prompt embedding)
  - - ∅
    - empty prompt
  - - w
    - guidance scale
  notes: 'Classifier-free guidance is the single most important trick behind prompt-following image generation.
    During training, the prompt is replaced by an empty prompt some of the time, so one network learns both conditional
    and unconditional noise predictions. At sampling time we compute both and extrapolate from the unconditional
    prediction towards the conditional one. The difference vector points in the direction that makes the image more
    like the prompt; multiplying it by w greater than one exaggerates that direction. The cost is two network evaluations
    per step. It replaced classifier guidance, which needed a separate noise-aware classifier.



    Here w = 1 gives the conditional prediction; the symbol convention varies across papers. Active guidance requires
    two predictions, which software can batch into one network call with twice the examples. Pipelines may skip
    the reference prediction when guidance is disabled. Do not apply an SD1.5 guidance default to every model: SD-Turbo
    disables guidance. Ask what w = 0 gives in the displayed formula: the reference prediction.'
- type: figure
  title: Effect of the guidance scale (same seed)
  figure: sd_guidance
  stack: true
  bullets:
  - Same prompt, seed and 25 steps; only the guidance scale w changes.
  - 'w = 1: washed out, no sunset. 7.5: lighthouse, cliff and sunset all present. 15: harsh, oversaturated colours.'
  - 'w above 1 runs the denoiser twice per step (with and without the prompt), so it is slower: {{W04_G1}} s at w = 1,
    {{W04_G75}} s at w = 7.5 on the lecture CPU.'
  notes: 'Real outputs with only the guidance scale changing. At one, the model is the plain conditional model and
    the image often ignores parts of the prompt. Around seven and a half, the default for Stable Diffusion 1.5,
    the lighthouse, cliff and sunset are all present. At fifteen, colours saturate and contrast becomes harsh, a
    characteristic artefact of excessive guidance. This is also a diversity trade-off: higher guidance makes different
    seeds look more alike. Connect to GANs: the truncation trick in BigGAN trades diversity for quality in a similar
    way. On cost: at a scale of one the pipeline skips the second, prompt-free pass, so each step needs one network
    call instead of two. Treat single CPU timings as rough: the same 7.5, 25-step setting took {{W04_G75}} seconds here
    and {{W04_T25}} seconds in the steps experiment.


    Figure discussion prompts: Keep prompt and seed fixed. Compare prompt fit and visual artefacts. A useful range
    depends on the model. Large guidance can reduce variety.

    '
- type: figure
  title: Seeds and negative prompts
  figure: seeds_negative_slide
  stack: true
  bullets:
  - 'Seeds 1–4: same prompt and settings, different starting noise, so four different pictures.'
  - 'Right pair: the same seed, with and without the negative prompt "lamp, blurry, low quality".'
  - 'The lamp is still there: a negative prompt pushes away from features; it cannot guarantee removal.'
  notes: 'A seed sets a random-number sequence, rather than directly naming an image. Holding seed and settings
    fixed makes controlled comparisons easier within the same setup. Exact results can still vary across hardware,
    software, model versions or nondeterministic operations. A negative prompt supplies an alternative condition
    in guidance and encourages movement away from its features. It cannot guarantee removal. Ask students to record
    all controls and inspect actual images.


    Figure discussion prompts: Seed sets the random-number sequence. Record model, sampler, software and settings.
    Negative prompts supply a guidance reference. Neither control guarantees a correct picture.

    '
- type: section
  number: 5
  title: Variants, evaluation and responsible use
  question: What has changed since Stable Diffusion, and how do we judge the results?
  icon: fa:FaStar
  notes: 'The final section brings us to the current state of the field. Flow matching and rectified flow, used
    by Stable Diffusion 3 and FLUX; few-step distillation, with a real SD-Turbo example; the many variants for editing,
    control, video and audio; how to evaluate image generators; a comparison of all the generative families so far;
    and responsible use, including copyright and memorisation, which are live issues for diffusion models.

    '
- type: figure
  title: 'Flow matching and rectified flow: straighter paths'
  figure: flow_paths
  notes: 'Flow matching, introduced by Lipman and colleagues and in rectified flow by Liu and colleagues in 2022,
    learns a velocity field that transports noise to data along simple paths, usually straight lines between a noise
    sample and a data sample. The panel compares schematic paired training paths. The learned marginal velocity
    generally averages possible pairwise targets, so generated trajectories need not follow one straight training
    pair. Efficiency depends on training, model and numerical solver. Conceptually they are close relatives of diffusion:
    both learn to turn noise into data gradually with a regression loss.



    Ask which paths are shown: paired training interpolations, not measured sample trajectories. The regression
    fits a marginal field across many possible pairings. The sample solver follows that learned field, which can
    curve.'
- type: equation
  title: The flow-matching objective
  eq:
  - x_t = (1 - t)\, x_0 + t\, \epsilon, \qquad t \in [0, 1]
  - \mathcal{L}_{\mathrm{FM}} = \mathbb{E}_{x_0, \epsilon, t}\left[\left\| v_\theta(x_t, t) - (\epsilon - x_0) \right\|^2\right]
  read_as:
  - Here t = 0 is data; t = 1 is noise.
  - Train velocity towards $\epsilon - x_0$.
  - Generate by integrating backwards from noise.
  terms:
  - - x₀
    - data sample
  - - ε
    - noise sample
  - - $v_\theta$
    - predicted velocity
  notes: 'The objective is as simple as DDPM''s. Mix a data point and a noise sample with a linear interpolation,
    and train the network to predict the constant velocity of that straight path, the noise minus the data. At sampling
    time, start from noise and integrate the learned velocity field back to the data with a few ODE steps. Warn
    students that sign and time conventions vary between papers: some write the data at time one. The important
    ideas are the linear path, the velocity target and the regression loss. In the lab, the optional extension converts
    the MNIST model to flow matching with a two-line change.

    '
- type: figure
  title: Few-step generation with a distilled model (SD-Turbo)
  figure: sd_turbo
  stack: true
  bullets:
  - One distilled model at 1, 2 and 4 steps, with no guidance.
  - 'Time on the lecture CPU: {{W04_TURBO1}} s for 1 step, {{W04_TURBO4}} s for 4; SD 1.5 with 25 steps took {{W04_T25}} s.'
  - 'Costs: fixed 512 × 512 size, less variety and weaker control from negative prompts.'
  notes: 'A real result from SD-Turbo, released by Stability AI in 2023. It was distilled from Stable Diffusion
    2.1 using adversarial diffusion distillation, which combines a distillation loss with a GAN discriminator, connecting
    last week and this week. With one step it already produces a coherent image, and four steps add detail. Compare
    with the twenty-five steps and classifier-free guidance, meaning fifty network calls, used on the previous slides.
    The timings measured on the lecture machine are in the notes. The costs: fixed resolution, somewhat less diversity,
    and weaker control through negative prompts, since guidance is disabled.


    Figure discussion prompts: SD-Turbo distils Stable Diffusion 2.1. Use 1–4 steps; guidance disabled. Negative
    prompts have no effect in this path. Measure time, detail and prompt fit.

    '
- type: cards
  title: 'Beyond text-to-image: diffusion variants'
  cards:
  - icon: fa:FaEdit
    head: Editing
    text: Partly noise a photo, then denoise with a new prompt; inpainting repaints only a masked area.
  - icon: fa:FaDraftingCompass
    head: Control
    text: ControlNet makes the image follow an edge map, depth map or body pose.
  - icon: fa:FaUserTag
    head: Personalisation
    text: Teach a new subject from a few images (for example LoRA, week 8), only with consent.
  - icon: fa:FaFilm
    head: Video
    text: Denoise many frames together so that objects move consistently.
  - icon: fa:FaMusic
    head: Audio
    text: Generate music or speech as spectrograms or compressed audio codes.
  - icon: fa:FaDna
    head: Science
    text: Propose protein structures or molecules for experts to test in the lab.
  notes: 'Diffusion is a general recipe, so it has spread far beyond text-to-image. Editing methods exploit the
    coarse-to-fine structure: noise an existing image partly, then denoise with a new prompt; inpainting restricts
    changes to a mask. ControlNet adds a trainable copy of the encoder that reads structural conditions such as
    edges, depth maps or human pose. Personalisation methods, including LoRA, which we study in week 8, teach a
    model a new subject from a handful of images. Video models extend diffusion transformers to space and time;
    audio models diffuse in spectrogram or codec latent spaces. In science, diffusion designs proteins and forecasts
    weather. Week 10 revisits video and audio.

    '
- type: table
  title: Evaluating image generators
  header:
  - Aspect
  - How to measure it
  - Watch out for
  rows:
  - - Realism and coverage
    - FID or KID against real images
    - Depends on the feature network and the number of images
  - - Prompt fit
    - CLIP similarity of image and prompt
    - Can miss counts and positions ("three cubes")
  - - Objects and relations
    - Detector-based tests, such as counting the cubes
    - The detector makes its own mistakes
  - - Human preference
    - People rate or rank images
    - Needs a rubric, several raters and agreement
  - - Cost
    - Seconds and memory per image
    - Always state the hardware
  notes: 'Compare several sources of evidence. FID compares feature means and covariances; it depends on the feature
    network, reference set and sample count. CLIP similarity measures one image-text relationship and can miss counts
    or spatial errors. Detector-based compositional tests inherit detector errors. Human ratings need a clear rubric,
    several raters and reported agreement. Analogy: assess a meal by taste, nutrition, cost and consistency rather
    than one score. Ask which test would catch a request for three objects that produces two. Common mistake: treating
    one automatic metric or a preference vote as complete validation.'
- type: table
  title: Comparing the generative families (weeks 2–4)
  header:
  - ''
  - VAE
  - GAN
  - Diffusion
  - Flow matching
  rows:
  - - Learns to
    - Rebuild the input + KL (ELBO)
    - Fool a learned checker
    - Predict the added noise
    - Predict a velocity (direction)
  - - Typical quality
    - Often blurry
    - Often sharp
    - Detailed
    - Detailed
  - - Typical coverage
    - Usually broad
    - Can collapse
    - Usually broad
    - Usually broad
  - - Generation cost
    - One pass
    - One pass
    - Many steps; fewer if distilled
    - Several solver steps
  - - Typical role today
    - Latent spaces, compression
    - Fast, sharp outputs
    - Image, video, audio
    - Image generation (SD 3, FLUX)
  notes: 'This table completes the comparison with other generative models required by the descriptor and is a strong
    revision aid. It also shows how the families work together in practice: the VAE provides the latent space, diffusion
    or flow matching does the generation, and GAN losses keep decoders sharp and help distil fast samplers. Transformers,
    next week, supply both the text encoder and, increasingly, the denoiser backbone. Encourage students to use
    this table to structure an exam answer on choosing a model family.

    '
- type: bullets
  title: 'Responsible AI lens: diffusion models'
  icon: fa:FaBalanceScale
  bullets:
  - 'Rights: models learned from scraped images; check licences before commercial use.'
  - 'Memorisation: images repeated in training can be regenerated almost exactly.'
  - 'Bias: audit who appears for prompts such as "a CEO" or "a nurse".'
  - 'Disclosure: label generated images and keep provenance (EU AI Act Article 50).'
  - Report the compute and energy of your actual workload.
  notes: 'Each point is a live issue. Copyright: diffusion models were trained on large scraped datasets such as
    LAION, and courts in several countries are considering claims by artists and image libraries; students should
    not assume training use is settled law. Memorisation: Carlini and colleagues showed that images duplicated many
    times in training can be regenerated almost exactly, a privacy and copyright risk. Bias audits of Stable Diffusion
    found strong occupational and racial stereotypes. Safety filters and source history (provenance) tools help,
    and Article 50 distinguishes provider marking from deployer disclosure of deepfakes and certain public-interest
    text, with scope and exceptions; consult the official text. In the lab, the pipeline''s safety checker is discussed
    rather than removed silently.

    '
- type: lab
  title: 'Lab 4: train a diffusion model and use Stable Diffusion'
  steps:
  - Create and inspect noisy examples.
  - Train point and image denoisers.
  - Compare full DDPM with DDIM.
  - Load a pretrained latent pipeline.
  - Change one control per comparison.
  - Measure time, alignment and failures.
  runtime: GPU recommended for images. About 17 min on a laptop CPU (SD-Turbo) after downloads
  deliverable: Models, figures, sampler timings, alignment table, three answers
  notes: 'The lab has two halves. First, students implement the forward process and the training and sampling loops
    themselves, on 2-D data where everything is fast, and then on MNIST with a tiny U-Net (six epochs on a Colab GPU, two on a CPU). Second,
    they use the Hugging Face Diffusers library with Stable Diffusion 1.5 and SD-Turbo, sweeping the controls we
    discussed and measuring time. They finish with a small evaluation using CLIP score, which previews week 9, and
    a failure case. Remind students that Stable Diffusion''s licence has use restrictions, and that generated images
    of real people are not permitted in the lab.

    '
- type: summary
  points:
  - Noising is fixed; the denoiser learns.
  - Known noise supplies the training target.
  - Sampling reuses weights across noise levels.
  - Latent generation connects several components.
  - Controls affect results and runtime.
  - Evaluate alignment, coverage, quality and rights.
  notes: 'Recap the six points. The key equation is the noise-prediction loss with the closed-form forward process;
    the key system is the latent diffusion pipeline; the key controls are steps, guidance, seed and negative prompt.
    Next week we open the black box that appears everywhere in today''s pipeline: the transformer and its attention
    mechanism, which powers the text encoder, the diffusion transformer and, in week 6, large language models. Ask
    students to finish the lab and read Foster chapter 8.

    '
