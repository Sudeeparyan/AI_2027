objectives:
- Trace generator and discriminator roles.
- Read minimax and non-saturating losses.
- Diagnose collapse and unstable training.
- Compare major GAN variants.
- Evaluate sample quality and coverage.
- Train a DCGAN and assess synthetic-media risks.
