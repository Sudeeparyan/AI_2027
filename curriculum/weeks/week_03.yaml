    Example: A student uncertain about detach can trace the official tutorial’s discriminator and generator updates, then explain
    the two fake targets. A student uncertain about FID can redo the one-dimensional example before reading the higher-dimensional
    formula. Reading is preparation for an explanation, not evidence of a successful training run.

    Ask: Which source would you consult before claiming that your custom DigitCNN number equals standard FID?

    Answer: The original FID definition and the actual feature extractor and preprocessing used by both experiments.

    Watch out: Keep historical papers distinct from current package documentation, and verify source details before repeating
    a model capability or legal duty.'
