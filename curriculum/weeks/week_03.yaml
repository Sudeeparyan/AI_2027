    items:
      - {kind: book, label: "Foster (2023) Generative Deep Learning, 2nd ed., ch. 4 'GANs' and ch. 10 'Advanced GANs'", note: "Core module text", url: "https://www.oreilly.com/library/view/generative-deep-learning/9781098134174/"}
      - {kind: paper, label: "Goodfellow et al. (2014) Generative Adversarial Networks", note: "The original paper", url: "https://arxiv.org/abs/1406.2661"}
      - {kind: doc, label: "PyTorch tutorial: DCGAN", note: "Official step-by-step implementation", url: "https://docs.pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html"}
      - {kind: course, label: "Google for Developers: GAN course", note: "Short free course with exercises", url: "https://developers.google.com/machine-learning/gan"}
      - {kind: paper, label: "Arjovsky et al. (2017) Wasserstein GAN", note: "Why the Wasserstein distance helps", url: "https://arxiv.org/abs/1701.07875"}
      - {kind: paper, label: "Karras et al. (2019) StyleGAN", note: "Style-based generator", url: "https://arxiv.org/abs/1812.04948"}
      - {kind: paper, label: "Heusel et al. (2017) TTUR and FID", note: "Defines the Fréchet Inception Distance", url: "https://arxiv.org/abs/1706.08500"}
    notes: |
      Foster chapter 4 introduces GANs with Keras code and chapter 10 covers ProGAN, StyleGAN and related work. The original Goodfellow paper is short and contains the optimal-discriminator derivation. The PyTorch DCGAN tutorial is the official reference implementation and trains on faces. Google's short GAN course has clear explanations of loss functions and common problems. The WGAN, StyleGAN and FID papers are for deeper reading. All links were checked in September 2026.
