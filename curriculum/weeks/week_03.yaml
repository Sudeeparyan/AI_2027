slides:
- type: title
  figure: cover
  notes: 'Welcome to week 3. Last week''s VAEs gave us a principled likelihood-based model with a smooth latent
    space, but blurry samples. Today we meet the model family that was designed to produce sharp, realistic images:
    generative adversarial networks, or GANs, introduced by Ian Goodfellow and colleagues in 2014. The digits on
    this slide were produced by a small GAN trained on a laptop for these slides; you will train the same model
    in the lab. GANs dominated image generation from about 2016 to 2021 and their ideas are still inside many modern
    systems.

    '
- type: outcomes
  notes: 'Six outcomes. The first two are about the game itself and its mathematics: students should be able to
    write the minimax objective, state the optimal discriminator and explain why we use the non-saturating loss.
    The third is practical diagnosis, a favourite exam topic because GAN training fails in characteristic ways.
    The fourth covers variants they will meet in papers and industry, the fifth evaluation metrics, especially FID
    which is also used for diffusion next week, and the sixth combines implementation with a responsible-AI discussion
    of deepfakes. This week practises MIMLO 1, 3 and 4.

    '
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: training a forger'
    minutes: 6
  - title: 1 · Why adversarial learning?
    minutes: 15
  - title: 2 · The GAN objective
    minutes: 30
  - title: 3 · Training challenges and fixes
    minutes: 22
  - title: '4 · Variants: DCGAN to StyleGAN'
    minutes: 22
  - title: 5 · Evaluation, applications and risks
    minutes: 18
  - title: Lab preview and wrap-up
    minutes: 7
  notes: 'The plan follows the descriptor''s topics for this week: motivation, architecture, objective, training
    challenges, variants, evaluation and applications. Section two contains the mathematics; take the break after
    it. Section three uses real training runs, including a small experiment that shows mode collapse happening.
    If short of time, compress the variants section, but keep the evaluation slides because FID returns next week
    for diffusion models and in the project.

    '
- type: discussion
  title: Warm-up
  icon: fa:FaUserSecret
  prompt: How would you train an art forger if you had no rulebook for 'realistic', only a detective who compares
    fakes with real paintings?
  points:
  - What feedback would the forger need from the detective?
  - What happens if the detective becomes perfect very quickly?
  - What if the forger finds one painting that always fools the detective?
  notes: 'Use the forger and detective as an analogy for two learners, each receiving a numerical loss. A discriminator
    that confidently rejects fakes can give weak minimax-loss derivatives. The non-saturating generator loss changes
    this derivative, so a high discriminator accuracy alone does not establish that all generator gradients vanish.
    Ask: who changes weights in each turn? Only the player whose optimiser steps. Common mistake: treating a probability
    score as the whole gradient. If one successful fake pattern is repeated while other real patterns disappear,
    that is mode collapse. We diagnose it using sample variety and coverage, not loss curves alone.'
- type: section
  number: 1
  title: Why adversarial learning?
  question: Can we learn the loss function itself?
  icon: fa:FaChessKnight
  notes: 'Section one motivates GANs. The key idea is that instead of writing down a loss that measures realism,
    such as pixel-wise error, which caused blur in VAEs, we train a second network whose job is to measure realism,
    and we use its judgement as the loss for the generator. We look at the architecture and the roles of the two
    networks. This section takes about fifteen minutes.

    '
- type: bullets
  title: 'The motivation: a learned loss for realism'
  icon: fa:FaLightbulb
  bullets:
  - Pixel losses can blur uncertain details.
  - D learns real-versus-generated differences.
  - G learns from D’s feedback.
  - Basic GANs sample without a tractable likelihood.
  callout: Learn a checker from real examples.
  notes: 'Connect to last week. A pixel-wise loss says a slightly shifted sharp edge is as bad as a blurred edge,
    so under uncertainty the model predicts the blur. A discriminator judges the whole image: a blurry digit is
    easy to spot as fake, so the generator is pushed towards sharp outputs. The price is that GANs are implicit
    generative models: you can draw samples, but you cannot compute the probability of an image, so direct likelihood
    evaluation is unavailable; other GAN-based anomaly approaches are possible. That is why evaluation later in
    the lecture needs sample-based metrics.

    '
- type: figure
  title: 'GAN architecture: two networks, one game'
  figure: gan_arch
  notes: 'Walk through the diagram. The generator takes a random noise vector, typically sixty-four to five hundred
    and twelve numbers from a standard Gaussian, and outputs an image. The discriminator is a binary classifier
    that takes an image, real or generated, and outputs the probability that it is real. The dashed arrow is the
    crucial part: In this basic unconditional lab, G receives real-data information through D rather than matching
    each code to a real image. It only receives gradients that flow back through the discriminator, telling it how
    to change its output to be judged more real. Ask: where is the latent variable from week 1? It is z, the noise
    input.

    '
- type: compare
  title: Generator vs. discriminator
  columns:
  - head: Generator G
    icon: fa:FaPaintBrush
    points:
    - Turns a random code z into an image.
    - Learns only from D's feedback, aiming to be called real.
    - Kept after training to make new images.
    - 'Example: 64 random numbers in, a 28 × 28 digit out.'
  - head: Discriminator D
    icon: fa:FaSearch
    points:
    - Gives each image a real-or-fake score.
    - Learns from real images and the current fakes.
    - Usually discarded after training.
    - 'Example: a clear real digit scores 0.9; a smudge, 0.1.'
  callout: Two networks, two losses, two updates.
  notes: 'Summarise the roles. The generator is an upsampling network; the discriminator is an ordinary image classifier.
    After training we keep the generator and usually throw the discriminator away, although discriminators are sometimes
    reused as feature extractors. The key difference from every model students have trained before is in the callout:
    the loss of each network depends on the parameters of the other, so we are looking for an equilibrium of a two-player
    game rather than a minimum of a fixed function. That single fact explains most of the training difficulties
    in section three.

    '
- type: callout
  label: Analogy and its limits
  icon: fa:FaTheaterMasks
  statement: The generator makes samples. The discriminator checks them. Each learns from the other.
  sub: At the ideal solution, real and generated samples have the same distribution. Training may fail to reach
    it.
  notes: 'The forger and detective analogy is useful, but state its limits clearly, since the course asks students
    to explain analogies critically. At the ideal end point the generator''s samples are hard to tell apart from
    real data, so the best the discriminator can do is output one half everywhere, a coin flip. But unlike a human
    forger, the generator never looks at real examples, only at the discriminator''s feedback. And real training
    does not always converge: the two networks can oscillate, each one''s improvement undoing the other''s. We see
    both in section three.

    '
- type: section
  number: 2
  title: The GAN objective
  question: What game are the networks playing, and where does it end?
  icon: fa:FaChess
  notes: 'Section two gives the mathematics. We write the minimax value function from the original paper, derive
    the optimal discriminator for a fixed generator, show what the generator then minimises, and explain why the
    loss used in practice differs from the textbook one. Then we look at the training loop in code. This is the
    core exam material for the week; go at a steady pace and work through the optimal-discriminator derivation on
    the board.

    '
- type: equation
  title: The minimax game (Goodfellow et al., 2014)
  eq: \min_G \max_D \; V(D, G) = \mathbb{E}_{x \sim p_{\mathrm{data}}}\left[\log D(x)\right] + \mathbb{E}_{z \sim
    p(z)}\left[\log\left(1 - D(G(z))\right)\right]
  read_as:
  - 'D increases the value: separate real and fake.'
  - 'G decreases it: make fakes score higher.'
  - Alternate updates on batches.
  terms:
  - - D(x)
    - probability D assigns to x being real
  - - G(z)
    - sample generated from noise z
  - - $p_{\mathrm{data}}$
    - distribution of real data
  - - p(z)
    - noise prior, e.g. N(0, I)
  notes: 'Read the equation as two expectations. The first is over real data: the discriminator wants log D of x
    to be high, meaning D of x near one. The second is over noise: the discriminator wants one minus D of G of z
    to be high, meaning fakes get low scores. So the discriminator maximises exactly the negative binary cross-entropy
    of a real-versus-fake classifier. The generator appears only in the second term and wants to make it small,
    pushing D of G of z up. In practice we alternate gradient ascent steps for D and descent steps for G on mini-batches.

    '
- type: equation
  title: The optimal discriminator and what G really minimises
  eq:
  - D^{*}_G(x) = \dfrac{p_{\mathrm{data}}(x)}{p_{\mathrm{data}}(x) + p_g(x)}
  - V(D^{*}_G, G) = -\log 4 + 2\, \mathrm{JSD}\left(p_{\mathrm{data}} \,\|\, p_g\right)
  read_as:
  - Fix G; ideal D compares both densities.
  - Equal positive densities give D* = 0.5.
  - Under ideal assumptions, G seeks matching distributions.
  terms:
  - - $p_g$
    - distribution of G(z)
  - - JSD
    - Jensen–Shannon divergence (≥ 0, symmetric)
  - - D* = ½
    - D can do no better than a coin flip
  notes: 'Derive the first line on the board: for each x, D maximises p data times log D plus p g times log of one
    minus D, and setting the derivative to zero gives p data over p data plus p g. Substituting back gives minus
    log four plus twice the Jensen-Shannon divergence, a symmetric measure of the difference between two distributions.
    So, in the idealised setting with an optimal discriminator and infinite capacity, training the generator minimises
    a proper divergence, and the unique optimum is when the generator''s distribution equals the data distribution.
    Real training never reaches this ideal, but it explains what the game is aiming for.

    '
- type: figure
  title: The optimal discriminator in pictures
  figure: optimal_d
  notes: 'A one-dimensional illustration. The teal area is the data distribution, the orange curve the generator''s
    distribution, and the dashed purple line the optimal discriminator. On the left, early in training, the discriminator
    is close to one where only real data lives and close to zero where only fakes live, and its slope tells the
    generator which way to move its samples. On the right, at equilibrium, the two distributions coincide and the
    discriminator is flat at one half: it carries no information, and the generator receives no further push. Ask:
    what does a flat D look like in the lab''s plots? D of real and D of fake both near one half.

    '
- type: figure
  title: Why practitioners use the non-saturating generator loss
  figure: saturating
  notes: 'This is a practical detail with a big effect, also from the original paper. At the start of training the
    generator''s samples are obviously fake, so D of G of z is near zero. The discriminator probability is sigmoid
    of a logit s. Through this sigmoid, the minimax derivative with respect to s is −D(fake), which becomes small
    when D rejects the image. The plot uses this logit axis. The fix is to have the generator maximise log D of
    G of z instead, which is steep near zero. Both losses are optimised by the same equilibrium. In code, the non-saturating
    loss is simply binary cross-entropy with the fake samples labelled as real.


    Figure discussion prompts: Early fakes often receive small probabilities. Minimax gradients through sigmoid
    can be weak. Use −log D(G(z)) for stronger early feedback. This changes the objective, not the ideal matching
    target.

    '
- type: code
  title: One training step in PyTorch
  code: '# --- 1. discriminator step: real -> 1, fake -> 0

    fake = G(torch.randn(b, z_dim))

    loss_D = bce(D(x_real), ones) + bce(D(fake.detach()), zeros)

    opt_D.zero_grad(); loss_D.backward(); opt_D.step()


    # --- 2. generator step (non-saturating): make D call the fakes real

    loss_G = bce(D(fake), ones)

    opt_G.zero_grad(); loss_G.backward(); opt_G.step()

    '
  bullets:
  - 'D targets: real 1, detached fake 0.'
  - 'G target: linked fake 1.'
  - Detach cuts the gradient route to G.
  - Only the chosen optimiser steps its weights.
  notes: 'This is the complete core of GAN training, and it is what students write in the lab. First update the
    discriminator on a real batch labelled one and a fake batch labelled zero; the detach call is essential, otherwise
    that backward pass also computes unwanted generator gradients. The discriminator optimiser still steps only
    D’s registered parameters. Then update the generator by passing the same fakes through the discriminator, this
    time with the label one, and backpropagating through the discriminator into the generator. Only the generator''s
    optimiser steps in the second update. The Adam settings come from the DCGAN paper and are still a sensible default.

    '
- type: quiz
  question: Where real and generated densities match and are positive, what does ideal D output?
  options:
  - 1 for real images and 0 for fakes, as it is never fooled
  - The digit class of the image, as a classifier would
  - 0.5 everywhere, as the two densities are equal
  - log 4, for real and generated inputs alike
  answer: 2
  notes: 'Answer: C. When the generator''s distribution equals the data distribution, the optimal discriminator is p data divided
    by twice p data, which is one half everywhere. A describes a discriminator that is winning, which happens early in training
    or when the generator fails. B confuses the discriminator with a classifier of digit classes; a standard GAN discriminator
    only judges real versus fake. D is the value of the objective at equilibrium, minus log four, not the discriminator''s output.
    In practice you rarely see exactly one half, but D values drifting towards it suggest the game is balanced.

    '
- type: section
  number: 3
  title: Training challenges and fixes
  question: Why are GANs notoriously hard to train, and what helps?
  icon: fa:FaTools
  notes: 'Welcome back from the break. Section three is about what goes wrong. We look at real loss curves from
    the DCGAN trained for these slides, see mode collapse happen in a small experiment, summarise the failure modes
    and their symptoms, and then cover the main stabilisation techniques, including the Wasserstein loss. This is
    highly practical: students will meet these problems in the lab and possibly in the project.

    '
- type: figure
  title: 'Real training curves: losses do not tell you quality'
  figure: losses
  notes: 'These curves come from the DCGAN trained for today. Unlike every supervised model students have trained,
    the losses do not steadily fall; they fluctuate, because each update of one network changes the other''s objective.
    A healthy run keeps the discriminator''s average output on real images above its output on fakes without either
    collapsing to zero or one. If D(fake) stays near zero, D separates sources easily. This alone does not prove
    vanishing G gradients, especially with the non-saturating loss; inspect actual progress. The practical lesson
    is to monitor samples at fixed noise vectors every epoch and to compute a quality metric, which the lab does.


    Figure discussion prompts: Each network changes the other’s task. Losses can rise and fall. Inspect fixed-noise
    samples. Check quality and coverage separately.

    '
- type: figure
  title: Mode collapse, seen in a real experiment
  figure: mode_collapse_slide
  caption: 'Target: 8 Gaussian clusters on a ring (grey). Blue/green: 1,500 generated points at each training step,
    same network sizes.'
  notes: 'This is a real experiment on a toy problem where we can see the whole distribution. The data are eight
    small clusters on a ring. The top row is a standard GAN; the bottom row uses the Wasserstein loss with gradient
    penalty. Mode collapse means the generator covers only some of the modes, producing plausible but repetitive
    samples. In this run the standard GAN quickly produces tight, sharp clusters, but by step 2,000 it has dropped
    the bottom-left cluster entirely and never recovers it: 7 of 8 modes. The Wasserstein GAN with gradient penalty
    learns more slowly, sweeping across the plane at first, but covers all 8 by the end. Other seeds drop more or
    fewer modes, which is itself a lesson: always report seeds and repeat runs. In image terms, mode collapse is
    a digit generator that never draws, say, a two.



    Explain the comparison limit: the configurations also use different learning rates and five versus one critic
    update. The result compares systems, not the loss alone. Ask students to name the extra compute cost before
    attributing improved coverage solely to Wasserstein distance.'
- type: table
  title: 'Failure modes: symptoms and remedies'
  header:
  - Problem
  - What you see
  - Common remedies
  rows:
  - - Mode collapse
    - Many samples look alike; some digits never appear
    - Count classes; WGAN-GP or spectral normalisation
  - - Weak generator gradients
    - D wins easily and G stops improving
    - Non-saturating G loss; keep D and G balanced
  - - Unstable training
    - Losses and samples swing back and forth
    - Lower or separate learning rates; average G's weights (EMA)
  - - D memorises the data
    - D trusts training images but not new real ones
    - Augment real and fake images (ADA)
  - - Checkerboard artefacts
    - Grid-like patterns in the images
    - Resize, then convolve, instead of transposed convolution
  notes: 'This table is a practical checklist and a good exam answer structure. Link each row to the warm-up: the
    forger who repeats one trick is mode collapse; the detective who wins too fast gives vanishing gradients; the
    endless chase is non-convergence. Two remedies deserve mention by name. TTUR, the two time-scale update rule,
    uses separate learning rates for the discriminator and generator and comes from the same paper that introduced
    FID. ADA, adaptive discriminator augmentation from the StyleGAN team, lets GANs train on a few thousand images
    by augmenting what the discriminator sees. Checkerboard artefacts come from transposed convolutions.

    '
- type: equation
  title: The Wasserstein GAN with gradient penalty (WGAN-GP)
  eq:
  - \min_G \max_{\|D\|_L \leq 1} \; \mathbb{E}_{x \sim p_{\mathrm{data}}}[D(x)] - \mathbb{E}_{z}[D(G(z))]
  - \mathrm{critic\ loss} = \mathbb{E}_{z}[D(G(z))] - \mathbb{E}_{x}[D(x)] + \lambda\, \mathbb{E}_{\hat{x}}\left[\left(\|\nabla_{\hat{x}} D(\hat{x})\|_2 - 1\right)^2\right]
  read_as:
  - The critic D gives any real number, not a probability.
  - Training widens the average score gap between real and generated images.
  - The penalty keeps the critic's slope near 1 at points between real and fake.
  terms:
  - - $\|D\|_L \leq 1$
    - 'Lipschitz limit: the score cannot change faster than its input'
  - - $\hat{x}$
    - a random point between a real and a generated image
  - - $\lambda$
    - penalty weight, often 10
  notes: 'The critic produces scores rather than real/fake probabilities. Its score gap approximates a Wasserstein
    comparison under the required smoothness assumptions. The gradient penalty checks randomly mixed real and fake
    inputs. It encourages gradient norm near one at those points, rather than proving a global Lipschitz bound.
    Ask students to separate an input gradient used by this penalty from a weight gradient used by the optimiser.
    Both are derivatives, but they answer different questions.

    '
- type: cards
  title: Stabilisation techniques you will meet
  cards:
  - icon: fa:FaWater
    head: Wasserstein loss + GP
    text: Scores keep giving G useful gradients; the penalty keeps the critic smooth.
  - icon: fa:FaCompressAlt
    head: Spectral normalisation
    text: Caps each D layer's scale, so D cannot change too sharply.
  - icon: fa:FaStopwatch
    head: TTUR
    text: Separate learning rates for D and G (two time-scale update rule).
  - icon: fa:FaChartLine
    head: EMA of G weights
    text: Average G's recent weights; sample from the smoother average.
  - icon: fa:FaRandom
    head: Augmentation (ADA)
    text: Flip, crop or recolour real and fake images, so D cannot memorise.
  - icon: fa:FaBalanceScale
    head: R1 penalty
    text: Penalise D's slope on real images so it does not overreact.
  notes: 'These six techniques cover most of what modern GAN code uses. Students do not need to derive them, but
    should know what problem each addresses. Spectral normalisation is a one-line change in PyTorch, torch dot nn
    dot utils dot spectral norm, and is one of the most effective. EMA, the exponential moving average of generator
    weights, is also used in diffusion model training. R1 regularisation penalises the discriminator''s gradient
    on real data and is the default in StyleGAN2. A good lab extension is to add spectral normalisation to the discriminator
    and compare sample quality and stability.

    '
- type: quiz
  question: Your MNIST GAN produces sharp digits, but almost all of them are 1s and 7s. What is the most appropriate
    first step?
  options:
  - Train for many more epochs with the same settings, hoping other digits appear
  - Check the class histogram of samples, then try a Wasserstein loss or spectral normalisation
  - Remove the discriminator and train the generator with pixel-wise MSE on real digits
  - Raise the sampling temperature so the generator draws more varied digits
  answer: 1
  notes: 'Answer: B. Sharp but repetitive samples are the signature of mode collapse. The first step is to measure
    it, for example by classifying generated digits and plotting the class histogram, which students do in the lab;
    then apply a remedy aimed at coverage, such as the Wasserstein loss with gradient penalty, spectral normalisation
    or minibatch statistics. A rarely helps, since a collapsed generator often stays collapsed or hops between modes.
    C would produce a blurry average, essentially giving up on the adversarial idea. D confuses GANs with language
    models: a GAN has no temperature; the related idea is the truncation trick, which trades diversity for quality.

    '
- type: section
  number: 4
  title: 'Variants: from DCGAN to StyleGAN'
  question: How did GANs go from blurry digits to photorealistic faces?
  icon: fa:FaLayerGroup
  notes: 'Section four surveys the variants named in the descriptor: DCGAN, which made GANs work with convolutions;
    conditional GANs, which let us choose what to generate; pix2pix and CycleGAN, which translate images from one
    domain to another; and StyleGAN, which produced the photorealistic faces that made deepfakes a public concern.
    We also look at real samples from the DCGAN trained for these slides and at latent interpolation.

    '
- type: figure
  title: 'DCGAN: the architecture that made GANs work on images'
  figure: dcgan_arch
  notes: 'The deep convolutional GAN paper by Radford, Metz and Chintala in 2015 established a set of architecture
    guidelines that made GAN training reliable enough to use widely. The generator starts from the noise vector,
    projects it to a small spatial grid, and doubles the resolution with each transposed convolution, using batch
    normalisation and ReLU, finishing with tanh so that pixels lie between minus one and one. The discriminator
    mirrors this with strided convolutions and leaky ReLU. Our lab model is exactly this architecture for 28 by
    28 images, with about a million parameters in total.

    '
- type: figure
  title: Real DCGAN samples across training epochs
  figure: epochs_slide
  stack: true
  bullets:
  - Each column follows one fixed noise vector through training.
  - Some columns change digit between epochs, because G keeps changing as D changes.
  caption: The same 16 noise vectors decoded after each epoch (MNIST, CPU training).
  notes: 'These samples use fixed noise vectors, so each column shows how one generated digit evolves. Before training
    the output is noise. After one epoch rough strokes appear. After two to four epochs digits become recognisable
    and sharper than last week''s VAE samples, although some are malformed. By eight epochs many samples are readable
    digits, but several are still malformed. Notice that the same noise vector can change digit identity between
    epochs, for example the tenth column, a sign that the generator''s mapping is still moving as the game continues.
    In the lab students produce this figure themselves; ask them to record how long one epoch takes on their hardware.

    '
- type: figure
  title: 'Conditional GANs: choose what to generate'
  figure: cgan
  notes: 'A conditional GAN, from Mirza and Osindero in 2014, adds information to both players. The generator receives
    the noise and the condition, for example the label seven, and the discriminator receives an image together with
    a label. A real seven paired with the label three should be rejected, so the generator is forced to produce
    images that match their condition. The same principle extends to any kind of condition: text for text-to-image
    GANs, a semantic map for image synthesis, or an entire image for image-to-image translation, which is the next
    slide.


    Figure discussion prompts: Give condition y to both networks. G(z, y) creates a sample. D(x, y) judges the image-condition
    pair. A label, image or text can condition generation.

    '
- type: cards
  title: Landmark GAN variants
  cards:
  - icon: fa:FaPencilAlt
    head: pix2pix (2017)
    text: Learns from matched pairs, such as a sketch and its photo; a pixel (L1) loss keeps outputs faithful.
  - icon: fa:FaSyncAlt
    head: CycleGAN (2017)
    text: No pairs needed, such as horses ↔ zebras; translating there and back must return the original.
  - icon: fa:FaUserAstronaut
    head: StyleGAN (2019–21)
    text: Photorealistic faces with separate controls for coarse features (pose) and fine ones (hair).
  - icon: fa:FaGlobe
    head: BigGAN (2018)
    text: Large-scale ImageNet images by class; the truncation trick trades variety for quality.
  notes: 'Four landmark variants. Pix2pix needs paired examples and combines the adversarial loss with an L1 pixel
    loss, so outputs are both realistic and faithful to the input. CycleGAN removes the need for pairs by training
    two translators and requiring that translating there and back returns the original image. StyleGAN, from NVIDIA,
    maps noise through a mapping network into a style vector that controls each resolution of the generator separately,
    which gives photorealistic faces and control over coarse features like pose and fine features like hair texture.
    BigGAN showed that scaling up batch size and model size gives much more realistic ImageNet samples,
    and popularised the truncation trick.

    '
- type: equation
  title: 'CycleGAN''s key idea: cycle consistency'
  eq: \mathcal{L}_{\mathrm{cyc}} = \mathbb{E}_{x}\left[\|F(G(x)) - x\|_1\right] + \mathbb{E}_{y}\left[\|G(F(y))
    - y\|_1\right]
  read_as:
  - G translates X → Y; F translates back.
  - Compare the round-trip image with its input.
  - Add both cycle losses to adversarial training.
  terms:
  - - G, F
    - the two translators
  - - ‖·‖₁
    - sum of absolute pixel differences
  notes: 'Without paired data, an adversarial loss alone would let the generator output any realistic zebra, unrelated
    to the input horse. The cycle-consistency loss fixes this: translating a horse to a zebra and back must reproduce
    the original horse, and vice versa. This is a general idea worth remembering, using round-trip consistency as
    supervision when direct labels are missing; it appears again in unsupervised translation of text. Point out
    the limitation: cycle consistency encourages, but does not guarantee, that semantic content is preserved, and
    CycleGAN can hide information in imperceptible patterns to pass the cycle test.

    '
- type: figure
  title: Latent interpolation in a GAN
  figure: interpolation
  stack: true
  bullets:
  - Each row decodes 10 evenly spaced codes on the straight line between two random noise vectors.
  - 'Top row: a 6 closes into a 0. Bottom row: an 8 opens into a 5.'
  - A basic GAN has no encoder, so it cannot find the code of a real photo directly.
  notes: 'As with VAEs, walking between codes can show smooth transitions, but smooth interpolation does not prove
    absence of memorisation or guarantee plausible intermediate images. A key difference from VAEs is that a standard
    GAN has no encoder, so we cannot directly find the latent code of a real image. GAN inversion methods improve
    a latent vector to reproduce a given image, which enables editing real photos. StyleGAN''s intermediate style
    space turned out to be particularly well organised, with directions for age, smile or pose, and this powered
    a wave of face-editing tools, with obvious misuse potential.


    Figure discussion prompts: Choose two codes; decode points between. Inspect intermediate samples. Basic GANs
    have no encoder. Inversion searches for a real image’s code.

    '
- type: section
  number: 5
  title: Evaluation, applications and risks
  question: How good is a generator, and where are GANs used in 2026?
  icon: fa:FaClipboardCheck
  notes: 'The final section covers evaluation, which is required by the descriptor and by MIMLO 4, then where GANs
    are used today, and a responsible AI discussion of deepfakes. Because GANs have no likelihood, evaluation relies
    on comparing samples with real data, and the Fréchet Inception Distance is the standard. The same metrics are
    used for diffusion models next week and for image generation in the project, so this section has lasting value.

    '
- type: equation
  title: Fréchet Inception Distance (FID)
  eq: \mathrm{FID} = \|\mu_r - \mu_g\|_2^2 + \mathrm{Tr}\left(\Sigma_r + \Sigma_g - 2\left(\Sigma_r \Sigma_g\right)^{1/2}\right)
  read_as:
  - Extract real and generated features with one network.
  - Compare feature means and covariances.
  - Lower FID means closer Gaussian summaries, not guaranteed correctness.
  terms:
  - - μ (r, g)
    - mean feature vectors, real and generated
  - - Σ (r, g)
    - feature covariance matrices
  - - Tr
    - trace (sum of the diagonal)
  notes: 'FID compares Gaussian summaries of real and generated image features: their means and covariance matrices.
    Use the same feature network and image preparation for both sets. A lower score means closer feature statistics.
    Zero does not prove that images or full distributions are identical. Means and covariances both affect the score,
    so avoid calling one a pure quality measure and the other a pure diversity measure. The lab uses custom DigitCNN
    features rather than standard Inception FID.

    '
- type: figure
  title: What FID measures, in feature space
  figure: fid
  notes: 'A two-dimensional illustration of what happens in the two-thousand-dimensional feature space. On the left
    the generated features have a similar centre and spread to the real ones, giving a low FID. On the right they
    are shifted, meaning the average generated image differs from the average real image, and narrow, meaning low
    diversity, which is exactly what mode collapse produces; both effects increase FID. Remind students that FID
    values are only comparable when computed with the same feature network, the same number of samples, and the
    same image preprocessing.

    '
- type: table
  title: 'Evaluating GANs: the main tools'
  header:
  - Metric
  - What it measures
  - Watch out for
  rows:
  - - FID
    - Distance between real and generated image features (lower is better)
    - Needs thousands of images; depends on the feature network and resizing
  - - Inception Score
    - Whether a classifier finds the images confident and varied
    - Never compares with real data
  - - Precision / recall
    - Realism (precision) and coverage of real data (recall), separately
    - Depends on the feature space and neighbour count
  - - KID
    - Like FID, but unbiased with fewer images
    - Still noisy when images are few
  - - Human checks
    - Realism and usefulness for the task
    - Needs a rubric and several raters
  notes: 'No single metric is sufficient, so reports should combine them. Inception Score rewards images that a
    classifier labels confidently and a set of images covering many classes, but it never compares with real data.
    Precision and recall for generative models, from 2019, separate the two things FID mixes: are samples realistic,
    and do they cover the data distribution. An unbiased KID estimator avoids the plug-in bias of empirical FID,
    but its variance, feature choice and sample count still matter; no metric is universally preferable. Human evaluation
    can assess task-specific realism and usefulness and must be designed properly: several raters, a clear rubric,
    and agreement statistics. This table maps directly onto MIMLO 4 and the project''s evaluation section.

    '
- type: cards
  title: Where GANs are used in 2026
  cards:
  - icon: fa:FaExpand
    head: Super-resolution
    text: Sharpen low-resolution photos or video frames in one fast pass.
  - icon: fa:FaBolt
    head: Fast diffusion
    text: A discriminator helps cut diffusion to 1–4 steps (SDXL-Turbo).
  - icon: fa:FaCompressArrowsAlt
    head: Sharper autoencoders
    text: A GAN loss keeps latent-diffusion decoders sharp (week 2's VAE).
  - icon: fa:FaVolumeUp
    head: Audio vocoders
    text: Turn speech features into waveforms in real time (e.g. HiFi-GAN).
  - icon: fa:FaExchangeAlt
    head: Image translation
    text: Day to night, sketch to photo, or one painting style to another.
  - icon: fa:FaTable
    head: Synthetic data
    text: Extra tabular or image records; audit them for privacy leaks.
  notes: 'Diffusion models have replaced GANs as the main text-to-image generators, but GANs are far from gone.
    They excel where speed matters: a GAN produces an image in one forward pass, while diffusion needs many steps.
    So GAN-based upscalers are everywhere, and adversarial distillation, as in Stability AI''s SDXL-Turbo, uses
    a discriminator to compress a diffusion model into one to four steps. Adversarial losses also keep the decoders
    of latent-diffusion autoencoders and image tokenizers sharp, and GAN vocoders are standard in speech synthesis.
    Point out the link to last week: the VAE inside Stable Diffusion was trained with a GAN loss.

    '
- type: bullets
  title: 'Responsible AI lens: deepfakes and synthetic media'
  icon: fa:FaUserSecret
  bullets:
  - Synthetic media can impersonate or mislead.
  - False positives and new generators defeat detectors.
  - Check provenance and disclosure.
  - Use authorised data; prevent abuse.
  notes: 'Adversarial training is, by design, optimised to fool a detector, so it is no surprise that GAN outputs
    raised the first wave of deepfake concerns. Discuss the harms concretely, including the liar''s dividend, where
    genuine recordings are dismissed as fakes. Explain why detection alone is insufficient: detectors generalise
    poorly to new generators. The policy response combines source history (provenance), meaning signed content credentials
    such as C2PA, watermarks, and legal duties. Article 50 distinguishes provider marking from deployer disclosure,
    with scope and exceptions, including special treatment of artistic works. Read the official text for the role
    and use concerned. The rules apply from 2 August 2026; systems already on the market have until 2 December 2026
    for the Article 50(2) marking duty only, not for every transparency duty.
    Week 10 returns to watermarking in detail. Ask students where their project could create synthetic media and
    how they would label it.

    '
- type: table
  title: 'VAE vs. GAN: a summary for the exam'
  header:
  - ''
  - VAE (week 2)
  - GAN (week 3)
  rows:
  - - Training signal
    - Rebuild the input + KL penalty
    - A learned real-or-fake checker
  - - Likelihood
    - A lower bound (ELBO) can be computed
    - None; quality must be measured
  - - Encoder
    - Yes, image → code
    - 'Basic GAN: no'
  - - Samples
    - Often slightly blurry
    - Often sharp
  - - Coverage
    - Usually broad; still check
    - Can miss whole classes (collapse)
  - - Training
    - One loss to minimise; stable
    - Two networks in a moving game
  - - Typical uses
    - Latent spaces, anomaly scores
    - Fast, sharp generation
  notes: 'This comparison appears frequently in exams, so present it as a revision tool. VAEs improve a bound on
    likelihood, have an encoder and train stably, but their samples blur. GANs produce sharper samples through a
    learned critic, but have no likelihood, no encoder, and can collapse. The two families are complementary, and
    modern systems combine them: VAE-GAN hybrids and autoencoders trained with adversarial losses. Next week, diffusion
    models achieve the quality of GANs with the stability and coverage of likelihood-based models, at the cost of
    many sampling steps.

    '
- type: lab
  title: 'Lab 3: train and diagnose a DCGAN'
  steps:
  - Build G and D.
  - Implement detached D loss.
  - Implement connected G loss.
  - Inspect fixed-noise snapshots.
  - Check features and class coverage.
  - Compare toy training configurations.
  runtime: Colab GPU or local CPU. About 19 min on a laptop CPU after downloads
  deliverable: Figures, diagnostics, distances, toy comparison, four answers
  notes: 'The lab mirrors the lecture. Students first implement the two losses, especially the detached path for
    the discriminator update. They then train and inspect fixed-noise samples. Evaluation uses a small digit classifier:
    its predictions estimate class coverage, and its features supply a custom Fréchet distance. This uses the FID
    formula with a different feature network, so its values cannot be compared directly with standard Inception
    FID. Check classifier accuracy before interpreting either result. Finally the ring experiment makes missing
    modes visible and lets students test the Wasserstein objective with gradient penalty. The trained generator
    and evaluation code can be reused in the project.

    '
- type: summary
  points:
  - G creates; D checks.
  - Alternate two weight updates.
  - Non-saturating loss improves early feedback.
  - Collapse loses data variety.
  - Metrics need features and sample counts.
  - Consent, disclosure and provenance matter.
  notes: 'Recap the six points. The essential equations are the minimax objective and the optimal discriminator;
    the essential practical knowledge is the non-saturating loss, the failure modes, and FID. Next week we meet
    diffusion models, which learn to reverse a gradual noising process. Their known noise targets avoid the two-player
    adversarial game. Many produce detailed images; useful quality, coverage and cost still require evaluation.
    Ask students to finish the lab, read Foster chapter 4 and, if they want the history, chapter 10 on advanced
    GANs including StyleGAN.

    '
