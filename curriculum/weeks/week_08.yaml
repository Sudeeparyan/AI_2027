objectives:
- Choose prompting, retrieval or further training.
- Explain SFT and instruction tuning.
- Compare reward-model RLHF, DPO and verified rewards.
- Trace LoRA and calculate its parameter count.
- Distinguish QLoRA, soft prompts and distillation.
- Adapt a domain model and evaluate fairly.
