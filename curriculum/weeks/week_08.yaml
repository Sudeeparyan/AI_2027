  notes: 'In short: Use the official library documentation for code and the original papers for what each method actually claims.


    Explain: The Hugging Face course chapter walks through SFT with TRL and LoRA. The PEFT documentation covers LoRA, QLoRA
    and other adapters. TRL documents the SFT, DPO and GRPO trainers. The RLHF blog explains the three-stage pipeline with diagrams.
    The linked inventor video explains LoRA; its paper remains in the Word readings.


    Example: Before changing a trainer argument, check the documentation for your TRL version, because argument names change
    between releases. Read the LoRA paper''s experiments to see which ranks and target modules worked. Then compare those settings
    with the lab''s choices.


    Ask: Why check the documentation version before copying fine-tuning code?


    Answer: Trainer arguments are renamed between releases, so old examples can fail or silently change behaviour.


    Watch out: Blog posts and videos simplify; confirm important details in the paper or documentation.'
