subtitle: Teach an existing model a task, train small adapters, and check what changes
mimlos:
- 1
- 3
- 4
objectives:
- Choose prompting, retrieval or further training.
- Explain SFT and instruction tuning.
- Compare reward-model RLHF, DPO and verified rewards.
- Trace LoRA and calculate its parameter count.
- Distinguish QLoRA, soft prompts and distillation.
- Adapt a domain model and evaluate fairly.
coverage:
- full fine-tuning
- supervised fine-tuning
- instruction tuning
- chat template
- RLHF
- reward model
- PPO
- DPO
- verifiable rewards
- GRPO
- LoRA
- QLoRA
- adapters
- prompt tuning
- distillation
- domain
- overfitting
- catastrophic forgetting
- data leakage
- held-out
- benchmark
- PEFT
- TRL
slides:
- type: title
  figure: cover
  notes: 'Say: We will teach a small model to route banking messages. Start with measured prompting baselines,
    keep separate datasets, train only added paths and compare on the same final examples. Analogy: a
    trained worker practises a stable specialist job. Ask: could retrieval solve frequently changing interest-rate
    facts more directly? Common mistake: fine-tuning is a choice to justify with evidence, not an automatic
    next step.'
- type: outcomes
  notes: 'Say: Separate objectives from implementation. SFT supplies desired answers; preferences compare
    replies. Full fine-tuning and LoRA specify which weights can change. We will trace those choices and
    test the result. Analogy: what is practised differs from which part of an instrument can be adjusted.
    Ask: can SFT use LoRA? Common mistake: SFT and full fine-tuning are not opposing categories.'
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: prompt, retrieve or fine-tune?'
    minutes: 5
  - title: 1 · When to fine-tune
    minutes: 13
  - title: 2 · Supervised and instruction fine-tuning
    minutes: 20
  - title: '3 · Preference alignment: RLHF, DPO, RL for reasoning'
    minutes: 25
  - title: 4 · Parameter-efficient fine-tuning
    minutes: 25
  - title: 5 · Domain adaptation in practice
    minutes: 25
  - title: Lab preview and wrap-up
    minutes: 7
  notes: 'Say: Begin with the adaptation decision, then practise with known answers. Learn preferences
    before the cheaper weight-update methods. Finish with the full domain experiment and its checks. Analogy:
    choose the job, choose the teaching signal, choose what to adjust, then examine performance. Ask:
    which dataset chooses hyperparameters? Common mistake: reusing a final test to keep improving the
    model leaks information into the decision.'
- type: discussion
  title: Warm-up
  icon: fa:FaComments
  prompt: A bank wants an assistant that (a) uses its brand voice, (b) knows this week's interest rates,
    and (c) routes 50,000 messages a day cheaply. Prompt, retrieve or fine-tune, for each?
  points:
  - Changing facts?
  - Consistent behaviour?
  - Measured time and cost?
  notes: 'Say: Give three minutes. A good answer: brand voice, a) can often be achieved with a good system prompt and examples,
    and if that is not consistent enough, fine-tuning on examples of the voice. This week''s interest rates, b), change often,
    so they belong in retrieval or a tool, not in model weights. Routing at high volume, c), is an ideal fine-tuning case: a
    stable task where a small fine-tuned model can be accurate, fast and cheap. The general lesson: knowledge that changes goes
    into retrieval; behaviour goes into prompts or weights; cost at scale favours small fine-tuned models.


    Analogy: Prompting writes a brief; retrieval opens a reference book; training gives repeated practice.

    Ask: Which method updates this week''s interest-rate source most directly?

    Answer: Retrieval, or a rates tool: update the source and the next answer uses it.

    Common mistake: Fine-tuning to supply facts that change every week.'
- type: section
  number: 1
  title: When to fine-tune
  question: 'Prompting, retrieval or fine-tuning: what problem does each solve?'
  icon: fa:FaQuestionCircle
  notes: 'Say: Section one is about the decision, which is where many real projects go wrong: teams fine-tune to add facts,
    which retrieval does better, or without an evaluation set, so they cannot tell whether it helped. We compare the three approaches,
    give a decision process, and list good and bad reasons to fine-tune. About thirteen minutes.


    Analogy: Before training a new employee, check whether a better brief or a reference manual would solve the problem.

    Ask: What do you need before you can tell whether fine-tuning helped?

    Answer: An evaluation set and the best prompting result on it.

    Common mistake: Fine-tuning without a baseline, so any gain or loss is invisible.'
- type: table
  title: Prompting vs. retrieval vs. fine-tuning
  header:
  - Method
  - Changes
  - Best first use
  - Banking example
  rows:
  - - Prompt
    - The input
    - Task and format
    - List the ten intents and show examples
  - - Retrieval
    - Input + sources
    - Changing facts
    - Fetch this week's interest rates
  - - Fine-tune
    - The weights
    - Persistent behaviour gaps
    - Route 50,000 messages a day cheaply
  callout: Combine methods when evidence supports it.
  notes: 'Say: Walk through the rows. Prompting changes the input and solves task specification. Retrieval also changes the
    input, adding documents, and solves missing or changing knowledge with traceable citations, which is why it is the right
    answer for this week''s interest rates. Fine-tuning changes weights and is best for consistent behaviour, style and format,
    and specialised skills such as a classification task with many fine distinctions. It needs labelled data and a re-training
    cycle whenever things change, and knowledge in weights cannot be cited or easily corrected. Microsoft''s guidance on customising
    LLMs, linked in the resources, makes the same distinctions.


    Ask: Which method lets you show where an answer came from?

    Answer: Retrieval: the source passages travel with the request and can be cited.

    Common mistake: Expecting knowledge stored in weights to be easy to cite or correct.'
- type: figure
  title: A decision process
  figure: decision
  notes: 'Say: This flowchart turns the table into a process. Start with a good prompt and an evaluation set from week 7. If
    quality is sufficient, ship and monitor. If not, diagnose: if errors come from missing or outdated knowledge, add retrieval;
    if they come from behaviour, format, style or a specialised skill that examples in the prompt cannot teach, or if you need
    a smaller, cheaper model to reach the same quality, fine-tune. In practice the approaches combine: a fine-tuned model that
    follows your format well can still use retrieval for facts. The key requirement at every step is the evaluation set; without
    it you cannot tell whether a change helped.


    Analogy: A doctor diagnoses before prescribing.

    Ask: The errors come from outdated product names. Which branch of the flowchart applies?

    Answer: Missing or outdated knowledge, so add retrieval.

    Common mistake: Skipping the diagnosis and fine-tuning by default.'
- type: compare
  title: Good and bad reasons to fine-tune
  columns:
  - head: Good reasons
    icon: fa:FaCheck
    points:
    - Persistent label or style gaps after good prompts
    - Useful labelled examples and a separate test set
    - A measured saving, e.g. a small model at high volume
  - head: Bad reasons
    icon: fa:FaTimes
    points:
    - Only facts that change (use retrieval)
    - No measured problem with the best prompt
    - No rights to the data, or no test set
  notes: 'Say: Go through both columns. Among good reasons, cost is often the decisive one: a small model fine-tuned on a narrow
    task can match a large general model at a fraction of the price and latency, which is exactly the lab scenario. Among bad
    reasons, the most common misconception is that fine-tuning is the way to teach a model new facts; research shows that fine-tuning
    on new factual knowledge is slow and can even increase hallucination, while retrieval handles facts transparently. Always
    check the licence: some models and API terms restrict fine-tuning or the use of outputs.


    Ask: Why can fine-tuning on new facts be risky?

    Answer: Models learn new facts slowly from fine-tuning, and research found it can increase hallucination.

    Common mistake: Ignoring licence terms. Some models and APIs restrict fine-tuning or the use of outputs.'
- type: section
  number: 2
  title: Supervised and instruction fine-tuning
  question: How do we teach a model what good outputs look like?
  icon: fa:FaChalkboardTeacher
  notes: 'Say: Section two covers supervised fine-tuning, the workhorse of adaptation, and instruction tuning, the step that
    turns a base model into an assistant. We look at the loss, chat templates and, most importantly, data preparation, where
    most of the quality comes from. Keep asking students what the model sees during training. About twenty minutes.


    Analogy: SFT is guided practice with a supplied correct answer; the model still reads the question.

    Ask: Does masking the prompt loss stop the model reading the prompt?

    Answer: No. The prompt is still input; masking only leaves its tokens out of the loss.

    Common mistake: Confusing SFT, a training signal, with full fine-tuning, a choice of which weights change.'
- type: compare
  title: Full fine-tuning vs. supervised fine-tuning (SFT)
  columns:
  - head: Full fine-tuning
    icon: fa:FaWeightHanging
    points:
    - 'Which weights: all'
    - More gradient and optimiser memory
    - Re-test older abilities
  - head: Supervised fine-tuning (SFT)
    icon: fa:FaClipboardList
    points:
    - 'What examples: inputs and desired answers'
    - Full weights or adapters
    - Read prompt; score answer tokens
  notes: 'Say: Clarify terms, because they are used loosely. Full fine-tuning means updating every parameter, which gives maximum
    flexibility but needs the most memory, as we calculate later, and produces a complete copy of the model for each task. Supervised
    fine-tuning describes the training signal: pairs of inputs and desired outputs, trained with the same next-token loss as
    pre-training. SFT can be done with full fine-tuning or with parameter-efficient methods. In practice, the loss is computed
    only on the output tokens, so the model learns to produce answers rather than to reproduce the questions.


    Ask: Which needs more memory: full fine-tuning or LoRA, trained on the same SFT examples?

    Answer: Full fine-tuning, because every weight needs a gradient and optimiser state.

    Common mistake: Treating SFT and full fine-tuning as alternatives. SFT can use full weights or adapters.'
- type: equation
  title: 'The SFT loss: next-token prediction on the answer'
  eq: \mathcal{L}_{\mathrm{SFT}}(\theta) = -\sum_{(x, y)} \;\; \sum_{t=1}^{|y|} \, \log p_\theta\left(y_t \mid x, y_{<t}\right)
  read_as:
  - Read prompt x and known answer y.
  - Raise each correct answer-token probability.
  - Mask prompt loss; still read the prompt.
  - 'Example answer: lost_or_stolen_card.'
  terms:
  - - $\theta$
    - the numbers being trained
  - - x
    - prompt and input
  - - $y_t$
    - correct answer token at position $t$
  - - $y_{<t}$
    - correct answer tokens before position $t$
  notes: 'Say: The SFT loss is the negative log-likelihood of the response tokens given the prompt and the earlier response
    tokens, which is exactly maximum likelihood from week 1, but on curated pairs instead of raw web text. The prompt tokens
    are fed to the model but excluded from the loss by masking their labels, so the model is not trained to generate questions.
    In the TRL library used in the lab, providing the data as prompt and completion pairs does this masking automatically. Ask
    students: why would training on the prompt tokens be harmful? It wastes capacity learning to predict user text and can make
    the model continue questions rather than answer them.


    Ask: For the answer lost_or_stolen_card, which tokens count in the loss?

    Answer: Only the answer tokens. The system and user tokens are read but not scored.

    Common mistake: Thinking masking hides the prompt from the model.'
- type: bullets
  title: 'Instruction tuning: from base model to assistant'
  icon: fa:FaCommentDots
  bullets:
  - Instructions paired with useful answers.
  - Teach general instruction following; test new tasks.
  - Match training and inference chat templates.
  - LIMA used 1,000 carefully reviewed examples.
  notes: 'Say: Instruction tuning is SFT on a broad mixture of tasks written as instructions, such as summarise this, translate
    that, answer this question. Google''s FLAN work in 2021 showed that this makes models better at following instructions for
    tasks they never saw; OpenAI''s InstructGPT used it as the first stage of post-training. Chat models also learn a chat template:
    special tokens that mark system, user and assistant turns. Mismatched templates between training and inference are a common
    bug. The LIMA paper showed that a thousand high-quality examples can be enough for good assistant behaviour, supporting
    the idea that post-training mainly shapes behaviour.


    Analogy: Practising many kinds of exam question rather than one.

    Ask: What does the LIMA result suggest about post-training?

    Answer: A small set of high-quality examples can shape behaviour, because most knowledge comes from pre-training.

    Common mistake: Training with one chat template and serving with another.'
- type: code
  title: What a chat template produces (Qwen family)
  code: "messages = [\n    {\"role\": \"system\", \"content\": \"You classify banking messages.\"},\n\
    \    {\"role\": \"user\", \"content\": \"I lost my card!\"},\n    {\"role\": \"assistant\", \"content\"\
    : \"lost_or_stolen_card\"},\n]\nprint(tok.apply_chat_template(messages, tokenize=False))\n\n# <|im_start|>system\n\
    # You classify banking messages.<|im_end|>\n# <|im_start|>user\n# I lost my card!<|im_end|>\n# <|im_start|>assistant\n\
    # lost_or_stolen_card<|im_end|>\n"
  bullets:
  - Role tokens mark turns.
  - Use the model’s stored template.
  - Match training and new requests.
  notes: 'Say: Show what the model actually sees. The apply chat template method turns a list of messages into a single string
    with the model''s special tokens; this example is the format used by the Qwen family. Other families use different tokens.
    During fine-tuning the training data must be formatted with the same template the model will see at inference, which libraries
    such as TRL do automatically when the data are given as messages. If you format data by hand with the wrong tokens, the
    fine-tuned model will behave strangely. Students print their own template in the lab.


    Analogy: A sorting office expects one address format; a different layout gets misrouted.

    Ask: What happens if you format training data with another model family''s tokens?

    Answer: The model sees unfamiliar markers, and the fine-tuned model behaves strangely at inference.

    Common mistake: Writing role markers by hand instead of using apply_chat_template.'
- type: cards
  title: 'Data preparation: where most of the quality comes from'
  cards:
  - icon: fa:FaGem
    head: Quality
    text: 'Correct, consistent answers: one label per message, checked by a second person.'
  - icon: fa:FaRandom
    head: Diversity
    text: 'Real wording: typos, slang, short and long messages.'
  - icon: fa:FaCut
    head: Clean splits
    text: Separate train, validation and test; remove near-duplicates across them.
  - icon: fa:FaUserSecret
    head: Privacy & rights
    text: Remove names and card numbers; check permission to use the data.
  - icon: fa:FaBalanceScale
    head: Balance
    text: Count examples per label; a rare intent needs enough examples.
  - icon: fa:FaFileAlt
    head: Document
    text: Record sources, dates, filters and known gaps in a datasheet.
  notes: 'Say: Emphasise that data preparation determines most of the outcome. Label quality matters more than quantity: a few
    hundred clean examples usually beat thousands of noisy ones. The data must reflect the real distribution of inputs, including
    awkward phrasings and edge cases. Splits must be clean: near-duplicate messages in both training and test sets inflate the
    measured accuracy, which is data leakage. Personal data must be removed, because fine-tuned models can memorise it. And
    the process should be documented in a datasheet, a companion to the model card from week 6.


    Analogy: A textbook full of wrong answers trains wrong habits.

    Ask: The same customer message appears in training and test. What goes wrong?

    Answer: Leakage: the model can remember the label, so the test score is inflated.

    Common mistake: Collecting thousands of noisy examples instead of a few hundred clean ones.'
- type: section
  number: 3
  title: 'Preference alignment: RLHF, DPO and RL for reasoning'
  question: How can comparisons between two answers guide further training?
  icon: fa:FaThumbsUp
  notes: 'Say: Section three covers the second stage of post-training. SFT teaches from examples of good answers, but for many
    tasks it is easier for people to compare two answers than to write the ideal one. Preference alignment learns from such
    comparisons. We cover reinforcement learning from human feedback as used for InstructGPT, direct preference optimisation
    which simplified it, AI feedback, and reinforcement learning with verifiable rewards, which produces today''s reasoning
    models. About twenty-five minutes.


    Analogy: Preference learning compares two answers instead of supplying one exact target.

    Ask: Who decided which answer was preferred, and using what rubric?

    Answer: Annotators or an AI judge following written guidelines; the guidelines define what better means.

    Common mistake: Treating a higher learned reward as truth or safety.'
- type: figure
  title: Reinforcement learning from human feedback (RLHF)
  figure: rlhf
  notes: 'Say: The RLHF pipeline from Ouyang and colleagues'' InstructGPT paper, the method behind the first ChatGPT. Step one
    is supervised fine-tuning on demonstrations. Step two collects comparisons: people see several model answers to the same
    prompt and rank them. Step three trains a reward model, usually a copy of the language model with a scalar output, to predict
    those preferences. Step four uses reinforcement learning, specifically proximal policy optimisation, to adjust the language
    model to produce answers with high reward, while a penalty keeps it close to the SFT model. A striking result: people preferred
    the outputs of a 1.3-billion-parameter InstructGPT model over those of the 175-billion-parameter GPT-3.


    Analogy: A coach ranks practice attempts, a scorer learns the coach''s taste, and the player trains to please the scorer.

    Ask: Why ask people to rank answers instead of writing the ideal one?

    Answer: Comparing is faster and more consistent for people than writing a perfect answer.

    Common mistake: Forgetting the KL penalty. Without it the policy drifts and exploits flaws in the reward model.'
- type: equation
  title: The reward model and the RL objective
  eq:
  - \mathcal{L}_{\mathrm{RM}} = -\log \sigma\left(r_\phi(x, y_w) - r_\phi(x, y_l)\right)
  - \max_{\pi_\theta} \; \mathbb{E}_{y \sim \pi_\theta(\cdot \mid x)}\left[r_\phi(x, y)\right] - \beta\,
    D_{\mathrm{KL}}\left(\pi_\theta(\cdot \mid x) \,\|\, \pi_{\mathrm{ref}}(\cdot \mid x)\right)
  read_as:
  - 'Reward model: score preferred answers higher.'
  - 'RL policy: seek reward with a change penalty.'
  - KL discourages drift; it cannot guarantee safety.
  terms:
  - - $y_w$ / $y_l$
    - preferred / less-preferred answer
  - - $r_\phi$
    - learned scoring model
  - - $\pi_\theta$ / $\pi_{\mathrm{ref}}$
    - model being trained / fixed starting model
  - - $\beta$
    - strength of the penalty for changing the model
  panel_h: 2.2
  notes: 'Say: Two equations. The reward model loss says the reward difference between the preferred and rejected answers, passed
    through a sigmoid, should approach one: the probability that the preferred answer wins. This is the Bradley-Terry model
    of pairwise comparisons. The RL objective maximises expected reward minus a KL divergence to the reference model, the same
    KL as in week 2. Without the penalty, the policy finds ways to exploit flaws in the reward model, producing strange text
    that scores highly, which is called reward hacking. RLHF works but is complex: four models in memory and an unstable RL
    loop.


    Ask: The reward model scores the preferred answer 2 points higher. What probability does it give that the preferred answer
    wins?

    Answer: σ(2) ≈ 0.88.

    Common mistake: Reading the KL term as a safety guarantee. It only limits drift from the reference model.'
- type: equation
  title: Direct Preference Optimisation (DPO)
  eq: \mathcal{L}_{\mathrm{DPO}} = -\log \sigma\left(\beta \log \dfrac{\pi_\theta(y_w \mid x)}{\pi_{\mathrm{ref}}(y_w
    \mid x)} - \beta \log \dfrac{\pi_\theta(y_l \mid x)}{\pi_{\mathrm{ref}}(y_l \mid x)}\right)
  read_as:
  - Use preferred and rejected replies to one prompt.
  - Compare probabilities against a fixed reference.
  - Train directly; no separate reward-model fit or RL loop.
  terms:
  - - $\pi_\theta$
    - model being trained
  - - $\pi_{\mathrm{ref}}$
    - fixed reference model
  - - $\beta$
    - scale controlling the preference objective
  notes: 'Say: Rafailov and colleagues showed in 2023 that the RLHF objective has a closed-form optimal policy, which lets you
    skip the reward model and the reinforcement learning. The resulting DPO loss looks like the reward model loss, but the reward
    is implicitly defined by the log-ratio of the trained model''s probabilities to the reference model''s. In words: make preferred
    answers relatively more likely and rejected answers relatively less likely, without drifting too far from the reference.
    DPO is much simpler and more stable than PPO-based RLHF and is available in TRL; the lab includes an optional snippet.


    Analogy: Practise by contrasting a good and a poor answer while staying close to your earlier style.

    Ask: What does DPO need that SFT does not?

    Answer: Pairs of preferred and rejected answers to the same prompt, and a frozen reference model.

    Common mistake: Thinking DPO needs no preference data.'
- type: compare
  title: Three ways to learn from feedback
  columns:
  - head: RLHF (PPO)
    icon: fa:FaUsers
    points:
    - Human rankings → reward model
    - PPO updates the policy
    - 'Example: InstructGPT, behind the first ChatGPT'
  - head: DPO and variants
    icon: fa:FaBalanceScale
    points:
    - Ranked pairs → preference loss
    - No reward-model fit or RL loop
    - 'Example: many open chat models, such as Zephyr'
  - head: RL with verifiable rewards
    icon: fa:FaCheckDouble
    points:
    - Check answers or run tests
    - GRPO compares sampled rewards
    - 'Example: DeepSeek-R1 on maths and code'
  notes: 'Say: Summarise the landscape. RLHF with PPO is the original, most flexible and most complex. DPO and its many variants
    are the practical default for preference tuning of open models. The newest branch is reinforcement learning with verifiable
    rewards: for maths problems or code, correctness can be checked automatically, so no human preferences or learned reward
    model are needed. DeepSeek''s group relative policy optimisation, GRPO, samples several answers per problem and rewards
    those better than the group average. DeepSeek-R1 showed that long step-by-step reasoning emerges from this training, which
    is how the reasoning models of week 6 are made.


    Ask: Which method suits maths problems with checkable answers?

    Answer: RL with verifiable rewards, such as GRPO: correctness is checked automatically.

    Common mistake: Assuming every task has a verifiable reward. Open-ended writing still needs preferences.'
- type: bullets
  title: AI feedback, and what can go wrong
  icon: fa:FaExclamationTriangle
  bullets:
  - RLAIF uses AI feedback; Constitutional AI uses written principles.
  - Reward hacking improves scores without the intended outcome.
  - Preferences may reward agreement with false claims.
  - Inspect rubric, annotators and representation.
  notes: 'Say: Human preference data is expensive, so AI feedback is now common: in Constitutional AI, a model critiques and
    revises answers according to a written set of principles and generates preference labels, with humans writing the principles
    rather than labelling every example. Preference training has characteristic failures. Reward hacking exploits imperfections
    in the reward, for example making answers longer because raters tended to prefer detail. Sycophancy, agreeing with the user,
    is partly a product of preference training. And the question of whose preferences and values are encoded is a real ethical
    issue, linking to the responsible-AI lens later.


    Analogy: A student who learns that longer essays get higher marks writes longer essays, not better ones.

    Ask: Give an example of reward hacking.

    Answer: Answers grow longer because raters tended to prefer detail, without becoming more correct.

    Common mistake: Assuming preferences are neutral. Whose preferences were collected shapes the model''s values.'
- type: quiz
  question: What is the main practical advantage of DPO over PPO-based RLHF?
  options:
  - It needs no preference data, only ordinary instruction examples
  - It works only for image models, where rewards are easy to define
  - It always produces a better model than PPO on every benchmark
  - It needs no separate reward model or RL loop, so training is simpler
  answer: 3
  notes: 'Say: Answer: D. DPO still needs preference pairs, so A is wrong, but it turns alignment into a direct supervised-style
    loss, removing the reward model and the unstable reinforcement learning loop. C overstates: results depend on data and settings,
    and PPO can still outperform in some studies. B is simply wrong. Follow-up question: when would you use reinforcement learning
    with verifiable rewards instead? When correctness can be checked automatically, such as maths answers or code with unit
    tests.


    Ask: Why is option C wrong?

    Answer: Results depend on data and settings; PPO still does better in some studies.

    Common mistake: Choosing A. DPO still needs preference pairs.'
- type: section
  number: 4
  title: Parameter-efficient fine-tuning (PEFT)
  question: How can we train a small part of a large model to reduce GPU memory use?
  icon: fa:FaCompressArrowsAlt
  notes: 'Say: Welcome back. Section four is about making fine-tuning affordable. Updating every weight of a multi-billion-parameter
    model needs data-centre hardware. Parameter-efficient methods freeze the original weights and train a tiny number of new
    parameters. We focus on LoRA, which students use in the lab, and QLoRA, then compare other methods, estimate memory, and
    cover knowledge distillation.


    Analogy: LoRA adds a small adjustable correction alongside a fixed transformation.

    Ask: For rank 16 and a 4096 × 4096 matrix, how many values does LoRA train?

    Answer: 16 × (4096 + 4096) = 131,072.

    Common mistake: Assuming fewer trainable weights remove the memory for the frozen weights and activations.'
- type: figure
  title: 'LoRA: learn a low-rank update'
  figure: lora
  notes: 'Say: Low-rank adaptation, LoRA, by Hu and colleagues in 2021, rests on the observation that the change needed to adapt
    a large model to a task has low intrinsic rank. Instead of learning a full update to a weight matrix W, we learn two thin
    matrices, B and A, whose product is the update. Only A and B are trained; W stays frozen. B is initialised to zero, so at
    the start the model is exactly the pretrained model. For a four-thousand by four-thousand matrix with rank sixteen, the
    adapter has about 131 thousand weights instead of 16.8 million, under one percent.


    Analogy: A small adjustable lens clipped in front of a fixed camera lens.

    Ask: Why is B initialised to zero?

    Answer: So BA is zero at the start and the model begins exactly as the pretrained model.

    Common mistake: Thinking W changes during LoRA training. W stays frozen.'
- type: equation
  title: LoRA in equations
  eq:
  - h = W x + \frac{\alpha}{r} B A x, \qquad B \in \mathbb{R}^{d \times r},\; A \in \mathbb{R}^{r \times
    k},\; r \ll \min(d, k)
  - '\#\mathrm{params}: \; r(d + k) \;\; \mathrm{vs.} \;\; d \cdot k'
  read_as:
  - Keep W fixed; train A and B.
  - '4096 × 4096: W has 16,777,216 values.'
  - 'Rank 16: A + B has 131,072 values.'
  - Scale by $\alpha/r$; compatible updates can merge.
  terms:
  - - r
    - small inner size (rank) of the added path
  - - $\alpha$
    - number scaling the correction
  - - target modules
    - layers that receive a LoRA path, such as attention projections
  panel_h: 2.0
  notes: 'Say: Go through the worked example on the board: rank sixteen times the sum of the two dimensions gives 131,072 trainable
    parameters, compared with nearly 16.8 million in the frozen matrix. The hyperparameters students set in the lab are the
    rank, the scaling alpha, often twice the rank, dropout, and the target modules, the layers that receive adapters, commonly
    the attention projections and sometimes the MLP layers. Two deployment options follow. You can merge the product BA into
    W after training, so inference costs nothing extra, or keep the adapter separate, a few megabytes, and swap adapters per
    task on one shared base model.


    Ask: With r = 16 and α = 32, what scale multiplies BAx?

    Answer: α/r = 2.

    Common mistake: Assuming a merged adapter slows inference. After merging, it costs nothing extra.'
- type: figure
  title: How many weights does LoRA train? (the lab model)
  figure: param_compare
  bullets:
  - '{{LORA_PARAMS}}'
  - Shown counts come from the recorded lab model.
  - Compare trainable parameters; memory also includes fixed weights and activations.
  stack: true
  notes: 'Say: These numbers come from the lab model, Qwen 2.5 with half a billion parameters, with rank-sixteen adapters on
    the four attention projections. The bar chart uses a log scale because the difference is several orders of magnitude. The
    memory saving comes mainly from the optimizer: Adam stores two extra numbers per trainable parameter, so training only adapters
    removes most of that memory. The LoRA paper reported ten thousand times fewer trainable parameters and three times less
    GPU memory for GPT-3, with quality comparable to full fine-tuning on the tasks they tested.


    Ask: Why does the chart use a log scale?

    Answer: The counts differ by more than two orders of magnitude, so a linear axis would hide the LoRA bar.

    Common mistake: Reading the trainable count as the memory needed. Frozen weights and activations still use memory.'
- type: bullets
  title: 'QLoRA: fine-tune on top of a 4-bit model'
  icon: fa:FaMicrochip
  bullets:
  - Store frozen base weights in 4-bit form.
  - Train higher-precision LoRA paths.
  - NF4; quantised scales; paged optimiser.
  - 'Paper: 65 B on 48 GB. Measure your model, sequence and batch.'
  notes: 'Say: QLoRA combines LoRA with quantisation. The frozen base weights are stored in four bits using a data type called
    NormalFloat, designed for normally distributed weights, and are de-quantised on the fly during the forward pass, while the
    adapters are trained in sixteen-bit precision. Double quantisation also compresses the quantisation constants, and paged
    optimizers handle memory spikes. The QLoRA paper fine-tuned a sixty-five-billion-parameter model on a single forty-eight-gigabyte
    GPU. For students this means that seven- or eight-billion-parameter models can often be fine-tuned on a Colab T4 GPU when
    one is available; the lab includes an optional QLoRA snippet.


    Analogy: Keep a reference book in compact print and write your notes on a separate clean sheet.

    Ask: In QLoRA, which numbers are 4-bit and which are trained?

    Answer: The frozen base weights are stored in 4 bits; the LoRA adapters are trained in 16-bit precision.

    Common mistake: Assuming 4-bit storage keeps full quality without testing. Measure the task again.'
- type: table
  title: Parameter-efficient methods compared
  header:
  - Method
  - What is trained
  - Example
  - Watch
  rows:
  - - LoRA
    - Low-rank paths beside weights
    - Rank 16 on q, k, v, o
    - Rank; which layers
  - - QLoRA
    - LoRA on a 4-bit base
    - 7 B model on one T4
    - Memory; speed
  - - Adapters
    - Small bottleneck layers
    - One adapter per task
    - Extra latency
  - - Prompt tuning
    - Vectors added to the input
    - 20 learned input vectors
    - Task quality
  - - Prefix tuning
    - Key/value prefixes in each layer
    - Prefixes at every layer
    - Task quality
  - - Full fine-tuning
    - Every weight
    - All 494 M weights
    - Memory; forgetting
  notes: 'Say: LoRA updates low-rank additions to selected weights; QLoRA keeps those additions while
    compressing the frozen base. Bottleneck adapters add small layers. Prompt tuning learns vectors at
    the input. Prefix tuning adds learned key/value prefixes at multiple transformer layers. Full fine-tuning
    updates original weights. Analogy: several different adjustment points can tune an instrument. Ask:
    which method changes all original matrices? Common mistake: prompt and prefix tuning are not identical
    input-prepending procedures; inspect their location and evaluate quality and latency.'
- type: table
  title: Rough GPU memory to fine-tune a 7–8 B model
  header:
  - Approach
  - Weights
  - Other state
  - Indicative total
  rows:
  - - Full, 16-bit Adam
    - ≈ 15 GB
    - ≈ 100–110 GB
    - ≈ 120+ GB
  - - LoRA, 16-bit base
    - ≈ 15 GB
    - < 1 GB
    - ≈ 18–24 GB
  - - QLoRA, 4-bit base
    - ≈ 4–5 GB
    - < 1 GB
    - ≈ 7–12 GB
  callout: 'Illustrative only: activations, sequence, batch and implementation affect totals.'
  notes: 'Say: These are order-of-magnitude estimates students can reproduce. Sixteen-bit weights need two bytes per parameter,
    so about fifteen gigabytes for a seven-to-eight-billion-parameter model. Full fine-tuning with Adam in mixed precision needs
    roughly sixteen bytes per parameter in total for weights, gradients, master weights and optimizer states, well over a hundred
    gigabytes. LoRA keeps the base frozen, so gradients and optimizer states exist only for the tiny adapters. QLoRA shrinks
    the base to about half a byte per parameter. Activations add memory depending on sequence length and batch size, so always
    measure.


    Ask: Why does full fine-tuning need about 16 bytes per parameter?

    Answer: 16-bit weights and gradients (2 + 2 bytes), a 32-bit master copy (4) and two Adam states (8).

    Common mistake: Forgetting activations. They grow with sequence length and batch size.'
- type: bullets
  title: 'Knowledge distillation: big teacher, small student'
  icon: fa:FaChild
  bullets:
  - A smaller student imitates a larger teacher.
  - 'Targets: probabilities or generated examples.'
  - Test speed, quality and inherited errors.
  - Check data rights and provider terms.
  notes: 'Say: Distillation, from Hinton and colleagues in 2015, trains a small student model to reproduce a large teacher''s
    behaviour, either by matching its full output distributions, which carry more information than hard labels, or, for LLMs,
    by fine-tuning on answers generated by the teacher, sometimes called synthetic data. It is a key reason small models improved
    so fast. DeepSeek released versions of R1 distilled into small Qwen and Llama models. Two cautions: distillation inherits
    the teacher''s errors and biases, and many commercial API terms prohibit using outputs to develop competing models.


    Analogy: An apprentice learns by copying a master''s finished work.

    Ask: Why do a teacher''s full probabilities carry more information than hard labels?

    Answer: They show which wrong answers are nearly right, not just the winner.

    Common mistake: Ignoring provider terms. Many APIs forbid using outputs to build competing models.'
- type: section
  number: 5
  title: Domain adaptation in practice
  question: How do we fine-tune for a real domain and prove it worked?
  icon: fa:FaBriefcase
  notes: 'Say: The final section puts everything together for a domain-specific task: a workflow, the common pitfalls, real
    results from the lab notebook run on a banking customer-support task, evaluation and benchmarks, examples of domain models,
    and the responsible-AI issues specific to fine-tuning. The real results from the lab anchor the whole section, so leave
    time for questions on them. About twenty-five minutes.


    Analogy: Training examples are practice, validation selects settings, and the final test is the exam.

    Ask: Which prompt result must fine-tuning beat on the same held-out messages?

    Answer: The best prompting result on that test set.

    Common mistake: Treating lower training loss as better task performance.'
- type: flow
  title: A domain fine-tuning workflow
  steps:
  - label: Define task & metric
    sub: Task; metric; final test
  - label: Prepare data
    sub: Clean; split; template
  - label: Baseline
    sub: Best prompting result
  - label: LoRA SFT
    sub: Small steps; validate
    highlight: true
  - label: Evaluate & decide
    sub: Task, older abilities, safety, cost
  notes: 'Say: This workflow is what the project expects when a group fine-tunes. Create the held-out test set first and never
    train on it. Prepare and format data carefully. Establish the best prompting baseline on the same test set, because fine-tuning
    is only justified if it beats that baseline by a meaningful margin. Train with LoRA using conservative settings and watch
    the validation loss. Evaluate the task metric, check that general abilities have not collapsed, and compare cost and latency.
    Then decide whether to iterate, deploy or go back to prompting and retrieval.


    Ask: Why create the held-out test set first?

    Answer: So no training or prompt decision can see it.

    Common mistake: Skipping the prompting baseline.'
- type: cards
  title: Common pitfalls
  cards:
  - icon: fa:FaChartLine
    head: Overfitting
    text: Validation loss rises while training loss falls; test on new messages.
  - icon: fa:FaEraser
    head: Catastrophic forgetting
    text: The banking model may fail a general question; re-test old abilities.
  - icon: fa:FaTint
    head: Data leakage
    text: The same message in train and test inflates accuracy; remove overlap.
  - icon: fa:FaCode
    head: Template mismatch
    text: Train and serve with the same chat template, or replies look odd.
  - icon: fa:FaTachometerAlt
    head: Learning rate
    text: A rate that suits LoRA can wreck full fine-tuning; tune it on validation.
  - icon: fa:FaVial
    head: Weak evaluation
    text: Report the held-out test and read the errors, not the loss alone.
  notes: 'Say: Each pitfall is common in student projects. Overfitting is visible when validation loss rises while training
    loss falls. Catastrophic forgetting means the model loses abilities it had before; we demonstrate it in the lab by asking
    the banking model a general-knowledge question, and show that switching off the LoRA adapter restores the base behaviour.
    Data leakage is the most damaging because it produces impressive but false results. Chat-template mismatch produces odd
    outputs. Learning rates that are fine for LoRA can destroy a model in full fine-tuning. And evaluation must use the held-out
    set, not examples or losses.


    Ask: How do you spot overfitting during training?

    Answer: Validation loss rises while training loss keeps falling.

    Common mistake: Evaluating on training examples, or on loss alone.'
- type: figure
  title: 'Real results: prompting vs. LoRA fine-tuning (Banking77, 10 intents)'
  figure: results_bar
  bullets:
  - '{{RESULTS_SUMMARY}}'
  - Same base model, 200 test messages and greedy decoding.
  - Fine-tuning must beat the best prompt and earn its cost.
  stack: true
  notes: 'Say: Read the recorded table and its run settings: the same base model, 200 held-out messages and greedy decoding.
    {{RESULTS_SUMMARY}} {{RUN_NOTE}} Compare the best prompt, costs and errors. Analogy: compare learners using the same exam.
    Ask: would the gain justify training and maintenance for this workload? Answer: At high volume it often can, because a small
    fine-tuned model is cheap per message, but it must be retrained when the intents change. Common mistake: these results establish
    this experiment, not a universal fine-tuning benefit. Recheck safety and earlier abilities.'
- type: figure
  title: Real training curve
  figure: loss_curve
  bullets:
  - Training and validation losses fell in the stored run.
  - '{{ADAPTER_SIZE}}'
  - No clear loss warning here; inspect errors and older abilities.
  stack: true
  notes: 'Say: The recorded training and validation curves both fall. There is no clear loss-based overfitting
    warning in this run, but that alone cannot prove generalisation on every future input. Loss is averaged
    on completion tokens; watch actual held-out labels too. A saved adapter needs its matching base model
    and configuration. Analogy: practice and mock-exam marks are useful clues, but still take the final
    exam. Ask: what errors remain despite a low loss? Common mistake: a falling curve proves neither zero
    errors nor preserved general ability.'
- type: table
  title: Evaluating a fine-tuned model
  header:
  - What to check
  - How
  - Example
  rows:
  - - Task
    - Same test as the best prompt
    - Accuracy on the 200 held-out messages
  - - Earlier abilities
    - A general-question set
    - Capital of France? 2 + 2?
  - - Safety
    - Re-run refusal tests
    - Harmful request still refused
  - - Robustness
    - Rewording, typos, dates
    - '"lost my card" vs "card gone"'
  - - Time and cost
    - Tokens, seconds, memory
    - Seconds per message on the target machine
  - - People
    - Expert review with a rubric
    - A bank agent checks 50 replies
  notes: 'Say: Evaluation after fine-tuning must go beyond the task metric. Compare with the prompting baseline on the same
    test set, with margins of error from week 7. Check that general capabilities have not regressed. Re-run safety tests, because
    fine-tuning can weaken safety behaviour, as the next slides show. Test robustness to paraphrases and to data from a different
    period. Measure cost and latency, since they are often the reason for fine-tuning. For high-stakes domains, add expert review.
    Benchmarks are useful for the general-ability check, but the held-out domain test set is what decides.


    Ask: Why re-run safety tests after fine-tuning?

    Answer: Fine-tuning, even on harmless-looking data, can weaken refusal behaviour.

    Common mistake: Reporting only the task metric.'
- type: bullets
  title: 'Domain-specific models: build, adapt or retrieve?'
  icon: fa:FaIndustry
  bullets:
  - 'BloombergGPT: 50 B, financial and general training data (2023).'
  - Specialist examples can adapt a general model.
  - Compare prompting plus retrieval first.
  - Check sensitive-data rights and governance.
  notes: 'Say: The descriptor mentions domain-specific fine-tuning, and the business module mentions domain models such as BloombergGPT.
    BloombergGPT, released in 2023, was a fifty-billion-parameter model trained on a mix of financial and general data and did
    well on financial tasks at the time. Compare a general model plus retrieval with a specialist on the same domain test. Adapt
    a suitable general model when measured behaviour, format or cost gaps justify training. Domain data, in health, finance
    or law, is typically sensitive, so governance and privacy requirements shape what is possible.


    Ask: When would building a specialist model like BloombergGPT be worth it today?

    Answer: Rarely: only if a general model with retrieval or fine-tuning fails a measured domain test and the budget allows
    pre-training.

    Common mistake: Assuming domain data alone guarantees better results.'
- type: bullets
  title: 'Responsible AI lens: fine-tuning'
  icon: fa:FaBalanceScale
  bullets:
  - Re-test safety after training.
  - Remove sensitive records; check leakage.
  - Audit groups and labels.
  - Check licences and provider terms.
  - Document data, settings, results and limits.
  notes: 'Say: Fine-tuning creates a new model with new responsibilities. Qi and colleagues showed in 2023 that fine-tuning
    safety-aligned models, even on harmless-looking data, can substantially weaken their refusal behaviour, so safety evaluation
    must be repeated after fine-tuning. Models memorise training examples, which matters for personal data. Biased labels produce
    biased decisions, so evaluate performance across relevant groups. Licences and API terms may restrict fine-tuning or the
    use of outputs. And documentation, a model card for the adapter describing data, evaluation and limitations, is both good
    practice and increasingly a regulatory expectation.


    Ask: What should an adapter''s model card record?

    Answer: Its base model, training data and licence, settings, evaluation results and known limits.

    Common mistake: Fine-tuning on records that contain personal data. Models can memorise them.'
- type: lab
  title: 'Lab 8: LoRA fine-tuning for a banking domain task'
  steps:
  - Prepare ten intents; split datasets.
  - Measure zero-shot and few-shot.
  - Add rank 16 LoRA; count weights.
  - Train; watch validation.
  - Test and inspect errors.
  - Check older abilities; save adapter.
  runtime: GPU recommended. A full CPU run took about 84 min; prepare results before class
  deliverable: Notebook with baseline vs fine-tuned table, loss curve, error analysis and three written
    answers
  notes: 'Say: The lab implements the descriptor''s tutorial exactly: fine-tune a pre-trained LLM for a domain-specific task,
    apply parameter-efficient fine-tuning with LoRA and optionally QLoRA, and compare base with fine-tuned performance. The
    domain is banking customer support, using the public Banking77 dataset under a CC-BY licence. Students must use the held-out
    test set for all comparisons and interpret the differences with the statistics from week 7. The optional extensions cover
    QLoRA on a larger model and DPO preference tuning.


    Ask: Which test set compares the base model and the adapter?

    Answer: The same 200 held-out messages for every model.

    Common mistake: Comparing smoke-run scores. They use six messages and three training steps.'
- type: summary
  points:
  - Measure the best prompt first.
  - SFT learns desired answer tokens.
  - Templates and separate splits matter.
  - Preferences can train behaviour; inspect their source.
  - LoRA adds small paths; QLoRA compresses the base.
  - Re-test task, older abilities, safety and cost.
  notes: 'Say: Recap the six points. Students should be able to explain when to fine-tune, write the SFT and DPO losses, compute
    LoRA parameter counts, and describe an honest evaluation. Next week we open the multimodal half of the module: how models
    connect text with images, audio and video, starting with representation learning and contrastive models such as CLIP, which
    students met briefly in the diffusion lab''s CLIP score. The fine-tuning skills from today apply directly to multimodal
    models in week 10.


    Ask: What must a fine-tuned model beat to justify its cost?

    Answer: The best prompt on the same held-out test, by more than the margin of error.

    Common mistake: Reporting accuracy without the baseline or the test size.'
