slides:
- type: title
  figure: cover
  notes: 'In short: This week changes model weights on purpose, and asks when that is worth the cost.


    Explain: Fine-tuning continues training a pretrained model on new examples. Weights are the learned numbers inside the model.
    An adapter is a small set of added weights trained instead of all of them. LoRA is the adapter method used in the lab. Evaluation
    decides whether training beat the best prompt.


    Example: Last week, prompts routed student messages with fixed weights. This week the same Qwen2.5-0.5B model learns banking
    intents from labelled examples. A LoRA adapter of about {{W08_CORE_TRAINABLE_M}} million numbers changes its behaviour while
    the base weights stay frozen. Driving lessons are an analogy; practice changes habits, but a test still decides.


    Ask: What must a fine-tuned model beat before we keep it?


    Answer: The best prompt on the same held-out test, at an acceptable cost.


    Watch out: A falling training loss is not the same as a better result on the task.'
- type: outcomes
  notes: 'In short: Students leave able to choose an adaptation method, explain how training changes behaviour, and run a fair
    fine-tuning experiment.


    Explain: SFT means supervised fine-tuning on inputs paired with desired answers. Preference training learns from comparisons
    between two answers. LoRA trains small low-rank matrices beside frozen weights. A fair experiment compares methods on the
    same held-out test. These outcomes support MIMLOs 1, 3 and 4.


    Example: In the lab, the base model''s zero-shot and few-shot accuracy come first. Then a LoRA adapter trains on labelled
    banking messages and is tested on unseen messages. The comparison table, loss curve and saved adapter size form the evidence.
    Each outcome therefore ends in a measured number.


    Ask: Which outcome would a lower training loss alone fail to show?


    Answer: Fair evaluation: only held-out accuracy shows whether the adapter beats the best prompt.


    Watch out: LoRA decides which weights change; SFT, RLHF and DPO are objectives that say how they change.'
  items:
  - Choose prompting, retrieval or training
  - Explain SFT, preferences and LoRA
  - Fine-tune and evaluate fairly
- type: agenda
  icon: fa:FaRoute
  items:
  - title: 'Warm-up: prompt, retrieve or fine-tune?'
    minutes: 5
  - title: 1 · When to fine-tune
    minutes: 13
  - title: 2 · Supervised and instruction fine-tuning
    minutes: 20
  - title: '3 · Preference alignment: RLHF, DPO, RL for reasoning'
    minutes: 25
  - title: 4 · Parameter-efficient fine-tuning
    minutes: 25
  - title: 5 · Domain adaptation in practice
    minutes: 25
  - title: Lab preview and wrap-up
    minutes: 7
  notes: 'In short: The session moves from deciding whether to fine-tune, through training objectives, to cheap adapters and
    a fair domain test.


    Explain: Section one compares prompting, retrieval and fine-tuning. Section two explains supervised and instruction fine-tuning.
    Section three covers learning from preferences. Section four trains small adapters instead of all weights. Section five
    runs and evaluates a domain adaptation.


    Example: Week 7 measured prompts with fixed weights on routing tickets. Week 8 trains on labelled banking messages and compares
    against prompting baselines. Week 12 then adds retrieval for changing facts. A toolbox is an analogy, though here the tools
    are often combined rather than chosen once.


    Ask: Which week''s method suits facts that change every week?


    Answer: Retrieval, covered in week 12, because it supplies current sources without retraining.


    Watch out: Fine-tuning is not the default upgrade; it is one option to justify with evidence.'
- type: discussion
  title: Warm-up
  icon: fa:FaComments
  prompt: A bank wants (a) its brand voice, (b) this week's rates, (c) 50,000 cheap routings a day. Prompt, retrieve or fine-tune?
  points:
  - Changing facts?
  - Consistent behaviour?
  - Measured time and cost?
  notes: 'In short: Different needs call for different adaptation methods, and one assistant can need all three.


    Explain: Brand voice is a consistent style. Interest rates are facts that change weekly. Routing is a repeated classification
    at high volume. Retrieval suits changing facts. Fine-tuning can suit consistent behaviour or cheaper high-volume use.


    Example: The rates belong in retrieval, because training would be out of date next week. The brand voice may start as a
    prompt, with fine-tuning if prompts drift. Routing 50,000 messages with a long few-shot prompt resends the examples every
    time, so a small fine-tuned model can cut the cost. A shop is an analogy; it needs staff training, a price board and a sorting
    machine.


    Ask: Which need is the worst fit for fine-tuning, and why?


    Answer: This week''s interest rates; they change weekly, so retrieval keeps them current.


    Watch out: Estimate cost and accuracy before deciding; intuition about what is cheap is often wrong.'
- type: section
  number: 1
  title: When to fine-tune
  question: 'Prompting, retrieval or fine-tuning: what problem does each solve?'
  icon: fa:FaQuestionCircle
  notes: 'In short: Prompting, retrieval and fine-tuning solve different problems, so the first step is naming the problem.


    Explain: Prompting changes the input for one request. Retrieval adds relevant documents to the input. Fine-tuning changes
    weights using training examples. A behaviour gap is a repeated failure that good prompts cannot fix. A knowledge gap is
    missing or outdated facts.


    Example: A model that keeps writing "card arrival" instead of card_arrival has a format gap; examples or fine-tuning help.
    A model that does not know this week''s rate has a knowledge gap; retrieval helps. A model that is accurate but too slow
    and expensive may justify a smaller fine-tuned model.


    Ask: Predict: is a missing fact a behaviour gap or a knowledge gap?


    Answer: A knowledge gap; supply the fact through retrieval rather than training it in.


    Watch out: Fine-tuning on new facts can make a model more confident without making it more correct.'
- type: table
  title: Prompting vs. retrieval vs. fine-tuning
  header:
  - Method
  - Changes
  - Best first use
  rows:
  - - Prompt
    - The input
    - Task and format
  - - Retrieval
    - Input + sources
    - Changing facts
  - - Fine-tune
    - The weights
    - Persistent behaviour
  callout: Combine methods when evidence supports it.
  notes: 'In short: Each method changes something different: the input, the sources added to the input, or the weights.


    Explain: A prompt lists rules, labels and examples. Retrieval fetches documents and places them in the prompt. Fine-tuning
    trains on examples so behaviour persists without long prompts. Each has different up-front and per-request costs. Methods
    can be combined in one system.


    Example: For banking routing, a prompt can list the ten intents with examples. Retrieval can fetch this week''s interest
    rates for answers. Fine-tuning can make a small model route 50,000 messages a day with a short prompt. One assistant can
    use all three for different parts of its job.


    Ask: Which method has the highest up-front cost but the shortest prompt per request?


    Answer: Fine-tuning; training costs time once, then requests need no long list of examples.


    Watch out: A fine-tuned model still needs an input format at inference, and it must match training.'
- type: figure
  title: A decision process
  figure: decision
  notes: 'In short: The decision process tries the cheapest fix first and moves to training only when measured gaps remain.


    Explain: Start with a strong prompt and a test set. If facts are missing or change, add retrieval. If behaviour gaps persist,
    consider fine-tuning. Each branch ends with a measured comparison on the same test. Cost and data rights can stop a branch
    early.


    Example: Suppose a routing prompt reaches 85% on held-out messages, but the target is 95% at lower cost. Facts are not the
    problem, so retrieval will not help. Labelled messages exist and may be used, so a LoRA experiment is justified. If it reaches
    only 86%, keep the prompt.


    Ask: When should you stop before fine-tuning even if accuracy is too low?


    Answer: When you lack rights to the data, a separate test set or a measured problem to fix.


    Watch out: The decision depends on measurements; repeat it when the model or the data changes.'
- type: compare
  title: Good and bad reasons to fine-tune
  columns:
  - head: Good reasons
    points:
    - Gaps persist after good prompts
    - Labelled data and a test set
    - Measured saving at volume
  - head: Bad reasons
    points:
    - Facts that change
    - No measured problem
    - No data rights or test set
  notes: 'In short: Fine-tune for persistent, measured gaps with usable data, not for changing facts or untested hunches.


    Explain: A persistent gap survives the best prompt you can write. Labelled examples are inputs with known correct answers.
    A separate test set measures improvement fairly. A measured saving compares cost per request before and after. Data rights
    mean permission to use the examples for training.


    Example: The stored lab run had 1,216 labelled Banking77 training messages and a separate 200-message test. That makes fine-tuning
    a fair experiment. A team wanting the model to know its latest prices has a changing-facts problem instead. A team with
    no test set cannot tell whether training helped.


    Ask: Is "everyone else fine-tunes" a good reason?


    Answer: No. Only a measured gap, usable data and a fair test justify the cost.


    Watch out: Data collected for one purpose may not be licensed or consented for training.'
- type: section
  number: 2
  title: Supervised and instruction fine-tuning
  question: How do we teach a model what good outputs look like?
  icon: fa:FaChalkboardTeacher
  notes: 'In short: Supervised fine-tuning teaches a model by showing inputs together with the answers we want.


    Explain: Supervised means each example has a known target. The input is the prompt; the target is the desired answer. Training
    raises the probability of the target tokens. Instruction tuning applies this to many different tasks. The chat template
    formats each example as a conversation.


    Example: The input "I lost my card!" has the target lost_or_stolen_card. The model reads the input and is scored only on
    the answer tokens. After many such pairs, it routes similar messages without examples in the prompt. A teacher marking only
    the final answer is an analogy, though the model also learns the answer''s exact wording.


    Ask: Predict: are the prompt tokens part of the loss?


    Answer: Usually not; they are read as context, and the loss is computed on the answer tokens.


    Watch out: Train and test with the same template, or the model sees an unfamiliar format.'
- type: compare
  title: Full fine-tuning vs. supervised fine-tuning (SFT)
  columns:
  - head: Full fine-tuning
    points:
    - All weights change
    - More optimiser memory
    - Re-test older abilities
  - head: Supervised fine-tuning (SFT)
    points:
    - Inputs with desired answers
    - Full weights or adapters
    - Loss on answer tokens
  notes: 'In short: "Full fine-tuning" says which weights change; "SFT" says what kind of examples and loss are used.


    Explain: Full fine-tuning updates every weight. SFT trains on input–answer pairs with a supervised loss. SFT can update
    all weights or only adapters. The optimiser stores extra numbers for every trainable weight. More trainable weights mean
    more memory and more risk of forgetting.


    Example: The lab does SFT with LoRA: about {{W08_CORE_TRAINABLE_M}} million adapter numbers train, while about 494 million
    base weights stay frozen. Full SFT of the same model would train all of them and need far more optimiser memory. A building
    is an analogy; renovation versus a removable extension.


    Ask: Can SFT and LoRA be used together?


    Answer: Yes. SFT is the training objective; LoRA decides which parameters that objective updates.


    Watch out: Do not call every fine-tuning SFT; preference methods such as DPO use a different loss.'
- type: equation
  title: 'The SFT loss: next-token prediction on the answer'
  eq: \mathcal{L}_{\mathrm{SFT}}(\theta) = -\sum_{(x, y)} \;\; \sum_{t=1}^{|y|} \, \log p_\theta\left(y_t \mid x, y_{<t}\right)
  read_as:
  - Read prompt x and known answer y.
  - Raise each answer-token probability.
  - Prompt tokens are read, not scored.
  terms:
  - - $\theta$
    - trained weights
  - - x
    - prompt
  - - $y_t$
    - answer token t
  - - $y_{<t}$
    - earlier answer tokens
  notes: 'In short: SFT minimises the negative log-probability of the correct answer tokens, given the prompt and earlier answer
    tokens.


    Explain: θ is the set of trained numbers. x is the prompt and y is the known answer. y_t is the answer token at position
    t. The log turns multiplied probabilities into added scores. The minus sign makes higher probability give lower loss.


    Example: Suppose the answer lost_or_stolen_card is three tokens with probabilities 0.5, 0.8 and 0.9. The loss is −(ln 0.5
    + ln 0.8 + ln 0.9) ≈ 0.69 + 0.22 + 0.11 = 1.02. Training pushes each probability towards 1, so the loss falls towards 0.


    Ask: What happens to the loss if the first token''s probability rises from 0.5 to 0.9?


    Answer: Its term drops from about 0.69 to 0.11, so the total falls to about 0.43.


    Watch out: An answer can span several tokens even when it looks like one word.'
- type: bullets
  title: 'Instruction tuning: from base model to assistant'
  bullets:
  - Instruction–answer pairs across tasks.
  - Test on new tasks.
  - Match the chat template.
  notes: 'In short: Instruction tuning turns a base model that continues text into an assistant that follows requests.


    Explain: A base model is trained only to predict the next token of ordinary text. Instruction tuning trains on many instruction–answer
    pairs across tasks. The goal is general instruction following, not one task. Quality and variety of examples matter more
    than sheer volume. New tasks test whether the skill generalises.


    Example: Asked "Write three tips for revising", a base model may continue with more forum questions. The instruction-tuned
    version answers with three tips. LIMA (2023) showed that 1,000 carefully curated examples gave strong instruction following
    on a 65-billion-parameter model.


    Ask: Why test an instruction-tuned model on tasks absent from its training set?


    Answer: To check general instruction following rather than memorised task formats.


    Watch out: Instruction tuning shapes behaviour; it does not reliably add new facts.'
  visual:
    type: example_strip
    items:
    - label: Base model
      text: Continues the text
    - label: Instruction-tuned
      text: Answers the request
- type: code
  title: What a chat template produces (Qwen family)
  code: "messages = [\n    {\"role\": \"system\", \"content\": \"Name the intent.\"},\n    {\"role\": \"user\", \"content\"\
    : \"Card lost!\"},\n    {\"role\": \"assistant\", \"content\": \"lost_or_stolen_card\"},\n]\nprint(tok.apply_chat_template(messages,\
    \ tokenize=False))\n\n# <|im_start|>system\n# Name the intent.<|im_end|>\n# <|im_start|>user\n# Card lost!<|im_end|>\n#\
    \ <|im_start|>assistant\n# lost_or_stolen_card<|im_end|>\n"
  bullets:
  - Serve with this template.
  notes: 'In short: A chat template turns role-tagged messages into one token sequence with markers the model learned in training.


    Explain: Each message has a role and content. The template adds special tokens such as <|im_start|> and <|im_end|>. These
    mark where each turn begins and ends. The tokenizer stores the template for its model family. Using a different template
    at inference confuses the model.


    Example: For Qwen, the user turn becomes <|im_start|>user, the message, then <|im_end|>. The assistant turn holds the label
    lost_or_stolen_card. During SFT only that final assistant content is scored. Other families, such as Llama and Gemma, use
    different markers.


    Ask: What goes wrong if you train with one template and serve with another?


    Answer: The model meets unfamiliar markers, so replies can ramble or ignore the format.


    Watch out: Without a system message, Qwen''s template inserts a default one; print the formatted text to check.'
- type: cards
  title: 'Data preparation: where most of the quality comes from'
  cards:
  - head: Quality
    text: Correct, consistent labels
  - head: Diversity
    text: Real wording and typos
  - head: Clean splits
    text: No overlap across sets
  - head: Privacy and rights
    text: Remove personal data
  - head: Balance
    text: Enough per label
  - head: Document
    text: Sources, filters, gaps
  notes: 'In short: Most fine-tuning quality comes from the examples, so data preparation deserves more time than training.


    Explain: Quality means each label is correct and consistently applied. Diversity covers the real range of wording, including
    typos and long messages. Clean splits keep near-duplicates out of the test set. Balance gives each label enough examples.
    A datasheet documents sources, filters and known gaps.


    Example: If annotators label "card not here yet" as card_arrival on Monday and activate_my_card on Tuesday, the model learns
    noise. If the same message appears in training and test, accuracy looks higher than it is. Banking77 averages about 130
    training messages per intent, enough for a small adapter.


    Ask: Why remove near-duplicates across training and test splits?


    Answer: Otherwise the test rewards memorisation and overstates accuracy on genuinely new messages.


    Watch out: Personal data in training examples can be memorised and later reproduced.'
- type: section
  number: 3
  title: 'Preference alignment: RLHF, DPO and RL for reasoning'
  question: How can comparisons between two answers guide further training?
  icon: fa:FaThumbsUp
  notes: 'In short: Preference training uses comparisons between two answers to steer behaviour beyond what single target answers
    show.


    Explain: A preference pair holds a prompt, a preferred answer and a rejected answer. People or models produce the comparisons.
    RLHF trains a reward model on pairs, then optimises the policy with RL. DPO trains directly on the pairs. Verifiable rewards
    replace preferences with automatic checks.


    Example: For "Explain my card fee", answer A is accurate and polite; answer B is curt. A rater prefers A. Thousands of such
    pairs teach tone and helpfulness that are hard to write as single labels. Choosing between two drafts is the analogy, but
    preference is not the same as truth.


    Ask: Predict: does a preferred answer have to be correct?


    Answer: No. Raters may prefer confident or agreeable answers, so correctness still needs checking.


    Watch out: Preference data reflects the raters and guidelines that produced it.'
- type: figure
  title: Reinforcement learning from human feedback (RLHF)
  figure: rlhf
  notes: 'In short: RLHF has three stages: supervised fine-tuning, a reward model trained on comparisons, and reinforcement
    learning against that reward.


    Explain: Stage one fine-tunes on demonstrations. Stage two trains a reward model to predict which answer people prefer.
    Stage three samples answers and updates the policy to raise reward. PPO is the RL algorithm used in InstructGPT. A KL penalty
    keeps the policy close to the starting model.


    Example: InstructGPT (2022) used this pipeline; labelers preferred outputs of the 1.3-billion-parameter InstructGPT model
    over the 175-billion-parameter GPT-3. ChatGPT was built with similar methods. The cost is high: people for comparisons,
    plus several models in memory during RL.


    Ask: Why keep the policy close to the starting model?


    Answer: Without the penalty, it can exploit the reward model with odd text that scores well.


    Watch out: The reward model is itself learned and imperfect; optimising it too hard causes reward hacking.'
- type: equation
  title: The reward model and the RL objective
  eq:
  - \mathcal{L}_{\mathrm{RM}} = -\log \sigma\left(r_\phi(x, y_w) - r_\phi(x, y_l)\right)
  - \max_{\pi_\theta} \; \mathbb{E}_{y \sim \pi_\theta(\cdot \mid x)}\left[r_\phi(x, y)\right] - \beta\,
    D_{\mathrm{KL}}\left(\pi_\theta(\cdot \mid x) \,\|\, \pi_{\mathrm{ref}}(\cdot \mid x)\right)
  read_as:
  - 'Reward model: score preferred answers higher.'
  - 'Policy: maximise reward, minus a KL drift penalty.'
  terms:
  - - $y_w$ / $y_l$
    - preferred / rejected
  - - $r_\phi$
    - reward model
  - - $\pi_\theta$ / $\pi_{\mathrm{ref}}$
    - trained / starting
  - - $\beta$
    - penalty strength
  panel_h: 2.2
  notes: 'In short: The reward model learns to score preferred answers higher, and the policy then maximises reward while staying
    near its start.


    Explain: r_φ is the reward model, a network that outputs one score. σ is the sigmoid function, which maps any number to
    between 0 and 1. The first loss is small when the preferred answer scores higher. The second line maximises expected reward.
    The KL term measures how far the policy drifts from the reference.


    Example: If r(x, y_w) = 2 and r(x, y_l) = 0, then σ(2) ≈ 0.88 and the loss is −ln 0.88 ≈ 0.13. If the scores were reversed,
    σ(−2) ≈ 0.12 and the loss would be about 2.13. β then trades reward against drift.


    Ask: What does a larger β do?


    Answer: It penalises drift more, so the policy stays closer to the reference model.


    Watch out: The KL penalty limits drift; it does not guarantee safe or truthful outputs.'
- type: equation
  title: Direct Preference Optimisation (DPO)
  eq: \mathcal{L}_{\mathrm{DPO}} = -\log \sigma\left(\beta \log \dfrac{\pi_\theta(y_w \mid x)}{\pi_{\mathrm{ref}}(y_w
    \mid x)} - \beta \log \dfrac{\pi_\theta(y_l \mid x)}{\pi_{\mathrm{ref}}(y_l \mid x)}\right)
  read_as:
  - Use preferred and rejected replies to one prompt.
  - Compare probabilities against a fixed reference.
  - 'Train directly: no reward model, no RL loop.'
  terms:
  - - $\pi_\theta$
    - model being trained
  - - $\pi_{\mathrm{ref}}$
    - fixed reference model
  - - $\beta$
    - penalty strength
  notes: 'In short: DPO trains directly on preference pairs by raising the preferred answer''s probability relative to a fixed
    reference model.


    Explain: π_θ is the model being trained. π_ref is a frozen copy of the starting model. Each log ratio measures how much
    training has changed an answer''s probability. The loss rewards a larger ratio for the preferred answer. β is the drift-penalty
    strength from RLHF; it scales the difference.


    Example: Suppose training raises the preferred answer''s log ratio to 0.5 and lowers the rejected one to −0.5. With β =
    0.1, the inside is 0.1 × (0.5 − (−0.5)) = 0.1, σ(0.1) ≈ 0.52, and the loss is about 0.64. Larger gaps push the loss towards
    zero.


    Ask: Why compare against a reference model instead of raw probabilities?


    Answer: It measures change from the start, which stops the model drifting far for small gains.


    Watch out: DPO still needs good preference data; it removes the reward model and RL loop, not the data.'
- type: compare
  title: Three ways to learn from feedback
  columns:
  - head: RLHF (PPO)
    points:
    - Rankings train a reward model
    - PPO updates the policy
    - InstructGPT
  - head: DPO
    points:
    - Pairs give a direct loss
    - No reward model or RL loop
    - Zephyr
  - head: Verifiable rewards
    points:
    - Automatic checks
    - GRPO compares samples
    - DeepSeek-R1
  notes: 'In short: RLHF, DPO and verifiable-reward RL all learn from feedback, but differ in where the signal comes from.


    Explain: RLHF uses human rankings to train a reward model, then PPO. DPO turns ranked pairs directly into a loss. Verifiable
    rewards come from automatic checks, such as a correct maths answer or passing tests. GRPO compares several sampled answers
    to the same prompt. Each suits a different kind of task.


    Example: InstructGPT used RLHF with PPO. Zephyr-7B used DPO on AI-ranked preference pairs. DeepSeek-R1 used GRPO with rule-based
    rewards on maths and code, where answers can be checked automatically. A tutor, a ranking of drafts and an automatic marker
    are the three analogies.


    Ask: Which approach suits a coding task with unit tests?


    Answer: RL with verifiable rewards, because passing tests is an automatic, checkable signal.


    Watch out: A verifiable reward only checks what the test measures; it can still reward shortcuts.'
- type: bullets
  title: AI feedback, and what can go wrong
  bullets:
  - AI feedback scales ranking.
  - Reward hacking games the score.
  - Check raters and rubric.
  notes: 'In short: AI feedback makes preference data cheaper, but every feedback signal can be gamed or biased.


    Explain: RLAIF replaces human raters with an AI model. Constitutional AI asks a model to critique answers against written
    principles. Reward hacking means raising the score without achieving the intended goal. Sycophancy means agreeing with the
    user against the evidence. The rubric and raters decide what gets rewarded.


    Example: If the reward model likes longer answers, the policy learns to pad replies. If raters prefer agreement, the model
    learns to confirm a user''s false claim. Anthropic''s Constitutional AI work (2022) generated feedback from principles such
    as avoiding harmful advice.


    Ask: How could you detect reward hacking?


    Answer: Compare reward scores with independent checks, such as human review or task accuracy, on held-out prompts.


    Watch out: An AI rater can pass its own biases on to the trained model.'
  visual:
    type: mini_table
    header:
    - Method
    - Signal
    rows:
    - - RLAIF
      - AI-model ratings
    - - Constitutional AI
      - Written principles
- type: quiz
  question: Main practical advantage of DPO over PPO-based RLHF?
  options:
  - Needs no preference data
  - Works only on images
  - Always beats PPO
  - No reward model or RL loop
  answer: 3
  notes: 'In short: DPO''s practical advantage is simplicity: it trains from preference pairs without a reward model or an RL
    loop.


    Explain: PPO-based RLHF needs a reward model, sampling and several models in memory. DPO uses the same pairs with a direct
    loss. It still needs a reference model and good preference data. Results vary by task and data. Simpler training is easier
    to run and debug.


    Example: An RLHF run may keep a policy, a reference model, a reward model and a value model in memory. DPO keeps only the
    policy and the frozen reference. That reduction is one reason many open chat models adopted DPO.


    Ask: Which option is correct?


    Answer: D. DPO needs no separate reward model or RL loop, though it still needs preference pairs.


    Watch out: Simpler does not mean always better; compare on your own evaluation.'
- type: section
  number: 4
  title: Parameter-efficient fine-tuning (PEFT)
  question: How can we train a small part of a large model to reduce GPU memory use?
  icon: fa:FaCompressArrowsAlt
  notes: 'In short: Parameter-efficient fine-tuning trains a small number of new parameters while the base weights stay frozen.


    Explain: PEFT is a family of methods that train small additions. Frozen weights do not change during training. Fewer trainable
    weights mean less gradient and optimiser memory. Adapters can be saved separately and swapped. LoRA is the most widely used
    PEFT method.


    Example: Full fine-tuning of a 7-billion-parameter model with Adam in 16-bit needs more than 100 GB of GPU memory. LoRA
    on the same model can fit in about 18–24 GB, and QLoRA in about 7–12 GB. The lab''s adapter trains about {{W08_CORE_TRAINABLE_PCT}}
    of Qwen''s weights.


    Ask: Predict: does freezing weights reduce the memory needed for the weights themselves?


    Answer: No. Frozen weights still sit in memory; the savings come from gradients and optimiser state.


    Watch out: Activations for long sequences can dominate memory even with LoRA.'
- type: figure
  title: 'LoRA: learn a low-rank update'
  figure: lora
  notes: 'In short: LoRA adds a trainable low-rank path beside a frozen weight matrix and sums the two outputs.


    Explain: W is the frozen pretrained weight matrix. A projects the input down to r numbers. B projects those r numbers back
    up to the output size. The input x goes through both paths in parallel. Their outputs are added, so W never changes.


    Example: For an 8-input, 8-output projection, W has 64 entries. With rank r = 2, A is [2, 8] and B is [8, 2], giving 32
    trainable entries. B starts at zero, so training begins exactly at the pretrained behaviour. A dimmer fitted beside a light
    switch is an analogy; it adjusts the output without rewiring the switch.


    Ask: Why does B start at zero?


    Answer: Then BA = 0, so the model initially behaves exactly like the pretrained model.


    Watch out: The adapter takes the same input x as W, not W''s output.'
- type: equation
  title: LoRA in equations
  eq:
  - h = W x + \frac{\alpha}{r} B A x, \qquad B \in \mathbb{R}^{d \times r},\; A \in \mathbb{R}^{r \times
    k},\; r \ll \min(d, k)
  - '\#\mathrm{params}: \; r(d + k) \;\; \mathrm{vs.} \;\; d \cdot k'
  read_as:
  - 'W: 4096×4096.'
  - 'Rank 16: 131,072 weights.'
  - 'Scale: α/r.'
  terms:
  - - h / x
    - output / input
  - - W / A / B
    - base / adapters
  - - d / k
    - 'widths: output / input'
  - - r / α
    - rank / scale
  panel_h: 2.0
  notes: 'In short: LoRA''s output is the frozen projection plus a scaled low-rank correction, and its count grows with r(d
    + k) instead of d·k.


    Explain: d is the output size and k is the input size. A has shape [r, k] and B has shape [d, r]. The rank r is much smaller
    than d and k. The scale α/r sets how strongly the correction counts. After training, BA can be merged into W.


    Example: For a 4096 × 4096 projection, W has 16,777,216 values. Rank 16 adds 16 × (4096 + 4096) = 131,072 values, under
    1% of W. With α = 32 and r = 16, the scale is 2.


    Ask: How many LoRA values does rank 8 add to that 4096 × 4096 projection?


    Answer: 8 × (4096 + 4096) = 65,536, half the rank-16 count.


    Watch out: Merging removes the adapter''s runtime cost but also its easy on and off switch.'
- type: figure
  title: How many weights does LoRA train? (the lab model)
  figure: param_compare
  bullets:
  - '{{LORA_PARAMS}}'
  - 'Lab CPU core, rank {{W08_CORE_RANK}}: {{W08_CORE_TRAINABLE}} ({{W08_CORE_TRAINABLE_PCT}}).'
  - Memory also holds frozen weights.
  stack: true
  notes: 'In short: In the stored lab run, LoRA trained under half a percent of the model''s parameters.


    Explain: Trainable parameters are those the optimiser updates. The base model''s weights stay frozen. The count depends
    on the rank and the target modules. Qwen2.5-0.5B has 24 layers with four attention projections each. Grouped-query attention
    makes its key and value projections smaller.


    Example: {{LORA_PARAMS}} Each layer adds r × 5,632 values, because q and o map 896 to 896 while k and v map 896 to 128.
    With r = 16 that is 90,112 per layer, times 24 layers. The CPU core uses r = {{W08_CORE_RANK}}, so it trains half as many:
    {{W08_CORE_TRAINABLE}}.


    Ask: Why are the k and v adapters smaller than the q and o adapters?


    Answer: Their output size is 128 rather than 896, so r(d + k) is smaller.


    Watch out: Trainable count is not total memory; frozen weights and activations still need space.'
- type: bullets
  title: 'QLoRA: fine-tune on top of a 4-bit model'
  bullets:
  - Frozen base stored in 4-bit.
  - LoRA paths train in higher precision.
  - Measure memory and speed.
  notes: 'In short: QLoRA trains LoRA adapters on top of a base model whose frozen weights are stored in 4-bit form.


    Explain: Quantisation stores numbers with fewer bits. NF4 is a 4-bit format designed for normally distributed weights. Double
    quantisation also compresses the scaling constants. Paged optimisers move optimiser state to CPU memory during spikes. Gradients
    flow through the dequantised weights into the LoRA paths.


    Example: The QLoRA paper (2023) fine-tuned a 65-billion-parameter model on one 48 GB GPU. A 7-billion-parameter model needs
    about 4–5 GB for 4-bit weights instead of about 15 GB in 16-bit. The trade-off is extra computation to dequantise.


    Ask: Which parts of QLoRA stay in higher precision?


    Answer: The trainable LoRA matrices and the computation; only the frozen base is stored in 4-bit.


    Watch out: QLoRA needs a supported GPU library; it is a stretch topic, not the CPU core.'
  visual:
    type: mini_table
    header:
    - Idea
    - Purpose
    rows:
    - - NF4
      - 4-bit weight format
    - - Double quantisation
      - Smaller scales
    - - Paged optimiser
      - Absorb memory spikes
- type: table
  title: Parameter-efficient methods compared
  header:
  - Method
  - Trains
  - Watch
  rows:
  - - LoRA
    - Low-rank paths
    - Rank; layers
  - - QLoRA
    - LoRA on 4-bit base
    - Speed
  - - Adapters
    - Bottleneck layers
    - Latency
  - - Prompt tuning
    - Input vectors
    - Quality
  - - Prefix tuning
    - Per-layer prefixes
    - Quality
  - - Full
    - Every weight
    - Memory; forgetting
  notes: 'In short: PEFT methods differ in where they add trainable parameters and what they cost at inference.


    Explain: LoRA adds low-rank paths beside existing weights. QLoRA applies LoRA to a 4-bit base. Adapter layers insert small
    bottleneck networks between layers. Prompt tuning learns vectors placed before the input. Prefix tuning learns key and value
    prefixes for every layer.


    Example: Prompt tuning with 20 learned vectors of width 896 trains 17,920 numbers, far fewer than LoRA. Adapter layers add
    computation at inference, while merged LoRA adds none. Full fine-tuning of all Qwen weights is the expensive baseline.


    Ask: Which method adds no inference cost after merging?


    Answer: LoRA, because BA can be added into W once training ends.


    Watch out: The fewest trainable parameters do not guarantee the best task accuracy.'
- type: table
  title: Rough GPU memory to fine-tune a 7–8 B model
  header:
  - Approach
  - Weights
  - Total
  rows:
  - - Full, 16-bit Adam
    - ≈ 15 GB
    - ≈ 120+ GB
  - - LoRA, 16-bit base
    - ≈ 15 GB
    - ≈ 18–24 GB
  - - QLoRA, 4-bit base
    - ≈ 4–5 GB
    - ≈ 7–12 GB
  callout: Illustrative; measure your setup.
  notes: 'In short: Rough memory estimates show why LoRA and QLoRA make fine-tuning a 7–8 billion-parameter model practical
    on one GPU.


    Explain: Weights in 16-bit use two bytes each. Adam stores two extra numbers per trainable weight, often in 32-bit. Gradients
    add another copy for trainable weights. LoRA keeps gradients and optimiser state only for the small adapters. QLoRA also
    shrinks the frozen weights to about half a byte each.


    Example: A 7.5-billion-parameter model in 16-bit needs about 15 GB for its weights. Full fine-tuning adds gradients and
    Adam state, passing 100 GB. LoRA needs those 15 GB plus a little for adapters and activations. QLoRA brings the weights
    to about 4–5 GB.


    Ask: Where does most of full fine-tuning''s memory go?


    Answer: To gradients and optimiser state for every weight, not to the weights themselves.


    Watch out: These are indicative; sequence length, batch size and implementation change real totals.'
- type: bullets
  title: 'Knowledge distillation: big teacher, small student'
  bullets:
  - Student imitates a larger teacher.
  - 'Targets: probabilities or examples.'
  - Check quality, speed and rights.
  notes: 'In short: Knowledge distillation trains a small student model to imitate a larger teacher model.


    Explain: The teacher is a large, capable model. The student is smaller and cheaper to run. Soft targets are the teacher''s
    full probability distributions. Hard targets are the teacher''s chosen outputs used as labels. The student inherits the
    teacher''s errors as well as its skills.


    Example: A large model labels 10,000 unlabelled banking messages. A 0.5-billion-parameter student then fine-tunes on those
    labels and runs far faster. If the teacher confuses card_arrival with activate_my_card, the student learns that confusion
    too.


    Ask: What must you check before distilling from a commercial model?


    Answer: The provider''s terms, because some forbid using outputs to train competing models.


    Watch out: Test the student on human-labelled data, not only on teacher labels.'
  visual:
    type: example_strip
    items:
    - label: Teacher
      text: Large model labels messages
    - label: Student
      text: Small model learns the labels
- type: section
  number: 5
  title: Domain adaptation in practice
  question: How do we fine-tune for a real domain and prove it worked?
  icon: fa:FaBriefcase
  notes: 'In short: Domain adaptation applies the whole process: define the task, prepare data, set baselines, train and evaluate
    fairly.


    Explain: A domain is a specialised area, such as banking or law. The task metric is decided before training. The final test
    set stays untouched until the end. Baselines come from the best prompting methods. Evaluation covers task accuracy, older
    abilities, safety and cost.


    Example: In the lab, the task is routing banking messages to intents, measured by accuracy on held-out messages. Zero-shot
    and few-shot prompts set the baselines. A LoRA adapter trains on separate training messages. All three are scored with the
    same parser.


    Ask: Predict: which baseline is hardest for the adapter to beat?


    Answer: Usually the few-shot prompt, because its examples already show the labels and format.


    Watch out: Choosing settings by reading test errors turns the test into training data.'
- type: flow
  title: A domain fine-tuning workflow
  steps:
  - label: Define task
    sub: Metric; final test
    role: tool
  - label: Prepare data
    sub: Clean; split
    role: data
  - label: Baseline
    sub: Best prompt
    role: metric
  - label: LoRA SFT
    sub: Watch validation
    role: model
  - label: Evaluate
    sub: Task, safety, cost
    role: output
  notes: 'In short: A domain fine-tuning workflow fixes the metric and test first, then trains only if the baseline leaves a
    gap.


    Explain: Defining the task names the inputs, outputs and metric. Preparing data cleans, splits and formats examples. The
    baseline is the best prompting result. LoRA SFT trains adapters while validation loss is watched. Evaluation decides whether
    the gain justifies the cost.


    Example: The stored run trained on 1,216 Banking77 messages for one epoch and tested on 200 held-out messages. The few-shot
    baseline set the bar to beat. Validation loss was checked during training, and the test was used once at the end.


    Ask: Why fix the metric before training?


    Answer: Choosing the metric after seeing results lets you pick whichever number looks best.


    Watch out: Skipping the baseline makes any trained result look like progress.'
  arrows:
  - metric
  - splits
  - score to beat
  - adapter
- type: cards
  title: Common pitfalls
  cards:
  - head: Overfitting
    text: Validation loss rises
  - head: Forgetting
    text: General answers degrade
  - head: Leakage
    text: Test items in training
  - head: Template mismatch
    text: Train and serve differ
  - head: Learning rate
    text: Too high destabilises
  - head: Weak evaluation
    text: Loss without a test
  notes: 'In short: Most fine-tuning failures come from data, settings or evaluation, not from the model architecture.


    Explain: Overfitting means fitting training examples while new examples get worse. Catastrophic forgetting means losing
    earlier abilities. Leakage means test examples or near-copies appear in training. A template mismatch formats training and
    serving differently. A learning rate that is too high destabilises training.


    Example: If training loss falls from 1.2 to 0.4 while validation loss rises from 0.9 to 1.3, the model is memorising. If
    accuracy jumps to 100% on a test that shares messages with training, check for leakage before celebrating.


    Ask: Which pitfall does an adapter on-and-off test help detect?


    Answer: Forgetting, because the same general question can be compared with and without the adapter.


    Watch out: A single impressive test result is more often a pitfall than a breakthrough.'
- type: figure
  title: 'Real results: prompting vs. LoRA fine-tuning (Banking77, 10 intents)'
  figure: results_bar
  bullets:
  - '{{RESULTS_SUMMARY}}'
  - 'Stored CPU run: same model and test.'
  - Fine-tuning must beat the best prompt.
  stack: true
  notes: 'In short: In the stored full run, few-shot prompting helped a lot, and the LoRA adapter helped further on the same
    test.


    Explain: All three rows use the same base model and the same 200 held-out messages. Greedy decoding removes sampling randomness.
    Invalid means no recognised intent in the reply. The few-shot prompt is the strongest baseline. The adapter must beat it
    to justify training.


    Example: {{RESULTS_SUMMARY}} With 200 messages, each message is 0.5 percentage points. Your CPU core measured {{W08_CORE_COMPARISON}}
    on {{W08_CORE_N_TEST}} messages.


    Ask: How do you turn an accuracy gain into a number of messages?


    Answer: Divide the percentage-point gain by the points per message: 0.5 here, so a 10-point gain is 20 messages.


    Watch out: Higher task accuracy does not show that older abilities or safety survived.'
- type: figure
  title: Real training curve
  figure: loss_curve
  bullets:
  - Both losses fell in the stored run.
  - '{{ADAPTER_SIZE}}'
  - Also inspect errors and older abilities.
  stack: true
  notes: 'In short: The stored run''s loss curves fell together, which is consistent with learning rather than memorising.


    Explain: Training loss is measured on the batches being trained. Validation loss is measured on separate examples without
    updates. Both use the answer-token loss. A widening gap suggests overfitting. The saved adapter contains only the LoRA weights
    and configuration.


    Example: {{ADAPTER_SIZE}} The adapter is small because it stores about two million 32-bit numbers. To use it, load the exact
    base model and attach the adapter.


    Ask: Does a falling validation loss prove high test accuracy?


    Answer: No. It is encouraging evidence; only the held-out test measures task accuracy.


    Watch out: An adapter is useless without the exact base model it was trained on.'
- type: table
  title: Evaluating a fine-tuned model
  header:
  - Check
  - How
  rows:
  - - Task
    - Same test as best prompt
  - - Older abilities
    - General questions
  - - Safety
    - Re-run refusal tests
  - - Robustness
    - Rewording, typos
  - - Cost
    - Seconds per message
  - - People
    - Expert rubric review
  notes: 'In short: Evaluating a fine-tuned model means checking the task, older abilities, safety, robustness, cost and expert
    judgement.


    Explain: The task check uses the same test as the best prompt. Older abilities are checked with general questions. Safety
    tests re-run harmful requests that should be refused. Robustness checks rewordings, typos and new time periods. Cost covers
    time, memory and tokens per message.


    Example: The lab asks one general question with the adapter on and off. A banking adapter might answer "What is the capital
    of France?" with an intent label. A real release would use a set of general questions, a refusal test suite and a bank agent
    reviewing 50 replies.


    Ask: Why re-run safety tests after a fine-tune on harmless data?


    Answer: Research has shown that fine-tuning, even on benign data, can weaken refusals.


    Watch out: One general question illustrates forgetting; it does not measure it.'
- type: bullets
  title: 'Domain-specific models: build, adapt or retrieve?'
  bullets:
  - Compare prompting plus retrieval first.
  - Adapt only for measured gaps.
  - Check data rights and governance.
  notes: 'In short: Organisations can build a domain model, adapt a general one, or add retrieval, and the cheapest adequate
    option should win.


    Explain: Building means pre-training on domain and general text. Adapting means fine-tuning a general model on domain examples.
    Retrieval supplies domain documents at request time. Each needs a domain test for comparison. Governance covers who may
    use sensitive data and how.


    Example: BloombergGPT (2023) trained a 50-billion-parameter model on financial and general data. Larger general models later
    rivalled it on some financial tasks, which shows why comparison matters. A bank could instead fine-tune a small model for
    routing and use retrieval for policy answers.


    Ask: What is the first comparison to run before building a domain model?


    Answer: A strong general model with prompting and retrieval on the same domain test.


    Watch out: Domain data is often confidential; training on it needs explicit permission.'
  visual:
    type: mini_table
    header:
    - Option
    - Example
    rows:
    - - Build
      - BloombergGPT, 50 B (2023)
    - - Adapt
      - LoRA on a general model
    - - Retrieve
      - Search bank documents
- type: bullets
  title: 'Responsible AI lens: fine-tuning'
  bullets:
  - Re-test safety after training.
  - Remove personal data; check leakage.
  - Document data, settings and limits.
  notes: 'In short: Fine-tuning changes behaviour in ways you did not target, so safety, privacy, fairness and licences need
    fresh checks.


    Explain: Safety erosion means refusals weaken after fine-tuning. Memorisation means the model can reproduce training records.
    Bias amplification means errors concentrate on some groups. Licences govern whether a base model may be fine-tuned and shared.
    A model card documents data, evaluation and limits.


    Example: Qi et al. (2023) showed that fine-tuning aligned models on even benign examples weakened their refusals. A banking
    adapter trained on real complaints could reproduce a customer''s account number. Checking accuracy by customer group can
    reveal uneven errors.


    Ask: What should accompany a released adapter?


    Answer: A model card stating the base model, data sources, evaluation results, known limits and intended use.


    Watch out: Removing names may not remove identifying details such as rare circumstances.'
  visual:
    type: mini_table
    header:
    - Risk
    - Check
    rows:
    - - Safety erosion
      - Refusal tests
    - - Memorisation
      - Extraction probes
    - - Bias
      - Results by group
- type: lab
  title: 'Lab 8: LoRA fine-tuning for a banking domain task'
  steps:
  - Split the data.
  - Measure zero- and few-shot.
  - Add LoRA; count weights.
  - Train; watch the loss.
  - Test; read errors.
  - Disable adapter; save.
  runtime: CPU core took {{W08_CORE_TIME}}. Full run optional.
  deliverable: Comparison table, loss curve, answers
  notes: 'In short: The lab runs a real LoRA fine-tuning job on a CPU and compares it fairly with prompting.


    Explain: The core uses {{W08_CORE_MODEL}} with {{W08_CORE_N_INTENTS}} Banking77 intents. Zero-shot and few-shot prompts
    set the baselines. A rank-{{W08_CORE_RANK}} LoRA adapter trains for one epoch on {{W08_CORE_N_TRAIN}} messages. All three
    are tested on the same {{W08_CORE_N_TEST}} held-out messages. Each TODO has a check that prints ✅.


    Example: On the course laptop with {{W08_CORE_THREADS}} CPU threads, the whole core took {{W08_CORE_TIME}} once the model
    and data were downloaded. It measured {{W08_CORE_COMPARISON}}. The optional full run uses ten intents and 1,216 training
    messages and takes over an hour on a CPU.


    Ask: Which result decides whether the adapter was worth training?


    Answer: Its held-out accuracy compared with the few-shot baseline on the same messages.


    Watch out: Keep both API switches False for the core; the hosted comparison is optional and uses invented messages.'
- type: summary
  points:
  - Measure the best prompt first.
  - SFT scores answer tokens.
  - Preferences shape behaviour.
  - LoRA trains small paths.
  - Keep test data separate.
  - Re-test safety and cost.
  notes: 'In short: Fine-tuning is worth it only when a measured gap remains after the best prompt and the gain survives a fair
    test.


    Explain: SFT trains on input–answer pairs, scoring the answer tokens. Preference methods learn from comparisons between
    answers. LoRA and QLoRA make training affordable by adding small trainable paths. Clean, separate data splits make results
    trustworthy. Evaluation covers task, older abilities, safety and cost.


    Example: The lab''s chain is baseline, LoRA training, held-out test, adapter on-and-off check and saved adapter size. Each
    step produces evidence for the comparison table. The stored full run shows the same chain at a larger scale.


    Ask: What single comparison decides whether to keep the adapter?


    Answer: Held-out accuracy against the best prompting baseline, weighed against training and serving cost.


    Watch out: A great training curve without a held-out comparison is not evidence of a better model.'
